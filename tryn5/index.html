<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Try! N5 Grammar Quest</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Lexend:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f0f1a;
        color: #e0e0e0;
        font-family: 'Lexend', 'Noto Sans JP', sans-serif;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .loading {
        color: #e0e0e0;
        font-size: 1.2rem;
        letter-spacing: 0.02em;
      }
      .boot-error {
        max-width: 32rem;
        margin: 0 16px;
        padding: 1.25rem 1.5rem;
        border: 1px solid #ff6b6b55;
        border-radius: 12px;
        background: #1a1a2b;
        line-height: 1.5;
      }
      .boot-error h1 { margin: 0 0 0.5rem; font-size: 1.1rem; color: #ff8787; }
      .boot-error p { margin: 0.4rem 0; font-size: 0.95rem; }
      .boot-error code {
        background: #0f0f1a; padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em;
      }
    </style>
    <link rel="stylesheet" href="./src/style.css" />
    <script>
      // Mostra uma mensagem útil em vez de "carregando" infinito
      // quando o script principal não carrega ou falha ao iniciar.
      window.__bootFail = function (detail) {
        var app = document.getElementById('app');
        if (!app || !app.querySelector('.loading')) return; // app já montou
        app.innerHTML =
          '<div class="boot-error" role="alert">' +
          '<h1>Não foi possível iniciar o jogo</h1>' +
          '<p>Os arquivos da pasta <code>src/</code> (<code>data.js</code>, <code>main.js</code>, ' +
          '<code>style.css</code>) precisam estar ao lado deste <code>index.html</code>.</p>' +
          (detail ? '<p><small>Detalhe: ' + String(detail).replace(/</g, '&lt;') + '</small></p>' : '') +
          '</div>';
      };
      window.addEventListener('error', function (e) {
        if (!(e instanceof ErrorEvent)) return; // falhas de <script>/<link> tratadas no onerror
        window.__bootFail(e.message);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        window.__bootFail(e.reason && (e.reason.message || e.reason));
      });
      // Rede de segurança: se nada montou em 10 s, avisa.
      setTimeout(function () { window.__bootFail('tempo de carregamento esgotado'); }, 10000);
    </script>
  </head>
  <body>
    <div id="app">
      <p class="loading" lang="ja">読み込み中…</p>
    </div>
    <noscript>
      <p style="text-align:center">Ative o JavaScript para jogar.</p>
    </noscript>
    <script src="./src/data.js" onerror="window.__bootFail('falha ao carregar ./src/data.js')"></script>
    <script src="./src/main.js" onerror="window.__bootFail('falha ao carregar ./src/main.js')"></script>
  </body>
</html>
