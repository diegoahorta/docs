<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pongo e o Castelo das Partículas Mágicas</title>
<meta name="description" content="Jogo de plataforma educativo: Pongo explora o castelo mágico, encontra partículas japonesas e acende as Tochas do Saber.">
<style>
:root{
  --bg:#070d20; --panel:#101a36; --ink:#eef3ff; --muted:#b6c6e6; --gold:#f3c56b; --gold2:#ffe39a;
  --line:#d5ae66; --ok:#58d7ac; --bad:#fa838c; --violet:#9a80ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at top,#16224a 0%,var(--bg) 60%);color:var(--ink);font-family:system-ui,'Segoe UI','Noto Sans JP','Hiragino Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:10px 16px;overflow-x:hidden}
#wrap{max-width:1100px;width:100%;background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);border:2px solid var(--line)}
header{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 16px;background:#0b1225;border-bottom:2px solid var(--line);flex-wrap:wrap}
header .t{font-weight:700;font-size:1rem}
header .t b{color:var(--gold2)}
header .btns{display:flex;gap:8px}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 13px;background:var(--gold);color:#1b1930;font-weight:800;font-size:.88rem;font-family:inherit;transition:filter .15s,transform .15s}
button:hover{filter:brightness(1.1)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ghost{background:#24375f;color:#fff}
#hud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 14px;background:#152344;font-weight:700;font-size:.88rem;border-bottom:1px solid #2a3f6b}
#hud .v{color:#ffdb87}
#bag{display:inline-flex;gap:4px;vertical-align:middle}
.chip{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:800;color:#fff;font-size:.9rem;text-shadow:0 1px 2px #000;border:1.5px solid #ffffffb0;box-shadow:0 0 8px var(--c)}
#stage{position:relative}
canvas{width:100%;height:auto;display:block;background:#09152b;touch-action:none;aspect-ratio:1000/560}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#16284bf0;border:2px solid #d9b56a;border-radius:12px;padding:10px 18px;display:none;z-index:5;text-align:center;max-width:88%;font-weight:600;color:#ffe59b;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:.95rem;pointer-events:none}
#toast.show{display:block;animation:tIn .25s ease}
@keyframes tIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
#help{padding:8px 14px;color:var(--muted);font-size:.8rem;background:#0d162e;text-align:center}
#touch{display:none;justify-content:space-between;gap:12px;padding:10px;background:#0b1225;border-top:2px solid var(--line);user-select:none;-webkit-user-select:none}
#touch button{min-width:64px;min-height:52px;font-size:1.25rem;touch-action:none;background:#445a91;color:#fff}
#touch .act{background:#ad74e3}
#touch button.on{transform:scale(.94);filter:brightness(1.3)}
@media (hover:none),(max-width:820px){#touch{display:flex}}
@media (max-width:560px){header .t{font-size:.85rem}#hud{font-size:.78rem}#help{display:none}#toast{font-size:.74rem;padding:6px 10px;top:6px}}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;background:#050b1ce0;display:none;place-items:center;z-index:20;padding:12px;backdrop-filter:blur(3px)}
.overlay.show{display:grid}
.panel{max-width:720px;width:100%;background:linear-gradient(150deg,#22375c,#10172d);border:2px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 0 70px #623db54d;max-height:94vh;overflow-y:auto;position:relative}
.panel h1{color:#ffdf94;font-size:1.55rem;text-align:center;margin-bottom:10px;line-height:1.25}
.panel h2{color:#ffdf94;font-size:1.1rem;margin:14px 0 6px}
.panel p{line-height:1.5;margin-bottom:9px;color:#d6e2f7}
.panel .small{font-size:.85rem;color:#a9bddf}
.btn-primary{display:block;width:100%;padding:13px 20px;font-size:1.05rem;margin-top:10px;border-radius:12px}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.hero{display:flex;gap:16px;align-items:center;margin:6px 0 10px}
.hero img{width:150px;height:auto;filter:drop-shadow(0 6px 16px #000a)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem;color:#cfdcf3;margin:6px 0}
kbd{background:#0c1530;border:1px solid #4a5f8f;border-bottom-width:3px;border-radius:6px;padding:1px 7px;font-family:inherit;font-size:.82rem;color:#fff;white-space:nowrap}
.steps{display:flex;gap:6px;justify-content:center;margin:2px 0 12px}
.steps span{padding:4px 10px;border-radius:99px;background:#0c1530;font-size:.78rem;color:#93a6cc;border:1px solid #2c4170}
.steps span.on{background:#3d2f76;color:#fff;border-color:var(--violet)}
.steps span.done{background:#1d5a49;color:#c9ffe9;border-color:var(--ok)}

/* Sentence puzzle */
.sentence{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin:14px 0 6px;padding:16px 10px;background:#0b1430;border-radius:14px;border:1px solid #2c4170}
.word{font-size:1.6rem;padding:6px 10px;background:#1b2a52;border-radius:10px;color:#f1ecff;letter-spacing:1px}
.slot{width:54px;height:54px;border-radius:50%;border:3px dashed #7b8fc0;background:transparent;color:#fff;font-size:1.6rem;display:grid;place-items:center;padding:0;transition:.15s}
.slot.hover,.slot:hover{border-color:var(--gold2);background:#ffe39a22;transform:scale(1.08)}
.slot.filled{border-style:solid;border-color:var(--ok);box-shadow:0 0 18px var(--ok)}
.slot.no{animation:shake .4s}
.tray{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px;min-height:70px}
.orb{width:62px;height:62px;border-radius:50%;font-size:1.7rem;font-weight:800;color:#fff;display:grid;place-items:center;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 0 22px var(--c),inset 0 0 16px #ffffff66;background:radial-gradient(circle at 35% 30%,#fff9,var(--c) 45%,#0006 100%);border:2px solid #ffffffaa;position:relative}
.orb small{position:absolute;bottom:-18px;font-size:.7rem;color:#b9c8e6;font-weight:600}
.orb.sel{outline:3px solid var(--gold2);outline-offset:4px}
.orb.used{opacity:.25;pointer-events:none}
.orb.drag{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);cursor:grabbing}
.orb.no{animation:shake .4s}
@keyframes shake{0%,100%{translate:0}20%{translate:-7px}40%{translate:7px}60%{translate:-5px}80%{translate:5px}}
.trans{text-align:center;color:#ffdb87;font-weight:600}
.romaji{text-align:center;color:#a9bddf;font-style:italic;font-size:.92rem}
#fb{min-height:1.5em;text-align:center;font-weight:700;margin:8px 0 0}
#fb.ok{color:var(--ok)} #fb.bad{color:var(--bad)}
.choices{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}
@media(min-width:620px){.choices{grid-template-columns:1fr 1fr}}
.choices button{background:#e1e9fa;color:#1b1930;text-align:left;font-size:.95rem;padding:12px 14px;border-radius:12px;font-weight:600;line-height:1.35}
.choices button.correct{background:var(--ok);color:#06231a}
.choices button.wrong{background:var(--bad);opacity:.7}
.explain{background:#0b1f1a;border:1px solid var(--ok);border-radius:12px;padding:12px 14px;margin-top:8px}
.explain b{color:#a8ffd8}
.big-kana{font-size:3rem;text-align:center;line-height:1.2;text-shadow:0 0 22px var(--c)}
/* Matching */
.match{display:grid;grid-template-columns:90px 1fr;gap:10px;margin:12px 0}
.match .col{display:flex;flex-direction:column;gap:7px}
.match .k{height:46px;font-size:1.45rem;color:#fff;background:#1b2a52;border:2px solid #3a5088}
.match .f{min-height:46px;text-align:left;background:#e1e9fa;color:#1b1930;font-size:.86rem;font-weight:600;padding:7px 11px}
.match .sel{outline:3px solid var(--gold2);outline-offset:2px}
.match .done{background:var(--ok)!important;color:#06231a!important;border-color:var(--ok)!important;pointer-events:none}
.match .no{animation:shake .4s;background:var(--bad)!important}
.table{width:100%;border-collapse:collapse;font-size:.86rem;margin:8px 0}
.table td{padding:6px 8px;border-bottom:1px solid #2c4170;vertical-align:top}
.table td:first-child{font-size:1.3rem;text-align:center;width:44px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.stats div{background:#0b1430;border:1px solid #2c4170;border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:1.4rem;color:#ffdb87}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="t">🐾 <b>Pongo</b> e o Castelo das Partículas Mágicas</div>
    <div class="btns">
      <button class="ghost" id="btnPause" aria-label="Pausar">⏸ Pausa</button>
      <button class="ghost" id="btnSound" aria-label="Som">🔊 Som</button>
    </div>
  </header>
  <div id="hud">
    <div>⭐ <span class="v" id="hScore">0</span></div>
    <div>❤️ <span class="v" id="hLives">3</span></div>
    <div>🔥 Tochas <span class="v" id="hTorch">0/8</span></div>
    <div>🎒 <span id="bag"><span class="v">vazia</span></span></div>
    <div>🏰 <span class="v" id="hRoom">Salão Escarlate</span></div>
  </div>
  <div id="stage">
    <canvas id="game" width="1000" height="560" aria-label="Jogo de plataforma"></canvas>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <div id="help"><kbd>←</kbd><kbd>→</kbd>/<kbd>A</kbd><kbd>D</kbd> andar · <kbd>Espaço</kbd>/<kbd>↑</kbd>/<kbd>W</kbd> pular (segure para ir mais alto) · <kbd>E</kbd> depositar na tocha / falar · <kbd>P</kbd> pausa · <kbd>M</kbd> som</div>
  <div id="touch">
    <div style="display:flex;gap:10px"><button data-k="left" aria-label="Esquerda">◀</button><button data-k="right" aria-label="Direita">▶</button></div>
    <div style="display:flex;gap:10px"><button class="act" data-k="act" aria-label="Tocha">✨</button><button class="act" data-k="jump" aria-label="Pular">⬆</button></div>
  </div>
</div>
<div class="overlay" id="modal"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

/* ---------- Áudio (Web Audio, sem arquivos externos) ---------- */
const Sound = {
  on:true, ctx:null, music:null, step:0,
  init(){ if(this.ctx) return; try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  tone(f, d=.12, type='sine', vol=.08, when=0){
    if(!this.on || !this.ctx) return;
    try{
      const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + d);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
    }catch(e){}
  },
  jump(){ this.tone(420,.09,'square',.04); this.tone(640,.08,'square',.035,.05); },
  pick(){ [880,1175,1568].forEach((f,i)=>this.tone(f,.14,'triangle',.07,i*.06)); },
  ok(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.2,'triangle',.08,i*.09)); },
  bad(){ this.tone(220,.25,'sawtooth',.05); this.tone(170,.3,'sawtooth',.05,.12); },
  hurt(){ this.tone(300,.12,'square',.06); this.tone(140,.3,'sawtooth',.06,.08); },
  stomp(){ this.tone(200,.08,'square',.07); this.tone(500,.12,'triangle',.06,.05); },
  door(){ [392,523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.3,'sine',.06,i*.07)); },
  click(){ this.tone(660,.05,'triangle',.05); },
  // Música de fundo: escala japonesa “in” em arpejo suave
  startMusic(){
    if(this.music || !this.ctx) return;
    const scale = [293.66,311.13,392,440,466.16,587.33,622.25,783.99];
    const pat = [0,2,4,5,4,2,3,1, 0,2,4,7,6,4,5,2];
    this.music = setInterval(()=>{
      if(!this.on || Game.state!=='play') return;
      const n = pat[this.step % pat.length];
      this.tone(scale[n], .5, 'triangle', .022);
      if(this.step % 4 === 0) this.tone(scale[n]/2, .9, 'sine', .028);
      this.step++;
    }, 300);
  }
};

const Input = { left:false, right:false, jump:false, jumpPressed:false, act:false };
const KEYMAP = { ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right',
  ArrowUp:'jump', w:'jump', W:'jump', ' ':'jump', e:'act', E:'act', Enter:'act' };
window.addEventListener('keydown', e => {
  if(UI.modalOpen()){ if(e.key==='Escape' && Game.state==='pause') Game.togglePause(); return; }
  const k = KEYMAP[e.key];
  if(k){ e.preventDefault(); if(k==='jump' && !Input.jump) Input.jumpPressed = true; if(k==='act' && !e.repeat) Input.act = true; if(k!=='act') Input[k] = true; }
  if(e.key==='p'||e.key==='P'||e.key==='Escape') Game.togglePause();
  if(e.key==='m'||e.key==='M') toggleSound();
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.key]; if(k && k!=='act') Input[k] = false; });
window.addEventListener('blur', () => { Input.left = Input.right = Input.jump = false; });
document.querySelectorAll('#touch [data-k]').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); Sound.init(); b.classList.add('on');
    if(k==='act'){ Input.act = true; return; }
    if(k==='jump' && !Input.jump) Input.jumpPressed = true; Input[k] = true; };
  const up = e => { e.preventDefault(); b.classList.remove('on'); if(k!=='act') Input[k] = false; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ---------- Utilidades ---------- */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const overlap = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
const shuffle = arr => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const roomAt = x => clamp(Math.floor(x / ROOM_W), 0, 3);

  plat(3500,400,120); plat(3620,315,120); plat(3500,230,120);
  plat(3860,390,110); plat(3990,300,140);
  part('で', 3560, 182); part('へ', 4060, 252);

/* =====================================================================
   PONGO — "PlayerController" (Rigidbody2D + BoxCollider2D)
   ===================================================================== */
class Pongo {
  constructor(){ this.reset(80); }
  reset(x){
    this.x = x; this.y = FY - 56; this.w = 50; this.h = 56;
    this.vx = 0; this.vy = 0; this.onGround = false; this.face = 1;
    this.coyote = 0; this.buffer = 0; this.inv = 0; this.anim = 0; this.ride = null; this.squash = 0;
  }
  get cx(){ return this.x + this.w/2; }
  get bottom(){ return this.y + this.h; }

  update(dt, L){
    const dir = (Input.right?1:0) - (Input.left?1:0);
    const acc = this.onGround ? PHYS.accel : PHYS.airAccel;
    if(dir){ this.vx = clamp(this.vx + dir*acc*dt, -PHYS.run, PHYS.run); this.face = dir; }
    else if(this.onGround){ const f = PHYS.friction*dt; this.vx = Math.abs(this.vx) <= f ? 0 : this.vx - Math.sign(this.vx)*f; }
    else this.vx *= .985;

    // pulo: coyote time + buffer + altura variável
    this.coyote = this.onGround ? PHYS.coyote : this.coyote - dt;
    if(Input.jumpPressed){ this.buffer = PHYS.buffer; Input.jumpPressed = false; }
    else this.buffer -= dt;
    if(this.buffer > 0 && this.coyote > 0){
      this.vy = PHYS.jumpV; this.buffer = 0; this.coyote = 0; this.onGround = false; this.ride = null;
      this.squash = -.18; Sound.jump(); FX.burst(this.cx, this.bottom, '#e9d8b4', 6, 90);
    }
    if(!Input.jump && this.vy < -280) this.vy = lerp(this.vy, -280, .35);

    this.vy = Math.min(this.vy + PHYS.g*dt, PHYS.maxFall);

    // carregado por plataforma móvel
    if(this.ride){ this.x += this.ride.dx; this.y += this.ride.dy; }

    // eixo X
    this.x += this.vx*dt;
    for(const s of solids(L)) if(overlap(this, s)){
      if(this.vx > 0) this.x = s.x - this.w; else if(this.vx < 0) this.x = s.x + s.w;
      else this.x = (this.cx < s.x + s.w/2) ? s.x - this.w : s.x + s.w;
      this.vx = 0;
      if(s.door !== undefined) Game.bumpDoor(s.door);
    }
    // eixo Y
    const prevBottom = this.bottom;
    this.y += this.vy*dt;
    const wasGround = this.onGround;
    this.onGround = false; this.ride = null;
    for(const s of solids(L)) if(overlap(this, s)){
      if(this.vy > 0){ this.y = s.y - this.h; this.vy = 0; this.onGround = true; }
      else if(this.vy < 0){ this.y = s.y + s.h; this.vy = 0; }
    }
    if(this.vy >= 0){
      for(const p of L.plats.concat(L.movers)){
        if(this.x + this.w > p.x + 4 && this.x < p.x + p.w - 4 && prevBottom <= p.y + 2 + (p.dy>0?p.dy:0) && this.bottom >= p.y){
          this.y = p.y - this.h; this.vy = 0; this.onGround = true;
          if(p.period) this.ride = p;
        }
      }
    }
    if(this.onGround && !wasGround){ this.squash = .2; FX.burst(this.cx, this.bottom, '#e9d8b4', 5, 70); }
    this.squash *= Math.pow(.0001, dt);
    if(this.inv > 0) this.inv -= dt;
    this.anim += dt * (this.onGround ? Math.abs(this.vx)/40 : 3);
  }

  draw(c){
    if(this.inv > 0 && Math.floor(this.inv*14)%2===0) return;
    const moving = Math.abs(this.vx) > 40;
    const air = !this.onGround;
    c.save();
    // sombra
    c.fillStyle = 'rgba(0,0,0,.3)';
    c.beginPath(); c.ellipse(this.cx, this.bottom+2, air?18:28, 6, 0, 0, Math.PI*2); c.fill();
    c.translate(this.cx, this.bottom);
    c.scale(this.face, 1);
    const sq = this.squash;
    if(air || moving){
      const img = SPR.run, w = 104, h = w * (img.naturalHeight||154)/(img.naturalWidth||299);
      const bob = air ? 0 : Math.abs(Math.sin(this.anim*1.6))*-9;
      const rot = air ? clamp(this.vy/2600, -.25, .3) : Math.sin(this.anim*1.6)*.06;
      c.translate(0, bob); c.rotate(rot);
      c.scale(1+sq*.5, 1-sq);
      if(img.complete && img.naturalWidth) c.drawImage(img, -w/2+6, -h-2, w, h);
      else drawFallbackDog(c);
    } else {
      const img = SPR.idle, w = 86, h = w * (img.naturalHeight||213)/(img.naturalWidth||240);
      const breathe = Math.sin(Game.time*3)*.02;
      c.scale(1+sq*.5, 1-sq+breathe);
      if(img.complete && img.naturalWidth) c.drawImage(img, -w/2, -h+2, w, h);
      else drawFallbackDog(c);
    }
    c.restore();
    // partículas carregadas orbitando o Pongo
    Game.bag.forEach((k,i) => {
      const a = Game.time*2.4 + i*(Math.PI*2/Game.bag.length);
      const ox = this.cx + Math.cos(a)*34, oy = this.y - 4 + Math.sin(a)*10;
      drawOrb(c, ox, oy, 10, P[k].color, k, 11);
    });
  }
}
function drawFallbackDog(c){
  c.fillStyle='#f3e6c9'; c.beginPath(); c.ellipse(0,-26,26,18,0,0,7); c.fill();
  c.fillStyle='#c9661c'; c.beginPath(); c.arc(20,-44,14,0,7); c.fill();
}

/* Sólidos dinâmicos (chão + paredes + portas fechadas) */
function solids(L){
  const out = L.floors.concat(L.walls);
  for(const d of L.doors) if(d.open < 1) out.push({ x:d.x, y:d.y, w:d.w, h:d.h, door:d.room });
  return out;
}

/* =====================================================================
   EFEITOS — sistema de partículas visuais ("ParticleSystem")
   ===================================================================== */
const FX = {
  list:[],
  burst(x,y,color,n=12,spd=180,life=.7){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, s = spd*(.4+Math.random()*.8);
      this.list.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - spd*.3, life, max:life, color, r:2+Math.random()*3 });
    }
  },
  update(dt){
    for(const p of this.list){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 400*dt; p.vx *= .98; p.life -= dt; }
    this.list = this.list.filter(p => p.life > 0);
  },
  draw(c){
    c.save(); c.globalCompositeOperation = 'lighter';
    for(const p of this.list){ c.globalAlpha = clamp(p.life/p.max,0,1); c.fillStyle = p.color; c.beginPath(); c.arc(p.x,p.y,p.r,0,7); c.fill(); }
    c.restore();
  }
};

/* ---------- Desenho de elementos ---------- */
function glow(c, x, y, r, color, a=.5){
  const g = c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = a; c.fillStyle = g;
  c.fillRect(x-r, y-r, r*2, r*2); c.restore();
}
function drawOrb(c, x, y, r, color, k, fs){
  glow(c, x, y, r*3, color, .55);
  const g = c.createRadialGradient(x-r*.35, y-r*.4, r*.1, x, y, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.35, color); g.addColorStop(1, shade(color,-.45));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.5; c.stroke();
  if(k){ c.fillStyle = '#fff'; c.font = `800 ${fs||r*1.1}px 'Noto Sans JP','Hiragino Sans',system-ui,sans-serif`;
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.shadowColor = '#000'; c.shadowBlur = 4;
    c.fillText(k, x, y+1); c.shadowBlur = 0; }
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=n>>8&255, b=n&255;
  const f = v => clamp(Math.round(amt<0 ? v*(1+amt) : v+(255-v)*amt),0,255);
  return '#' + ((1<<24)|(f(r)<<16)|(f(g)<<8)|f(b)).toString(16).slice(1);
}
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

/* ---------- Cenário inspirado nas salas isométricas do castelo ---------- */
function drawRoomBackground(c, r, camX){
  const R = ROOMS[r], ox = r*ROOM_W;
  const x0 = Math.max(ox, camX-50), x1 = Math.min(ox+ROOM_W, camX+VW+50);
  if(x1 <= x0) return;
  c.save(); c.beginPath(); c.rect(x0, 0, x1-x0, VH); c.clip();
  // parede
  const g = c.createLinearGradient(0,0,0,FY);
  g.addColorStop(0, shade(R.wall,-.25)); g.addColorStop(.55, R.wall); g.addColorStop(1, R.wall2);
  c.fillStyle = g; c.fillRect(x0, 0, x1-x0, FY);
  // tijolos sutis
  c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 1;
  for(let y=40; y<330; y+=26){ c.beginPath(); c.moveTo(x0,y); c.lineTo(x1,y); c.stroke();
    for(let x=ox+((y/26)%2)*30; x<ox+ROOM_W; x+=60){ if(x<x0-60||x>x1) continue; c.beginPath(); c.moveTo(x,y); c.lineTo(x,y+26); c.stroke(); } }
  // lambri inferior
  c.fillStyle = shade(R.wall2,-.15); c.fillRect(x0, 335, x1-x0, FY-335);
  c.fillStyle = R.trim; c.fillRect(x0, 330, x1-x0, 7);
  c.fillStyle = 'rgba(0,0,0,.18)';
  for(let x=ox+20; x<ox+ROOM_W; x+=70){ if(x<x0-70||x>x1) continue; c.fillRect(x, 350, 52, 110); }

  // janelas (arco gótico ou redondas na sala dourada) + arandelas
  for(let i=0;i<4;i++){
    const wx = ox + 175 + i*350;
    if(wx < x0-120 || wx > x1+120) continue;
    if(R.theme==='gold') drawRoundWindow(c, wx, 175, R); else drawArchWindow(c, wx, 90, R);
    drawSconce(c, wx + 175, 205, R);
  }
  // pilares
  for(let i=0;i<=4;i++){ const px = ox + i*350 - 14; if(px<x0-40||px>x1) continue;
    c.fillStyle = 'rgba(0,0,0,.22)'; c.fillRect(px, 26, 28, FY-26); c.fillStyle = 'rgba(255,255,255,.05)'; c.fillRect(px, 26, 6, FY-26); }
  // estandartes
  for(let i=0;i<2;i++){ drawBanner(c, ox + 350 + i*700, R, i); }
  // decoração temática
  drawThemeDecor(c, r, ox, R);
  // viga do teto
  c.fillStyle = '#3b2414'; c.fillRect(x0, 0, x1-x0, 26);
  c.fillStyle = R.theme==='green' ? '#8f979b' : (R.theme==='gold' ? '#1d140b' : '#b0703a'); c.fillRect(x0, 22, x1-x0, 6);
  c.restore();
}
function drawArchWindow(c, x, y, R){
  const w = 88, h = 180;
  glow(c, x, y+h/2, 160, R.glow, .18);
  c.fillStyle = '#2a1a10'; c.beginPath(); c.moveTo(x-w/2-8, y+h+6); c.lineTo(x-w/2-8, y+40); c.quadraticCurveTo(x-w/2-8, y-14, x, y-28); c.quadraticCurveTo(x+w/2+8, y-14, x+w/2+8, y+40); c.lineTo(x+w/2+8, y+h+6); c.fill();
  const gg = c.createLinearGradient(0,y-20,0,y+h); gg.addColorStop(0,'#fff8dc'); gg.addColorStop(1,R.win);
  c.fillStyle = gg; c.beginPath(); c.moveTo(x-w/2, y+h); c.lineTo(x-w/2, y+40); c.quadraticCurveTo(x-w/2, y-6, x, y-18); c.quadraticCurveTo(x+w/2, y-6, x+w/2, y+40); c.lineTo(x+w/2, y+h); c.fill();
  c.strokeStyle = 'rgba(80,50,20,.6)'; c.lineWidth = 2;
  for(let i=1;i<4;i++){ c.beginPath(); c.moveTo(x-w/2+i*w/4, y-10); c.lineTo(x-w/2+i*w/4, y+h); c.stroke(); }
  for(let j=1;j<6;j++){ c.beginPath(); c.moveTo(x-w/2, y+j*h/6); c.lineTo(x+w/2, y+j*h/6); c.stroke(); }
}
function drawRoundWindow(c, x, y, R){
  glow(c, x, y, 150, R.glow, .2);
  c.fillStyle = '#5a3a1a'; c.beginPath(); c.arc(x, y, 62, 0, 7); c.fill();
  c.fillStyle = R.win; c.beginPath(); c.arc(x, y, 52, 0, 7); c.fill();
  c.strokeStyle = '#7a5428'; c.lineWidth = 4;
  c.beginPath(); c.moveTo(x-52,y); c.lineTo(x+52,y); c.moveTo(x,y-52); c.lineTo(x,y+52); c.stroke();
  c.lineWidth = 2; c.beginPath(); c.arc(x, y, 26, 0, 7); c.stroke();
}
function drawSconce(c, x, y, R){
  const fl = Math.sin(Game.time*9 + x)*.12 + Math.sin(Game.time*13 + x*.3)*.08;
  glow(c, x, y, 90, R.glow, .35 + fl);
  c.fillStyle = '#2b1d12'; c.fillRect(x-3, y, 6, 22); c.fillRect(x-12, y+18, 24, 6);
  c.fillStyle = '#3a2a1a'; roundRect(c, x-10, y-18, 20, 22, 4); c.fill();
  c.fillStyle = R.glow; c.globalAlpha = .9; roundRect(c, x-6, y-14, 12, 14, 3); c.fill(); c.globalAlpha = 1;
}
function drawBanner(c, x, R, i){
  const sway = Math.sin(Game.time*1.3 + x)*3;
  c.fillStyle = '#2b1d12'; c.fillRect(x-36, 30, 72, 5);
  const col = R.theme==='gold' ? '#2a2016' : (R.theme==='green' ? '#0f5a2a' : (R.theme==='blue' ? '#25458f' : '#8f1f1f'));
  c.fillStyle = col; c.beginPath(); c.moveTo(x-30,34); c.lineTo(x+30,34); c.lineTo(x+30+sway,140); c.lineTo(x+sway,122); c.lineTo(x-30+sway,140); c.closePath(); c.fill();
  c.strokeStyle = R.theme==='green' ? '#c0c8cc' : '#e7b14d'; c.lineWidth = 3; c.stroke();
  // emblema: kanji 学 (aprender)
  c.fillStyle = R.theme==='green' ? '#dfe6ea' : '#ffd77e'; c.font = "800 30px 'Noto Sans JP',system-ui,sans-serif";
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(i ? '学' : '語', x+sway*.5, 80);
}
function drawThemeDecor(c, r, ox, R){
  const t = Game.time;
  if(R.theme==='red'){
    // lareira
    const fx = ox+700;
    c.fillStyle = '#3a2a22'; c.fillRect(fx-90, 300, 180, 180);
    c.fillStyle = '#4b382d'; c.fillRect(fx-100, 290, 200, 16); c.fillRect(fx-70, 120, 140, 175);
    c.fillStyle = '#120a06'; c.beginPath(); c.moveTo(fx-60,480); c.lineTo(fx-60,360); c.quadraticCurveTo(fx,320,fx+60,360); c.lineTo(fx+60,480); c.fill();
    glow(c, fx, 440, 140, '#ffb347', .55+Math.sin(t*10)*.08);
    for(let i=0;i<5;i++){ const h = 30+Math.sin(t*8+i*2)*12; c.fillStyle = i%2?'#ffd56b':'#ff8a2a';
      c.beginPath(); c.ellipse(fx-36+i*18, 470-h/2, 10, h/2, 0, 0, 7); c.fill(); }
    // mesa de xadrez + abóbora
    const cx = ox+1000;
    c.fillStyle = '#5a2e18'; c.fillRect(cx-40, 430, 80, 10); c.fillRect(cx-6, 440, 12, 40);
    for(let i=0;i<4;i++) for(let j=0;j<2;j++){ c.fillStyle = (i+j)%2 ? '#eee' : '#222'; c.fillRect(cx-32+i*16, 424+j*3, 16, 3); }

function drawFloors(c, L, camX){
  for(const f of L.floors){
    if(f.x+f.w < camX-20 || f.x > camX+VW+20) continue;
    const r = roomAt(f.x + 1), R = ROOMS[r];
    const wood = R.theme==='green' || R.theme==='blue' ? '#7f8a91' : '#9a5c34';
    const g = c.createLinearGradient(0,FY,0,VH); g.addColorStop(0, wood); g.addColorStop(1, shade(wood,-.6));
    c.fillStyle = g; c.fillRect(f.x, FY, f.w, VH-FY);
    c.fillStyle = shade(wood,.25); c.fillRect(f.x, FY, f.w, 6);
    c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1;
    for(let x=f.x+((f.x/7)%40); x<f.x+f.w; x+=40){ c.beginPath(); c.moveTo(x, FY+8); c.lineTo(x, FY+30); c.stroke(); }
    c.beginPath(); c.moveTo(f.x, FY+30); c.lineTo(f.x+f.w, FY+30); c.stroke();
  }
  // abismos: brilho mágico subindo
  for(let i=0;i<L.floors.length-1;i++){
    const a = L.floors[i], b = L.floors[i+1], x0 = a.x+a.w, x1 = b.x;
    if(x1 <= x0 || x1 < camX || x0 > camX+VW) continue;
    const g = c.createLinearGradient(0,FY,0,VH); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(120,80,255,.35)');
    c.fillStyle = '#05070f'; c.fillRect(x0, FY, x1-x0, VH-FY); c.fillStyle = g; c.fillRect(x0, FY, x1-x0, VH-FY);
  }
}
function drawPlatform(c, p, moving){
  const r = roomAt(p.x), R = ROOMS[r];

    c.fillStyle = moving ? '#6b5fa8' : '#6e7579'; roundRect(c, p.x, p.y, p.w, 20, 5); c.fill();

  } else {
    c.fillStyle = '#5a3218'; c.fillRect(p.x, p.y, p.w, 14);
    c.fillStyle = R.trim; c.fillRect(p.x, p.y, p.w, 4);
    c.fillStyle = '#3b200e'; c.beginPath(); c.moveTo(p.x+10,p.y+14); c.lineTo(p.x+24,p.y+14); c.lineTo(p.x+10,p.y+34); c.fill();
    c.beginPath(); c.moveTo(p.x+p.w-10,p.y+14); c.lineTo(p.x+p.w-24,p.y+14); c.lineTo(p.x+p.w-10,p.y+34); c.fill();
    // livrinhos decorativos

function drawTorch(c, t){

  c.fillStyle = '#4a4f63'; c.fillRect(x-20, y-14, 40, 14);

  c.fillStyle = '#8a6a2a'; c.fillRect(x-28, y-82, 56, 5);

    drawOrb(c, x, y-158 + Math.sin(Game.time*2+x)*5, 15, p.color, t.k, 17);
  } else {

    const a = .35 + Math.sin(Game.time*2.5 + x)*.15;
    glow(c, x, y-100, 50, p.color, .18);
    c.globalAlpha = a; c.strokeStyle = p.color; c.lineWidth = 2; c.setLineDash([4,4]);
    c.beginPath(); c.arc(x, y-110, 18, 0, 7); c.stroke(); c.setLineDash([]);
    c.fillStyle = p.color; c.font = "800 20px 'Noto Sans JP',system-ui,sans-serif"; c.fillText(t.k, x, y-109);
    c.globalAlpha = 1;

}
function drawDoor(c, d){
  const a = 1 - d.open; if(a <= 0) return;
  const R = ROOMS[d.room];
  c.save(); c.globalAlpha = a;
  c.fillStyle = '#4b4f5e'; c.fillRect(d.x-16, d.y, 12, d.h); c.fillRect(d.x+d.w+4, d.y, 12, d.h);
  const g = c.createLinearGradient(d.x,0,d.x+d.w,0); g.addColorStop(0,'rgba(150,120,255,.15)'); g.addColorStop(.5,'rgba(190,170,255,.65)'); g.addColorStop(1,'rgba(150,120,255,.15)');
  c.fillStyle = g; c.fillRect(d.x, d.y, d.w, d.h);
  for(let i=0;i<10;i++){ const yy = d.y + ((Game.time*60 + i*47) % d.h); glow(c, d.x+d.w/2 + Math.sin(i+Game.time*3)*6, yy, 12, '#d6caff', .7); }
  // selos (quantas tochas faltam)
  const need = Game.level.torches.filter(t => P[t.k].room===d.room);
  need.forEach((t,i) => drawOrb(c, d.x+d.w/2, 200 + i*44, 13, t.lit ? P[t.k].color : '#555a70', t.k, 14));
  c.restore();
}
function drawEnemy(c, e){
  if(e.dead >= 1) return;
  c.save(); c.globalAlpha = 1 - e.dead;
  const cx = e.x + e.w/2, cy = e.y + e.h/2;
  if(e.type==='ghost'){
    glow(c, cx, cy, 50, '#8a7bff', .3);
    c.translate(cx, cy); c.scale(e.vx<0?-1:1, 1 - e.dead*.6);
    c.fillStyle = 'rgba(40,30,80,.92)';
    c.beginPath(); c.arc(0, -4, 20, Math.PI, 0); c.lineTo(20, 18);
    for(let i=0;i<4;i++){ c.quadraticCurveTo(15-i*10, 10 + Math.sin(Game.time*10+i)*3, 10-i*10, 18); }
    c.closePath(); c.fill();
    c.fillStyle = '#ff5c8a'; c.beginPath(); c.arc(6,-6,4,0,7); c.arc(-6,-6,4,0,7); c.fill();
    c.fillStyle = '#fff'; c.font = "700 11px 'Noto Sans JP',sans-serif"; c.textAlign='center'; c.fillText('？', 0, 10);
  } else {
    c.translate(cx, cy); const flap = Math.sin(Game.time*14)*.6;

    c.fillStyle = '#7a1f3a'; c.save(); c.rotate(-flap*.4); c.fillRect(-22,-14,22,28); c.restore();
    c.save(); c.rotate(flap*.4); c.fillRect(0,-14,22,28); c.restore();
    c.fillStyle = '#f4ecd8'; c.fillRect(-18,-10,36,20);
    c.fillStyle = '#222'; c.beginPath(); c.arc(-6,-2,3,0,7); c.arc(6,-2,3,0,7); c.fill();
    c.strokeStyle = '#222'; c.lineWidth = 2; c.beginPath(); c.moveTo(-6,6); c.lineTo(-2,4); c.lineTo(2,6); c.lineTo(6,4); c.stroke();
  }
  c.restore();
}
function drawTreat(c, t){
  if(t.got) return;
  const y = t.y + Math.sin(Game.time*3 + t.t)*5;
  glow(c, t.x, y, 34, '#ffd6a0', .4);
  c.save(); c.translate(t.x, y); c.rotate(-.3);
  c.fillStyle = '#e8b26a'; c.strokeStyle = '#8a5a24'; c.lineWidth = 2;
  c.beginPath(); c.arc(-12,-5,6,0,7); c.arc(-12,5,6,0,7); c.arc(12,-5,6,0,7); c.arc(12,5,6,0,7); c.fill();
  c.fillRect(-12,-5,24,10); c.restore();
}
function drawTromba(c, n){
  const x = n.x, y = n.y, b = Math.sin(Game.time*2)*2;
  c.save(); c.translate(x, y);
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(0, 2, 30, 6, 0, 0, 7); c.fill();

  c.beginPath(); c.ellipse(0, -26+b*.3, 30, 22, 0, 0, 7); c.fill();

function drawPortal(c, pt){
  const x = pt.x, y = pt.y - 190, act = pt.active;
  c.fillStyle = '#3a2a16'; c.fillRect(x-70, pt.y-14, 140, 14);
  c.save();
  for(let i=0;i<8;i++){ const a = i/8*Math.PI*2 + Game.time*.6, k = PARTICLES[i].k;
    const lit = Game.level.torches.find(t => t.k===k).lit;
    drawOrb(c, x + Math.cos(a)*78, y + Math.sin(a)*78, 13, lit ? PARTICLES[i].color : '#3c4058', k, 14); }
  const g = c.createRadialGradient(x, y, 5, x, y, 64);
  g.addColorStop(0, act ? '#ffffff' : '#555a74'); g.addColorStop(.4, act ? '#b9a8ff' : '#2e3150'); g.addColorStop(1, 'rgba(20,20,40,.0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, 64, 0, 7); c.fill();

  c.fillStyle = '#ffe39a'; c.font = "800 15px system-ui,sans-serif"; c.textAlign = 'center';
  c.fillText(act ? 'Grande Selo — [E]' : 'Grande Selo', x, y + 108);

}

/* =====================================================================
   GAME — "GameManager"
   ===================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let DPR = 1;
function resize(){ DPR = Math.min(2, window.devicePixelRatio || 1); canvas.width = VW*DPR; canvas.height = VH*DPR; }
resize(); window.addEventListener('resize', resize);

const Game = {
  state:'title', time:0, camX:0, shake:0,
  score:0, lives:3, bag:[], lit:0, errors:0, stomps:0, startTime:0, checkpoint:80,
  level:null, player:new Pongo(), currentRoom:0, nearTarget:null, doorMsgT:0, trombaTalked:false,

  newGame(){
    this.level = buildLevel(); this.player = new Pongo();
    Object.assign(this, { score:0, lives:3, bag:[], lit:0, errors:0, stomps:0, checkpoint:80, camX:0, currentRoom:0, trombaTalked:false });
    this.startTime = performance.now(); FX.list = [];
    this.state = 'play'; UI.hud();
    setTimeout(() => this.say('🐘 Senhor Tromba: “Pongo! Aproxime-se e aperte E para conversar comigo.”', 3600), 400);
  },
  togglePause(){
    if(this.state==='play'){ this.state='pause'; UI.pause(); }
    else if(this.state==='pause'){ this.state='play'; UI.close(); }
  },
  say(msg, ms){ UI.toast(msg, ms); },
  bumpDoor(room){
    if(this.doorMsgT > 0) return; this.doorMsgT = 2.5;
    const left = this.level.torches.filter(t => P[t.k].room===room && !t.lit).map(t => t.k);
    this.say(`🔒 A barreira mágica só se abre quando as tochas ${left.join(' e ')} desta sala estiverem acesas.`);
  },
  hurt(fromX){
    const p = this.player; if(p.inv > 0) return;
    this.lives--; p.inv = 1.6; this.shake = .3; Sound.hurt();
    p.vy = -480; p.vx = (p.cx < fromX ? -1 : 1) * 300;
    FX.burst(p.cx, p.y+20, '#ff6b8a', 14, 200);
    UI.hud();
    if(this.lives <= 0) this.gameOver();
  },
  fall(){
    this.lives--; this.shake = .3; Sound.hurt(); UI.hud();
    if(this.lives <= 0){ this.gameOver(); return; }
    this.player.reset(this.checkpoint); this.player.inv = 1.5;
    this.say('💫 Ops! Pongo caiu no abismo encantado. Cuidado com os buracos!');
  },
  gameOver(){ this.state = 'over'; setTimeout(() => UI.gameOver(), 500); },

  update(dt){
    this.time += dt;
    if(this.state !== 'play'){ FX.update(dt); return; }
    const L = this.level, p = this.player;
    if(this.doorMsgT > 0) this.doorMsgT -= dt;

    // plataformas móveis
    for(const m of L.movers){
      m.t += dt; const s = (1 - Math.cos(m.t/m.period*Math.PI*2))/2;
      const nx = m.bx + m.ax*s, ny = m.by + m.ay*s; m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
    }
    p.update(dt, L);
    if(p.y > VH + 60){ this.fall(); return; }

    // inimigos
    for(const e of L.enemies){
      e.t += dt;
      if(e.dead){ e.dead = Math.min(1, e.dead + dt*2.5); continue; }
      if(e.type==='ghost'){ e.x += e.vx*dt; if(e.x < e.a){ e.x = e.a; e.vx = Math.abs(e.vx); } if(e.x + e.w > e.b){ e.x = e.b - e.w; e.vx = -Math.abs(e.vx); } e.y = e.by + Math.sin(e.t*3)*5; }
      else { e.y = e.by + Math.sin(e.t*1.6)*e.amp; e.x += Math.sin(e.t*.8)*.6; }
      if(overlap(p, {x:e.x+4, y:e.y+4, w:e.w-8, h:e.h-6})){
        if(p.vy > 60 && p.bottom - p.vy*dt <= e.y + e.h*.5){
          e.dead = .01; p.vy = -560; this.score += 30; this.stomps++; Sound.stomp();
          FX.burst(e.x+e.w/2, e.y+e.h/2, e.type==='ghost'?'#b9a8ff':'#ff9a9a', 18, 220); UI.hud();
        } else this.hurt(e.x + e.w/2);
      }
    }
    // coleta de partículas
    for(const it of L.particles){
      it.t += dt; if(it.got) continue;
      if(Math.abs(p.cx - it.x) < 38 && Math.abs((p.y + p.h/2) - it.y) < 52){
        it.got = true; this.bag.push(it.k); this.score += 50; Sound.pick();
        FX.burst(it.x, it.y, P[it.k].color, 26, 240, .9);
        this.say(`✨ Partícula ${it.k} (${P[it.k].ro}) encontrada! Leve-a até a Tocha do Saber com o mesmo símbolo.`);
        UI.hud();
      }
    }
    // biscoitos (vida extra)
    for(const t of L.treats){
      if(t.got) continue;
      if(Math.abs(p.cx - t.x) < 34 && Math.abs((p.y+p.h/2) - t.y) < 46){
        t.got = true; this.lives = Math.min(5, this.lives+1); this.score += 20; Sound.pick();
        FX.burst(t.x, t.y, '#ffd6a0', 16, 160); this.say('🦴 Biscoito mágico! +1 vida'); UI.hud();
      }
    }
    // portas abrem quando as tochas da sala estão acesas
    for(const d of L.doors){
      const ready = L.torches.filter(t => P[t.k].room===d.room).every(t => t.lit);
      if(ready && d.open < 1){ d.open = Math.min(1, d.open + dt*.8); }
    }
    // alvo de interação
    this.nearTarget = null;
    for(const t of L.torches){ if(!t.lit && Math.abs(p.cx - t.x) < 62 && Math.abs(p.bottom - t.y) < 90){ this.nearTarget = { type:'torch', t }; break; } }
    if(!this.nearTarget && Math.abs(p.cx - L.tromba.x) < 80 && p.bottom > FY - 60) this.nearTarget = { type:'tromba' };
    if(!this.nearTarget && Math.abs(p.cx - L.portal.x) < 90 && p.bottom > FY - 60) this.nearTarget = { type:'portal' };
    L.portal.active = this.lit === 8;

    if(Input.act){
      Input.act = false;
      const n = this.nearTarget;
      if(n && n.type==='torch'){
        if(this.bag.includes(n.t.k)){ this.state = 'puzzle'; Sound.click(); Puzzle.open(n.t); }
        else this.say(`🔮 Esta Tocha do Saber espera a partícula ${n.t.k}. Procure-a nesta sala!`);
      } else if(n && n.type==='tromba'){ this.trombaTalk(); }
      else if(n && n.type==='portal'){
        if(this.lit === 8){ this.state = 'puzzle'; Puzzle.openFinal(); }
        else this.say(`🌀 O Grande Selo precisa das 8 tochas acesas. Faltam ${8 - this.lit}.`);
      }
    }

    // sala atual / checkpoint
    const r = roomAt(p.cx);
    if(r !== this.currentRoom){
      this.currentRoom = r; UI.hud();
      if(r > 0 && this.checkpoint < r*ROOM_W) this.checkpoint = r*ROOM_W + 60;
      this.say(`🏰 Você entrou: ${ROOMS[r].name}`, 2000);
    }

    // câmera (segue o Pongo com suavização)
    const target = clamp(p.cx - VW*.42 + p.face*60, 0, WORLD_W - VW);
    this.camX = lerp(this.camX, target, 1 - Math.pow(.002, dt));
    if(this.shake > 0) this.shake -= dt;
    FX.update(dt);
    Input.jumpPressed = false;
  },

  trombaTalk(){
    const lines = [
      '🐘 “Oito partículas mágicas fugiram pelo castelo! Elas são os artefatos que dão sentido às frases.”',
      '🐘 “Pule nas estantes, pegue cada partícula brilhante e leve-a à Tocha do Saber com o mesmo símbolo.”',
      '🐘 “Na tocha, encaixe a partícula no lugar certo da frase e diga qual é a função dela. がんばって!”',
      '🐘 “Cuidado com os Fantasmas do Esquecimento — pule em cima deles! Biscoitos 🦴 dão vida extra.”',
    ];
    this.trombaIdx = ((this.trombaIdx ?? -1) + 1) % lines.length;
    this.say(lines[this.trombaIdx], 4200); Sound.click();
  },

  lightTorch(t, pts){
    t.lit = true; this.lit++; this.bag = this.bag.filter(k => k !== t.k);
    this.score += pts; this.checkpoint = t.x - 25;
    FX.burst(t.x, t.y-110, P[t.k].color, 40, 300, 1.1); Sound.ok();
    const room = P[t.k].room;
    if(this.level.torches.filter(x => P[x.k].room===room).every(x => x.lit) && room < 3){
      setTimeout(() => { Sound.door(); this.say(`🚪 Todas as tochas do ${ROOMS[room].name} estão acesas! A barreira mágica se dissolveu →`, 3200); }, 400);
    }
    if(this.lit === 8) setTimeout(() => this.say('🌀 As 8 tochas brilham! Vá até o Grande Selo no fim da Copa Dourada.', 3600), 400);
    UI.hud();
  },

  draw(){
    const c = ctx, L = this.level;
    c.setTransform(DPR,0,0,DPR,0,0);
    c.fillStyle = '#09152b'; c.fillRect(0,0,VW,VH);
    if(!L){ return; }
    c.save();
    const sx = this.shake > 0 ? (Math.random()-.5)*10 : 0, sy = this.shake > 0 ? (Math.random()-.5)*8 : 0;
    c.translate(-Math.round(this.camX) + sx, sy);
    for(let r=0;r<4;r++) drawRoomBackground(c, r, this.camX);
    drawFloors(c, L, this.camX);
    const vis = o => o.x + (o.w||80) > this.camX - 100 && o.x < this.camX + VW + 100;
    for(const pl of L.plats) if(vis(pl)) drawPlatform(c, pl, false);
    for(const m of L.movers) if(vis(m)) drawPlatform(c, m, true);
    if(vis(L.tromba)) drawTromba(c, L.tromba);
    for(const t of L.torches) if(vis(t)) drawTorch(c, t);
    if(vis(L.portal)) drawPortal(c, L.portal);
    for(const it of L.particles){ if(it.got || !vis(it)) continue;
      const y = it.y + Math.sin(this.time*2.5 + it.t)*7;
      for(let i=0;i<3;i++){ const a = this.time*3 + i*2.1; glow(c, it.x+Math.cos(a)*26, y+Math.sin(a)*12, 8, '#ffffff', .8); }
      drawOrb(c, it.x, y, 22, P[it.k].color, it.k, 26); }
    for(const t of L.treats) if(vis(t)) drawTreat(c, t);
    for(const e of L.enemies) if(vis(e)) drawEnemy(c, e);
    for(const d of L.doors) if(vis(d)) drawDoor(c, d);
    this.player.draw(c);
    // indicador de interação
    const n = this.nearTarget;
    if(n && this.state==='play'){
      let x, y, txt;
      if(n.type==='torch'){ x = n.t.x; y = n.t.y - 205; txt = this.bag.includes(n.t.k) ? 'E · depositar ' + n.t.k : 'precisa de ' + n.t.k; }
      else if(n.type==='tromba'){ x = L.tromba.x + 10; y = FY - 110; txt = 'E · conversar'; }
      else { x = L.portal.x; y = FY - 320; txt = this.lit===8 ? 'E · abrir o Selo' : `${this.lit}/8 tochas`; }
      const bob = Math.sin(this.time*5)*4;
      c.font = "700 14px system-ui,'Noto Sans JP',sans-serif"; const w = c.measureText(txt).width + 22;
      c.fillStyle = 'rgba(10,16,40,.85)'; roundRect(c, x - w/2, y - 14 + bob, w, 28, 8); c.fill();
      c.strokeStyle = '#ffe39a'; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = '#ffe39a'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, x, y + bob);
    }
    FX.draw(c);
    c.restore();

    // vinheta
    const v = c.createRadialGradient(VW/2, VH/2, VH*.35, VW/2, VH/2, VH*.95);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,10,.55)');
    c.fillStyle = v; c.fillRect(0,0,VW,VH);
    // minimapa
    const mx = 20, my = 16, mw = 220;
    c.fillStyle = 'rgba(5,10,30,.6)'; roundRect(c, mx-6, my-6, mw+12, 26, 8); c.fill();
    for(let r=0;r<4;r++){ c.fillStyle = ROOMS[r].wall; c.fillRect(mx + r*mw/4 + 1, my, mw/4 - 2, 14); }
    for(const t of L.torches){ c.fillStyle = t.lit ? P[t.k].color : '#333'; c.fillRect(mx + t.x/WORLD_W*mw - 1.5, my+2, 3, 10); }
    c.fillStyle = '#fff'; c.beginPath(); c.arc(mx + this.player.cx/WORLD_W*mw, my+7, 4, 0, 7); c.fill();
  }
};

/* =====================================================================
   PUZZLE DA TOCHA DO SABER
   Etapa 1: arrastar a partícula para o lugar certo da frase.
   Etapa 2: escolher a função da partícula.
   Final  : combinar as 8 partículas com suas funções (Grande Selo).
   ===================================================================== */
const Puzzle = {
  torch:null, mistakes:0,
  open(t){
    this.torch = t; this.mistakes = 0;
    const p = P[t.k];
    // bandeja: partícula correta + itens da mochila + distratores
    const pool = new Set([t.k, ...Game.bag]);
    for(const k of shuffle(PARTICLES.map(x=>x.k))){ if(pool.size >= 4) break; pool.add(k); }
    this.tray = shuffle([...pool]);
    this.stage1();
  },
  header(step){
    const p = P[this.torch.k];
    return `<h1>🔥 Tocha do Saber · ${esc(ROOMS[p.room].name)}</h1>
      <div class="steps"><span class="${step===1?'on':'done'}">1 · Encaixar na frase</span><span class="${step===2?'on':(step>2?'done':'')}">2 · Função</span></div>`;
  },
  stage1(){
    const p = P[this.torch.k];
    let s = '';
    p.words.forEach((w,i) => { s += `<span class="word">${esc(w)}</span>`; if(i < p.words.length-1) s += `<button class="slot" data-gap="${i}" aria-label="Espaço ${i+1}"></button>`; });
    UI.open(`${this.header(1)}
      <p style="text-align:center">Arraste a partícula mágica para o <b>lugar certo</b> da frase (ou toque na partícula e depois no espaço).</p>
      <div class="sentence" id="sent">${s}</div>
      <p class="trans">“${esc(p.pt)}”</p>
      <div class="tray" id="tray">${this.tray.map(k => `<button class="orb" style="--c:${P[k].color}" data-k="${k}" aria-label="Partícula ${k}">${k}<small>${Game.bag.includes(k)?'mochila':'eco'}</small></button>`).join('')}</div>
      <p id="fb" aria-live="polite"></p>`);
    DnD.bind(document.getElementById('tray'), document.getElementById('sent'), (k, gap, slotEl, orbEl) => this.drop(k, gap, slotEl, orbEl));
  },
  drop(k, gap, slotEl, orbEl){
    const p = P[this.torch.k], fb = document.getElementById('fb');
    if(k === p.k && gap === p.gap){
      slotEl.textContent = k; slotEl.classList.add('filled'); slotEl.style.color = p.color; orbEl.classList.add('used');
      document.querySelectorAll('#sent .slot:not(.filled)').forEach(s => s.remove());
      fb.className = 'ok'; fb.innerHTML = `✨ Perfeito! <span class="romaji">${esc(p.rs)}</span>`;
      Sound.ok(); DnD.unbind();
      const b = document.createElement('button'); b.className = 'btn-primary'; b.textContent = 'Próxima etapa →';
      b.onclick = () => this.stage2(); document.getElementById('panel').appendChild(b); b.focus();
    } else {
      this.mistakes++; Game.errors++; Game.score = Math.max(0, Game.score - 10); UI.hud(); Sound.bad();
      slotEl.classList.add('no'); orbEl.classList.add('no');
      setTimeout(() => { slotEl.classList.remove('no'); orbEl.classList.remove('no'); }, 450);
      fb.className = 'bad';
      fb.textContent = k !== p.k
        ? `❌ A partícula ${k} não combina com esta frase. Pense no que a frase quer dizer. (-10)`
        : `🤔 Partícula certa, lugar errado! Em que ponto da frase ela faz sentido? (-10)`;
    }
  },
  stage2(){
    const p = P[this.torch.k];
    const opts = shuffle([p.fn, ...shuffle(PARTICLES.filter(x => x.k !== p.k).map(x => x.fn)).slice(0,3)]);
    const sent = p.words.map((w,i) => esc(w) + (i===p.gap ? `<b style="color:${p.color}">${p.k}</b>` : '')).join(' ');
    UI.open(`${this.header(2)}
      <div class="big-kana" style="--c:${p.color};color:${p.color}">${p.k}</div>
      <p style="text-align:center;font-size:1.35rem">${sent}</p>
      <p class="romaji">${esc(p.rs)}</p>
      <p style="text-align:center;margin-top:8px"><b>Qual é a função de ${p.k} nesta frase?</b></p>
      <div class="choices" id="ch">${opts.map(o => `<button data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <p id="fb" aria-live="polite"></p>`);
    document.querySelectorAll('#ch button').forEach(b => b.onclick = () => {
      const fb = document.getElementById('fb');
      if(b.dataset.v === p.fn){
        document.querySelectorAll('#ch button').forEach(x => x.disabled = true);
        b.classList.add('correct'); Sound.ok();
        const pts = Math.max(60, 250 - this.mistakes*30);
        fb.className = 'ok'; fb.textContent = `✅ Correto! +${pts} pontos`;
        const ex = document.createElement('div'); ex.className = 'explain';
        ex.innerHTML = `<b>${p.k} (${p.ro}) — ${esc(p.name)}</b><br>${esc(p.fn)}<br><span class="small">💡 ${esc(p.tip)}</span>`;
        const btn = document.createElement('button'); btn.className = 'btn-primary'; btn.textContent = '🔥 Acender a Tocha do Saber';
        btn.onclick = () => { UI.close(); Game.state = 'play'; Game.lightTorch(this.torch, pts); };
        const panel = document.getElementById('panel'); panel.appendChild(ex); panel.appendChild(btn); btn.focus();
      } else {
        this.mistakes++; Game.errors++; Game.score = Math.max(0, Game.score - 10); UI.hud(); Sound.bad();
        b.classList.add('wrong'); b.disabled = true;
        fb.className = 'bad'; fb.textContent = '❌ Essa não é a função desta partícula. Tente de novo! (-10)';
      }
    });
  },
  // Grande Selo — combinar partículas e funções
  openFinal(){
    const ks = shuffle(PARTICLES.map(p => p.k)), fs = shuffle(PARTICLES.map(p => p.k));
    UI.open(`<h1>🌀 O Grande Selo do Castelo</h1>
      <p style="text-align:center">Para libertar a magia, <b>combine cada partícula com a sua função</b>. Toque numa partícula e depois na função correspondente.</p>
      <div class="match"><div class="col" id="mk">${ks.map(k => `<button class="k" data-k="${k}" style="color:${P[k].color}">${k}</button>`).join('')}</div>
      <div class="col" id="mf">${fs.map(k => `<button class="f" data-k="${k}">${esc(P[k].fn)}</button>`).join('')}</div></div>
      <p id="fb" aria-live="polite"></p>`);
    let sel = null, done = 0;
    const fb = () => document.getElementById('fb');
    document.querySelectorAll('#mk .k').forEach(b => b.onclick = () => {
      document.querySelectorAll('#mk .k').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = b; Sound.click();
    });
    document.querySelectorAll('#mf .f').forEach(b => b.onclick = () => {
      if(!sel){ fb().className = 'bad'; fb().textContent = 'Primeiro toque numa partícula à esquerda.'; return; }
      if(b.dataset.k === sel.dataset.k){
        b.classList.add('done'); sel.classList.add('done'); sel.classList.remove('sel'); sel = null; done++;
        Game.score += 40; UI.hud(); Sound.pick(); fb().className = 'ok'; fb().textContent = `✨ Combinação perfeita! (${done}/8)`;
        if(done === 8){ setTimeout(() => { Game.state = 'win'; Sound.door(); UI.victory(); }, 700); }
      } else {
        Game.errors++; Game.score = Math.max(0, Game.score - 5); UI.hud(); Sound.bad();
        b.classList.add('no'); setTimeout(() => b.classList.remove('no'), 450);
        fb().className = 'bad'; fb().textContent = '❌ Não combinam. Leia a função com calma! (-5)';
      }
    });
  }
};

/* ---------- Arrastar e soltar (mouse + toque) com alternativa por clique ---------- */
const DnD = {
  cleanup:null,
  bind(tray, sent, onDrop){
    this.unbind();
    let sel = null, drag = null, start = null, src = null;
    const slotAt = (x,y) => { const el = document.elementFromPoint(x,y); return el && el.closest ? el.closest('.slot') : null; };
    const hoverClear = () => sent.querySelectorAll('.slot.hover').forEach(s => s.classList.remove('hover'));
    const down = e => {
      const orb = e.target.closest('.orb'); if(!orb || orb.classList.contains('used')) return;
      e.preventDefault(); src = orb; start = { x:e.clientX, y:e.clientY };
      try{ orb.setPointerCapture(e.pointerId); }catch(_){}
    };
    const move = e => {
      if(!src) return;
      if(!drag && Math.hypot(e.clientX-start.x, e.clientY-start.y) > 8){
        drag = src.cloneNode(true); drag.classList.add('drag'); drag.classList.remove('sel'); document.body.appendChild(drag);
        src.style.opacity = '.35';
      }
      if(drag){ drag.style.left = e.clientX+'px'; drag.style.top = e.clientY+'px';
        hoverClear(); const s = slotAt(e.clientX, e.clientY); if(s) s.classList.add('hover'); }
    };
    const up = e => {
      if(!src) return;
      const orb = src; src = null;
      if(drag){
        drag.remove(); drag = null; orb.style.opacity = ''; hoverClear();
        const s = slotAt(e.clientX, e.clientY);
        if(s && !s.classList.contains('filled')) onDrop(orb.dataset.k, +s.dataset.gap, s, orb);
      } else {
        // clique: selecionar partícula
        tray.querySelectorAll('.orb').forEach(o => o.classList.remove('sel'));
        sel = orb; orb.classList.add('sel'); Sound.click();
      }
    };
    const slotClick = e => {
      const s = e.target.closest('.slot'); if(!s || s.classList.contains('filled')) return;
      if(!sel){ const fb = document.getElementById('fb'); fb.className = 'bad'; fb.textContent = 'Escolha primeiro uma partícula abaixo.'; return; }
      sel.classList.remove('sel'); const o = sel; sel = null; onDrop(o.dataset.k, +s.dataset.gap, s, o);
    };
    const keySel = e => { // teclado: Enter/Espaço na partícula seleciona
      const orb = e.target.closest('.orb'); if(!orb || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault(); tray.querySelectorAll('.orb').forEach(o => o.classList.remove('sel')); sel = orb; orb.classList.add('sel');
      const first = sent.querySelector('.slot:not(.filled)'); if(first) first.focus();
    };
    tray.addEventListener('pointerdown', down); window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    sent.addEventListener('click', slotClick); tray.addEventListener('keydown', keySel);
    this.cleanup = () => { tray.removeEventListener('pointerdown', down); window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      sent.removeEventListener('click', slotClick); tray.removeEventListener('keydown', keySel); if(drag) drag.remove(); };
  },
  unbind(){ if(this.cleanup){ this.cleanup(); this.cleanup = null; } }
};

      <button class="btn-primary" id="res">▶ Continuar</button>

    document.getElementById('res').onclick = () => Game.togglePause();

      <div class="stats"><div><b>${Game.score}</b>pontos</div><div><b>${Game.lit}/8</b>tochas</div></div>

    Game.score += bonus; UI.hud();
    let best = 0; try{ best = +localStorage.getItem('pongo-particulas-best') || 0; if(Game.score > best) localStorage.setItem('pongo-particulas-best', Game.score); }catch(e){}
    this.open(`<h1>🏆 Mestre das Partículas!</h1>
      <div class="hero"><img src="${SPR.run.src}" alt="Pongo correndo feliz" style="width:180px"><div>
      <p>O Grande Selo se abriu e a magia da língua japonesa voltou a iluminar o castelo! Pongo e o Senhor Tromba comemoram juntos. <b>おめでとう!</b></p></div></div>
      <div class="stats"><div><b>${Game.score}</b>pontos${Game.score > best ? ' 🆕' : ''}</div><div><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b>tempo</div><div><b>${Game.errors}</b>erros</div><div><b>${Game.stomps}</b>fantasmas</div></div>
      <p class="small" style="text-align:center">Bônus de tempo e vidas: +${bonus}</p>
      <h2>Seu grimório de partículas</h2>
      <table class="table">${PARTICLES.map(p => `<tr><td style="color:${p.color}">${p.k}</td><td><b>${esc(p.name)}</b> (${p.ro}) — ${esc(p.fn)}<br><span class="small">${esc(p.words.map((w,i)=>w+(i===p.gap?p.k:'')).join(''))} · ${esc(p.pt)}</span></td></tr>`).join('')}</table>
      <button class="btn-primary" id="again">🔁 Jogar novamente</button>`);
    document.getElementById('again').onclick = () => { this.close(); Game.newGame(); };
  }
};

function toggleSound(){ Sound.on = !Sound.on; document.getElementById('btnSound').textContent = Sound.on ? '🔊 Som' : '🔇 Mudo'; if(Sound.on){ Sound.init(); Sound.startMusic(); Sound.click(); } }
document.getElementById('btnSound').onclick = toggleSound;
document.getElementById('btnPause').onclick = () => Game.togglePause();

/* ---------- Tela de título animada (castelo ao fundo) ---------- */
function drawTitleBackdrop(){
  const c = ctx; c.setTransform(DPR,0,0,DPR,0,0);
  const g = c.createLinearGradient(0,0,0,VH); g.addColorStop(0,'#070d23'); g.addColorStop(1,'#2a3f6c'); c.fillStyle = g; c.fillRect(0,0,VW,VH);
  for(let i=0;i<90;i++){ const x=(i*179+43)%VW, y=(i*67+19)%300; c.globalAlpha = .4+.4*Math.sin(Game.time*2+i); c.fillStyle='#d6e2ff'; c.fillRect(x,y,2,2); }
  c.globalAlpha = 1; glow(c, 840, 90, 120, '#cfe0ff', .35); c.fillStyle = '#e6eeff'; c.beginPath(); c.arc(840, 90, 34, 0, 7); c.fill();
  // silhueta do castelo
  c.fillStyle = '#1a2846';
  c.beginPath(); c.moveTo(0,VH); c.lineTo(0,430); c.quadraticCurveTo(250,370,500,400); c.quadraticCurveTo(760,360,VW,420); c.lineTo(VW,VH); c.fill();
  const towers = [[230,200,40],[300,150,55],[380,230,36],[470,170,46],[560,120,60],[650,210,40],[720,160,50],[800,230,34]];
  c.fillStyle = '#22355c';
  c.fillRect(220, 300, 620, 110);
  for(const [x,top,w] of towers){ c.fillRect(x-w/2, top, w, 410-top); c.beginPath(); c.moveTo(x-w/2-8, top); c.lineTo(x, top-w*1.3); c.lineTo(x+w/2+8, top); c.fill(); }
  for(const [x,top,w] of towers) for(let j=0;j<3;j++){ c.fillStyle = '#ffd178'; c.globalAlpha = .6+.4*Math.sin(Game.time*1.5+x+j); c.fillRect(x-4, top+24+j*40, 8, 14); }
  c.globalAlpha = 1;
  PARTICLES.forEach((p,i) => { const a = Game.time*.5 + i/8*Math.PI*2; drawOrb(c, 530 + Math.cos(a)*300, 260 + Math.sin(a)*70, 16, p.color, p.k, 17); });
}

/* ---------- Loop principal (passo fixo de 60 Hz) ---------- */
let last = performance.now(), acc = 0;
const STEP = 1/60;
function frame(now){
  acc += Math.min(.1, (now - last)/1000); last = now;
  while(acc >= STEP){ Game.update(STEP); acc -= STEP; }
  if(Game.state === 'title') drawTitleBackdrop(); else Game.draw();
  requestAnimationFrame(frame);
}
UI.hud(); UI.title(); requestAnimationFrame(frame);
</script>
</body>
