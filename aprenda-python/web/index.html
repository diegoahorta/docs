<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2433">
<title>Aprenda Python</title>
<link rel="icon" href="img/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script>
  // Se algum script falhar (ex.: WebView muito antigo), mostra o motivo na tela.
  window.addEventListener('error', function (e) {
    var d = document.getElementById('erro-global');
    if (!d) {
      d = document.createElement('div');
      d.id = 'erro-global';
      d.style.cssText = 'position:fixed;left:8px;right:8px;top:64px;z-index:99;background:#fdecea;color:#8a1c14;border:1px solid #c9372c;border-radius:12px;padding:10px 12px;font:14px/1.4 sans-serif';
      (document.body || document.documentElement).appendChild(d);
    }
    d.textContent = 'Ocorreu um erro no app: ' + (e.message || e) + ' — Se persistir, atualize o "Android System WebView" e o Chrome pela Play Store. Navegador: ' + navigator.userAgent;
  });
</script>
</head>
<body>
<header class="topo">
  <button class="btn-icone" id="btn-voltar" aria-label="Voltar" hidden>‹</button>
  <a href="#/" class="marca"><img src="img/icone.svg" alt="" width="28" height="28"><span>Aprenda Python</span></a>
  <span class="status-py" id="status-py" title="Estado do interpretador Python">Python…</span>
  <button class="btn-icone" id="btn-busca" aria-label="Buscar">⌕</button>
  <button class="btn-icone" id="btn-tema" aria-label="Alternar tema">◐</button>
</header>
<main id="app" tabindex="-1"><div class="carregando">Carregando conteúdo…</div></main>
<nav class="abas">
  <a href="#/" data-aba="inicio"><span>🏠</span>Início</a>
  <a href="#/trilha" data-aba="trilha"><span>🗺️</span>Trilha</a>
  <a href="#/playground" data-aba="playground"><span>▶</span>Praticar</a>
  <a href="#/mais" data-aba="mais"><span>☰</span>Mais</a>
</nav>
<script src="js/parser.js"></script>
<script src="js/editor.js"></script>
<script src="js/python.js"></script>
<script src="js/app.js"></script>
</body>
</html>
