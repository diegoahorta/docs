<script>
"use strict";
(() => {
// ===== core.js =====
// Núcleo compartilhado: dados, progresso, repetição espaçada, XP, acento tonal e voz.
const COLS = ["id", "no", "palavra", "leitura", "romaji", "pt", "imp", "cls", "livro", "licao", "acento", "acento_fonte", "nota"];

const CLS = {
  SUB: "substantivo", V1: "verbo grupo 1", V2: "verbo grupo 2", V3: "verbo grupo 3",
  "ADJ-I": "adjetivo-i", "ADJ-NA": "adjetivo-na", ADV: "advérbio", CONJ: "conjunção",
  EXP: "expressão", AFX: "afixo (～)", NC: "não classificado",
};
const BOOKS = { 1: [1, 15], 2: [16, 24], 3: [25, 33], 4: [34, 42], 5: [43, 51], 6: [52, 60] };
const VOCAB = (window.KOTOBANA_DATA || []).map(r => Object.fromEntries(COLS.map((c, i) => [c, r[i]])));
const BYID = Object.fromEntries(VOCAB.map(v => [v.id, v]));
const DAY = 86400000;

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);

// ---------- estado persistente ----------
const KEY = "ktb2:state";
const blank = () => ({
  srs: {}, seen: {}, xp: 0, streak: { last: null, count: 0 }, days: {},
  best: { lanternas: 0, karuta: null }, stats: { answers: 0, correct: 0, games: 0 }, badges: [],
  prefs: { books: [1], from: 1, to: 15, imp: [1, 2, 3], dir: "jp" },
});
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return { ...blank(), ...s, prefs: { ...blank().prefs, ...s.prefs } }; } catch {}
  return blank();
}
const S = load();
let server = false, saveTimer = null;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
  if (server) { clearTimeout(saveTimer); saveTimer = setTimeout(() => fetch("api/progresso", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(S) }).catch(() => {}), 600); }
}
// Com o servidor Python (tools/servidor.py) o progresso também fica salvo em arquivo.
async function syncFromServer() {
  if (!location.protocol.startsWith("http")) return false;   // arquivo aberto direto do disco
  try {
    const r = await fetch("api/progresso", { cache: "no-store" });
    if (!r.ok || !(r.headers.get("content-type") || "").includes("json")) return false;
    const remote = await r.json();
    server = true;
    if (remote && remote.xp > S.xp) Object.assign(S, blank(), remote);
    save();
    return true;
  } catch { return false; }
}
function reset() { const p = S.prefs; Object.assign(S, blank(), { prefs: p }); save(); }

// ---------- baralho filtrado ----------
function deck(p = S.prefs) {
  const lo = Math.min(p.from, p.to), hi = Math.max(p.from, p.to);
  return VOCAB.filter(v => p.books.includes(v.livro) && v.licao >= lo && v.licao <= hi && p.imp.includes(v.imp || 1));
}
function status(id) {
  const s = S.srs[id];
  if (!s) return S.seen[id] ? "seen" : "new";
  return s.iv >= 21 ? "known" : "learn";
}
const STATUS_LABEL = { new: "nova", seen: "vista", learn: "aprendendo", known: "memorizada" };

// ---------- repetição espaçada (SM-2 simplificado) ----------
function nextInterval(s, q) {
  const ef = Math.max(1.3, s.ef + [0, -0.15, 0, 0.15][q]);
  const iv = s.reps === 0 ? [0, 1, 1, 3][q] : s.reps === 1 ? [0, 3, 4, 7][q] : Math.max(1, Math.round(s.iv * ef * [0, 0.8, 1, 1.3][q]));
  return { ef, iv };
}
function grade(id, q) { // 0 errei · 1 difícil · 2 bom · 3 fácil
  const s = S.srs[id] || { iv: 0, ef: 2.5, reps: 0, lapses: 0 };
  if (q === 0) { s.reps = 0; s.lapses++; s.iv = 0; s.ef = Math.max(1.3, s.ef - 0.2); s.due = Date.now() + 60000; }
  else { const n = nextInterval(s, q); s.ef = n.ef; s.iv = n.iv; s.reps++; s.due = Date.now() + s.iv * DAY; }
  S.srs[id] = s;
  S.seen[id] = 1;
}
function previewInterval(id, q) {
  if (q === 0) return "1 min";
  const { iv } = nextInterval(S.srs[id] || { iv: 0, ef: 2.5, reps: 0 }, q);
  return iv >= 30 ? Math.round(iv / 30) + (iv >= 60 ? " meses" : " mês") : iv + (iv === 1 ? " dia" : " dias");
}
// Resultado de quiz/jogo alimenta o SRS sem rebaixar quem já está bem.
function practiced(id, correct) {
  S.stats.answers++; if (correct) S.stats.correct++;
  if (!correct) grade(id, 0);
  else if (!S.srs[id]) grade(id, 2);
  else S.seen[id] = 1;
}
function dueCount(d = deck()) { const now = Date.now(); return d.filter(v => S.srs[v.id] && S.srs[v.id].due <= now).length; }

// ---------- XP, nível, sequência de dias, conquistas ----------
const today = () => new Date().toLocaleDateString("sv");
function level(xp = S.xp) { return Math.floor(Math.sqrt(xp / 40)) + 1; }
function levelRange(l) { return [40 * (l - 1) ** 2, 40 * l ** 2]; }
const listeners = new Set();
const onChange = fn => listeners.add(fn);
function gain(xp) {
  const d = today();
  if (S.streak.last !== d) {
    const y = new Date(Date.now() - DAY).toLocaleDateString("sv");
    S.streak.count = S.streak.last === y ? S.streak.count + 1 : 1;
    S.streak.last = d;
  }
  S.days[d] = (S.days[d] || 0) + xp;
  S.xp += xp;
  const fresh = checkBadges();
  save();
  listeners.forEach(fn => fn(xp, fresh));
}
const BADGES = [
  { id: "primeira", nome: "Primeiro passo", desc: "Ganhe seus primeiros pontos", ok: () => S.xp > 0 },
  { id: "cem", nome: "100 palavras", desc: "Estude 100 palavras diferentes", ok: () => Object.keys(S.seen).length >= 100 },
  { id: "quinhentas", nome: "500 palavras", desc: "Estude 500 palavras diferentes", ok: () => Object.keys(S.seen).length >= 500 },
  { id: "livro1", nome: "Livro 1 visto", desc: "Veja todas as palavras do livro 1", ok: () => VOCAB.filter(v => v.livro === 1).every(v => S.seen[v.id]) },
  { id: "memoria50", nome: "Memória firme", desc: "50 palavras memorizadas (revisão ≥ 21 dias)", ok: () => Object.values(S.srs).filter(s => s.iv >= 21).length >= 50 },
  { id: "sequencia3", nome: "Três dias seguidos", desc: "Estude 3 dias seguidos", ok: () => S.streak.count >= 3 },
  { id: "sequencia7", nome: "Uma semana", desc: "Estude 7 dias seguidos", ok: () => S.streak.count >= 7 },
  { id: "lanterna30", nome: "Mestre das lanternas", desc: "Faça 30 pontos em Lanternas", ok: () => S.best.lanternas >= 30 },
  { id: "karuta", nome: "Karuta", desc: "Complete uma partida de Karuta", ok: () => S.best.karuta != null },
  { id: "nivel5", nome: "Nível 5", desc: "Chegue ao nível 5", ok: () => level() >= 5 },
];
function checkBadges() {
  const fresh = BADGES.filter(b => !S.badges.includes(b.id) && b.ok());
  fresh.forEach(b => S.badges.push(b.id));
  return fresh;
}

// ---------- acento tonal ----------
const SMALL = new Set("ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ");
function morae(s) {
  const out = [];
  for (const ch of s) { if (SMALL.has(ch) && out.length) out[out.length - 1] += ch; else out.push(ch); }
  return out;
}
function pitchWord(tok) {
  const clean = tok.replace(/[（）()～…。、]/g, "");
  if (!clean) return `<span class="w">${esc(tok)}</span>`;
  const flat = clean.includes("→"), dropAt = clean.includes("↓") ? morae(clean.split("↓")[0]).length : null;
  const m = morae(clean.replace(/[↓→]/g, ""));
  if (!flat && dropAt === null) return `<span class="w">${m.map(x => `<span class="m">${esc(x)}</span>`).join("")}</span>`;
  const n = flat ? 0 : dropAt;
  return `<span class="w">${m.map((x, i) => {
    const k = i + 1, high = n === 0 ? k > 1 : n === 1 ? k === 1 : k > 1 && k <= n;
    const c = ["m"]; if (high) c.push("h"); if (n > 0 && k === n) c.push("drop"); if (high && k === 2) c.push("rise");
    return `<span class="${c.join(" ")}">${esc(x)}</span>`;
  }).join("")}</span>`;
}
function pitchHTML(v) {
  if (!v.acento_fonte) return `<div class="pitch">${esc(v.leitura)}</div>`;
  const vars = String(v.acento_fonte).split(/\s*[/／]\s*/).map(x =>
    `<span class="variant">${x.split(/[ 　]+/).filter(Boolean).map(pitchWord).join("")}</span>`);
  return `<div class="pitch" title="Linha = tom alto · degrau = queda">${vars.join('<span class="sep">ou</span>')}</div>`;
}

// ---------- voz (síntese do navegador) ----------
let jaVoice = null;
const hasTTS = "speechSynthesis" in window;
function pickVoice() { try { jaVoice = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)) || null; } catch {} }
if (hasTTS) { pickVoice(); try { speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch {} }
function speak(v) {
  if (!hasTTS) return;
  const text = String(v.leitura || v.palavra).split(/\s*[/／]\s*/)[0].replace(/[（）()]/g, "").replace(/[～…]/g, "");
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 0.85; if (jaVoice) u.voice = jaVoice;
    speechSynthesis.speak(u);
  } catch {}
}
const SPEAKER = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>`;

// ---------- distratores para múltipla escolha ----------
function distractors(v, n, field = "pt") {
  const pool = VOCAB.filter(x => x.id !== v.id && x[field] && x[field] !== v[field]);
  const same = pool.filter(x => x.cls === v.cls && Math.abs((x.licao || 0) - (v.licao || 0)) <= 12);
  const picked = [], used = new Set([v[field]]);
  for (const x of [...shuffle(same), ...shuffle(pool)]) {
    if (picked.length >= n) break;
    if (!used.has(x[field])) { used.add(x[field]); picked.push(x); }
  }
  return picked;
}

// ---------- seletor de conteúdo (livros, lições, importância) ----------
function deckPicker(el, onUpdate) {
  const p = S.prefs;
  const opts = Array.from({ length: 60 }, (_, i) => `<option value="${i + 1}">Lição ${i + 1}</option>`).join("");
  el.innerHTML = `
    <div class="picker">
      <div class="prow"><span class="plbl">Livros</span>${Object.keys(BOOKS).map(b =>
        `<label class="chip"><input type="checkbox" name="pk-book" value="${b}" ${p.books.includes(+b) ? "checked" : ""}>${b}</label>`).join("")}</div>
      <div class="prow"><span class="plbl">Lições</span><select name="pk-from" aria-label="Da lição">${opts}</select><span class="muted">até</span><select name="pk-to" aria-label="Até a lição">${opts}</select></div>
      <div class="prow"><span class="plbl">Importância</span>${[[3, "★★★"], [2, "★★"], [1, "★"]].map(([i, t]) =>
        `<label class="chip"><input type="checkbox" name="pk-imp" value="${i}" ${p.imp.includes(i) ? "checked" : ""}>${t}</label>`).join("")}</div>
      <div class="pinfo muted"></div>
    </div>`;
  const from = $("[name=pk-from]", el), to = $("[name=pk-to]", el);
  from.value = p.from; to.value = p.to;
  const info = () => { const d = deck(); $(".pinfo", el).textContent = `${d.length} palavras selecionadas · ${dueCount(d)} para revisar`; };
  el.addEventListener("change", e => {
    const vals = n => $$(`[name=${n}]:checked`, el).map(i => +i.value);
    p.books = vals("pk-book"); p.imp = vals("pk-imp");
    if (e.target.name === "pk-book" && p.books.length) {
      p.from = Math.min(...p.books.map(b => BOOKS[b][0])); p.to = Math.max(...p.books.map(b => BOOKS[b][1]));
      from.value = p.from; to.value = p.to;
    } else { p.from = +from.value; p.to = +to.value; }
    save(); info(); onUpdate?.();
  });
  info();
  return { refresh: info };
}

function toast(html) {
  const t = document.createElement("div");
  t.className = "toast"; t.innerHTML = html;
  $("#toasts").append(t);
  setTimeout(() => t.classList.add("out"), 2600);
  setTimeout(() => t.remove(), 3100);
}

// ===== three-util.js =====
// Utilidades three.js compartilhadas pelos jogos (THREE vem do script global do cdnjs).
async function fontsReady() {
  try {
    await Promise.race([
      Promise.all(['700 64px "Zen Old Mincho"', '500 48px "Zen Kaku Gothic New"', '600 40px "Instrument Sans"'].map(f => document.fonts.load(f))),
      new Promise(r => setTimeout(r, 1500)),
    ]);
  } catch {}
}

function wrapLines(ctx, text, maxW, maxLines) {
  const words = String(text).split(/\s+/), lines = [];
  let line = "";
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  // palavras japonesas sem espaço: quebra por caractere
  const out = [];
  for (const l of lines) {
    if (ctx.measureText(l).width <= maxW) { out.push(l); continue; }
    let cur = "";
    for (const ch of l) { if (ctx.measureText(cur + ch).width > maxW) { out.push(cur); cur = ch; } else cur += ch; }
    out.push(cur);
  }
  if (out.length > maxLines) { out.length = maxLines; out[maxLines - 1] = out[maxLines - 1].replace(/.?$/, "…"); }
  return out;
}

// Texto ajustado ao espaço: diminui a fonte até caber.
function fitText(ctx, text, family, weight, maxW, maxH, startSize, maxLines = 3) {
  for (let size = startSize; size >= 14; size -= 2) {
    ctx.font = `${weight} ${size}px ${family}`;
    const lines = wrapLines(ctx, text, maxW, 99);
    if (lines.length <= maxLines && lines.length * size * 1.2 <= maxH) return { size, lines };
  }
  ctx.font = `${weight} 14px ${family}`;
  return { size: 14, lines: wrapLines(ctx, text, maxW, maxLines) };
}

function canvasTexture(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  if (THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding;
  return t;
}

// Encurta significados longos para caber em lanternas e cartas.
function shortPt(pt) {
  let s = String(pt).replace(/\s*\([^)]*\)/g, "").trim();
  if (s.length > 34) s = s.split(/[,;]/)[0].trim();
  return s || String(pt);
}

function tween(ms, fn, ease = t => 1 - (1 - t) ** 3) {
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      const t = Math.min(1, (now - t0) / ms);
      fn(ease(t));
      if (t < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}

function makeRenderer(stage) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  if ("outputEncoding" in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
  stage.append(renderer.domElement);
  return renderer;
}

// ===== learn.js =====
// Aprender: navegar lição por lição, ver cada palavra em detalhe e marcar como vista.

function learnView(el) {
  let book = S.prefs.books[0] || 1;
  let lesson = Math.max(BOOKS[book][0], Math.min(S.prefs.from, BOOKS[book][1]));
  let idx = -1; // palavra aberta no modo apresentação

  const words = () => VOCAB.filter(v => v.livro === book && v.licao === lesson)
    .sort((a, b) => (b.imp || 0) - (a.imp || 0) || a.leitura.localeCompare(b.leitura, "ja"));

  function markSeen(v) {
    if (S.seen[v.id]) return;
    S.seen[v.id] = 1; gain(1);
  }

  function render() {
    const w = words(), seen = w.filter(v => S.seen[v.id]).length;
    const [a, z] = BOOKS[book];
    el.innerHTML = `
      <div class="page-head">
        <h1>Aprender</h1>
        <p class="muted">Escolha uma lição, ouça cada palavra e observe o acento: a linha marca o tom alto e o degrau, a queda.</p>
      </div>
      <div class="learn-nav">
        <div class="seg" role="tablist" aria-label="Livro">${Object.keys(BOOKS).map(b =>
          `<button data-book="${b}" aria-selected="${+b === book}">Livro ${b}</button>`).join("")}</div>
        <div class="lessons-strip">${Array.from({ length: z - a + 1 }, (_, i) => a + i).map(l => {
          const lw = VOCAB.filter(v => v.livro === book && v.licao === l);
          if (!lw.length) return "";
          const pct = lw.filter(v => S.seen[v.id]).length / lw.length;
          return `<button class="ls ${l === lesson ? "on" : ""} ${pct === 1 ? "done" : ""}" data-lesson="${l}" title="${lw.length} palavras">
            <b>${l}</b><i style="width:${pct * 100}%"></i></button>`;
        }).join("")}</div>
      </div>
      <div class="lesson-head">
        <h2>Lição ${lesson} <span class="muted">· ${w.length} palavras · ${seen} vistas</span></h2>
        <div class="row">
          <button class="btn" id="present">Apresentar uma a uma</button>
          <button class="btn" id="markall">Marcar todas como vistas</button>
          <a class="btn primary" href="#memorizar" id="test">Testar esta lição</a>
        </div>
      </div>
      <div class="wgrid">${w.map((v, i) => `
        <article class="wcard ${S.seen[v.id] ? "seen" : ""}" data-i="${i}" tabindex="0">
          <div class="wc-top"><span class="stars">${"★".repeat(v.imp || 0)}</span><span class="pill ${status(v.id)}">${STATUS_LABEL[status(v.id)]}</span></div>
          <div class="wc-word">${esc(v.palavra)}</div>
          ${pitchHTML(v)}
          <div class="wc-pt">${esc(v.pt)}</div>
          <div class="wc-meta muted">${esc(v.romaji)} · ${esc(CLS[v.cls])}</div>
          ${hasTTS ? `<button class="icon-btn" data-say="${i}" aria-label="Ouvir ${esc(v.leitura)}">${SPEAKER}</button>` : ""}
        </article>`).join("")}</div>
      <div id="present-layer"></div>`;
  }

  function renderPresent() {
    const w = words(), layer = $("#present-layer", el);
    if (idx < 0) { layer.innerHTML = ""; return; }
    const v = w[idx];
    markSeen(v);
    layer.innerHTML = `
      <div class="overlay" role="dialog" aria-label="Apresentação da lição">
        <div class="present">
          <div class="pr-top"><span class="muted">${idx + 1} / ${w.length}</span><span class="code">${esc(v.id)}</span>
            <button class="icon-btn" id="pr-close" aria-label="Fechar">✕</button></div>
          <div class="pr-word">${esc(v.palavra)}</div>
          ${pitchHTML(v)}
          <div class="pr-pt">${esc(v.pt)}</div>
          <div class="muted">${esc(v.romaji)} · ${esc(CLS[v.cls])} · ${"★".repeat(v.imp || 0)}</div>
          ${v.nota ? `<div class="note">${esc(v.nota)}</div>` : ""}
          <div class="pr-nav">
            <button class="btn" id="pr-prev" ${idx === 0 ? "disabled" : ""}>Anterior</button>
            ${hasTTS ? `<button class="btn" id="pr-say">${SPEAKER} Ouvir</button>` : ""}
            <button class="btn primary" id="pr-next">${idx === w.length - 1 ? "Concluir" : "Próxima"}</button>
          </div>
          <div class="muted small">Setas ← → para navegar · Esc para fechar</div>
        </div>
      </div>`;
    speak(v);
  }

  el.addEventListener("click", e => {
    const t = e.target.closest("button, article, a");
    if (!t) return;
    if (t.dataset.book) { book = +t.dataset.book; lesson = BOOKS[book][0]; idx = -1; render(); return; }
    if (t.dataset.lesson) { lesson = +t.dataset.lesson; idx = -1; render(); return; }
    if (t.dataset.say) { const v = words()[+t.dataset.say]; speak(v); markSeen(v); e.stopPropagation(); refreshCard(+t.dataset.say); return; }
    if (t.matches("article.wcard")) { idx = +t.dataset.i; renderPresent(); return; }
    if (t.id === "present") { idx = 0; renderPresent(); }
    if (t.id === "markall") { const w = words().filter(v => !S.seen[v.id]); w.forEach(v => (S.seen[v.id] = 1)); if (w.length) gain(w.length); else save(); render(); }
    if (t.id === "test") { S.prefs.books = [book]; S.prefs.from = S.prefs.to = lesson; save(); }
    if (t.id === "pr-close") { idx = -1; render(); }
    if (t.id === "pr-prev") { idx--; renderPresent(); }
    if (t.id === "pr-say") speak(words()[idx]);
    if (t.id === "pr-next") { if (idx < words().length - 1) { idx++; renderPresent(); } else { idx = -1; render(); } }
  });
  el.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("article.wcard")) e.target.click(); });
  function refreshCard(i) { const c = $(`article[data-i="${i}"]`, el); if (c) { c.classList.add("seen"); const p = $(".pill", c); p.className = "pill seen"; p.textContent = "vista"; } }

  const onKey = e => {
    if (idx < 0) return;
    if (e.key === "Escape") { idx = -1; render(); }
    if (e.key === "ArrowRight" && idx < words().length - 1) { idx++; renderPresent(); }
    if (e.key === "ArrowLeft" && idx > 0) { idx--; renderPresent(); }
  };
  document.addEventListener("keydown", onKey);
  render();
  return () => document.removeEventListener("keydown", onKey);
}

// ===== study.js =====
// Estudar: flashcards com repetição espaçada.

function studyView(el) {
  let current = null, shown = false, done = 0, right = 0;
  el.innerHTML = `
    <div class="page-head"><h1>Estudar</h1>
      <p class="muted">Primeiro vêm as revisões vencidas, depois palavras novas (★★★ primeiro). Seja honesto na nota: é ela que decide quando a palavra volta.</p></div>
    <div class="study-layout">
      <aside class="side"><div id="picker"></div>
        <div class="prow"><span class="plbl">Direção</span>
          <label class="chip"><input type="radio" name="dir" value="jp" ${S.prefs.dir !== "pt" ? "checked" : ""}>日本語 → PT</label>
          <label class="chip"><input type="radio" name="dir" value="pt" ${S.prefs.dir === "pt" ? "checked" : ""}>PT → 日本語</label></div>
        <div class="session muted" id="session"></div>
      </aside>
      <div id="card"></div>
    </div>`;
  deckPicker($("#picker", el), () => { current = null; render(); });
  el.addEventListener("change", e => { if (e.target.name === "dir") { S.prefs.dir = e.target.value; render(); } });

  function next(d) {
    const now = Date.now();
    const due = d.filter(v => S.srs[v.id] && S.srs[v.id].due <= now).sort((a, b) => S.srs[a.id].due - S.srs[b.id].due);
    if (due.length) return due[0];
    return d.filter(v => !S.srs[v.id]).sort((a, b) => (b.imp || 0) - (a.imp || 0) || a.licao - b.licao || a.no - b.no)[0] || null;
  }

  function render() {
    const d = deck();
    if (!current || !d.includes(current)) { current = next(d); shown = false; }
    $("#session", el).innerHTML = `Nesta sessão: <b>${done}</b> respondidas · <b>${done ? Math.round(right / done * 100) : 0}%</b> de acerto<br>${dueCount(d)} revisões pendentes`;
    const box = $("#card", el);
    if (!current) {
      box.innerHTML = `<div class="card empty">${d.length ? "Tudo em dia. Volte mais tarde, aprenda uma lição nova ou jogue um pouco." : "Nenhuma palavra com esse filtro. Marque ao menos um livro e uma importância."}
        <div class="row center"><a class="btn" href="#aprender">Aprender</a><a class="btn" href="#jogar">Jogar</a></div></div>`;
      return;
    }
    const v = current, jp = S.prefs.dir !== "pt", st = status(v.id);
    box.innerHTML = `<div class="card flash ${shown ? "shown" : ""}">
      <div class="meta"><span class="code">${esc(v.id)}</span><span>Livro ${v.livro} · Lição ${v.licao}</span>
        <span class="stars">${"★".repeat(v.imp || 0)}</span><span class="pill ${st}">${STATUS_LABEL[st]}</span></div>
      <div class="front">${jp ? `<div class="big-jp">${esc(v.palavra)}</div>` : `<div class="big-pt">${esc(v.pt)}</div><div class="muted">${esc(CLS[v.cls])}</div>`}</div>
      ${shown ? `<div class="answer">
        ${jp ? `<div class="ans-pt">${esc(v.pt)}</div>` : `<div class="big-jp">${esc(v.palavra)}</div>`}
        ${pitchHTML(v)}
        <div class="muted">${esc(v.romaji)} · ${esc(CLS[v.cls])}</div>
        ${v.nota ? `<div class="note">${esc(v.nota)}</div>` : ""}
        ${hasTTS ? `<button class="btn ghost" id="say">${SPEAKER} Ouvir</button>` : ""}
      </div>
      <div class="grades">${["Errei", "Difícil", "Bom", "Fácil"].map((t, q) =>
        `<button class="btn g${q}" data-q="${q}">${t}<small>${previewInterval(v.id, q)}</small></button>`).join("")}</div>
      <div class="muted small center">Teclas 1 · 2 · 3 · 4</div>`
      : `<button class="btn primary wide" id="show">Mostrar resposta</button><div class="muted small center">Espaço</div>`}
    </div>`;
    if (shown && jp) speak(v);
  }
  function reveal() { if (current && !shown) { shown = true; render(); } }
  function answer(q) {
    grade(current.id, q); done++; if (q > 0) right++;
    gain(q === 0 ? 1 : 2); current = null; render();
  }
  el.addEventListener("click", e => {
    if (e.target.closest("#show")) reveal();
    else if (e.target.closest("#say")) speak(current);
    else { const b = e.target.closest("[data-q]"); if (b) answer(+b.dataset.q); }
  });
  const onKey = e => {
    if (e.target.matches("input,select,textarea")) return;
    if (!shown && (e.key === " " || e.key === "Enter")) { e.preventDefault(); reveal(); }
    else if (shown && current && ["1", "2", "3", "4"].includes(e.key)) answer(+e.key - 1);
  };
  document.addEventListener("keydown", onKey);
  render();
  return () => document.removeEventListener("keydown", onKey);
}

// ===== quiz.js =====
// Memorizar: quiz de 10 perguntas com tipos variados; erros voltam para revisão.

const TYPES = {
  significado: "Qual é o significado?",
  palavra: "Qual é a palavra em japonês?",
  leitura: "Como se lê?",
  romaji: "Escreva em romaji",
  ouvir: "Que palavra você ouviu?",
};

// Normaliza romaji para comparar Hepburn, Kunrei e vogais longas escritas de jeitos diferentes.
function normRomaji(s) {
  return s.toLowerCase().normalize("NFD")
    .replace(/ō/g, "oo").replace(/ū/g, "uu").replace(/[̀-ͯ]/g, "")
    .replace(/[\s\-'’.…~～]/g, "")
    .replace(/ou/g, "oo").replace(/shi/g, "si").replace(/chi/g, "ti").replace(/tsu/g, "tu").replace(/fu/g, "hu").replace(/ji/g, "zi")
    .replace(/sh/g, "sy").replace(/ch/g, "ty").replace(/j/g, "zy").replace(/n(?=[bmp])/g, "m");
}
function romajiAnswers(v) {
  let r = String(v.romaji).trim();
  if (!r.startsWith("(")) r = r.replace(/\s*\([^)]*\)\s*$/, "");          // remove origem: "aisu (ice)"
  const m = r.match(/^\(([^)]*)\)\s*(.*)$/);                              // prefixo opcional: "(o) sushi"
  const forms = m ? [m[2], m[1].replace(/[…]/g, "") + " " + m[2]] : [r];
  return forms.map(normRomaji);
}
const romajiOk = v => v.romaji && !/[/]/.test(v.romaji) && v.romaji.length <= 22 && !/\[/.test(v.romaji);

function quizView(el) {
  let qs = [], i = 0, score = 0, missed = [], answered = false;
  const enabled = new Set(S.prefs.quizTypes || ["significado", "palavra", "leitura", "romaji"].concat(hasTTS ? ["ouvir"] : []));

  function setup() {
    el.innerHTML = `
      <div class="page-head"><h1>Memorizar</h1>
        <p class="muted">Rodadas de 10 perguntas. As palavras que você está revisando aparecem mais. Cada erro volta para a fila de revisão do modo Estudar.</p></div>
      <div class="study-layout">
        <aside class="side"><div id="picker"></div>
          <div class="prow"><span class="plbl">Tipos</span>${Object.entries(TYPES).filter(([k]) => k !== "ouvir" || hasTTS).map(([k, t]) =>
            `<label class="chip"><input type="checkbox" name="qt" value="${k}" ${enabled.has(k) ? "checked" : ""}>${t.replace("?", "")}</label>`).join("")}</div>
        </aside>
        <div class="card quiz-start">
          <div class="big-jp">試験</div>
          <p>10 perguntas sobre as palavras selecionadas.</p>
          <button class="btn primary wide" id="go">Começar rodada</button>
          <p class="muted small" id="best"></p>
        </div>
      </div>`;
    deckPicker($("#picker", el));
    $("#best", el).textContent = S.stats.answers ? `Acerto geral: ${Math.round(S.stats.correct / S.stats.answers * 100)}% em ${S.stats.answers} respostas` : "";
  }

  function build() {
    const d = deck();
    if (d.length < 4) return null;
    const now = Date.now();
    const weight = v => { const s = S.srs[v.id]; if (s && s.due <= now) return 6; if (s && s.iv < 21) return 4; if (S.seen[v.id]) return 3; return 1 + (v.imp || 1) / 3; };
    const pool = shuffle(d).map(v => ({ v, k: Math.random() ** (1 / weight(v)) })).sort((a, b) => b.k - a.k).slice(0, 10).map(x => x.v);
    return pool.map(v => {
      const types = [...enabled].filter(t => (t !== "leitura" || v.palavra !== v.leitura) && (t !== "romaji" || romajiOk(v)));
      const type = types.length ? types[Math.random() * types.length | 0] : "significado";
      const field = type === "significado" ? "pt" : type === "leitura" ? "leitura" : "palavra";
      const opts = type === "romaji" ? null : shuffle([v, ...distractors(v, 3, field)]).map(x => x[field]);
      return { v, type, field, opts };
    });
  }

  function render() {
    const q = qs[i], v = q.v;
    const prompt = {
      significado: `<div class="big-jp">${esc(v.palavra)}</div>`,
      palavra: `<div class="big-pt">${esc(v.pt)}</div><div class="muted">${esc(CLS[v.cls])}</div>`,
      leitura: `<div class="big-jp">${esc(v.palavra)}</div>`,
      romaji: `<div class="big-pt">${esc(v.pt)}</div><div class="muted">${esc(CLS[v.cls])}</div>`,
      ouvir: `<button class="btn listen" id="replay">${SPEAKER} Ouvir de novo</button>`,
    }[q.type];
    el.innerHTML = `
      <div class="quiz">
        <div class="qbar"><span>Pergunta ${i + 1} de ${qs.length}</span><span class="dots">${qs.map((_, k) =>
          `<i class="${k < i ? (missed.includes(qs[k]) ? "bad" : "good") : k === i ? "cur" : ""}"></i>`).join("")}</span><span>${score} acertos</span></div>
        <div class="card">
          <div class="qtype">${TYPES[q.type]}</div>
          <div class="front">${prompt}</div>
          ${q.opts ? `<div class="opts ${q.field === "pt" ? "" : "jp"}">${q.opts.map((o, k) =>
            `<button class="opt" data-o="${esc(o)}"><span class="k">${k + 1}</span>${esc(o)}</button>`).join("")}</div>`
          : `<form class="typein" id="typein"><input id="romaji-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ex.: taberu, shoogatsu" aria-label="Resposta em romaji">
              <button class="btn primary">Responder</button></form>`}
          <div id="feedback"></div>
        </div>
      </div>`;
    answered = false;
    if (q.type === "ouvir") speak(v);
    $("#romaji-in", el)?.focus();
  }

  function answer(ok, given) {
    if (answered) return;
    answered = true;
    const q = qs[i], v = q.v;
    practiced(v.id, ok);
    if (ok) { score++; gain(5); } else { missed.push(q); gain(1); }
    if (q.opts) $$(".opt", el).forEach(b => {
      b.disabled = true;
      if (b.dataset.o === v[q.field]) b.classList.add("right");
      else if (b.dataset.o === given) b.classList.add("wrong");
    });
    $("#feedback", el).innerHTML = `<div class="fb ${ok ? "ok" : "no"}">
      <b>${ok ? "Certo!" : "Não foi dessa vez."}</b>
      <div class="fb-word"><span class="jp">${esc(v.palavra)}</span> ${pitchHTML(v)} <span>${esc(v.pt)}</span></div>
      <div class="muted small">${esc(v.romaji)} · Livro ${v.livro}, lição ${v.licao}</div>
      <button class="btn primary" id="next">${i === qs.length - 1 ? "Ver resultado" : "Próxima"}</button></div>`;
    $("#next", el).focus();
    if (q.type !== "ouvir") speak(v);
  }

  function results() {
    S.stats.games++; save();
    const pct = Math.round(score / qs.length * 100);
    el.innerHTML = `
      <div class="card result">
        <div class="big-jp">${pct >= 90 ? "すごい！" : pct >= 60 ? "いいね！" : "がんばって！"}</div>
        <p class="score-line"><b>${score}</b> de ${qs.length} · ${pct}%</p>
        ${missed.length ? `<h3>Para revisar</h3><ul class="missed">${missed.map(q =>
          `<li><span class="jp">${esc(q.v.palavra)}</span><span class="muted">${esc(q.v.leitura)}</span><span>${esc(q.v.pt)}</span></li>`).join("")}</ul>
          <p class="muted small">Essas palavras já estão na fila de revisão do modo Estudar.</p>` : "<p>Nenhum erro. Ótimo trabalho.</p>"}
        <div class="row center"><button class="btn primary" id="again">Nova rodada</button><a class="btn" href="#estudar">Estudar</a><button class="btn" id="cfg">Mudar seleção</button></div>
      </div>`;
  }

  el.addEventListener("change", e => {
    if (e.target.name !== "qt") return;
    enabled.clear(); $$("[name=qt]:checked", el).forEach(c => enabled.add(c.value));
    S.prefs.quizTypes = [...enabled]; save();
  });
  el.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.id === "go" || t.id === "again") {
      if (!enabled.size) { enabled.add("significado"); }
      const b = build();
      if (!b) { $("#best", el) && ($("#best", el).textContent = "Selecione pelo menos 4 palavras."); return; }
      qs = b; i = 0; score = 0; missed = []; render();
    } else if (t.id === "cfg") setup();
    else if (t.id === "replay") speak(qs[i].v);
    else if (t.id === "next") { if (++i < qs.length) render(); else results(); }
    else if (t.dataset.o !== undefined && !answered) answer(t.dataset.o === qs[i].v[qs[i].field], t.dataset.o);
  });
  el.addEventListener("submit", e => {
    e.preventDefault();
    const val = $("#romaji-in", el).value.trim(); if (!val || answered) return;
    answer(romajiAnswers(qs[i].v).includes(normRomaji(val)), val);
    $("#romaji-in", el).disabled = true;
  });
  const onKey = e => {
    if (!qs.length || e.target.matches("input")) return;
    if (!answered && /^[1-4]$/.test(e.key)) { const b = $$(".opt", el)[+e.key - 1]; b?.click(); }
  };
  document.addEventListener("keydown", onKey);
  setup();
  return () => document.removeEventListener("keydown", onKey);
}

// ===== game-lanterns.js =====
// 灯籠 Lanternas: toque a lanterna com o significado certo antes que ela suba.


function lanternGame(stage, words) {
  if (words.length < 4) words = VOCAB.filter(v => v.livro === 1 && v.imp === 3);
  stage.classList.add("night");
  stage.innerHTML = `
    <div class="hud">
      <div class="hud-l"><span>Pontos <b id="h-score">0</b></span><span>Nível <b id="h-level">1</b></span></div>
      <div class="hud-target" id="h-target"></div>
      <div class="hud-r" id="h-lives"></div>
    </div>
    <div class="stage-overlay" id="ov"></div>`;
  const $ = s => stage.querySelector(s);
  const renderer = makeRenderer(stage);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1326);
  scene.fog = new THREE.Fog(0x0b1326, 14, 30);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  camera.position.set(0, 0, 12);
  scene.add(new THREE.HemisphereLight(0x8fa8d8, 0x1a1020, 0.6));
  const warm = new THREE.PointLight(0xffb36b, 0.8, 30); warm.position.set(0, -4, 6); scene.add(warm);

  // céu: estrelas, lua e montanhas distantes
  const starGeo = new THREE.BufferGeometry(), sp = [];
  for (let i = 0; i < 500; i++) sp.push((Math.random() - 0.5) * 60, Math.random() * 22 - 4, -12 - Math.random() * 10);
  starGeo.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xdfe8ff, size: 0.07, transparent: true, opacity: 0.85 }));
  scene.add(stars);
  const moon = new THREE.Mesh(new THREE.CircleGeometry(1.4, 48), new THREE.MeshBasicMaterial({ color: 0xf3ead2, fog: false }));
  moon.position.set(7, 5.5, -16); scene.add(moon);
  const glowTex = canvasTexture(128, 128, (c, w, h) => {
    const g = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, "rgba(255,190,110,0.9)"); g.addColorStop(0.35, "rgba(255,140,60,0.35)"); g.addColorStop(1, "rgba(255,120,40,0)");
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  });
  const mountains = canvasTexture(1024, 256, (c, w, h) => {
    const layer = (col, amp, base, seed) => {
      c.fillStyle = col; c.beginPath(); c.moveTo(0, h);
      for (let x = 0; x <= w; x += 8) c.lineTo(x, base - amp * (Math.sin(x / 90 + seed) * 0.6 + Math.sin(x / 37 + seed * 2) * 0.25 + Math.sin(x / 210 + seed) * 0.8));
      c.lineTo(w, h); c.fill();
    };
    layer("#16203a", 50, 150, 1); layer("#0f1830", 40, 190, 4); layer("#0b1224", 25, 225, 7);
  });
  const mtn = new THREE.Mesh(new THREE.PlaneGeometry(50, 12.5), new THREE.MeshBasicMaterial({ map: mountains, transparent: true, fog: false }));
  mtn.position.set(0, -5.5, -14); scene.add(mtn);

  // lanternas decorativas ao fundo
  const deco = [];
  const decoMat = new THREE.SpriteMaterial({ map: glowTex, color: 0xffa860, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  for (let i = 0; i < 26; i++) {
    const s = new THREE.Sprite(decoMat); const k = 0.25 + Math.random() * 0.4;
    s.scale.set(k, k, 1); s.position.set((Math.random() - 0.5) * 30, Math.random() * 20 - 10, -6 - Math.random() * 8);
    s.userData.v = 0.15 + Math.random() * 0.25; deco.push(s); scene.add(s);
  }

  const bodyGeo = new THREE.SphereGeometry(0.62, 28, 20); bodyGeo.scale(1, 1.18, 1);
  const capGeo = new THREE.CylinderGeometry(0.34, 0.4, 0.14, 24);
  const capMat = new THREE.MeshStandardMaterial({ color: 0x2a1a14, roughness: 0.7 });
  const ribGeo = new THREE.TorusGeometry(0.62, 0.012, 6, 40);

  let W = 10, H = 8, raf = 0, last = 0, running = false, alive = true;
  let score = 0, lives = 3, lvl = 1, combo = 0, lanterns = [], target = null, roundLock = false, missed = [], dirJP = S.prefs.lanternDir !== "pt";
  const particles = [];

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    H = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
    W = H * camera.aspect;
  }
  const ro = new ResizeObserver(resize); ro.observe(stage); resize();

  function labelTexture(text, jp) {
    return canvasTexture(512, 256, (c, w, h) => {
      c.fillStyle = "rgba(255,247,232,0.94)";
      c.beginPath(); c.roundRect ? c.roundRect(8, 8, w - 16, h - 16, 26) : c.rect(8, 8, w - 16, h - 16); c.fill();
      c.strokeStyle = "#b5462e"; c.lineWidth = 6; c.stroke();
      c.fillStyle = "#2a1712"; c.textAlign = "center"; c.textBaseline = "middle";
      const fam = jp ? '"Zen Old Mincho", "Hiragino Mincho ProN", serif' : '"Instrument Sans", system-ui, sans-serif';
      const { size, lines } = fitText(c, text, fam, jp ? 700 : 600, w - 70, h - 50, jp ? 96 : 64, jp ? 2 : 3);
      c.font = `${jp ? 700 : 600} ${size}px ${fam}`;
      lines.forEach((l, i) => c.fillText(l, w / 2, h / 2 + (i - (lines.length - 1) / 2) * size * 1.18));
    });
  }

  function makeLantern(v, x, y, correct) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xe8502f, emissive: 0xff6a2a, emissiveIntensity: 0.55, roughness: 0.55 });
    const body = new THREE.Mesh(bodyGeo, mat); g.add(body);
    for (const yy of [-0.35, 0, 0.35]) { const r = new THREE.Mesh(ribGeo, capMat); r.rotation.x = Math.PI / 2; r.position.y = yy; r.scale.setScalar(Math.cos(Math.asin(yy / 0.73)) || 0.7); g.add(r); }
    const top = new THREE.Mesh(capGeo, capMat); top.position.y = 0.72; g.add(top);
    const bot = new THREE.Mesh(capGeo, capMat); bot.position.y = -0.72; g.add(bot);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffb070, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    glow.scale.set(3.2, 3.2, 1); g.add(glow);
    const text = dirJP ? shortPt(v.pt) : v.palavra;
    const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTexture(text, !dirJP), transparent: true, depthTest: false }));
    label.scale.set(2.3, 1.15, 1); label.position.set(0, -1.35, 0.2); label.renderOrder = 5; g.add(label);
    g.position.set(x, y, 0);
    g.userData = { v, correct, mat, glow, label, phase: Math.random() * 6, state: "rise", speed: 1 };
    body.userData.root = g; label.userData.root = g;
    scene.add(g);
    return g;
  }

  function lifeIcons() { $("#h-lives").innerHTML = Array.from({ length: 3 }, (_, i) => `<i class="${i < lives ? "on" : ""}" aria-hidden="true"></i>`).join("") + `<span class="sr">${lives} vidas</span>`; }
  function hud() { $("#h-score").textContent = score; $("#h-level").textContent = lvl; lifeIcons(); }

  function newRound() {
    if (!alive) return;
    lanterns.forEach(l => scene.remove(l)); lanterns = [];
    target = words[Math.random() * words.length | 0];
    const field = dirJP ? "pt" : "palavra";
    const opts = distractors(target, 3, field).filter(o => shortPt(o.pt) !== shortPt(target.pt));
    const all = shuffle([target, ...opts.slice(0, 3)]);
    const span = Math.min(W * 0.84, 11), n = all.length;
    const k = Math.max(0.5, Math.min(1, W / (n * 2.6)));     // telas estreitas: lanternas menores e em zigue-zague
    all.forEach((v, i) => {
      const x = n === 1 ? 0 : -span / 2 + span * (i / (n - 1)) * (k < 1 ? 0.9 : 1) + (k < 1 ? span * 0.05 : 0);
      const stagger = k < 0.85 && i % 2 ? -2.2 : 0;
      const l = makeLantern(v, x + (Math.random() - 0.5) * 0.4 * k, -H / 2 - 1.4 - Math.random() * 1.2 + stagger, v === target);
      l.scale.setScalar(k);
      lanterns.push(l);
    });
    $("#h-target").innerHTML = dirJP
      ? `<span class="t-jp">${esc(target.palavra)}</span>${target.palavra !== target.leitura ? `<span class="t-r">${esc(target.leitura)}</span>` : ""}`
      : `<span class="t-pt">${esc(target.pt)}</span>`;
    if (dirJP) speak(target);
    roundLock = false;
  }

  function burst(pos, color) {
    const n = 60, geo = new THREE.BufferGeometry(), p = new Float32Array(n * 3), vel = [];
    for (let i = 0; i < n; i++) { p.set([pos.x, pos.y, pos.z], i * 3); const a = Math.random() * Math.PI * 2, b = Math.random() * Math.PI, s = 2 + Math.random() * 4; vel.push(new THREE.Vector3(Math.cos(a) * Math.sin(b) * s, Math.cos(b) * s, Math.sin(a) * Math.sin(b) * s)); }
    geo.setAttribute("position", new THREE.BufferAttribute(p, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size: 0.14, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    pts.userData = { vel, life: 1 }; scene.add(pts); particles.push(pts);
  }

  function hit(l) {
    if (roundLock || l.userData.state !== "rise") return;
    roundLock = true;
    if (l.userData.correct) {
      combo++; score += 1 + (combo >= 5 ? 1 : 0);
      practiced(target.id, true);
      l.userData.state = "fly"; burst(l.position, 0xffd27a);
      lanterns.filter(o => o !== l).forEach(o => (o.userData.state = "fade"));
      if (score >= lvl * 6) lvl++;
      hud(); setTimeout(newRound, 750);
    } else {
      combo = 0; lives--; missed.push(target); practiced(target.id, false);
      l.userData.state = "fall"; l.userData.mat.color.set(0x5a2b4a); l.userData.mat.emissive.set(0x3a0f30);
      const right = lanterns.find(o => o.userData.correct); if (right) right.userData.state = "show";
      hud();
      setTimeout(() => (lives > 0 ? newRound() : gameOver()), 1400);
    }
  }

  function escaped() {
    if (roundLock) return;
    roundLock = true; combo = 0; lives--; missed.push(target); practiced(target.id, false);
    hud();
    setTimeout(() => (lives > 0 ? newRound() : gameOver()), 500);
  }

  function update(dt, t) {
    stars.material.opacity = 0.7 + Math.sin(t * 0.8) * 0.15;
    deco.forEach(s => { s.position.y += s.userData.v * dt; if (s.position.y > 12) s.position.y = -12; });
    const speed = 0.75 + 0.16 * (lvl - 1);
    for (const l of lanterns) {
      const u = l.userData;
      u.phase += dt;
      if (u.state === "rise" || u.state === "show") {
        l.position.y += speed * dt * (u.state === "show" ? 0.4 : 1);
        l.position.x += Math.sin(u.phase * 1.3) * 0.004;
        l.rotation.z = Math.sin(u.phase * 1.1) * 0.08;
        if (u.state === "show") u.glow.scale.setScalar(3.2 + Math.sin(t * 10) * 0.6);
        if (u.correct && u.state === "rise" && l.position.y > H / 2 + 0.8) escaped();
      } else if (u.state === "fly") {
        l.position.y += dt * 9; l.scale.multiplyScalar(1 + dt * 0.6);
      } else if (u.state === "fall") {
        l.position.y -= dt * 6; l.rotation.z += dt * 2;
      } else if (u.state === "fade") {
        u.label.material.opacity = Math.max(0, u.label.material.opacity - dt * 3);
        l.position.y += dt * 1.5; l.scale.multiplyScalar(1 - dt * 1.2);
      }
      u.mat.emissiveIntensity = 0.5 + Math.sin(u.phase * 3) * 0.08;
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i], a = p.geometry.attributes.position;
      p.userData.life -= dt * 1.1;
      p.userData.vel.forEach((v, k) => { v.y -= dt * 3; a.array[k * 3] += v.x * dt; a.array[k * 3 + 1] += v.y * dt; a.array[k * 3 + 2] += v.z * dt; });
      a.needsUpdate = true; p.material.opacity = Math.max(0, p.userData.life);
      if (p.userData.life <= 0) { scene.remove(p); p.geometry.dispose(); particles.splice(i, 1); }
    }
  }

  function loop(now) {
    raf = requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
    if (running) update(dt, now / 1000);
    else deco.forEach(s => { s.position.y += s.userData.v * dt; if (s.position.y > 12) s.position.y = -12; });
    renderer.render(scene, camera);
  }

  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  function onPointer(e) {
    if (!running) return;
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const objs = lanterns.flatMap(l => [l.children[0], l.userData.label]);
    const h = ray.intersectObjects(objs, false)[0];
    if (h) hit(h.object.userData.root);
  }
  renderer.domElement.addEventListener("pointerdown", onPointer);
  function onKey(e) { if (running && /^[1-4]$/.test(e.key)) { const sorted = [...lanterns].sort((a, b) => a.position.x - b.position.x); if (sorted[+e.key - 1]) hit(sorted[+e.key - 1]); } }
  document.addEventListener("keydown", onKey);

  function intro() {
    $("#ov").hidden = false;
    $("#ov").innerHTML = `<div class="ov-card">
      <h2>灯籠 Lanternas</h2>
      <p>Uma palavra aparece no alto. Toque a lanterna com a resposta certa antes que ela suba pelo céu. No teclado, use 1 a 4 da esquerda para a direita.</p>
      <div class="row center">
        <label class="chip"><input type="radio" name="ldir" value="jp" ${dirJP ? "checked" : ""}>Palavra → significado</label>
        <label class="chip"><input type="radio" name="ldir" value="pt" ${!dirJP ? "checked" : ""}>Significado → palavra</label>
      </div>
      <button class="btn primary" id="l-start">Começar</button>
      <p class="small">Recorde: ${S.best.lanternas || 0} pontos</p></div>`;
  }
  function begin() {
    dirJP = (stage.querySelector("[name=ldir]:checked") || {}).value !== "pt";
    S.prefs.lanternDir = dirJP ? "jp" : "pt";
    score = 0; lives = 3; lvl = 1; combo = 0; missed = [];
    $("#ov").hidden = true; hud(); running = true; newRound();
  }
  function gameOver() {
    running = false;
    lanterns.forEach(l => scene.remove(l)); lanterns = [];
    $("#h-target").innerHTML = "";
    const record = score > (S.best.lanternas || 0);
    if (record) S.best.lanternas = score;
    S.stats.games++;
    gain(Math.max(1, score * 2)); save();
    const uniq = [...new Map(missed.map(v => [v.id, v])).values()];
    $("#ov").hidden = false;
    $("#ov").innerHTML = `<div class="ov-card">
      <h2>${record ? "Novo recorde!" : "Fim de jogo"}</h2>
      <p class="score-line"><b>${score}</b> pontos · nível ${lvl} · +${Math.max(1, score * 2)} XP</p>
      ${uniq.length ? `<div class="ov-missed">${uniq.map(v => `<div><span class="jp">${esc(v.palavra)}</span> ${pitchHTML(v)} <span>${esc(v.pt)}</span></div>`).join("")}</div>
        <p class="small">Essas palavras foram para a revisão.</p>` : ""}
      <button class="btn primary" id="l-start">Jogar de novo</button></div>`;
  }
  stage.addEventListener("click", e => { if (e.target.closest("#l-start")) begin(); });
  const onVis = () => { if (document.hidden) last = performance.now(); };
  document.addEventListener("visibilitychange", onVis);

  fontsReady().then(() => { if (alive) { intro(); raf = requestAnimationFrame(loop); } });
  hud();

  return () => {
    alive = false; running = false; cancelAnimationFrame(raf); ro.disconnect();
    document.removeEventListener("keydown", onKey); document.removeEventListener("visibilitychange", onVis);
    scene.traverse(o => { o.geometry?.dispose?.(); if (o.material) { o.material.map?.dispose?.(); o.material.dispose?.(); } });
    renderer.dispose();
  };
}

// ===== game-karuta.js =====
// かるた Karuta: jogo da memória em 3D, palavra ↔ significado.


const PAIRS = 6;

function karutaGame(stage, words) {
  if (words.length < PAIRS) words = VOCAB.filter(v => v.livro === 1 && v.imp === 3);
  stage.classList.add("tatami");
  stage.innerHTML = `
    <div class="hud"><div class="hud-l"><span>Jogadas <b id="k-moves">0</b></span><span>Pares <b id="k-pairs">0/${PAIRS}</b></span></div>
      <div class="hud-target"></div><div class="hud-r"><span>Tempo <b id="k-time">0:00</b></span></div></div>
    <div class="stage-overlay" id="ov" hidden></div>`;
  const $ = s => stage.querySelector(s);
  const renderer = makeRenderer(stage);
  renderer.shadowMap.enabled = true;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2b2a1c);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  scene.add(new THREE.AmbientLight(0xfff4e0, 0.55));
  const sun = new THREE.DirectionalLight(0xfff1d6, 0.75);
  sun.position.set(-4, 6, 10); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10 });
  scene.add(sun);

  // tatame: fibras de junco e borda de tecido
  const tatamiTex = canvasTexture(512, 512, (c, w, h) => {
    c.fillStyle = "#b9b27a"; c.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 4) { c.fillStyle = `rgba(${90 + Math.random() * 40},${90 + Math.random() * 30},40,${0.12 + Math.random() * 0.12})`; c.fillRect(0, y, w, 2); }
    for (let x = 0; x < w; x += 64) { c.fillStyle = "rgba(60,60,20,0.15)"; c.fillRect(x, 0, 2, h); }
  });
  tatamiTex.wrapS = tatamiTex.wrapT = THREE.RepeatWrapping; tatamiTex.repeat.set(3, 3);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: tatamiTex, roughness: 0.95 }));
  floor.position.z = -0.06; floor.receiveShadow = true; scene.add(floor);
  for (const y of [-7.5, 7.5]) {
    const band = new THREE.Mesh(new THREE.PlaneGeometry(40, 0.45), new THREE.MeshStandardMaterial({ color: 0x1d2a4a, roughness: 0.8 }));
    band.position.set(0, y, -0.05); scene.add(band);
  }

  const CW = 1.5, CH = 2.1;
  const cardGeo = new THREE.BoxGeometry(CW, CH, 0.05);
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0xf2ead8, roughness: 0.6 });
  const backTex = canvasTexture(300, 420, (c, w, h) => {
    c.fillStyle = "#24497a"; c.fillRect(0, 0, w, h);
    c.strokeStyle = "rgba(255,255,255,0.22)"; c.lineWidth = 3;
    for (let y = -20; y < h + 40; y += 28) for (let x = (y / 28) % 2 ? 0 : 24; x < w + 48; x += 48)   // seigaiha (ondas)
      for (const r of [22, 15, 8]) { c.beginPath(); c.arc(x, y, r, Math.PI, 0); c.stroke(); }
    c.strokeStyle = "#e8d9a8"; c.lineWidth = 10; c.strokeRect(12, 12, w - 24, h - 24);
    c.fillStyle = "#f3ead2"; c.beginPath(); c.arc(w / 2, h / 2, 62, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#24497a"; c.font = '700 80px "Zen Old Mincho", serif'; c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText("花", w / 2, h / 2 + 4);
  });
  backTex.encoding = THREE.sRGBEncoding;

  function faceTex(v, jp) {
    const t = canvasTexture(300, 420, (c, w, h) => {
      c.fillStyle = "#fbf6ea"; c.fillRect(0, 0, w, h);
      c.strokeStyle = jp ? "#b5462e" : "#24497a"; c.lineWidth = 12; c.strokeRect(14, 14, w - 28, h - 28);
      c.fillStyle = "#1d1a17"; c.textAlign = "center"; c.textBaseline = "middle";
      if (jp) {
        const fam = '"Zen Old Mincho", "Hiragino Mincho ProN", serif';
        const { size, lines } = fitText(c, v.palavra, fam, 700, w - 60, h - 150, 96, 3);
        c.font = `700 ${size}px ${fam}`;
        lines.forEach((l, i) => c.fillText(l, w / 2, h / 2 - 20 + (i - (lines.length - 1) / 2) * size * 1.15));
        if (v.palavra !== v.leitura) {
          c.fillStyle = "#6b5f52";
          const r = fitText(c, v.leitura, '"Zen Kaku Gothic New", sans-serif', 500, w - 60, 40, 28, 1);
          c.font = `500 ${r.size}px "Zen Kaku Gothic New", sans-serif`; c.fillText(r.lines[0], w / 2, h - 62);
        }
      } else {
        const fam = '"Instrument Sans", system-ui, sans-serif';
        const { size, lines } = fitText(c, shortPt(v.pt), fam, 600, w - 60, h - 110, 46, 5);
        c.font = `600 ${size}px ${fam}`;
        lines.forEach((l, i) => c.fillText(l, w / 2, h / 2 + (i - (lines.length - 1) / 2) * size * 1.2));
        c.fillStyle = "#24497a"; c.font = '600 20px "Instrument Sans", sans-serif'; c.fillText("PORTUGUÊS", w / 2, h - 52);
      }
    });
    t.encoding = THREE.sRGBEncoding;
    return t;
  }

  let cards = [], open = [], busy = false, moves = 0, matched = 0, t0 = 0, timer = 0, raf = 0, alive = true, hover = null, chosen = [];

  function layout() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const cols = camera.aspect >= 1.1 ? 4 : 3, rows = (PAIRS * 2) / cols;
    const gx = CW + 0.35, gy = CH + 0.35;
    cards.forEach((c, i) => {
      const col = i % cols, row = (i / cols) | 0;
      c.userData.home.set((col - (cols - 1) / 2) * gx, ((rows - 1) / 2 - row) * gy, 0);
      if (!c.userData.anim) c.position.copy(c.userData.home).setZ(c.userData.done ? 0.25 : 0);
    });
    // enquadra a grade inteira
    const needH = rows * gy + 0.6, needW = cols * gx + 0.6;
    const vfov = THREE.MathUtils.degToRad(camera.fov);
    const dist = Math.max(needH / 2 / Math.tan(vfov / 2), needW / 2 / (Math.tan(vfov / 2) * camera.aspect)) * 1.05;
    camera.position.set(0, -dist * 0.22, dist);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
  }
  const ro = new ResizeObserver(layout); ro.observe(stage);

  function deal() {
    cards.forEach(c => scene.remove(c)); cards = [];
    chosen = sample(words, PAIRS);
    const deckCards = chosen.flatMap(v => [{ v, jp: true }, { v, jp: false }]).sort(() => Math.random() - 0.5);
    for (const { v, jp } of deckCards) {
      const front = new THREE.MeshStandardMaterial({ map: faceTex(v, jp), roughness: 0.5 });
      const back = new THREE.MeshStandardMaterial({ map: backTex, roughness: 0.5 });
      const m = new THREE.Mesh(cardGeo, [edgeMat, edgeMat, edgeMat, edgeMat, front, back]);
      m.castShadow = true;
      m.rotation.y = Math.PI;                      // começa virada
      m.userData = { v, jp, up: false, done: false, home: new THREE.Vector3(), front };
      cards.push(m); scene.add(m);
    }
    layout();
    // animação de distribuição
    cards.forEach((c, i) => {
      const end = c.userData.home.clone(); c.userData.anim = true;
      c.position.set(0, -8, 3);
      setTimeout(() => tween(380, k => c.position.lerpVectors(new THREE.Vector3(0, -8, 3), end, k)).then(() => (c.userData.anim = false)), i * 50);
    });
    moves = 0; matched = 0; open = []; busy = false; t0 = performance.now();
    clearInterval(timer); timer = setInterval(tick, 500); hud();
  }

  function flip(c, up) {
    c.userData.up = up; c.userData.anim = true;
    const from = c.rotation.y, to = up ? 0 : Math.PI, z0 = c.position.z;
    return tween(320, k => { c.rotation.y = from + (to - from) * k; c.position.z = z0 + Math.sin(k * Math.PI) * 0.6; }).then(() => (c.userData.anim = false));
  }

  async function pick(c) {
    if (busy || c.userData.up || c.userData.done) return;
    open.push(c); await flip(c, true);
    if (open.length < 2) return;
    busy = true; moves++; hud();
    const [a, b] = open; open = [];
    if (a.userData.v.id === b.userData.v.id && a.userData.jp !== b.userData.jp) {
      matched++; speak(a.userData.v); practiced(a.userData.v.id, true);
      for (const c of [a, b]) { c.userData.done = true; c.userData.front.emissive = new THREE.Color(0x3a2a00); c.userData.front.emissiveIntensity = 0.35; }
      await tween(260, k => { a.position.z = b.position.z = 0.25 * k; });
      hud(); busy = false;
      if (matched === PAIRS) setTimeout(finish, 500);
    } else {
      await new Promise(r => setTimeout(r, 850));
      await Promise.all([flip(a, false), flip(b, false)]);
      busy = false;
    }
  }

  const elapsed = () => Math.round((performance.now() - t0) / 1000);
  const fmt = s => `${(s / 60) | 0}:${String(s % 60).padStart(2, "0")}`;
  function tick() { $("#k-time").textContent = fmt(elapsed()); }
  function hud() { $("#k-moves").textContent = moves; $("#k-pairs").textContent = `${matched}/${PAIRS}`; tick(); }

  function finish() {
    clearInterval(timer);
    const secs = elapsed(), best = S.best.karuta;
    const record = !best || moves < best.moves || (moves === best.moves && secs < best.secs);
    if (record) S.best.karuta = { moves, secs };
    S.stats.games++;
    const xp = Math.max(6, 30 - (moves - PAIRS) * 2);
    gain(xp); save();
    $("#ov").hidden = false;
    $("#ov").innerHTML = `<div class="ov-card">
      <h2>${record ? "Novo recorde!" : "おつかれさま！"}</h2>
      <p class="score-line"><b>${moves}</b> jogadas · ${fmt(secs)} · +${xp} XP</p>
      <div class="ov-missed">${chosen.map(v => `<div><span class="jp">${esc(v.palavra)}</span> ${pitchHTML(v)} <span>${esc(v.pt)}</span></div>`).join("")}</div>
      <button class="btn primary" id="k-again">Jogar de novo</button></div>`;
  }

  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  function cast(e) {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    return ray.intersectObjects(cards, false)[0]?.object;
  }
  renderer.domElement.addEventListener("pointerdown", e => { const c = cast(e); if (c) pick(c); });
  renderer.domElement.addEventListener("pointermove", e => {
    const c = cast(e); hover = c && !c.userData.up && !c.userData.done ? c : null;
    renderer.domElement.style.cursor = hover ? "pointer" : "default";
  });
  stage.addEventListener("click", e => { if (e.target.closest("#k-again")) { $("#ov").hidden = true; deal(); } });

  function loop() {
    raf = requestAnimationFrame(loop);
    for (const c of cards) {
      if (c.userData.anim || c.userData.done || c.userData.up) continue;
      const target = c === hover ? 0.18 : 0;
      c.position.z += (target - c.position.z) * 0.2;
    }
    renderer.render(scene, camera);
  }

  fontsReady().then(() => { if (alive) { deal(); loop(); } });

  return () => {
    alive = false; cancelAnimationFrame(raf); clearInterval(timer); ro.disconnect();
    scene.traverse(o => { o.geometry?.dispose?.(); [].concat(o.material || []).forEach(m => { m.map?.dispose?.(); m.dispose?.(); }); });
    renderer.dispose();
  };
}

// ===== play.js =====
// Jogar: menu dos jogos em three.js.



function playView(el) {
  let stop = null;
  function menu() {
    stop?.(); stop = null;
    el.innerHTML = `
      <div class="page-head"><h1>Jogar</h1>
        <p class="muted">Os jogos usam as palavras selecionadas abaixo. Acertos e erros também contam para a revisão.</p></div>
      <div class="study-layout">
        <aside class="side"><div id="picker"></div></aside>
        <div class="games">
          <button class="game-card" data-game="lanternas">
            <span class="gc-art lantern-art" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="gc-t">灯籠 Lanternas</span>
            <span class="gc-d">A palavra aparece no alto. Toque a lanterna com o significado certo antes que ela suba pelo céu. Três vidas, velocidade crescente.</span>
            <span class="muted small">Recorde: ${S.best.lanternas || 0} pontos</span>
          </button>
          <button class="game-card" data-game="karuta">
            <span class="gc-art karuta-art" aria-hidden="true"><i>花</i><i>はな</i><i>flor</i></span>
            <span class="gc-t">かるた Karuta</span>
            <span class="gc-d">Doze cartas viradas sobre o tatame. Encontre os pares palavra ↔ significado com o menor número de jogadas.</span>
            <span class="muted small">Recorde: ${S.best.karuta ? `${S.best.karuta.moves} jogadas` : "—"}</span>
          </button>
        </div>
      </div>`;
    deckPicker($("#picker", el));
  }
  function start(name) {
    const words = deck();
    el.innerHTML = `<div class="game-wrap"><div class="game-bar"><button class="btn" id="back">← Jogos</button><span class="muted small">${words.length} palavras na seleção</span></div><div class="stage" id="stage"></div></div>`;
    if (typeof THREE === "undefined") {
      $("#stage", el).innerHTML = `<div class="stage-msg">Não foi possível carregar o three.js. Verifique a conexão e recarregue a página.</div>`;
      return;
    }
    stop = (name === "lanternas" ? lanternGame : karutaGame)($("#stage", el), words);
  }
  el.addEventListener("click", e => {
    const g = e.target.closest("[data-game]"); if (g) return start(g.dataset.game);
    if (e.target.closest("#back")) menu();
  });
  menu();
  return () => stop?.();
}

// ===== progress.js =====
// Progresso: nível, sequência, livros, mapa das lições, conquistas e busca no glossário.

function progressView(el) {
  function render() {
    const l = level(), [a, z] = levelRange(l);
    const counts = { new: 0, seen: 0, learn: 0, known: 0 };
    VOCAB.forEach(v => counts[status(v.id)]++);
    const days = Array.from({ length: 28 }, (_, i) => new Date(Date.now() - (27 - i) * 86400000).toLocaleDateString("sv"));
    const maxDay = Math.max(1, ...days.map(d => S.days[d] || 0));
    el.innerHTML = `
      <div class="page-head"><h1>Progresso</h1>
        <p class="muted">“Memorizada” significa que a próxima revisão está a 21 dias ou mais. Tudo fica salvo neste navegador${location.protocol.startsWith("http") ? " (e no servidor, se estiver usando o servidor Python)" : ""}.</p></div>

      <section class="pgrid">
        <div class="pcard">
          <h3>Nível ${l}</h3>
          <div class="bar big"><i style="width:${((S.xp - a) / (z - a) * 100).toFixed(1)}%"></i></div>
          <p class="muted small">${S.xp} XP · faltam ${z - S.xp} para o nível ${l + 1}</p>
          <p class="muted small">${S.streak.count || 0} dias seguidos · ${S.stats.answers} respostas em quizzes e jogos${S.stats.answers ? ` · ${Math.round(S.stats.correct / S.stats.answers * 100)}% de acerto` : ""}</p>
        </div>
        <div class="pcard">
          <h3>Últimos 28 dias</h3>
          <div class="days">${days.map(d => `<i title="${d}: ${S.days[d] || 0} XP" style="--k:${(S.days[d] || 0) / maxDay}"></i>`).join("")}</div>
          <p class="muted small">Cada quadrado é um dia; mais escuro = mais XP.</p>
        </div>
        <div class="pcard">
          <h3>Todas as palavras</h3>
          <div class="bar stacked big"><i class="k" style="width:${counts.known / VOCAB.length * 100}%"></i><i class="l" style="width:${counts.learn / VOCAB.length * 100}%"></i><i class="s" style="width:${counts.seen / VOCAB.length * 100}%"></i></div>
          <p class="legend"><span class="lg k"></span>${counts.known} memorizadas <span class="lg l"></span>${counts.learn} aprendendo <span class="lg s"></span>${counts.seen} vistas · ${counts.new} novas</p>
          <p class="muted small">${dueCount(VOCAB)} revisões pendentes</p>
        </div>
      </section>

      <h2>Mapa das lições</h2>
      <div class="lmap">${Object.entries(BOOKS).map(([b, [a, z]]) => `
        <div class="lmap-row"><span class="lmap-b">Livro ${b}</span><div class="lmap-cells">${Array.from({ length: z - a + 1 }, (_, i) => a + i).map(ls => {
          const w = VOCAB.filter(v => v.livro === +b && v.licao === ls); if (!w.length) return "";
          const score = w.reduce((s, v) => s + { new: 0, seen: 0.25, learn: 0.6, known: 1 }[status(v.id)], 0) / w.length;
          return `<a href="#aprender" class="lc" data-b="${b}" data-l="${ls}" style="--k:${score}" title="Lição ${ls}: ${w.length} palavras, ${Math.round(score * 100)}%">${ls}</a>`;
        }).join("")}</div></div>`).join("")}</div>

      <h2>Conquistas</h2>
      <div class="badges">${BADGES.map(b => `<div class="badge ${S.badges.includes(b.id) ? "on" : ""}"><b>${esc(b.nome)}</b><span>${esc(b.desc)}</span></div>`).join("")}</div>

      <h2>Glossário</h2>
      <input type="search" id="q" class="search" placeholder="Buscar: かな, kanji, romaji, português ou código (KB3-L27…)">
      <div class="tablewrap"><table><thead><tr><th>Código</th><th>Palavra</th><th>Acento</th><th>Português</th><th>Classe</th><th>Estado</th></tr></thead><tbody id="tb"></tbody></table></div>
      <p class="muted small" id="tinfo"></p>

      <div class="danger"><button class="linkbtn" id="reset">Apagar todo o progresso</button>
        <span id="confirm" hidden>Tem certeza? <button class="linkbtn" id="yes">Sim, apagar</button> · <button class="linkbtn" id="no">Cancelar</button></span></div>`;
    table();
  }
  const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  function table() {
    const q = norm($("#q", el).value.trim());
    const rows = q ? VOCAB.filter(v => [v.palavra, v.leitura, v.romaji, v.pt, v.id].some(f => norm(f).includes(q))) : VOCAB.filter(v => S.seen[v.id]);
    $("#tb", el).innerHTML = rows.slice(0, 200).map(v => `<tr><td class="code">${esc(v.id)}</td><td class="jp">${esc(v.palavra)}</td><td>${pitchHTML(v)}</td><td>${esc(v.pt)}</td><td>${esc(CLS[v.cls])}</td><td><span class="pill ${status(v.id)}">${STATUS_LABEL[status(v.id)]}</span></td></tr>`).join("");
    $("#tinfo", el).textContent = q ? `${rows.length} resultados${rows.length > 200 ? " · mostrando 200" : ""}` : rows.length ? `${rows.length} palavras estudadas${rows.length > 200 ? " · mostrando 200" : ""}. Digite para buscar no glossário inteiro.` : "Digite para buscar nas 2.094 palavras.";
  }
  el.addEventListener("input", e => { if (e.target.id === "q") table(); });
  el.addEventListener("click", e => {
    const c = e.target.closest(".lc");
    if (c) { S.prefs.books = [+c.dataset.b]; S.prefs.from = S.prefs.to = +c.dataset.l; return; }
    if (e.target.id === "reset") $("#confirm", el).hidden = false;
    if (e.target.id === "no") $("#confirm", el).hidden = true;
    if (e.target.id === "yes") { reset(); location.reload(); }
  });
  render();
}

// ===== app.js =====






const VIEWS = { inicio: homeView, aprender: learnView, estudar: studyView, memorizar: quizView, jogar: playView, progresso: progressView };
let cleanup = null;

function homeView(el) {
  const seen = Object.keys(S.seen).length;
  const known = Object.values(S.srs).filter(s => s.iv >= 21).length;
  const due = dueCount(VOCAB);
  const next = VOCAB.find(v => status(v.id) === "new" && v.imp === 3);
  el.innerHTML = `
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow">Kotobana 1–6 · ${VOCAB.length.toLocaleString("pt-BR")} palavras · 60 lições</p>
        <h1>Aprenda, pratique e brinque com o vocabulário do Kotobana.</h1>
        <p class="lead">Veja cada palavra com leitura, acento e áudio. Revise no momento certo com repetição espaçada. Teste a memória com quizzes e jogos em 3D.</p>
        <div class="hero-cta">
          <a class="btn primary" href="#${due ? "estudar" : "aprender"}">${due ? `Revisar ${due} palavras` : "Começar a aprender"}</a>
          <a class="btn" href="#jogar">Jogar</a>
        </div>
      </div>
      <div class="hero-word" aria-hidden="true">
        <div class="hw-k">${esc(next ? next.palavra : "ことば")}</div>
        <div class="hw-r">${esc(next ? next.leitura : "")}</div>
        <div class="hw-p">${esc(next ? next.pt : "palavra")}</div>
      </div>
    </section>

    <section class="stats" aria-label="Resumo">
      <div><b>${seen}</b><span>palavras estudadas</span></div>
      <div><b>${known}</b><span>memorizadas</span></div>
      <div><b>${due}</b><span>para revisar hoje</span></div>
      <div><b>${S.streak.count || 0}</b><span>dias seguidos</span></div>
    </section>

    <section class="modes">
      ${[
        ["aprender", "学", "Aprender", "Lição por lição: palavra, leitura, acento tonal, áudio e exemplos. Marque o que já viu."],
        ["estudar", "復", "Estudar", "Flashcards com repetição espaçada. Cada palavra volta no dia em que você está prestes a esquecer."],
        ["memorizar", "試", "Memorizar", "Quiz de 10 perguntas: significado, leitura, escrita em romaji e audição."],
        ["jogar", "遊", "Jogar", "Lanternas (acerte o significado antes que voem) e Karuta (encontre os pares) em 3D."],
      ].map(([k, kj, t, d]) => `<a class="mode" href="#${k}"><span class="mk">${kj}</span><span class="mt">${t}</span><span class="md">${d}</span></a>`).join("")}
    </section>

    <section class="books-mini">
      <h2>Livros</h2>
      <div class="bm-grid">${Object.entries(BOOKS).map(([b, [a, z]]) => {
        const w = VOCAB.filter(v => v.livro === +b), s = w.filter(v => S.seen[v.id]).length;
        return `<button class="bm" data-book="${b}"><span class="bm-t">Livro ${b}</span><span class="muted">Lições ${a}–${z} · ${w.length} palavras</span>
          <span class="bar"><i style="width:${(s / w.length * 100).toFixed(1)}%"></i></span><span class="muted small">${s} estudadas</span></button>`;
      }).join("")}</div>
    </section>`;
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-book]"); if (!b) return;
    const n = +b.dataset.book; S.prefs.books = [n]; [S.prefs.from, S.prefs.to] = BOOKS[n];
    location.hash = "aprender";
  });
}

function renderHeader() {
  const l = level(), [a, z] = levelRange(l);
  $("#lvl").textContent = l;
  $("#xpfill").style.width = ((S.xp - a) / (z - a) * 100).toFixed(1) + "%";
  $(".xpbox").title = `Nível ${l} · ${S.xp} XP (próximo nível em ${z} XP)`;
  $("#streak").textContent = S.streak.count ? `${S.streak.count} 日` : "";
}

onChange((xp, badges) => {
  const before = level(S.xp - xp);
  renderHeader();
  if (level() > before) toast(`<b>Nível ${level()}!</b> Continue assim.`);
  badges.forEach(b => toast(`<b>Conquista:</b> ${esc(b.nome)}`));
});

function route() {
  const name = location.hash.slice(1);
  const view = VIEWS[name] ? name : "inicio";
  cleanup?.(); cleanup = null;
  $$(".nav a").forEach(a => a.classList.toggle("on", a.dataset.view === view));
  const el = $("#app");
  const fresh = el.cloneNode(false); el.replaceWith(fresh);   // remove listeners da tela anterior
  cleanup = VIEWS[view](fresh) || null;
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
renderHeader();
route();
syncFromServer().then(ok => { if (ok) { renderHeader(); toast("Progresso sincronizado com o servidor."); } });

})();
</script>
