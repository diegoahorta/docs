<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mayu e o Gato de Nekomori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Grenze+Gotisch:wght@600;800&display=swap">
<style>
/* Layout: full-screen dark-fantasy forest painted on canvas; the giant cat and the white-brick road sit in the free area,
   the mission panel floats on the right (desktop) or the lower half (phone). Single dark look by design. */
:root{
  color-scheme: dark;
  --night:#0c0a22;        /* forest sky */
  --ink:#f6efff;          /* text */
  --muted:#b6a8dc;        /* secondary text */
  --sakura:#ff6fb5;       /* pink mist, ribbons, main accent */
  --neko:#7fd3ff;         /* the giant cat's glow */
  --gold:#ffd54a;         /* cat eyes, stars */
  --dress:#2f5bd3;        /* Mayu's blue dress */
  --good:#7dffb2;
  --warn:#ffb36b;
  --panel:rgba(22,16,52,.84);
  --panel-edge:rgba(255,111,181,.45);
  --tile:#f3ecff;
  --tile-ink:#2a1f55;
  --display:"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --gothic:"Grenze Gotisch","Mochiy Pop One",serif;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#app.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-3px,2px) rotate(-.4deg)}20%,80%{transform:translate(6px,-4px) rotate(.5deg)}30%,50%,70%{transform:translate(-10px,5px) rotate(-.8deg)}40%,60%{transform:translate(10px,-6px) rotate(.8deg)}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:40}
#flash{position:absolute;inset:0;pointer-events:none;z-index:39;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.95),rgba(255,111,181,.6) 40%,rgba(127,211,255,0) 75%)}
#flash.on{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}

/* Mayu */
#mayu{position:absolute;z-index:5;transform-origin:50% 100%;pointer-events:none;filter:drop-shadow(0 0 14px rgba(127,211,255,.35))}
#mayu svg{width:100%;height:100%;overflow:visible}
#mayu .body{transform-origin:100px 290px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
#mayu.walk .body{animation:walkbob .36s ease-in-out infinite}
@keyframes walkbob{50%{transform:translateY(-7px) rotate(1deg)}}
#mayu.walk #legL{animation:legA .36s ease-in-out infinite}
#mayu.walk #legR{animation:legA .36s ease-in-out infinite reverse}
@keyframes legA{0%{transform:translateY(0)}50%{transform:translateY(-9px)}100%{transform:translateY(0)}}
#mayu.jump .body{animation:jump .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}15%{transform:translateY(4px) scale(1.08,.9)}45%{transform:translateY(-60px) scale(.95,1.06) rotate(-6deg)}75%{transform:translateY(0) scale(1.06,.94)}100%{transform:translateY(0)}}
#mayu.sad .body{animation:sad .7s ease-in-out}
@keyframes sad{25%{transform:rotate(-5deg)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
#mayu.fall{animation:fall 2.2s cubic-bezier(.55,0,.6,1) both}
@keyframes fall{0%{transform:translate(-50%,-100%) translateY(-120vh) rotate(-900deg) scale(.4)}70%{transform:translate(-50%,-100%) translateY(0) rotate(0) scale(1.05,.85)}82%{transform:translate(-50%,-100%) translateY(-30px) scale(.95,1.05)}100%{transform:translate(-50%,-100%) translateY(0) scale(1)}}
#mayu .mouth{display:none}
#mayu[data-face="smile"] .m-smile,#mayu[data-face="happy"] .m-happy,#mayu[data-face="oh"] .m-oh,#mayu[data-face="worry"] .m-worry{display:inline}
#mayu[data-face="happy"] .eyes-open{display:none}
#mayu .eyes-happy{display:none}
#mayu[data-face="happy"] .eyes-happy{display:inline}

/* Cat speech */
#catSay{position:absolute;z-index:6;max-width:min(300px,70vw);padding:10px 14px;border-radius:18px;background:rgba(240,250,255,.95);color:#1f2a5c;font-weight:700;font-size:14px;line-height:1.45;box-shadow:0 0 24px rgba(127,211,255,.6);transform:translate(-50%,-100%) scale(.6);opacity:0;transition:opacity .3s,transform .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
#catSay.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
#catSay::after{content:"";position:absolute;left:50%;bottom:-9px;border:10px solid transparent;border-top-color:rgba(240,250,255,.95);border-bottom:0;transform:translateX(-50%)}
#catSay .jp{font-family:var(--display);font-weight:400;color:#2f5bd3}

/* HUD */
#hud{position:absolute;z-index:20;top:calc(env(safe-area-inset-top,0px) + 10px);left:16px;right:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}
#hud > *{pointer-events:auto}
.brand{font-family:var(--gothic);font-size:22px;letter-spacing:.02em;color:var(--ink);text-shadow:0 0 12px rgba(255,111,181,.7);margin-right:auto;white-space:nowrap}
.brand small{font-family:var(--display);font-size:12px;color:var(--neko);margin-left:6px;text-shadow:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(15,10,40,.7);border:1px solid rgba(255,255,255,.14);font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;backdrop-filter:blur(6px)}
.pill .ic{color:var(--gold)}
.pill.combo{color:var(--sakura)}
.pill.combo.hot{animation:pulse .6s ease-in-out infinite alternate;box-shadow:0 0 16px var(--sakura)}
@keyframes pulse{to{transform:scale(1.08)}}
.iconbtn{appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(15,10,40,.7);color:var(--ink);width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer;display:grid;place-items:center}
.iconbtn[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.iconbtn:focus-visible,.btn:focus-visible,.tile:focus-visible,.opt:focus-visible,.mission:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Panel */
#panel{position:absolute;z-index:10;right:24px;top:calc(env(safe-area-inset-top,0px) + 64px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:min(540px,44vw);overflow-y:auto;overscroll-behavior:contain;
  background:var(--panel);border:1.5px solid var(--panel-edge);border-radius:26px;padding:22px 22px 26px;backdrop-filter:blur(10px);
  box-shadow:0 0 0 1px rgba(127,211,255,.12) inset,0 20px 60px rgba(0,0,0,.55),0 0 40px rgba(255,111,181,.18)}
@media (max-width:899px){
  #panel{left:16px;right:16px;width:auto;top:46%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:16px 16px 20px;border-radius:22px}
  .brand{font-size:18px}.brand small{display:none}
  .pill{padding:5px 9px;font-size:13px}
  .iconbtn{width:34px;height:34px}
  #catSay{font-size:12.5px;max-width:58vw;padding:8px 11px}
}
@media (max-width:520px){ .brand{display:none} #hud{justify-content:flex-end} }
.screen{display:flex;flex-direction:column;gap:14px;animation:rise .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{opacity:.0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--neko);font-weight:800}
h1,h2,h3{margin:0;text-wrap:balance}
.logo{display:flex;flex-direction:column;gap:4px}
.logo .jp{font-family:var(--display);font-size:clamp(30px,5vw,46px);line-height:1.1;background:linear-gradient(90deg,#ffd1ea,var(--sakura) 40%,var(--neko));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,111,181,.45))}
.logo .pt{font-family:var(--gothic);font-size:clamp(22px,3.2vw,30px);font-weight:800;letter-spacing:.02em}
p{margin:0;line-height:1.6;max-width:62ch}
.lede{color:#e3d9ff}
.chip{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(127,211,255,.14);color:var(--neko);border:1px solid rgba(127,211,255,.35)}
.chip.pink{background:rgba(255,111,181,.14);color:#ffb3d9;border-color:rgba(255,111,181,.4)}
.lesson{font-family:var(--display);font-size:14px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.2);line-height:1.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-size:16px;padding:13px 22px;border-radius:16px;color:#2a0f2f;
  background:linear-gradient(180deg,#ffd0ea,var(--sakura));box-shadow:0 5px 0 #b23a7c,0 0 24px rgba(255,111,181,.45);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b23a7c,0 0 12px rgba(255,111,181,.45)}
.btn.blue{color:#0c1d3d;background:linear-gradient(180deg,#d5f2ff,var(--neko));box-shadow:0 5px 0 #3a7fae,0 0 24px rgba(127,211,255,.4)}
.btn.blue:active{box-shadow:0 1px 0 #3a7fae}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);font-size:14px;padding:10px 16px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.big{font-size:19px;padding:15px 26px}
.how{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.how li{display:flex;gap:10px;align-items:baseline;color:#d9cff5;line-height:1.5}
.how b{color:var(--gold);font-family:var(--display);font-weight:400;min-width:1.4em}

/* Odu sequence */
.odu{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.08em}
.odu span{padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.06);color:var(--muted)}
.odu span.on{background:var(--sakura);color:#2a0f2f;box-shadow:0 0 14px var(--sakura)}
.odu span.done{color:var(--good)}
.odu i{color:var(--muted);font-style:normal}

/* Map */
.missions{list-style:none;margin:0;padding:0;display:grid;gap:10px;position:relative}
.missions::before{content:"";position:absolute;left:25px;top:10px;bottom:10px;border-left:3px dotted rgba(255,255,255,.25)}
.mission{position:relative;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;appearance:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--ink);border-radius:18px;padding:10px 12px 10px 0;cursor:pointer;font-family:var(--body)}
.mission .num{width:40px;height:40px;margin-left:6px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;background:#1d1645;border:2px solid rgba(255,255,255,.25);z-index:1}
.mission .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.mission .t strong{font-size:15px}
.mission .t small{color:var(--muted);font-size:12px}
.mission .st{font-size:13px;color:var(--gold);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.mission.locked{opacity:.45;cursor:not-allowed}
.mission.current{border-color:var(--sakura);background:rgba(255,111,181,.12);box-shadow:0 0 22px rgba(255,111,181,.3)}
.mission.current .num{background:var(--sakura);color:#2a0f2f;border-color:#ffd0ea;animation:pulse .9s ease-in-out infinite alternate}
.mission.done .num{background:var(--neko);color:#0c1d3d;border-color:#d5f2ff}

/* Task */
.taskhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pips{display:flex;gap:5px;margin-left:auto}
.pips i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18)}
.pips i.done{background:var(--neko);box-shadow:0 0 8px var(--neko)}
.pips i.now{background:var(--sakura);box-shadow:0 0 10px var(--sakura)}
.say{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:rgba(127,211,255,.08);border:1px solid rgba(127,211,255,.25)}
.say .who{flex:none;width:38px;height:38px}
.say .line{min-width:0}
.say .line .jp{font-family:var(--display);font-size:17px;color:#d5f2ff}
.say .line small{display:block;color:var(--muted);font-size:12.5px}
.orb{align-self:center;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;font-size:50px;letter-spacing:-.05em;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(127,211,255,.25) 30%,rgba(60,30,120,.6) 70%,rgba(255,111,181,.35));
  box-shadow:0 0 30px rgba(127,211,255,.5),inset 0 0 30px rgba(255,111,181,.4);animation:orb 4s ease-in-out infinite}
@keyframes orb{50%{transform:translateY(-6px);box-shadow:0 0 44px rgba(255,111,181,.55),inset 0 0 30px rgba(127,211,255,.5)}}
.prompt{font-size:18px;font-weight:800;line-height:1.45}
.prompt .hint-pt{display:block;font-size:13px;color:var(--muted);font-weight:500}
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--display);font-size:15px}
.formula span{padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
.formula span.k{background:rgba(255,111,181,.18);border-color:rgba(255,111,181,.5)}
.formula em{font-style:normal;color:var(--muted);font-family:var(--body);font-size:12px}
.model{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.model .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-right:4px}
.model span{font-family:var(--display);padding:5px 10px;border-radius:10px;background:rgba(127,211,255,.12);border:1px solid rgba(127,211,255,.3);font-size:15px}
.answer{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-radius:18px;border:2px dashed rgba(255,255,255,.28);background:rgba(0,0,0,.22);transition:border-color .2s,box-shadow .2s}
.answer.empty::before{content:"Toque nos blocos para montar a frase…";color:var(--muted);font-size:13px;padding-left:4px}
.answer.ok{border-color:var(--good);border-style:solid;box-shadow:0 0 26px rgba(125,255,178,.45)}
.answer.bad{border-color:var(--warn);animation:wob .4s}
@keyframes wob{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tile{appearance:none;cursor:pointer;border:0;border-radius:14px;padding:8px 13px 6px;background:var(--tile);color:var(--tile-ink);display:inline-flex;flex-direction:column;align-items:center;gap:1px;
  box-shadow:0 4px 0 #a98ad8,0 0 14px rgba(255,111,181,.25);font-family:var(--body);transition:transform .12s;animation:pop .3s cubic-bezier(.3,1.7,.5,1)}
.tile .j{font-family:var(--display);font-size:19px;line-height:1.25}
.tile .r{font-size:11px;color:#6d5aa8;font-weight:700}
.noro .tile .r{display:none}
.tile:hover{transform:translateY(-2px) rotate(-1deg)}
.tile:active{transform:translateY(3px)}
.tile.in{background:linear-gradient(180deg,#fff,#ffe0f1);box-shadow:0 4px 0 #d0609c,0 0 16px rgba(255,111,181,.5)}
.tile.hinted{box-shadow:0 4px 0 #c9a227,0 0 18px var(--gold)}
.tile[disabled]{opacity:.25;cursor:default;transform:none}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls .grow{margin-left:auto}
.opts{display:grid;gap:10px}
.opt{appearance:none;cursor:pointer;text-align:left;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--ink);border-radius:16px;padding:12px 14px;font-family:var(--body);display:flex;flex-direction:column;gap:2px;transition:transform .12s,background .2s}
.opt .j{font-family:var(--display);font-size:19px}
.opt .r{font-size:12px;color:var(--muted)}
.opt:hover{background:rgba(255,111,181,.12);transform:translateX(3px)}
.opt.ok{border-color:var(--good);background:rgba(125,255,178,.14);box-shadow:0 0 22px rgba(125,255,178,.35)}
.opt.no{opacity:.35;border-color:var(--warn);cursor:not-allowed;text-decoration:line-through;transform:none}
.opt.gone{display:none}
.feedback{min-height:0;border-radius:14px;padding:0;font-size:14px;line-height:1.55}
.feedback.show{padding:12px 14px}
.feedback.good{background:rgba(125,255,178,.12);border:1px solid rgba(125,255,178,.4)}
.feedback.bad{background:rgba(255,179,107,.1);border:1px solid rgba(255,179,107,.4)}
.feedback .jp{font-family:var(--display);font-size:17px}
.feedback .stars{color:var(--gold);font-size:18px;letter-spacing:.1em}
.speak{appearance:none;border:0;background:rgba(127,211,255,.18);color:var(--neko);border-radius:10px;padding:4px 9px;cursor:pointer;font-weight:800;font-size:12px;margin-left:6px;vertical-align:middle}
.rubric{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;font-size:12px;color:var(--muted)}
.rubric div{padding:7px 9px;border-radius:10px;background:rgba(255,255,255,.05)}
.rubric b{display:block;color:var(--gold);letter-spacing:.08em}
.slot-machine{align-self:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.slot-machine .reel{width:120px;height:120px;border-radius:24px;display:grid;place-items:center;font-size:62px;background:#120d30;border:3px solid var(--gold);box-shadow:0 0 30px rgba(255,213,74,.4),inset 0 0 20px rgba(0,0,0,.6)}
.slot-machine .lab{font-family:var(--display);font-size:20px}
.done-stars{font-size:38px;color:var(--gold);letter-spacing:.08em;text-shadow:0 0 18px rgba(255,213,74,.7);font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px;border-radius:14px;background:rgba(255,255,255,.06);text-align:center}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.review{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px}
.review-wrap{overflow-x:auto}
.review th{text-align:left;color:var(--neko);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:0 6px}
.review td{padding:8px 6px;background:rgba(255,255,255,.05)}
.review td:first-child{border-radius:10px 0 0 10px;font-weight:800}
.review td:last-child{border-radius:0 10px 10px 0}
.review label{display:inline-flex;gap:4px;align-items:center;margin-right:8px;white-space:nowrap;cursor:pointer}
.toggle-ro{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin-left:auto}

/* Hype overlay */
#hype{position:absolute;inset:0;z-index:45;pointer-events:none;display:grid;place-items:center;overflow:hidden}
#hype .big{text-align:center;opacity:0}
#hype .big.on{animation:hype 1.9s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes hype{0%{opacity:0;transform:scale(.2) rotate(-25deg)}18%{opacity:1;transform:scale(1.25) rotate(6deg)}30%{transform:scale(1) rotate(-3deg)}80%{opacity:1;transform:scale(1.04) rotate(0)}100%{opacity:0;transform:scale(1.6) rotate(0)}}
#hype .big .j{display:block;font-family:var(--display);font-size:clamp(54px,12vw,130px);line-height:1;
  background:linear-gradient(90deg,#fff36b,#ff6fb5,#7fd3ff,#b98bff,#7dffb2,#fff36b);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px rgba(255,255,255,.6);filter:drop-shadow(0 0 22px rgba(255,111,181,.9)) drop-shadow(0 6px 0 #3b0f4a);animation:rainbow 1s linear infinite}
@keyframes rainbow{to{background-position:300% 0}}
#hype .big .p{display:inline-block;margin-top:10px;font-family:var(--display);font-size:clamp(18px,3.4vw,30px);color:#fff;padding:8px 18px;border-radius:999px;background:rgba(43,10,60,.75);border:2px solid var(--gold);box-shadow:0 0 30px rgba(255,213,74,.6)}
.stamp{position:absolute;font-family:var(--display);font-size:clamp(20px,4vw,40px);color:#fff;padding:4px 12px;border-radius:12px;white-space:nowrap;animation:stamp 1.6s ease-out forwards;text-shadow:0 3px 0 rgba(0,0,0,.4)}

const STEP = .3;
let mus = {next:0, step:0, timer:null};
function startMusic(){
  const ctx=A.ctx, t=ctx.currentTime+.1;

  const dg=ctx.createGain(); dg.gain.value=.16; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=170; lp.Q.value=6;
  lp.connect(dg); dg.connect(A.music); const dsend=ctx.createGain(); dsend.gain.value=.3; dg.connect(dsend); dsend.connect(A.rev);
  [26,38,38.07,45].forEach(m=>{ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=hz(m); o.connect(lp); o.start(t); });
  const lfo=ctx.createOscillator(); lfo.frequency.value=.05; const lg=ctx.createGain(); lg.gain.value=70; lfo.connect(lg); lg.connect(lp.frequency); lfo.start(t);

function schedule(){
  const ctx=A.ctx; if(!ctx) return;
  while(mus.next < ctx.currentTime+.35){
    const s=mus.step, t=mus.next, bar=Math.floor(s/16), inBar=s%16, chord=CHORDS[Math.floor(bar/2)%4];
    if(inBar===0 && bar%2===0) pad(chord,t,STEP*32);
    if(inBar===0 && bar%2===0) choir(chord[2]+12,t,STEP*32);
    if(inBar===0 || inBar===8 || (bar%2===1 && inBar===10)) drum(t, inBar===0?.7:.45);
    if(bar%4===0 && inBar===0) bell(hz(50),t);

}

const P=[];

function burst(x,y,n,power,spread=Math.PI*2,dir=-Math.PI/2){

    const p=P[i]; p.vy+=.28; p.vx*=.985; p.vy*=.985; p.x+=p.vx+Math.sin(p.wob+=.15)*.8; p.y+=p.vy; p.rot+=p.vr; p.life-=dt*p.dec;

/* ---------- answer handling ---------- */
function award(stars, firstTry){
  if(firstTry){ S.combo++; S.bestCombo=Math.max(S.bestCombo,S.combo); } else S.combo=0;
  const pts = stars*100 + (firstTry ? Math.min(10,S.combo)*25 : 0);
  run.score += pts; run.stars += stars; hud(); save();
  return pts;
}
function correct(t, stars, sentence, note){
  const c=run.cur; c.solved=true;
  const first = c.tries===0 && c.hints===0;
  const pts = award(stars, first);
  celebrate(false);
  const fb=$('fb'); fb.className='feedback show good';
  fb.innerHTML = `<div class="stars">${'★'.repeat(stars)}<span style="color:var(--muted);letter-spacing:0;font-size:13px">  +${pts} pontos${first&&S.combo>1?` · sequência ${S.combo}`:''}</span></div>
    <div><span class="jp">${sentence}</span><button class="speak" data-act="speak" data-s="${sentence}">🔈 ouvir</button></div>
    ${note?`<div style="color:#d9cff5">${note}</div>`:''}`;
  $('next').hidden=false; const ch=$('check'); if(ch) ch.disabled=true;
  panel.querySelectorAll('.tray .tile,.opt').forEach(b=>b.disabled=true);
  catTalk(['にゃ〜！','すごい！','いいね！','完璧！'][Math.floor(Math.random()*4)], ['Até meus bigodes tremeram!','A estrada brilhou mais um pouco.','Isso! Mais um tijolo.','Perfeito, humana.'][Math.floor(Math.random()*4)], 2600);
  if(/[\u3040-\u30ff\u4e00-\u9faf]/.test(sentence)) setTimeout(()=>speak(sentence), 1300);
  setTimeout(()=>$('next')&&$('next').focus({preventScroll:true}), 400);
}
function wrong(msg){
  const c=run.cur; c.tries++; S.combo=0; hud(); sfx.wrong(); setFace('worry'); mayuAnim('sad'); setTimeout(()=>setFace('smile'),1400);
  const fb=$('fb'); fb.className='feedback show bad'; fb.innerHTML = msg + '<div style="color:var(--muted);font-size:12.5px;margin-top:4px">Erros não tiram pontos. Tente de novo ou peça uma pista.</div>';

  catTalk('おしい！', ['Quase! Olhe as partículas.','Hmm… um bloco está fora do lugar.','Respire. Os blocos não fogem.'][Math.floor(Math.random()*3)], 2600);
}
function checkBuild(){
  const t=run.tasks[run.ti], c=run.cur; if(c.solved) return;
  const s=strip(answerStr()), acc=accepts(t), bon=(t.bonus||[]).map(strip);
  if(bon.includes(s)) return correct(t, 4, answerStr()+'。', 'Você acrescentou informação. ★★★★');
  if(acc.includes(s)){
    const stars = c.hints>0 ? 2 : 3;
    return correct(t, stars, answerStr()+'。', c.hints>0 ? 'Produziu com ajuda. Na próxima, tente sem pista!' : (t.free?'Frase sua, sem ajuda!':'Produziu sem ajuda!'));
  }
  // diagnóstico: quantos blocos iniciais estão certos
  let good=0, acc0='';
  for(const id of c.answer){ const nxt=acc0+c.tiles.find(x=>x.id===id).jp; if([...acc,...bon].some(a=>a.startsWith(strip(nxt)))){ acc0=nxt; good++; } else break; }
  const tips=[];
  if(/忘れって|遅れって|読みて/.test(s)) tips.push('Cuidado com a forma て: 忘れる → 忘れて, 遅れる → 遅れて, 読む → 読んで.');
  if(s.includes('を') && /開いて|閉まって|掛かって|壊れて|故障して/.test(s)) tips.push('Estado resultante pede が + verbo intransitivo.');
  if(/が開けて|が閉めて|が掛けて/.test(s)) tips.push('開ける, 閉める e 掛ける são ações de alguém (transitivos). Para estado, use 開く→開いて, 閉まる→閉まって.');
  wrong(`${good>0?`Os primeiros <b>${good}</b> bloco(s) estão certos. `:''}A frase ainda não fecha.${tips.length?'<br>'+tips.join('<br>'):''}`);
}
function hintBuild(){
  const t=run.tasks[run.ti], c=run.cur; if(c.solved) return;
  const all=[...accepts(t)];
  let cur=strip(answerStr());
  // remove blocos até o prefixo ser válido
  while(c.answer.length && !all.some(a=>a.startsWith(cur))){ const id=c.answer.pop(); c.tiles.find(x=>x.id===id).used=false; cur=strip(answerStr()); }
  const target = all.find(a=>a.startsWith(cur));
  const cands = c.tiles.filter(x=>!x.used && target.startsWith(cur+strip(x.jp)) && strip(x.jp));
  // prefere o bloco mais longo que ainda permita completar
  cands.sort((a,b)=>b.jp.length-a.jp.length);
  const tl=cands[0];
  if(tl){ tl.used=true; tl.hinted=true; c.answer.push(tl.id); c.hints++; sfx.hint(); }
  drawTiles();
  const fb=$('fb'); fb.className='feedback show'; fb.style.background='rgba(255,213,74,.1)'; fb.style.border='1px solid rgba(255,213,74,.4)';
  fb.innerHTML = tl ? `💡 Pista ${c.hints}: o próximo bloco é <b class="jp" style="font-family:var(--display)">${tl.jp}</b>. Com pista, a tarefa vale ★★.` : '💡 A frase já está completa. Toque em Verificar.';
}
function hintChoice(){
  const t=run.tasks[run.ti], c=run.cur; if(c.solved) return;
  const wrongs=[...panel.querySelectorAll('.opt')].filter(b=>+b.dataset.k!==t.a && !b.classList.contains('gone') && !b.classList.contains('no'));
  if(wrongs.length){ wrongs[0].classList.add('gone'); c.hints++; sfx.hint(); }
  const fb=$('fb'); fb.className='feedback show'; fb.style.background='rgba(255,213,74,.1)'; fb.style.border='1px solid rgba(255,213,74,.4)';
  fb.innerHTML = wrongs.length ? '💡 Uma opção errada sumiu na névoa.' : '💡 Só sobrou a certa!';
}
function pickOpt(k){
  const t=run.tasks[run.ti], c=run.cur; if(c.solved) return;
  const b=panel.querySelector(`.opt[data-k="${k}"]`); if(!b||b.classList.contains('no')) return;
  if(k===t.a){ b.classList.add('ok'); const s=t.opts[k][0]; correct(t, 1, s, `${t.pt} · ★ reconheceu`); }
  else { b.classList.add('no'); b.disabled=true; wrong(`<span class="jp">${t.opts[k][0]}</span> não combina aqui.`); }
}
function nextTask(){
  if(!run.cur.solved) return;
  run.ti++;
  if(run.ti < run.tasks.length) { sfx.tap(); renderTask(); }
  else missionDone();
}
function missionDone(){
  const i=run.mi, m=MISSIONS[i], prev=S.done[i];
  const replay = prev!=null;
  // ao refazer, guarda a melhor marca de estrelas e soma só a diferença
  if(replay){ const gain=Math.max(0,run.stars-prev); S.stars+=gain; S.done[i]=Math.max(prev,run.stars); S.score+=Math.round(run.score*.25); }
  else { S.stars+=run.stars; S.score+=run.score; S.done[i]=run.stars; }
  S.unlocked=Math.max(S.unlocked, Math.min(MISSIONS.length-1, i+1)); if(i===MISSIONS.length-1) S.unlocked=MISSIONS.length;
  save();
  const r=run; run=null; hud();
  celebrate(true);
  const isLast = i===MISSIONS.length-1;
  show(`
    <div class="eyebrow">Missão ${i+1} completa</div>
    <h2 style="font-family:var(--gothic);font-size:32px">Portão aberto!</h2>
    <div class="done-stars">${'★'.repeat(Math.min(r.stars,12))}${r.stars>12?' +'+(r.stars-12):''}</div>
    <div class="statgrid"><div class="stat"><b>${r.stars}/${maxStars(m)}</b><small>Estrelas</small></div><div class="stat"><b>${replay?Math.round(r.score*.25):r.score}</b><small>Pontos</small></div><div class="stat"><b>${S.bestCombo}</b><small>Melhor sequência</small></div></div>
    ${r.obj?`<div class="say">${catIcon}<div class="line"><div class="jp">はい、${r.obj.jp}です。見つかりましたよ！</div><small>Aqui está seu(sua) ${r.obj.pt}. Encontramos! ${r.obj.e}</small></div></div>`:''}
    <p>${isLast?'Os nove portões estão abertos. Falta só a revisão espaçada, que é o que faz os chunks ficarem.':`Próximo portão desbloqueado: <b>${MISSIONS[i+1].title}</b>.`}</p>
    <div class="row"><button class="btn big blue" data-act="walk">${isLast?'Ir para o final ✦':'Seguir pela estrada →'}</button></div>
  `);
  catTalk('よくできました！', isLast?'Você atravessou Nekomori inteira!':'Pode seguir. Eu estou de olho.', 3500);
}
function walkOn(){
  setFace('happy'); mayu.classList.add('walk'); world.walking=2.4;
  for(let k=0;k<12;k++) sfx.step(k);
  setTimeout(()=>{ mayu.classList.remove('walk'); setFace('smile'); if(Object.keys(S.done).length===MISSIONS.length) screenFinal(); else screenMap(); }, 2400);
}
function screenFinal(){
  hud();
  const today=new Date(), fmt=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
  const plus=n=>{ const d=new Date(today); d.setDate(d.getDate()+n); return fmt(d); };
  const rows=[['Hoje',fmt(today)],['Próxima aula','—'],['+7 dias',plus(7)],['+14 dias',plus(14)],['+30 dias',plus(30)]];
  const max = MISSIONS.reduce((a,m)=>a+maxStars(m),0);
  const rank = S.stars>=max*.9?'Mestra dos Chunks 魔法使い':S.stars>=max*.7?'Guardiã da Estrada 守り人':'Aprendiz de Nekomori 見習い';
  show(`
    ${oduStrip('SPACED REVIEW')}
    <div class="eyebrow">10. Revisão espaçada</div>
    <h2 style="font-family:var(--gothic);font-size:32px">${rank}</h2>
    <div class="statgrid"><div class="stat"><b>${S.score.toLocaleString('pt-BR')}</b><small>Pontos</small></div><div class="stat"><b>${S.stars}/${max}</b><small>Estrelas</small></div><div class="stat"><b>${S.bestCombo}</b><small>Melhor sequência</small></div></div>
    <div class="say">${catIcon}<div class="line"><div class="jp">また来てね。</div><small>Volte nas datas abaixo e o portal de casa vai continuar aberto. Marque como foi cada revisão.</small></div></div>
    <div class="review-wrap"><table class="review"><thead><tr><th>Quando</th><th>Data</th><th>Como foi</th></tr></thead><tbody>
      ${rows.map((r,k)=>`<tr><td>${r[0]}</td><td style="font-variant-numeric:tabular-nums">${r[1]}</td><td>${['recuperei','com pista','revisar'].map(o=>`<label><input type="radio" name="rv${k}" id="rv${k}-${o.replace(' ','')}" data-act="rv" data-k="${k}" value="${o}" ${S.review[k]===o?'checked':''}> ${o}</label>`).join('')}</td></tr>`).join('')}
    </tbody></table></div>
    <p style="font-size:13px;color:#d9cff5"><b style="color:var(--gold)">Critério de sucesso:</b> não é preciso lembrar de tudo. O objetivo é recuperar alguns chunks úteis com menos apoio do que no início e perceber esse progresso.</p>
    <div class="lesson">窓が開いています ・ 傘を忘れてしまいました ・ 道をまちがえたんです</div>
    <div class="row"><button class="btn" data-act="map">Rever o mapa</button><button class="btn ghost" data-act="reset">Jogar de novo do zero</button></div>
  `);
  world.portal=2; celebrate(true);
  catTalk('おめでとう、マユ！','O portal para casa está aberto. Você conseguiu!', 6000);
}

/* ============================================================
   EVENTS
   ============================================================ */
panel.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const act=b.dataset.act; audioInit();
  if(act==='ro'){ S.showRo=b.checked; save(); panel.querySelectorAll('.answer,.tray').forEach(x=>x.classList.toggle('noro',!S.showRo)); panel.querySelectorAll('.opt .r').forEach(x=>x.style.display=S.showRo?'':'none'); return; }
  if(act==='rv'){ S.review[b.dataset.k]=b.value; save(); return; }
  switch(act){
    case 'start': sfx.tap(); screenStory(0); break;
    case 'continue': sfx.tap(); screenMap(); break;
    case 'reset': { const k=b.dataset.confirm; if(!k){ b.dataset.confirm='1'; b.textContent='Toque de novo para apagar o progresso'; return; } S=fresh(); save(); sfx.back(); screenStory(0); break; }
    case 'story': { const i=+b.dataset.i; sfx.tap(); if(i<STORY.length) screenStory(i); else { S.story=true; save(); screenMap(); } break; }
    case 'map': sfx.tap(); screenMap(); break;
    case 'final': sfx.tap(); screenFinal(); break;
    case 'mission': { const i=+b.dataset.i; if(i>S.unlocked){ sfx.wrong(); catTalk('まだだ。','Termine a missão anterior primeiro. Um portão de cada vez.'); return; } sfx.tap(); screenMissionIntro(i); break; }
    case 'begin': sfx.place(); beginMission(+b.dataset.i); break;
    case 'tile': { const c=run.cur; if(c.solved) return; const tl=c.tiles.find(x=>x.id===+b.dataset.id); if(!tl||tl.used) return; tl.used=true; c.answer.push(tl.id); sfx.place(); drawTiles(); break; }
    case 'untile': { const c=run.cur; if(c.solved) return; const id=+b.dataset.id; c.answer=c.answer.filter(x=>x!==id); const tl=c.tiles.find(x=>x.id===id); tl.used=false; sfx.back(); drawTiles(); break; }
    case 'clear': { const c=run.cur; if(c.solved) return; c.answer=[]; c.tiles.forEach(x=>x.used=false); sfx.back(); drawTiles(); break; }
    case 'check': checkBuild(); break;
    case 'hint': run.tasks[run.ti].type==='choice' ? hintChoice() : hintBuild(); break;
    case 'opt': pickOpt(+b.dataset.k); break;
    case 'next': nextTask(); break;
    case 'draw': doDraw(); break;
    case 'walk': walkOn(); break;
    case 'speak': speak(b.dataset.s); break;
  }
});
$('bMap').addEventListener('click',()=>{ audioInit(); if(!S.story){ screenTitle(); return; } sfx.tap(); screenMap(); });
bMusic.addEventListener('click',()=>{ audioInit(); setMusic(!A.musicOn); });
bSfx.addEventListener('click',()=>{ audioInit(); setSfx(!A.sfxOn); });
addEventListener('pointermove',e=>{ world.pointer={x:e.clientX,y:e.clientY}; world.pointerT=performance.now(); },{passive:true});
addEventListener('pointerdown',()=>audioInit(),{once:true});
addEventListener('resize',layout);
if(window.ResizeObserver) new ResizeObserver(layout).observe(panel);

initWorld(); layout(); hud(); screenTitle();
requestAnimationFrame(frame);
setTimeout(()=>catTalk('…にゃ。','Uma visitante? Toque em começar.',4000),900);
})();
</script>
