<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Prix des Sons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: palco 3D em tela cheia (mascote + coração do concurso); cartão de jogo à direita no desktop e embaixo no celular. */
:root {
  --pink: #ffb8d2;
  --pink-deep: #e9689a;
  --lilac: #d4c2ff;
  --mint: #b3ecd6;
  --sky: #c2e2ff;
  --butter: #fff1a8;
  --peach: #ffd6b5;
  --ink: #57426b;
  --ink-soft: #8b7a9e;
  --paper: #fffafd;
  --paper-glass: rgba(255, 250, 253, 0.86);
  --line: #f1dcea;
  --ok: #3fb98b;
  --ok-bg: #defaee;
  --bad: #e45f8c;
  --bad-bg: #ffe3ec;
  --bg: #fde3f0;
  --font-display: "Mochiy Pop One", "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Baloo 2", "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#stage3d { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.fallback-bg {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, #ffd9ec 0%, #e8dcff 55%, #cfeaff 100%);
}

/* ---------- HUD ---------- */
.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.brand {
  font-family: var(--font-display); font-size: 15px; letter-spacing: 0.02em;
  background: var(--paper-glass); padding: 6px 14px; border-radius: 999px;
  box-shadow: 0 3px 0 var(--line);
}
.brand b { color: var(--pink-deep); font-weight: 400; }
.hud-right { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.pill {
  display: flex; align-items: baseline; gap: 6px;
  background: var(--paper-glass); border-radius: 999px; padding: 5px 14px;
  box-shadow: 0 3px 0 var(--line); font-weight: 700; font-size: 14px; color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.pill strong { font-family: var(--font-display); font-weight: 400; color: var(--ink); font-size: 17px; }
.pill.combo strong { color: var(--pink-deep); }
.icon-btn {
  border: 0; cursor: pointer; font: inherit; font-weight: 800; color: var(--ink);
  background: var(--paper-glass); border-radius: 999px; padding: 6px 14px; font-size: 14px;
  box-shadow: 0 3px 0 var(--line);
}
.icon-btn[aria-pressed="false"] { color: var(--ink-soft); text-decoration: line-through; }

/* ---------- Painel / cartão ---------- */
#panel {
  position: fixed; z-index: 4;
  top: calc(env(safe-area-inset-top, 0px) + 70px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  right: max(24px, env(safe-area-inset-right, 0px));
  width: min(540px, 50vw);
  display: flex; flex-direction: column; justify-content: center;
}
.card {
  background: var(--paper-glass);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-radius: 32px; border: 3px solid #fff;
  box-shadow: 0 8px 0 var(--line), 0 18px 40px rgba(150, 90, 140, 0.18);
  padding: 22px 24px 24px;
  max-height: 100%; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 14px;
  animation: pop-in 0.35s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop-in { from { transform: scale(0.94) translateY(10px); opacity: 0.4; } to { transform: none; opacity: 1; } }
@media (max-aspect-ratio: 23/20), (max-width: 760px) {
  #panel {
    top: auto; width: auto; height: 61%;
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    justify-content: flex-end;
  }
  .card { padding: 18px 18px 20px; border-radius: 26px; }
  .brand { display: none; }
}

h1, h2, h3 { margin: 0; text-wrap: balance; }
.title {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 4.2vw, 40px); line-height: 1.1;
  color: var(--ink);
}
.title span { color: var(--pink-deep); }
.eyebrow {
  font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft);
}
.lead { margin: 0; color: var(--ink); }
.muted { color: var(--ink-soft); font-size: 15px; margin: 0; }

/* ---------- Méthode phonique ---------- */
.phon { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 0; font-size: 26px; font-weight: 800; line-height: 1.1; }
.syl { padding: 0 3px 7px; margin: 0 2px; border-bottom: 3px solid; border-radius: 0 0 50% 50% / 0 0 12px 12px; }
.syl.a { color: #d6457c; border-color: #f5a3c3; }
.syl.b { color: #4a72d1; border-color: #a6bff3; }
.mute { color: #b3a7c1 !important; font-weight: 600; }
.tgt { background: var(--butter); border-radius: 6px; padding: 0 2px; font-weight: 800; }
.sep { color: var(--ink-soft); opacity: .6; margin: 0 1px; }
.lia { color: var(--pink-deep); font-weight: 800; }
.phon .lia { font-size: 30px; margin: 0 -1px; padding-bottom: 6px; }
.gap { width: 14px; }
.legend { margin: 0; font-size: 13.5px; color: var(--ink-soft); line-height: 2; }
.legend .syl { padding: 0 2px 2px; margin: 0 1px; border-bottom-width: 2px; font-weight: 800; }
.fb-read { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fb-lbl { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.inline-ph { font-weight: 700; }
.fiche { display: flex; gap: 12px; align-items: flex-start; background: #fff; border-radius: 18px; padding: 10px 12px; margin-top: 4px; }
.fiche .emo { font-size: 42px; line-height: 1; flex: none; }
.fiche-body { min-width: 0; }
.fiche-t { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: 16px; }
.snd { font-family: var(--font-display); font-weight: 400; color: var(--pink-deep); }
.graph { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.graph span { background: var(--lilac); border-radius: 8px; padding: 0 8px; font-weight: 700; font-size: 14px; }
.bouche { margin: 6px 0 0; font-size: 14.5px; }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.tile {
  border: 3px solid #fff; background: #fff; border-radius: 18px; padding: 8px 4px; cursor: pointer; font: inherit; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 0 var(--line); min-width: 0;
}
.tile .emo { font-size: 30px; line-height: 1.2; }
.tile .ex { font-size: 14px; font-weight: 700; }
.tile.on { border-color: var(--pink-deep); background: #fff3f8; }
.wall-btn { font-size: 16px; padding: 9px 18px; align-self: flex-start; }

/* ---------- Escolha de manche ---------- */
.rounds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .rounds { grid-template-columns: 1fr; } }
.round {
  border: 0; cursor: pointer; text-align: left; font: inherit; color: var(--ink);
  border-radius: 22px; padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 2px;
  box-shadow: 0 5px 0 rgba(87, 66, 107, 0.14); transition: transform .15s, box-shadow .15s;
  min-width: 0;
}
.round:hover { transform: translateY(-2px); box-shadow: 0 7px 0 rgba(87, 66, 107, 0.14); }
.round:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(87, 66, 107, 0.14); }
.round .num { font-family: var(--font-display); font-size: 13px; opacity: .75; }
.round .rname { font-weight: 800; font-size: 19px; line-height: 1.15; }
.round .topics { font-size: 13.5px; line-height: 1.3; color: var(--ink); opacity: .82; }
.round .best { font-size: 12.5px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.c-pink { background: var(--pink); }
.c-mint { background: var(--mint); }
.c-sky { background: var(--sky); }
.c-butter { background: var(--butter); }
.howto { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink-soft); margin: 0; padding: 0; list-style: none; }
.howto li::before { content: "♥ "; color: var(--pink-deep); }
.voice-note { font-size: 13.5px; border-radius: 14px; padding: 8px 12px; background: var(--butter); margin: 0; }
.voice-note.ok { background: var(--ok-bg); }

/* ---------- Pergunta ---------- */
.q-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 800; padding: 3px 12px; border-radius: 999px; background: var(--lilac); letter-spacing: 0.02em; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
.dot.now { background: var(--lilac); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--lilac); }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--bad); }
.prompt { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.q-text { font-size: 21px; font-weight: 700; line-height: 1.3; margin: 0; }
.word-card {
  font-size: clamp(34px, 6vw, 48px); font-weight: 800; line-height: 1.1;
  background: #fff; border-radius: 24px; padding: 10px 26px; box-shadow: 0 5px 0 var(--line);
  display: inline-flex; align-items: center; gap: 14px;
}
.listen-row { display: flex; align-items: center; gap: 10px; }
.big-listen {
  width: 96px; height: 96px; border-radius: 50%; border: 4px solid #fff; cursor: pointer;
  background: radial-gradient(circle at 35% 30%, #ffd2e4, var(--pink-deep));
  color: #fff; font: inherit; font-weight: 800; font-size: 15px; line-height: 1.1;
  box-shadow: 0 6px 0 #c65483, 0 10px 24px rgba(233, 104, 154, .35);
  display: grid; place-items: center; transition: transform .12s;
}
.big-listen:active { transform: translateY(4px); box-shadow: 0 2px 0 #c65483; }
.big-listen svg { width: 34px; height: 34px; display: block; margin: 0 auto 2px; }
.big-listen.playing { animation: pulse 0.6s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.07); } }
.mini-btn {
  border: 0; cursor: pointer; font: inherit; font-size: 14px; font-weight: 800; color: var(--ink);
  background: var(--sky); padding: 6px 12px; border-radius: 999px; box-shadow: 0 3px 0 rgba(87,66,107,.15);
}
.mini-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(87,66,107,.15); }
.say-btn {
  border: 0; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; background: var(--sky);
  display: grid; place-items: center; flex: none; box-shadow: 0 3px 0 rgba(87,66,107,.15);
}
.say-btn svg { width: 22px; height: 22px; }
.opts { display: grid; gap: 9px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opts.three { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 460px) { .opts.three { grid-template-columns: 1fr; } }
.opt {
  border: 3px solid #fff; cursor: pointer; font: inherit; color: var(--ink); text-align: left;
  background: #fff; border-radius: 20px; padding: 10px 14px; min-height: 56px;
  display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; line-height: 1.25;
  box-shadow: 0 5px 0 var(--line); transition: transform .12s, box-shadow .12s, background .2s;
  min-width: 0;
}
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt .k {
  flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--lilac);
  display: grid; place-items: center; font-size: 13px; font-weight: 800;
}
.opt:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 7px 0 var(--line); background: #fff7fb; }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok-bg); border-color: var(--ok); box-shadow: 0 5px 0 #a6e6cb; }
.opt.right .k { background: var(--ok); color: #fff; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); box-shadow: 0 5px 0 #f7b7cb; animation: shake .4s; }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt.dim { opacity: .55; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.feedback {
  border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;
  animation: pop-in .3s cubic-bezier(.2,1.4,.4,1) both;
}
.feedback.ok { background: var(--ok-bg); }
.feedback.bad { background: var(--bad-bg); }
.fb-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.fb-title { font-family: var(--font-display); font-size: 18px; }
.feedback.ok .fb-title { color: #23946b; }
.feedback.bad .fb-title { color: #c9406f; }
.fb-pts { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.fb-answer { font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fb-tip { margin: 0; font-size: 15.5px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.cta {
  border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 18px; color: #fff;
  background: var(--pink-deep); padding: 11px 26px; border-radius: 999px;
  box-shadow: 0 5px 0 #c65483; transition: transform .12s, box-shadow .12s;
}
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #c65483; }
.cta.soft { background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--line); }
button:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 3px; }

/* ---------- Resultado ---------- */
.jury {
  text-align: center; border-radius: 24px; padding: 14px; background: linear-gradient(135deg, var(--butter), var(--peach));
}
.jury .pts { font-family: var(--font-display); font-size: clamp(40px, 8vw, 60px); line-height: 1; color: var(--pink-deep); }
.jury .lbl { font-weight: 800; font-size: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: #fff; border-radius: 18px; padding: 8px; text-align: center; box-shadow: 0 4px 0 var(--line); }
.stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.review { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.review li { background: #fff; border-radius: 16px; padding: 8px 12px; display: flex; gap: 10px; align-items: flex-start; }
.review li > div { min-width: 0; }
.review .say-btn { width: 36px; height: 36px; }
.review .say-btn svg { width: 18px; height: 18px; }
.review p { margin: 0; font-size: 14.5px; }

/* ---------- Pop de comemoração ---------- */
#pop {
  position: fixed; z-index: 6; left: 50%; top: 30%; transform: translate(-50%, -50%);
  font-family: var(--font-display); font-size: clamp(34px, 7vw, 64px); white-space: nowrap;
  color: #fff; pointer-events: none; opacity: 0;
  text-shadow: 0 4px 0 var(--pink-deep), 0 0 24px rgba(233,104,154,.6);
}
#pop.show { animation: popword 1.2s cubic-bezier(.2,1.5,.4,1) both; }
#pop.sad { text-shadow: 0 4px 0 #9a86c9, 0 0 20px rgba(154,134,201,.5); }
@keyframes popword {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.4) rotate(-8deg); }
  25% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(3deg); }
  70% { opacity: 1; transform: translate(-50%, -55%) scale(1) rotate(0); }
  100% { opacity: 0; transform: translate(-50%, -70%) scale(.95); }
}
@media (max-aspect-ratio: 23/20), (max-width: 760px) { #pop { top: 24%; } }
@media (min-aspect-ratio: 23/20) and (min-width: 761px) { #pop { left: 30%; } }
.toast {
  position: fixed; z-index: 7; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 62px);
  background: var(--ink); color: #fff; font-weight: 800; padding: 7px 16px; border-radius: 999px; font-size: 15px;
  animation: toast 2.4s ease both; pointer-events: none; white-space: nowrap;
}
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -8px); } 12%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .card, .feedback, #pop.show, .opt.wrong, .big-listen.playing { animation-duration: 0.01s; }
}
</style>
</head>
<body>
<canvas id="stage3d" aria-hidden="true"></canvas>

<header class="hud">
  <div class="brand">Grand Prix <b>des Sons</b></div>
  <div class="hud-right">
    <div class="pill" title="Pontuação"><span>pontos</span><strong id="hudScore">0</strong></div>
    <div class="pill combo" title="Multiplicador de sequência"><span>combo</span><strong id="hudCombo">x1</strong></div>
    <button class="icon-btn" id="musicBtn" aria-pressed="true" title="Ligar ou desligar a trilha">♪ música</button>
  </div>
</header>

<main id="panel" aria-live="polite"></main>
<div id="pop" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* =========================================================
   Grand Prix des Sons — jogo de pronúncia francesa (Pré-A1 / A1)
   Conteúdo: Caderno ODU Creative, Módulo Pré-A1, Aulas 01–03
   ========================================================= */

// ---------- Utilidades ----------
const $ = (s) => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* armazenamento indisponível */ } }
};
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

// ---------- Méthode phonique: o mural dos sons ----------
// Cada som tem rótulo entre colchetes, uma palavra-referência com imagem, os grafemas que o escrevem
// e o gesto da boca. Transcrição das palavras: sílabas separadas por ·, letras mudas entre ( ),
// grafema do som estudado entre { } e ligação marcada com ‿.
const SONS = {
  u:  { label: "[u]",  ex: "tortue", emo: "🐢", graph: ["u", "û"], bouche: "Diga “i” e, sem mexer a língua, faça bico com os lábios. Esse som não existe em português." },
  ou: { label: "[ou]", ex: "loup",   emo: "🐺", graph: ["ou", "où", "oû"], bouche: "Lábios em bico e língua recuada: é o nosso “u” de “tudo”." },
  an: { label: "[an]", ex: "enfant", emo: "🧒", graph: ["an", "am", "en", "em"], bouche: "Boca bem aberta e ar pelo nariz: um “ã” grave. Não feche a boca no n." },
  in: { label: "[in]", ex: "lapin",  emo: "🐰", graph: ["in", "im", "ain", "ein", "un"], bouche: "Boca aberta em sorriso e ar pelo nariz: um “é” nasal. Não feche a boca no n." },
  on: { label: "[on]", ex: "bonbon", emo: "🍬", graph: ["on", "om"], bouche: "Lábios redondos e ar pelo nariz: o “õ” de “bom”, sem fechar a boca no fim." },
  oi: { label: "[oi]", ex: "roi",    emo: "👑", graph: ["oi"], bouche: "[ou] e [a] colados, bem rápido: “uá”." },
  r:  { label: "[r]",  ex: "rat",    emo: "🐀", graph: ["r", "rr"], bouche: "No fundo da garganta, como um gargarejo suave ou o rr carioca. Vale em todas as posições." },

// ---------- Voz francesa (Web Speech API) ----------
const Voice = {
  v: null, ok: false, supported: "speechSynthesis" in window,
  pick() {
    if (!this.supported) return;
    const fr = speechSynthesis.getVoices().filter((v) => /^fr/i.test(v.lang));
    const frFR = fr.filter((v) => /fr[-_]FR/i.test(v.lang));
    this.v = frFR.find((v) => /google|amélie|amelie|thomas|audrey|marie|denise|henri|eloise|vivienne/i.test(v.name)) || frFR[0] || fr[0] || null;
    this.ok = !!this.v;
    const note = document.getElementById("voiceNote");
    if (note) note.outerHTML = voiceNoteHTML();
  },
  say(text, slow, onend) {
    if (!this.ok || !text) { if (onend) onend(); return false; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = this.v; u.lang = this.v.lang; u.rate = slow ? 0.55 : 0.85; u.pitch = 1.05;
    u.onstart = () => Music.duck(true);
    u.onend = u.onerror = () => { Music.duck(false); if (onend) onend(); };
    speechSynthesis.speak(u);
    return true;
  }
};
if (Voice.supported) {
  Voice.pick();
  speechSynthesis.addEventListener ? speechSynthesis.addEventListener("voiceschanged", () => Voice.pick()) : (speechSynthesis.onvoiceschanged = () => Voice.pick());
}

    // mascote dançando no tempo da música
    body.position.y = Math.abs(Math.sin(ph * Math.PI)) * 0.12;
    body.scale.set(1 + pulse * 0.05, 1 - pulse * 0.06, 1 + pulse * 0.05);
    mascot.position.y = 0.05; body.rotation.set(0, Math.sin(time * 0.7) * 0.28, Math.sin(time * 1.3) * 0.04);
    if (active && R.type === "happy") {
      mascot.position.y = 0.05 + Math.sin(k * Math.PI) * 1.3;
      body.rotation.y = (1 - Math.pow(1 - k, 3)) * Math.PI * 2;
    } else if (active && R.type === "sad") {
      body.rotation.z = Math.sin(k * Math.PI * 6) * 0.16 * (1 - k);
      body.position.y -= Math.sin(k * Math.PI) * 0.1;
    }
    const happy = active && R.type === "happy", sad = active && R.type === "sad";
    eyes.forEach((e) => { e.visible = !happy; }); happyEyes.forEach((e) => { e.visible = happy; });
    smile.visible = !happy && !sad; openMouth.visible = happy; frown.visible = sad;
    blinkAt -= dt;
    const blink = blinkAt < 0.12 && blinkAt > 0 ? 0.1 : 1; if (blinkAt <= 0) blinkAt = rand(2.2, 4.5);
    eyes.forEach((e) => { e.scale.y = blink; });
    const lift = mascot.position.y - 0.05; shadow.scale.setScalar(1 - Math.min(0.5, lift * 0.35)); shadow.material.opacity = 0.18 - Math.min(0.1, lift * 0.06);

    heart.scale.setScalar(1 + pulse * 0.05); heart.rotation.y = Math.sin(time * 0.5) * 0.18;
    ringMat.color.setHSL(0.93, 1, 0.78 + pulse * 0.12);
    lights.forEach((b, i) => { b.visible = (Math.floor(beat * 2) + i) % 3 !== 0; });
    beams.forEach((b, i) => { b.rotation.z = Math.sin(time * 0.6 + i * 1.7) * (REDUCED ? 0.1 : 0.45); b.rotation.x = Math.cos(time * 0.4 + i) * 0.15; b.material.opacity = 0.05 + pulse * 0.04; });
    floaters.forEach((m) => {
      const u = m.userData; m.position.y += u.vy * dt * (REDUCED ? 0.4 : 1); m.position.x += Math.sin(time * 0.5 + u.sway) * 0.004;
      m.rotation.y += u.spin * dt; m.rotation.x += u.spin * 0.5 * dt;
      if (m.position.y > 10) m.position.y = -7;
    });
    glitter.rotation.y = Math.sin(time * 0.05) * 0.2; glitter.material.opacity = 0.6 + Math.sin(time * 3) * 0.25;

    // confetes: gravidade, resistência do ar e balanço
    for (let i = 0; i < N; i++) {
      const q = P[i];
      if (q.life > 0) {
        q.life -= dt; q.v.y -= 5.2 * dt; q.v.multiplyScalar(1 - 1.6 * dt);
        q.v.x += Math.sin(time * 6 + q.ph) * 0.6 * dt;
        q.p.addScaledVector(q.v, dt);
        q.r.x += q.w.x * dt; q.r.y += q.w.y * dt; q.r.z += q.w.z * dt;
        dummy.position.copy(q.p); dummy.rotation.copy(q.r); dummy.scale.setScalar(Math.min(1, q.life * 2));
      } else dummy.scale.setScalar(0);
      dummy.updateMatrix(); confetti.setMatrixAt(i, dummy.matrix);
    }
    confetti.instanceMatrix.needsUpdate = true;

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  Stage.ok = true;
}
try { initStage(); } catch (e) {
  console.warn("Palco 3D indisponível:", e);
  $("#stage3d").replaceWith(Object.assign(document.createElement("div"), { className: "fallback-bg" }));
}

// ---------- Estado do jogo ----------
const G = { key: null, queue: [], i: 0, score: 0, streak: 0, maxStreak: 0, correct: 0, results: [], answered: false, t0: 0, shownOpts: [] };
const best = store.get("gpds-best", {});
const panel = $("#panel");
const mult = () => 1 + Math.min(2, Math.floor(G.streak / 3)) * 0.5;

function hud() {
  $("#hudScore").textContent = G.score.toLocaleString("pt-BR");
  $("#hudCombo").textContent = "x" + String(mult()).replace(".", ",");
}
function pop(text, sad) {
  const el = $("#pop"); el.textContent = text; el.className = sad ? "sad" : "";
  void el.offsetWidth; el.classList.add("show");
}
function toast(text) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2500);
}
function voiceNoteHTML() {
  if (Voice.ok) return '<p class="voice-note ok" id="voiceNote">Voz francesa pronta: <b>' + esc(Voice.v.name) + '</b>. Use fones para ouvir melhor.</p>';
  return '<p class="voice-note" id="voiceNote">Seu navegador não tem voz francesa instalada. As perguntas de escuta vão mostrar o som com a palavra-referência, como [ou] 🐺 loup. Para ouvir, use Chrome ou Edge, ou instale a voz “Français” no sistema.</p>';
}

// ---------- Transcrição méthode phonique ----------
// arcs = true desenha cada sílaba com arco e cor alternada; false é a versão em linha (dicas e opções).
function phon(s, arcs) {
  let out = "", syl = "", n = 0;
  const flush = () => { if (syl) { out += '<span class="syl ' + (n++ % 2 ? "b" : "a") + '">' + syl + "</span>"; syl = ""; } };
  for (const ch of String(s)) {
    if (ch === "(") syl += '<span class="mute">';
    else if (ch === "{") syl += '<span class="tgt">';
    else if (ch === ")" || ch === "}") syl += "</span>";
    else if (ch === "·") { if (arcs) flush(); else syl += '<span class="sep">·</span>'; }
    else if (ch === "‿") { if (arcs) { flush(); out += '<span class="lia">‿</span>'; } else syl += '<span class="lia">‿</span>'; }
    else if (ch === " " && arcs) { flush(); out += '<span class="gap"></span>'; }
    else syl += esc(ch);
  }
  if (arcs) flush(); else out += syl;
  return out;
}
const phonBlock = (s) => '<div class="phon" aria-label="Leitura em sílabas">' + phon(s, true) + "</div>";
function ficheHTML(k) {
  const s = SONS[k]; if (!s) return "";
  return '<div class="fiche"><span class="emo" aria-hidden="true">' + s.emo + '</span><div class="fiche-body">' +
    '<div class="fiche-t"><b class="snd">' + esc(s.label) + '</b> comme dans <b>' + esc(s.ex) + '</b>' +
    (Voice.ok ? ' <button class="mini-btn" data-say-word="' + esc(s.ex) + '">ouvir ' + esc(s.ex) + '</button>' : "") + '</div>' +
    '<div class="graph">' + s.graph.map((g) => "<span>" + esc(g) + "</span>").join("") + '</div>' +
    '<p class="bouche"><b>Boca:</b> ' + phon(s.bouche) + '</p></div></div>';
}
function bindSayWord(root) { root.querySelectorAll("[data-say-word]").forEach((b) => b.addEventListener("click", () => Voice.say(b.dataset.sayWord))); }
const LEGEND = '<p class="legend"><span class="syl a">sí</span><span class="syl b">la</span><span class="syl a">bas</span> em arcos · letras <span class="mute">mudas</span> em cinza · <span class="tgt">som</span> estudado · <span class="lia">‿</span> ligação</p>';

// ---------- Telas ----------
function renderHome() {
  G.key = null; G.score = 0; G.streak = 0; hud();
  const cards = Object.entries(ROUNDS).map(([k, r]) => {
    const b = best[k];
    return '<button class="round ' + r.color + '" data-round="' + k + '">' +
      '<span class="num">' + esc(r.num) + '</span><span class="rname">' + esc(r.name) + '</span>' +
      '<span class="topics">' + esc(r.topics) + '</span>' +
      '<span class="best">' + (b ? "Recorde: " + b.toLocaleString("pt-BR") + " pts" : ROUND_LEN[k] + " perguntas") + '</span></button>';
  }).join("");
  panel.innerHTML = '<section class="card">' +
    '<span class="eyebrow">Francês para brasileiros · Pré-A1 e A1 · méthode phonique</span>' +
    '<h1 class="title">Grand Prix <span>des Sons</span></h1>' +
    '<p class="lead">Coucou ! Eu sou a Mimi, o macaron de boina. Aqui cada som tem nome, imagem e gesto: [ou] 🐺 loup, [in] 🐰 lapin, [é] 👶 bébé. Ouça, escolha e ganhe pontos do júri.</p>' +
    '<div class="rounds">' + cards + '</div>' +
    '<button class="cta soft wall-btn" id="wallBtn">Mur des sons: os 15 sons e seus gestos</button>' +
    LEGEND +
    '<ul class="howto"><li>100 pontos por acerto</li><li>bônus de rapidez</li><li>combo de até x2</li><li>5 seguidas: mudança de tom!</li></ul>' +
    voiceNoteHTML() + '</section>';
  panel.querySelectorAll("[data-round]").forEach((b) => b.addEventListener("click", () => startRound(b.dataset.round)));
  $("#wallBtn").addEventListener("click", renderWall);
}

function renderWall() {
  Music.start();
  const tiles = Object.entries(SONS).map(([k, s]) =>
    '<button class="tile" data-son="' + esc(k) + '"><span class="emo" aria-hidden="true">' + s.emo + '</span>' +
    '<b class="snd">' + esc(s.label) + '</b><span class="ex">' + esc(s.ex) + '</span></button>').join("");
  panel.innerHTML = '<section class="card">' +
    '<span class="eyebrow">Méthode phonique</span><h2 class="title">Mur des sons</h2>' +
    '<p class="muted">Toque num som para ver como se escreve, como a boca se mexe e ouvir a palavra-referência.</p>' +
    '<div id="wallDetail">' + ficheHTML("u") + '</div>' +
    '<div class="wall">' + tiles + '</div>' +
    '<div class="actions"><button class="cta" id="backBtn">Voltar ao concurso</button></div></section>';
  bindSayWord($("#wallDetail"));
  panel.querySelectorAll("[data-son]").forEach((b) => b.addEventListener("click", () => {
    const d = $("#wallDetail"); d.innerHTML = ficheHTML(b.dataset.son); bindSayWord(d);
    panel.querySelectorAll(".tile").forEach((t) => t.classList.toggle("on", t === b));
    Voice.say(SONS[b.dataset.son].ex);
    d.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" });
  }));
  panel.querySelector(".tile").classList.add("on");
  $("#backBtn").addEventListener("click", renderHome);
}

function startRound(key) {
  Music.start();
  Music.transpose = 0;
  Object.assign(G, { key, i: 0, score: 0, streak: 0, maxStreak: 0, correct: 0, results: [], answered: false });
  G.queue = shuffle(ROUNDS[key].items).slice(0, ROUND_LEN[key]);
  hud(); renderQuestion();
}

function renderQuestion() {
  const it = G.queue[G.i]; G.answered = false;
  G.shownOpts = shuffle(it.opts);
  const dots = G.queue.map((_, j) => {
    const r = G.results[j]; return '<span class="dot' + (j === G.i ? " now" : r == null ? "" : r.ok ? " ok" : " bad") + '"></span>';
  }).join("");
  let prompt = "";
  if (it.type === "listen") {
    const clue = it.clue || (it.son ? "Qual palavra tem o som " + SND(it.son) + "?" : "Qual palavra é esta?");
    prompt = Voice.ok
      ? '<div class="listen-row"><button class="big-listen" id="listenBtn" aria-label="Ouvir a palavra">' + SPEAKER + 'Ouvir</button>' +
        '<button class="mini-btn" id="slowBtn">devagar</button></div><p class="q-text">Qual palavra você ouviu?</p>'
      : '<p class="q-text">' + esc(clue) + '</p>';
  } else if (it.type === "word") {
    prompt = '<div class="word-card">' + esc(it.word) + (Voice.ok ? '<button class="say-btn" id="sayBtn" aria-label="Ouvir">' + SPEAKER + '</button>' : "") + '</div>' +
      '<p class="q-text">' + esc(it.q) + '</p>';
  } else {
    prompt = '<p class="q-text">' + esc(it.q) + '</p>';
  }
  const n = G.shownOpts.length, longest = Math.max(...G.shownOpts.map((o) => o.length));
  const cols = longest > 22 ? "" : n === 3 ? (longest <= 9 ? " three" : "") : " two";
  panel.innerHTML = '<section class="card">' +
    '<div class="q-top"><span class="chip">' + esc(ROUNDS[G.key].num) + ' · ' + esc(it.tag) + '</span><div class="dots" aria-label="Pergunta ' + (G.i + 1) + ' de ' + G.queue.length + '">' + dots + '</div></div>' +
    '<div class="prompt">' + prompt + '</div>' +
    '<div class="opts' + cols + '">' + G.shownOpts.map((o, j) =>
      '<button class="opt" data-i="' + j + '"><span class="k">' + (j + 1) + '</span><span class="t">' + phon(o) + '</span></button>').join("") + '</div>' +
    '<div id="fbSlot"></div></section>';
  panel.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => answer(+b.dataset.i)));
  const lb = $("#listenBtn");
  if (lb) {
    const play = (slow) => { lb.classList.add("playing"); Voice.say(it.say, slow, () => lb.classList.remove("playing")); };
    lb.addEventListener("click", () => play(false));
    $("#slowBtn").addEventListener("click", () => play(true));
    setTimeout(() => play(false), 350);
  }
  const sb = $("#sayBtn"); if (sb) sb.addEventListener("click", () => Voice.say(it.say));
  G.t0 = performance.now();
}

function answer(j) {
  if (G.answered) return; G.answered = true;
  const it = G.queue[G.i], choice = G.shownOpts[j], ok = choice === it.answer;
  const secs = (performance.now() - G.t0) / 1000 - (it.type === "listen" && Voice.ok ? 1.5 : 0);
  let pts = 0, speed = 0;
  panel.querySelectorAll(".opt").forEach((b, k) => {
    b.disabled = true;
    const o = G.shownOpts[k];
    if (o === it.answer) b.classList.add("right"); else if (k === j) b.classList.add("wrong"); else b.classList.add("dim");
  });
  if (ok) {
    G.streak++; G.correct++; G.maxStreak = Math.max(G.maxStreak, G.streak);
    speed = Math.max(0, Math.min(50, Math.round(50 * (1 - (secs - 2) / 10))));
    pts = Math.round((100 + speed) * mult()); G.score += pts;
    Music.win(); Stage.ok && Stage.setReact("happy"); Stage.ok && Stage.celebrate(G.streak % 5 === 0);
    const praise = ["Très bien !", "Bravo !", "Magnifique !", "Parfait !", "Super !", "Excellent !", "Génial !"];
    pop(G.streak >= 5 && G.streak % 5 === 0 ? "Douze points !" : praise[Math.floor(Math.random() * praise.length)]);
    if (G.streak % 5 === 0) { Music.transpose++; Music.fanfare(); toast("Mudança de tom! " + G.streak + " acertos seguidos"); }
  } else {
    G.streak = 0; Music.lose(); Stage.ok && Stage.setReact("sad");
    pop(["Presque !", "Oh là là…", "Pas grave !", "Encore !"][Math.floor(Math.random() * 4)], true);
  }
  G.results[G.i] = { ok, it };
  hud();
  const sayText = it.say || "";
  $("#fbSlot").innerHTML = '<div class="feedback ' + (ok ? "ok" : "bad") + '">' +
    '<div class="fb-head"><span class="fb-title">' + (ok ? "Acertou!" : "Quase!") + '</span>' +
    (ok ? '<span class="fb-pts">+' + pts + ' pts' + (speed ? " · rapidez +" + speed : "") + (mult() > 1 ? " · combo" : "") + '</span>' : '<span class="fb-pts">combo zerado</span>') + '</div>' +
    '<div class="fb-answer">Resposta: ' + phon(it.answer) + '</div>' +
    (it.ph ? '<div class="fb-read"><span class="fb-lbl">Leitura</span>' + phonBlock(it.ph) +
      (Voice.ok && sayText ? '<button class="say-btn" id="fbSay" aria-label="Ouvir a resposta">' + SPEAKER + '</button>' : "") + '</div>' : "") +
    '<p class="fb-tip">' + phon(it.tip) + '</p>' +
    (it.son ? ficheHTML(it.son) : "") + '</div>' +
    '<div class="actions"><button class="cta" id="nextBtn">' + (G.i + 1 < G.queue.length ? "Próxima" : "Ver o placar do júri") + '</button></div>';
  bindSayWord($("#fbSlot"));
  const fs = $("#fbSay"); if (fs) fs.addEventListener("click", () => Voice.say(sayText));
  if (!ok && Voice.ok && sayText) setTimeout(() => Voice.say(sayText), 500);
  $("#nextBtn").addEventListener("click", next);
  $("#nextBtn").focus({ preventScroll: true });
  $("#fbSlot").scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" });
}

function next() {
  if (Voice.supported) speechSynthesis.cancel();
  G.i++;
  if (G.i < G.queue.length) renderQuestion(); else renderResults();
}

function renderResults() {
  const total = G.queue.length, acc = G.correct / total;
  const jury = acc >= 0.9 ? [12, "Douze points !", "O júri está encantado. Sua pronúncia brilha no palco!"]
    : acc >= 0.75 ? [10, "Dix points !", "Linda apresentação. Revise os itens abaixo e volte para os 12 pontos."]
    : acc >= 0.6 ? [8, "Huit points", "Bom caminho! Repita os pares em voz alta e tente de novo."]
    : acc >= 0.4 ? [5, "Cinq points", "O público gostou. Volte ao Mur des sons, faça o gesto de cada som e grave sua voz."]
    : [0, "Nul point…", "Pas grave ! Até no Eurovision isso acontece. Releia a aula e tente outra vez."];
  const k = G.key, isBest = G.score > (best[k] || 0);
  if (isBest) { best[k] = G.score; store.set("gpds-best", best); }
  if (jury[0] >= 10 && Stage.ok) { Stage.setReact("happy"); Stage.celebrate(true); setTimeout(() => Stage.celebrate(true), 600); }
  if (jury[0] >= 10) Music.fanfare();
  const missed = G.results.filter((r) => !r.ok);
  const review = missed.length ? '<h3 class="eyebrow">Para revisar</h3><ul class="review">' + missed.map((r, i) =>
    '<li>' + (Voice.ok && r.it.say ? '<button class="say-btn" data-say="' + i + '" aria-label="Ouvir">' + SPEAKER + '</button>' : "") +
    '<div><p><b>' + esc(r.it.word || r.it.q || r.it.opts.join(" × ")) + '</b> → ' + phon(r.it.answer) +
    (r.it.ph ? ' · <span class="inline-ph">' + phon(r.it.ph) + '</span>' : "") +
    (r.it.son ? ' · ' + esc(SND(r.it.son)) : "") + '</p><p class="muted">' + phon(r.it.tip) + '</p></div></li>').join("") + '</ul>'
    : '<p class="lead">Nenhum erro nesta manche. Parfait !</p>';
  panel.innerHTML = '<section class="card">' +
    '<span class="eyebrow">' + esc(ROUNDS[k].num) + ' · ' + esc(ROUNDS[k].name) + ' · resultado</span>' +
    '<div class="jury"><div class="lbl">O júri dá</div><div class="pts">' + jury[0] + '</div><div class="lbl">' + jury[1] + '</div></div>' +
    '<p class="lead">' + jury[2] + '</p>' +
    '<div class="stats"><div class="stat"><b>' + G.score.toLocaleString("pt-BR") + '</b><span>' + (isBest ? "novo recorde!" : "pontos") + '</span></div>' +
    '<div class="stat"><b>' + G.correct + '/' + total + '</b><span>acertos</span></div>' +
    '<div class="stat"><b>' + G.maxStreak + '</b><span>maior sequência</span></div></div>' +
    review +
    '<div class="actions"><button class="cta soft" id="homeBtn">Escolher manche</button><button class="cta" id="againBtn">Jogar de novo</button></div></section>';
  panel.querySelectorAll("[data-say]").forEach((b) => b.addEventListener("click", () => Voice.say(missed[+b.dataset.say].it.say)));
  $("#homeBtn").addEventListener("click", renderHome);
  $("#againBtn").addEventListener("click", () => startRound(k));
}

// ---------- Controles ----------
const musicBtn = $("#musicBtn");
musicBtn.setAttribute("aria-pressed", String(Music.on));
musicBtn.addEventListener("click", () => { Music.setOn(!Music.on); musicBtn.setAttribute("aria-pressed", String(Music.on)); if (Music.on) Music.start(); });
addEventListener("keydown", (e) => {
  if (!G.key || e.altKey || e.ctrlKey || e.metaKey) return;
  const n = parseInt(e.key, 10);
  if (!G.answered && n >= 1 && n <= G.shownOpts.length) { e.preventDefault(); answer(n - 1); }
  else if (!G.answered && e.key === " " && $("#listenBtn")) { e.preventDefault(); $("#listenBtn").click(); }
});

renderHome();
</script>
