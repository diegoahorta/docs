<title>Chunks Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: uma coluna estreita estilo app — trilha de lições em zigue-zague; lição em tela cheia por cima */
:root {
  --bg: #f3f6fd;
  --surface: #ffffff;
  --ink: #1d2433;
  --muted: #66718c;
  --line: #dbe3f1;
  --line-strong: #c3cee3;
  --accent: #2f6fd6;
  --accent-dark: #1f52aa;
  --go: #58cc02;
  --go-dark: #46a302;
  --bad: #ef3e46;
  --bad-dark: #c42a32;
  --ok-bg: #dcffc2;
  --ok-ink: #2d7a00;
  --bad-bg: #ffe0e1;
  --bad-ink: #b3232b;
  --gold: #ffc93c;
  --chunk-ink: #1b2130;
  --shadow: rgba(29, 36, 51, .12);
  --f-display: "Baloo 2", "Nunito", ui-rounded, system-ui, sans-serif;
  --f-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1626; --surface: #18233a; --ink: #e8eefc; --muted: #9aa6c2; --line: #2a3854; --line-strong: #3a4b6d;
    --accent: #6b9ef2; --accent-dark: #3d6fc4; --ok-bg: #1d3415; --ok-ink: #8ee35a; --bad-bg: #3a1a20; --bad-ink: #ff8d93;
    --shadow: rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1626; --surface: #18233a; --ink: #e8eefc; --muted: #9aa6c2; --line: #2a3854; --line-strong: #3a4b6d;
  --accent: #6b9ef2; --accent-dark: #3d6fc4; --ok-bg: #1d3415; --ok-ink: #8ee35a; --bad-bg: #3a1a20; --bad-ink: #ff8d93;
  --shadow: rgba(0, 0, 0, .4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible, .chunk:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.1; }

/* ---------- topo ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--line);
}
.top-in { max-width: 560px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; color: var(--accent); margin-right: auto; display: flex; align-items: center; gap: 8px; }
.flag { width: 26px; height: 18px; border-radius: 4px; background: linear-gradient(90deg, #2f55c4 33.3%, #fff 33.3% 66.6%, #ef4135 66.6%); box-shadow: 0 0 0 2px var(--line); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-weight: 900; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); }
.pill img { width: 20px; height: 20px; }
.pill.streak { color: #ff8a00; }
.pill.xp { color: #d79a00; }
.iconbtn { cursor: pointer; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); border-radius: 12px; padding: 4px 10px; font-weight: 800; font-size: .85rem; display: inline-flex; align-items: center; gap: 6px; }
.iconbtn:active { border-bottom-width: 2px; transform: translateY(2px); }
.iconbtn.on { border-color: var(--accent); color: var(--accent); }
.iconbtn .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.iconbtn .eq i { width: 3px; background: currentColor; border-radius: 2px; height: 4px; }
.iconbtn.on .eq i { animation: eq 0.9s ease-in-out infinite alternate; }
.iconbtn.on .eq i:nth-child(2) { animation-delay: -.3s; } .iconbtn.on .eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { from { height: 3px; } to { height: 12px; } }

/* ---------- home ---------- */
.home { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 80px; display: flex; flex-direction: column; gap: 22px; }
.hero { position: relative; background: var(--accent); color: #fff; border-radius: 22px; padding: 18px 18px 18px 130px; min-height: 150px; display: flex; flex-direction: column; justify-content: center; gap: 6px; overflow: hidden; box-shadow: 0 6px 0 var(--accent-dark); }
.hero img.m { position: absolute; left: 6px; bottom: -8px; width: 130px; animation: bob 3s ease-in-out infinite; }
.hero img.t { position: absolute; right: -10px; top: -6px; width: 90px; opacity: .28; }
.hero h1 { font-size: 1.6rem; }
.hero p { margin: 0; font-weight: 700; opacity: .92; max-width: 34ch; position: relative; }
.hero .bar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.25); overflow: hidden; margin-top: 4px; position: relative; }
.hero .bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .8s; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-2deg); } }

.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-weight: 800; font-size: .85rem; color: var(--muted); }
.legend b { color: var(--ink); font-family: var(--f-display); font-size: .95rem; margin-right: 2px; }
.lg { display: inline-flex; align-items: center; gap: 5px; }
.lg i { width: 18px; height: 14px; border-radius: 4px; display: inline-block; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.lg.S i { background: #8ab8ea; } .lg.V i { background: #93d47f; } .lg.O i { background: #ffd966; } .lg.AUX i { background: #b9a0e3; } .lg.ADV i { background: #f7a99f; }

.unit { display: flex; flex-direction: column; gap: 14px; }
.ubanner { border-radius: 18px; padding: 14px 16px; color: #fff; display: flex; align-items: center; gap: 12px; box-shadow: 0 5px 0 rgba(0,0,0,.18); }
.ubanner .txt { flex: 1; min-width: 0; }
.ubanner small { font-weight: 900; text-transform: uppercase; letter-spacing: .08em; opacity: .85; font-size: .72rem; }
.ubanner h2 { font-size: 1.3rem; }
.ubanner p { margin: 2px 0 0; font-size: .85rem; font-weight: 700; opacity: .92; }
.ubanner button { flex: none; cursor: pointer; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.55); border-bottom-width: 4px; color: #fff; border-radius: 12px; padding: 8px 10px; font-weight: 900; font-size: .8rem; letter-spacing: .04em; }
.ubanner button:active { transform: translateY(2px); border-bottom-width: 2px; }
.u1 { background: #2f6fd6; } .u2 { background: #e2575a; } .u3 { background: #7a55c8; } .u4 { background: #e3a20b; }

.path { position: relative; display: flex; flex-direction: column; align-items: center; gap: 34px; padding-block: 10px; }
.path .deco { position: absolute; top: 50%; transform: translateY(-50%); width: 110px; pointer-events: none; opacity: .95; }
.path .deco.l { left: 0; } .path .deco.r { right: 0; }
.node { position: relative; width: 92px; height: 84px; border: 0; padding: 0; cursor: pointer; background: center / contain no-repeat; transition: transform .15s; }
.node:active { transform: translateY(3px) scale(.97); }
.node .ic { position: absolute; left: 0; right: 0; top: 24%; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; line-height: 1; }
.node.done .ic { color: #9a6a00; }
.node.cur .ic { color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
.node.lock .ic { color: #8a93a6; font-size: 1.3rem; top: 27%; }
.node.lock { filter: saturate(.8); }
.node.boss { width: 110px; height: 110px; }
.node.boss.lock { filter: grayscale(1) opacity(.6); }
.node .stars { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); display: flex; gap: 1px; }
.node .stars img { width: 18px; height: 18px; }
.node .stars img.off { filter: grayscale(1) opacity(.35); }
.node .lbl { position: absolute; top: 50%; transform: translateY(-50%); white-space: nowrap; font-weight: 800; font-size: .8rem; color: var(--muted); }
.node .lbl.r { left: 100%; margin-left: 8px; } .node .lbl.l { right: 100%; margin-right: 8px; }
.node.cur { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 12px color-mix(in srgb, var(--go) 70%, transparent)); } }
.startbub { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--go-dark); border: 2px solid var(--line); font-weight: 900; font-size: .8rem; letter-spacing: .05em; padding: 6px 12px; border-radius: 12px; white-space: nowrap; animation: hop 1.2s ease-in-out infinite; pointer-events: none; }
.startbub::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--surface); }
@keyframes hop { 50% { transform: translate(-50%, -6px); } }
.foot { text-align: center; color: var(--muted); font-size: .85rem; font-weight: 700; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-weight: 800; }
.linkbtn.warn { color: var(--bad); }

/* ---------- botões grandes ---------- */
.big { cursor: pointer; border: 0; border-radius: 16px; padding: 14px 20px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; font-size: 1rem; color: #fff; background: var(--go); box-shadow: 0 5px 0 var(--go-dark); width: 100%; transition: transform .08s, box-shadow .08s; }
.big:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--go-dark); }
.big:disabled { background: var(--line); color: var(--muted); box-shadow: 0 5px 0 var(--line-strong); cursor: default; }
.big.red { background: var(--bad); box-shadow: 0 5px 0 var(--bad-dark); }
.big.ghost { background: var(--surface); color: var(--accent); box-shadow: 0 5px 0 var(--line); border: 2px solid var(--line); }

/* ---------- chunks (blocos 3D renderizados no Blender) ---------- */
.chunk {
  --img: url(assets/bloco_S.webp);
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  border-style: solid; border-color: transparent; border-width: 12px 15px 17px;
  border-image-source: var(--img); border-image-slice: 62 70 66 70 fill; border-image-width: 12px 15px 17px; border-image-repeat: stretch;
  background: none; padding: 1px 4px 0; min-width: 54px; cursor: pointer; color: var(--chunk-ink);
  font-weight: 800; font-size: 1.12rem; line-height: 1.15; user-select: none; transition: transform .1s; position: relative;
}
.chunk .tg { font-size: .58rem; font-weight: 900; letter-spacing: .08em; opacity: .6; line-height: 1; margin-bottom: 1px; }
.chunk:active { transform: translateY(2px); }
.k-S { --img: url(assets/bloco_S.webp); } .k-V { --img: url(assets/bloco_V.webp); } .k-O { --img: url(assets/bloco_O.webp); }
.k-AUX { --img: url(assets/bloco_AUX.webp); } .k-ADV { --img: url(assets/bloco_ADV.webp); }
.chunk.mini { font-size: .95rem; border-width: 9px 11px 13px; border-image-width: 9px 11px 13px; min-width: 0; cursor: inherit; }
.chunk.mini .tg { display: none; }
.chunk.fixed { cursor: default; }
.chunk.pop { animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.6); } 70% { transform: scale(1.08); } }

/* ---------- lição ---------- */
.screen { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.lhead { max-width: 640px; width: 100%; margin: 0 auto; padding: 14px 16px 6px; display: flex; align-items: center; gap: 12px; }
.x { cursor: pointer; background: none; border: 0; font-size: 1.6rem; color: var(--muted); line-height: 1; padding: 4px; font-weight: 900; }
.prog { flex: 1; height: 16px; background: var(--line); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--go); border-radius: 99px; transition: width .5s cubic-bezier(.3,1.6,.5,1); box-shadow: inset 0 -4px 0 rgba(0,0,0,.1), inset 0 4px 0 rgba(255,255,255,.3); }
.hearts { font-weight: 900; color: var(--bad); display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.hearts.hit { animation: hit .4s; }
@keyframes hit { 30% { transform: scale(1.4); } 60% { transform: scale(.9); } }
.lxp { font-weight: 900; color: #d79a00; font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; }
.lxp.bump { animation: hit .5s; }
.lbody { flex: 1; overflow-y: auto; max-width: 640px; width: 100%; margin: 0 auto; padding-inline: 16px; padding-block: 10px 20px; display: flex; flex-direction: column; gap: 16px; }
.lbody h2 { font-size: 1.45rem; }
.ask { display: flex; align-items: flex-end; gap: 6px; }
.ask img { width: 112px; flex: none; margin-bottom: -6px; }
.bubble { position: relative; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; font-weight: 800; font-size: 1.1rem; background: var(--surface); margin-bottom: 30px; min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -11px; bottom: 16px; border: 10px solid transparent; border-right-color: var(--line); border-left: 0; }
.bubble::after { content: ""; position: absolute; left: -8px; bottom: 18px; border: 8px solid transparent; border-right-color: var(--surface); border-left: 0; }
.bubble small { display: block; color: var(--muted); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 900; }
.answer { min-height: 128px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px 6px; padding: 8px 2px; background-image: repeating-linear-gradient(to bottom, transparent 0 60px, var(--line) 60px 62px); }
.answer .punct { align-self: center; font-weight: 900; font-size: 1.4rem; color: var(--muted); }
.sentence { display: flex; flex-wrap: wrap; gap: 8px 6px; align-items: center; padding: 10px 2px; }
.blank { min-width: 96px; height: 54px; border: 3px dashed var(--line-strong); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; }
.blank.filled { border: 0; min-width: 0; height: auto; }
.bank { display: flex; flex-wrap: wrap; gap: 10px 8px; justify-content: center; padding-top: 6px; }
.slot { border-radius: 14px; background: var(--line); display: inline-flex; }
.slot .chunk.used { visibility: hidden; }
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt { cursor: pointer; text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 16px; padding: 12px; display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; }
.opt .n { font-weight: 900; color: var(--muted); border: 2px solid var(--line); border-radius: 8px; width: 28px; height: 28px; display: inline-grid; place-items: center; margin-right: 6px; font-size: .85rem; }
.opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.opt.sel .n { border-color: var(--accent); color: var(--accent); }
.mlegend { justify-content: center; font-size: .75rem; }

.lfoot { border-top: 2px solid var(--line); background: var(--surface); }
.lfoot-in { max-width: 640px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.lfoot.ok { background: var(--ok-bg); border-color: transparent; }
.lfoot.bad { background: var(--bad-bg); border-color: transparent; }
.fb { display: flex; gap: 12px; align-items: flex-start; }
.fb .ttl { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; }
.lfoot.ok .ttl { color: var(--ok-ink); } .lfoot.bad .ttl { color: var(--bad-ink); }
.fb .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
.fb .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.fb .why { font-size: .92rem; }
.lfoot.bad .why { color: var(--bad-ink); }
.say { cursor: pointer; border: 2px solid currentColor; background: transparent; border-radius: 10px; font-weight: 900; padding: 2px 8px; font-size: .8rem; }
.lfoot.ok .say { color: var(--ok-ink); } .lfoot.bad .say { color: var(--bad-ink); }
.lfoot.ok .big { background: var(--go); }
.shake { animation: shake .45s; }
@keyframes shake { 15% { transform: translate(-9px, 4px) rotate(-1deg); } 30% { transform: translate(8px, -5px) rotate(1deg); } 45% { transform: translate(-6px, -3px); } 60% { transform: translate(5px, 4px); } 80% { transform: translate(-2px, 1px); } }
.wobble { animation: wob .4s; }
@keyframes wob { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }

/* ---------- resultado / modais ---------- */
.center { flex: 1; overflow-y: auto; max-width: 520px; width: 100%; margin: 0 auto; padding-inline: 16px; padding-block: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
.center img.tro { width: 180px; animation: bob 2.4s ease-in-out infinite; }
.center h1 { font-size: 2rem; color: var(--gold); text-shadow: 0 3px 0 #d99a00; }
.center h1.sad { color: var(--bad); text-shadow: none; }
.bigstars { display: flex; gap: 6px; }
.bigstars img { width: 64px; height: 64px; opacity: 0; animation: starin .5s forwards; }
.bigstars img.off { filter: grayscale(1) opacity(.3); }
@keyframes starin { from { opacity: 0; transform: scale(0) rotate(-90deg); } to { opacity: 1; transform: none; } }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.tile { border-radius: 14px; border: 2px solid var(--c); overflow: hidden; }
.tile small { display: block; background: var(--c); color: #fff; font-weight: 900; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; padding: 4px; }
.tile b { display: block; font-size: 1.4rem; padding: 8px 4px; font-variant-numeric: tabular-nums; color: var(--c); font-family: var(--f-display); }
.btncol { display: flex; flex-direction: column; gap: 12px; width: 100%; }

.modal { position: fixed; inset: 0; z-index: 40; background: rgba(10, 16, 30, .55); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.sheet { background: var(--surface); border-radius: 22px; max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -4px 30px var(--shadow); animation: up .3s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { font-size: 1.5rem; }
.gp { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: .95rem; }
.gp dt { font-weight: 900; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.gp dd { margin: 0; font-weight: 700; }
.exs { display: flex; flex-direction: column; gap: 6px; }
.exs .row { display: flex; flex-wrap: wrap; gap: 4px; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cmp div { border-radius: 12px; padding: 10px; font-weight: 800; }
.cmp .w { background: var(--bad-bg); color: var(--bad-ink); text-decoration: line-through; }
.cmp .r { background: var(--ok-bg); color: var(--ok-ink); }
.note { font-size: .9rem; color: var(--muted); font-weight: 700; margin: 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 800; max-width: calc(100% - 32px); text-align: center; animation: up .25s; }

/* ---------- efeitos de acerto ---------- */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.flash { position: fixed; inset: 0; z-index: 49; pointer-events: none; background: radial-gradient(circle at 50% 55%, rgba(255,255,255,.95), rgba(255,214,59,.7) 25%, rgba(255,80,160,.45) 50%, rgba(80,140,255,.3) 70%, transparent 85%); animation: flash .7s ease-out forwards; mix-blend-mode: screen; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.praise { position: fixed; left: 50%; top: 34%; z-index: 51; pointer-events: none; text-align: center; transform: translate(-50%, -50%); animation: praise 1.5s cubic-bezier(.2,1.6,.4,1) forwards; }
.praise b { display: block; font-family: var(--f-display); font-weight: 800; font-size: clamp(2.4rem, 11vw, 4.6rem); line-height: 1; color: #fff; -webkit-text-stroke: 2px #1d2433; paint-order: stroke fill; text-shadow: 0 5px 0 #ef4135, 0 10px 0 #2f55c4, 0 14px 24px rgba(0,0,0,.35); white-space: nowrap; }
.praise span { display: inline-block; margin-top: 14px; font-weight: 900; font-size: 1.3rem; color: #1d2433; background: var(--gold); padding: 4px 14px; border-radius: 99px; box-shadow: 0 4px 0 #d99a00; }
.praise span.combo { background: #ff6b2c; color: #fff; box-shadow: 0 4px 0 #c94a10; margin-left: 6px; }
@keyframes praise { 0% { transform: translate(-50%, -50%) scale(0) rotate(-14deg); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.25) rotate(5deg); opacity: 1; } 35% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); } 80% { opacity: 1; transform: translate(-50%, -58%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(.9); } }
.rain { position: fixed; top: -60px; z-index: 50; pointer-events: none; font-size: 2rem; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }

@media (max-width: 420px) {
  .hero { padding-left: 110px; } .hero img.m { width: 112px; }
  .ask img { width: 84px; }
  .chunk { font-size: 1.02rem; }

    bp.type = "bandpass"; bp.Q.value = 3; bp.frequency.setValueAtTime(800, t); bp.frequency.exponentialRampToValueAtTime(7000, t + 0.3);
    g2.gain.setValueAtTime(0.35, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    n2.connect(bp); bp.connect(g2); g2.connect(this.sfx);
    // arpejo brilhante com eco
    const arp = big ? [523, 659, 784, 1047, 1319, 1568, 2093, 2637] : [784, 988, 1175, 1568, 1976, 2349];
    arp.forEach((f, i) => { this.tone("triangle", f, t + 0.06 + i * 0.055, 0.22, 0.2, this.delay); this.tone("square", f, t + 0.06 + i * 0.055, 0.08, 0.04); });
    // estalos de confete
    for (let i = 0; i < (big ? 16 : 9); i++) this.tone("sine", 500 + Math.random() * 1800, t + 0.1 + Math.random() * 0.6, 0.06, 0.12, this.sfx, 200 + Math.random() * 400);
    if (big) [262, 330, 392, 523].forEach(f => this.tone("sawtooth", f, t + 0.55, 1.1, 0.06));
  },
  wrong() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, lp = this.ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 900; lp.connect(this.sfx);
    this.tone("sawtooth", 233, t, 0.22, 0.3, lp, 175);
    this.tone("sawtooth", 175, t + 0.2, 0.35, 0.3, lp, 110);
  }
};

const Lofi = {
  BPM: 74, SWING: 0.16,
  // Fmaj9 → Em7 → Dm9 → Cmaj9 (graus IV–iii–ii–I em dó maior)
  PROG: [
    { root: 41, notes: [57, 60, 64, 67] },
    { root: 40, notes: [55, 59, 62, 64] },
    { root: 38, notes: [53, 57, 60, 64] },
    { root: 36, notes: [52, 55, 59, 62] }
  ],
  SCALE: [72, 74, 76, 79, 81, 84, 86, 88],
  setup(ctx, out, noise) {
    this.ctx = ctx; this.out = out; this.noise = noise;
    this.keys = ctx.createBiquadFilter(); this.keys.type = "lowpass"; this.keys.frequency.value = 1700;
    const trem = ctx.createGain(); trem.gain.value = 0.85;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 4.2; lg.gain.value = 0.15;
    lfo.connect(lg); lg.connect(trem.gain); lfo.start();
    this.keys.connect(trem); trem.connect(out);
    // "wow" de fita: desafinação lenta
    this.wow = ctx.createOscillator(); this.wow.frequency.value = 0.35;
    this.wowAmt = ctx.createGain(); this.wowAmt.gain.value = 9; this.wow.connect(this.wowAmt); this.wow.start();
    this.dly = ctx.createDelay(1); this.dly.delayTime.value = 60 / this.BPM * 0.75;
    const fb = ctx.createGain(); fb.gain.value = 0.32; const dl = ctx.createBiquadFilter(); dl.type = "lowpass"; dl.frequency.value = 2200;
    this.dly.connect(dl); dl.connect(fb); fb.connect(this.dly); dl.connect(out);
    // chiado de vinil
    const sr = ctx.sampleRate, len = sr * 3, cb = ctx.createBuffer(1, len, sr), d = cb.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() < 0.0007 ? (Math.random() * 2 - 1) * 0.7 : 0) + (Math.random() * 2 - 1) * 0.006;
    const cr = ctx.createBufferSource(); cr.buffer = cb; cr.loop = true;
    const cf = ctx.createBiquadFilter(); cf.type = "bandpass"; cf.frequency.value = 2500; cf.Q.value = 0.5;
    const cg = ctx.createGain(); cg.gain.value = 0.55;
    cr.connect(cf); cf.connect(cg); cg.connect(out); cr.start();
  },
  mtof: m => 440 * Math.pow(2, (m - 69) / 12),
  start() {
    if (this.timer || !this.ctx) return;
    this.step = 0; this.next = this.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 25);
  },
  stop() { clearInterval(this.timer); this.timer = null; },
  tick() {
    const spb = 60 / this.BPM / 4;
    while (this.next < this.ctx.currentTime + 0.15) {
      this.play(this.step, this.next);
      this.next += spb * (this.step % 2 === 0 ? 1 + this.SWING : 1 - this.SWING);
      this.step = (this.step + 1) % 64;
    }
  },
  play(s, t) {
    const st = s % 16, ch = this.PROG[Math.floor(s / 16)], bar = 16 * 60 / this.BPM / 4;
    if (st === 0) this.chord(ch.notes, t, bar * 0.95, 0.075);
    if (st === 10) this.chord(ch.notes.slice(1), t, bar * 0.35, 0.04);
    if (st === 0 || st === 10) this.bass(ch.root + (st === 10 ? 7 : 0), t, st === 0 ? 0.9 : 0.4);
    if (st === 0 || st === 10 || (st === 15 && Math.random() < 0.3)) this.kick(t);
    if (st === 4 || st === 12) this.snare(t);
    if (st % 2 === 0) this.hat(t, st === 14 ? 0.09 : 0.03, 0.04 + Math.random() * 0.03);
    if ([2, 6, 8, 13].includes(st) && Math.random() < 0.3) this.mel(this.SCALE[Math.floor(Math.random() * this.SCALE.length)], t);
  },
  chord(notes, t, dur, vol) {
    const c = this.ctx;
    notes.forEach((m, i) => {
      const f = this.mtof(m), tt = t + i * 0.012;
      const car = c.createOscillator(), mod = c.createOscillator(), mg = c.createGain(), g = c.createGain();
      car.type = "sine"; car.frequency.value = f; mod.frequency.value = f;
      mg.gain.setValueAtTime(f * 1.6, tt); mg.gain.exponentialRampToValueAtTime(f * 0.12, tt + 0.6);
      mod.connect(mg); mg.connect(car.frequency); this.wowAmt.connect(car.detune);
      g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(vol, tt + 0.015);
      g.gain.exponentialRampToValueAtTime(vol * 0.35, tt + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, tt + dur + 0.4);
      car.connect(g); g.connect(this.keys);
      car.start(tt); mod.start(tt); car.stop(tt + dur + 0.5); mod.stop(tt + dur + 0.5);
    });
  },
  bass(m, t, dur) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = "triangle"; o.frequency.value = this.mtof(m); lp.type = "lowpass"; lp.frequency.value = 380;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); lp.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + 0.05);
  },
  kick(t) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    g.gain.setValueAtTime(0.55, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + 0.4);
  },
  snare(t) {
    const c = this.ctx, n = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    n.buffer = this.noise; bp.type = "bandpass"; bp.frequency.value = 1700; bp.Q.value = 0.7;
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    n.connect(bp); bp.connect(g); g.connect(this.out); n.start(t, Math.random()); n.stop(t + 0.22);
  },
  hat(t, dur, vol) {
    const c = this.ctx, n = c.createBufferSource(), hp = c.createBiquadFilter(), g = c.createGain();
    n.buffer = this.noise; hp.type = "highpass"; hp.frequency.value = 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(hp); hp.connect(g); g.connect(this.out); n.start(t, Math.random()); n.stop(t + dur + 0.02);
  },
  mel(m, t) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = this.mtof(m); this.wowAmt.connect(o.detune);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.connect(g); g.connect(this.out); g.connect(this.dly); o.start(t); o.stop(t + 0.75);
  }
};

function setMusic(on) {
  state.music = on; save();
  const b = $("#musicBtn"); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
  if (!Audio.ctx) return;
  const g = Audio.music.gain, t = Audio.ctx.currentTime;
  g.cancelScheduledValues(t);
  if (on) { Lofi.start(); g.setTargetAtTime(0.34, t, 0.3); }
  else { g.setTargetAtTime(0, t, 0.15); setTimeout(() => { if (!state.music) Lofi.stop(); }, 800); }
}

/* =====================================================================
   EFEITOS VISUAIS — explosão de confete, estrelas e croissants 3D
   ===================================================================== */
const FX = {
  cv: $("#fx"), parts: [], running: false, imgs: {},
  init() {
    ["estrela", "croissant"].forEach(n => { const i = new Image(); i.src = `assets/${n}.webp`; this.imgs[n] = i; });
    const rs = () => { const d = Math.min(devicePixelRatio || 1, 2); this.cv.width = innerWidth * d; this.cv.height = innerHeight * d; this.d = d; };
    addEventListener("resize", rs); rs();
  },
  COLORS: ["#ff4b4b", "#ffc93c", "#58cc02", "#2f6fd6", "#ff6bd6", "#8ab8ea", "#b9a0e3", "#ff9f1c", "#ffffff"],
  burst(x, y, big = false) {
    const k = reduced ? 0.25 : big ? 1.6 : 1;
    const rnd = (a, b) => a + Math.random() * (b - a);
    for (let i = 0; i < 150 * k; i++) {
      const a = rnd(0, Math.PI * 2), sp = rnd(250, 950);
      this.parts.push({ k: "rect", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 300, w: rnd(6, 13), h: rnd(4, 8), r: rnd(0, 6), vr: rnd(-12, 12), c: this.COLORS[i % this.COLORS.length], life: rnd(1.4, 2.6), g: 900, drag: 1.6 });
    }
    for (let i = 0; i < 40 * k; i++) {
      const a = rnd(0, Math.PI * 2), sp = rnd(600, 1500);
      this.parts.push({ k: "spark", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.25, 0.5), c: i % 2 ? "#fff6b0" : "#ffffff", g: 0, drag: 3 });
    }
    for (let i = 0; i < 26 * k; i++) {
      const a = rnd(0, Math.PI * 2), sp = rnd(200, 700);
      this.parts.push({ k: "img", img: "estrela", s: rnd(18, 46), x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 350, r: 0, vr: rnd(-6, 6), life: rnd(1.4, 2.4), g: 700, drag: 1.2 });
    }
    for (let i = 0; i < 7 * k; i++) {
      const a = rnd(Math.PI * 1.1, Math.PI * 1.9), sp = rnd(400, 900);
      this.parts.push({ k: "img", img: "croissant", s: rnd(40, 70), x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 0, vr: rnd(-5, 5), life: 2.4, g: 900, drag: 0.6 });
    }
    for (let i = 0; i < 3; i++) this.parts.push({ k: "ring", x, y, rad: 10, vrad: 900 - i * 220, life: 0.55 + i * 0.1, delay: i * 0.08, c: ["#ffc93c", "#ff4b4b", "#2f6fd6"][i] });
    if (!this.running) { this.running = true; this.last = performance.now(); requestAnimationFrame(t => this.loop(t)); }
  },
  loop(now) {
    const dt = Math.min(0.033, (now - this.last) / 1000); this.last = now;
    const c = this.cv.getContext("2d"), d = this.d;
    c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, innerWidth, innerHeight);
    this.parts = this.parts.filter(p => (p.age = (p.age || 0) + dt) < p.life + (p.delay || 0));
    for (const p of this.parts) {
      if (p.delay && p.age < p.delay) continue;
      const fade = Math.min(1, (p.life + (p.delay || 0) - p.age) / 0.4);
      c.globalAlpha = Math.max(0, fade);
      if (p.k === "ring") {
        p.rad += p.vrad * dt; c.strokeStyle = p.c; c.lineWidth = 10 * fade + 1;
        c.beginPath(); c.arc(p.x, p.y, p.rad, 0, Math.PI * 2); c.stroke(); continue;
      }
      p.vx -= p.vx * p.drag * dt; p.vy -= p.vy * p.drag * dt; p.vy += p.g * dt;
      const ox = p.x, oy = p.y; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.k === "spark") { c.strokeStyle = p.c; c.lineWidth = 3; c.beginPath(); c.moveTo(ox - p.vx * 0.03, oy - p.vy * 0.03); c.lineTo(p.x, p.y); c.stroke(); continue; }
      p.r += p.vr * dt;
      c.save(); c.translate(p.x, p.y); c.rotate(p.r);
      if (p.k === "rect") { c.fillStyle = p.c; c.scale(1, Math.cos(p.age * 9 + p.vr)); c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      else { const im = this.imgs[p.img]; if (im.complete) c.drawImage(im, -p.s / 2, -p.s / 2, p.s, p.s * (im.height / im.width || 1)); }
      c.restore();
    }
    c.globalAlpha = 1;
    if (this.parts.length) requestAnimationFrame(t => this.loop(t));
    else { this.running = false; c.clearRect(0, 0, innerWidth, innerHeight); }
  },
  celebrate(x, y, { xp = 0, combo = 0, big = false, word } = {}) {
    this.burst(x, y, big);
    if (!reduced) setTimeout(() => this.burst(innerWidth * (0.2 + Math.random() * 0.6), innerHeight * 0.3, false), 220);
    const f = h("div", "flash"); document.body.append(f); setTimeout(() => f.remove(), 800);
    const p = h("div", "praise", `<b>${esc(word || PRAISE[Math.floor(Math.random() * PRAISE.length)])}</b>` +
      (xp ? `<span>+${xp} XP</span>` : "") + (combo > 1 ? `<span class="combo">COMBO ×${combo}</span>` : ""));
    document.body.append(p); setTimeout(() => p.remove(), 1600);
    if (!reduced) {
      const em = ["🥐", "⭐", "🎉", "✨", "💥", "🇫🇷", "🥖", "🎊"];
      for (let i = 0; i < (big ? 30 : 16); i++) {
        const r = h("div", "rain", em[i % em.length]);
        r.style.left = Math.random() * 100 + "vw"; r.style.animationDuration = 1.2 + Math.random() * 1.4 + "s";
        r.style.animationDelay = Math.random() * 0.4 + "s"; r.style.fontSize = 1.4 + Math.random() * 1.6 + "rem";
        document.body.append(r); setTimeout(() => r.remove(), 3200);
      }
    }
  }
};
FX.init();

  const doneCount = LEVELS.filter(l => state.done[l.id]).length;

  const hero = h("section", "hero");

  const offs = [0, 58, 86, 58, 0, -58, -86, -58];
  let gi = 0;
  UNITS.forEach(u => {
    const sec = h("section", "unit");
    const ban = h("div", `ubanner ${u.cls}`);
    ban.innerHTML = `<div class="txt"><small>Unidade ${u.n}</small><h2>${esc(u.title)}</h2><p>${esc(u.sub)}</p></div>`;

      n.type = "button";

/* =====================================================================
   LIÇÃO
   ===================================================================== */
let L = null; // lição em andamento

function bossExercises() {
  return LEVELS.filter(l => !l.boss).map(l => l.ex[Math.floor(Math.random() * l.ex.length)]);
}

function startLevel(i) {
  const lv = LEVELS[i];
  const ex = shuffle(lv.boss ? bossExercises() : lv.ex);
  L = { i, lv, queue: ex.slice(), total: ex.length, right: 0, wrong: 0, hearts: 5, combo: 0, maxCombo: 0, xp: 0, answered: false };
  const s = h("div", "screen"); s.id = "lesson";
  s.innerHTML = `<div class="lhead"><button class="x" type="button" aria-label="Sair da lição">✕</button>
      <div class="prog" role="progressbar" aria-label="Progresso"><i></i></div>
      <span class="hearts" aria-label="Vidas">❤️ <span id="hp">5</span></span>
      <span class="lxp" id="lxp">0 XP</span></div>
    <div class="lbody" id="lbody"></div>
    <div class="lfoot" id="lfoot"><div class="lfoot-in"></div></div>`;
  $(".x", s).onclick = () => { s.remove(); L = null; renderHome(); };
  document.body.append(s);
  nextEx();
}

function nextEx() {
  const body = $("#lbody"), foot = $("#lfoot");
  $(".prog i").style.width = (L.right / L.total * 100) + "%";
  if (!L.queue.length) return finishLevel();
  const ex = L.ex = L.queue[0];
  L.answered = false; L.placed = []; L.sel = null;
  body.innerHTML = ""; body.scrollTop = 0;
  foot.className = "lfoot"; const fin = $(".lfoot-in", foot); fin.innerHTML = "";
  const check = h("button", "big", "Verificar"); check.type = "button"; check.disabled = true; check.id = "check";
  check.onclick = () => L.answered ? nextEx() : grade();
  fin.append(check);

  const title = { b: "Monte a frase em francês", f: "Complete com o bloco certo", p: "Escolha a frase correta" }[ex.t];
  body.append(h("h2", "", title));
  const ask = h("div", "ask");
  ask.innerHTML = `<img src="assets/mascote_idle.webp" alt="" id="masc"><div class="bubble"><small>Em português</small>${esc(ex.pt)}</div>`;
  body.append(ask);
  const punct = punctOf(ex.pt);

  if (ex.t === "b") {
    const ans = h("div", "answer"); ans.id = "ans"; ans.setAttribute("aria-label", "Sua frase");
    const bank = h("div", "bank");
    const all = [...parse(ex.a), ...parse(ex.x)];
    let order = shuffle(all.map((_, k) => k));
    if (order.every((v, k) => v === k)) order.reverse();
    order.forEach(k => {
      const ch = all[k], slot = h("span", "slot"), b = chunkEl(ch);
      b.onclick = () => {
        if (L.answered || b.classList.contains("used")) return;
        Audio.tap(ch.c); b.classList.add("used");
        const p = chunkEl(ch, "pop"); L.placed.push({ ch, src: b, el: p });
        p.onclick = () => {
          if (L.answered) return;
          Audio.tap(ch.c); L.placed = L.placed.filter(x => x.el !== p); p.remove(); b.classList.remove("used"); drawPunct(); updCheck();
        };
        ans.append(p); drawPunct(); updCheck();
      };
      slot.append(b); bank.append(slot);
    });
    const drawPunct = () => { $(".punct", ans)?.remove(); if (L.placed.length) ans.append(h("span", "punct", punct)); };
    body.append(ans, bank);
  }

  if (ex.t === "f") {
    const sent = h("div", "sentence");
    const parts = parse(ex.a);
    const blank = h("span", "blank"); blank.id = "blank";
    parts.forEach((ch, k) => { if (k === ex.b) sent.append(blank); else { const e = chunkEl(ch, "fixed"); e.tabIndex = -1; sent.append(e); } });
    sent.append(h("span", "punct", punct));
    const bank = h("div", "bank");
    shuffle([parts[ex.b], ...parse(ex.x)]).forEach(ch => {
      const slot = h("span", "slot"), b = chunkEl(ch);
      b.onclick = () => {
        if (L.answered) return;
        Audio.tap(ch.c);
        bank.querySelectorAll(".used").forEach(u => u.classList.remove("used"));
        b.classList.add("used"); blank.innerHTML = ""; blank.classList.add("filled");
        const p = chunkEl(ch, "pop");
        p.onclick = () => { if (L.answered) return; blank.innerHTML = ""; blank.classList.remove("filled"); b.classList.remove("used"); L.placed = []; updCheck(); };
        blank.append(p); L.placed = [{ ch }]; updCheck();
      };
      slot.append(b); bank.append(slot);
    });
    body.append(sent, bank);
  }

  if (ex.t === "p") {
    const opts = h("div", "opts");
    ex.o.forEach((s, k) => {
      const o = h("button", "opt"); o.type = "button";
      o.innerHTML = `<span class="n">${k + 1}</span>`;
      parse(s).forEach(ch => o.append(chunkEl(ch, "mini fixed")));
      o.append(h("span", "punct", punct));
      o.querySelectorAll(".chunk").forEach(c => c.tabIndex = -1);
      o.onclick = () => {
        if (L.answered) return;
        Audio.tap("V"); opts.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
        o.classList.add("sel"); L.sel = k; updCheck();
      };
      opts.append(o);
    });
    body.append(opts);
  }
  const leg = h("div", "legend mlegend");
  leg.innerHTML = Object.entries(CAT).map(([k, v]) => `<span class="lg ${k}"><i></i>${k}</span>`).join("");
  body.append(leg);
}

function updCheck() {
  const ok = L.ex.t === "p" ? L.sel != null : L.placed.length > 0;
  $("#check").disabled = !ok;
}

function grade() {
  const ex = L.ex, punct = punctOf(ex.pt);
  let correct, answerStr;
  if (ex.t === "p") { correct = L.sel === ex.ok; answerStr = ex.o[ex.ok]; }
  else {
    const target = parse(ex.a);
    answerStr = ex.a;
    if (ex.t === "b") correct = L.placed.length === target.length && L.placed.every((p, k) => p.ch.t === target[k].t);
    else correct = L.placed[0].ch.t === target[ex.b].t;
  }
  L.answered = true;
  L.queue.shift();
  const words = parse(answerStr).map(c => c.t), sentence = joinWords(words, punct);
  const foot = $("#lfoot"), fin = $(".lfoot-in", foot);
  const masc = $("#masc");

  if (correct) {
    L.right++; L.combo++; L.maxCombo = Math.max(L.maxCombo, L.combo);
    const gain = 10 + Math.min(10, (L.combo - 1) * 2);
    L.xp += gain;
    $("#lxp").textContent = L.xp + " XP"; $("#lxp").classList.remove("bump"); void $("#lxp").offsetWidth; $("#lxp").classList.add("bump");
    $(".prog i").style.width = (L.right / L.total * 100) + "%";
    masc.src = "assets/mascote_happy.webp";
    const r = ($("#ans") || $("#blank") || $(".opt.sel") || masc).getBoundingClientRect();
    Audio.explosion(false);
    FX.celebrate(r.left + r.width / 2, r.top + r.height / 2, { xp: gain, combo: L.combo });
    const s = $("#lesson"); if (!reduced) { s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake"); }
    foot.className = "lfoot ok";
  } else {
    L.wrong++; L.combo = 0; L.hearts--;
    L.queue.push(ex); // volta no fim: a lição só termina com tudo certo
    $("#hp").textContent = L.hearts; const hp = $(".hearts"); hp.classList.remove("hit"); void hp.offsetWidth; hp.classList.add("hit");
    masc.src = "assets/mascote_sad.webp";
    Audio.wrong();
    const b = $("#lbody"); b.classList.remove("wobble"); void b.offsetWidth; b.classList.add("wobble");
    foot.className = "lfoot bad";
  }

  fin.innerHTML = "";
  const fb = h("div", "fb");
  const bd = h("div", "body");
  bd.append(h("div", "ttl", correct ? esc(PRAISE[Math.floor(Math.random() * PRAISE.length)]) : "Resposta correta:"));
  const row = chunkRow(answerStr);
  row.append(h("span", "punct", punct));
  const say = h("button", "say", "🔊 Ouvir"); say.type = "button"; say.onclick = () => speak(sentence);
  row.append(say);
  bd.append(row);
  const why = ex.why || (!correct ? hintFor(answerStr) : "");
  if (why) bd.append(h("div", "why", esc(why)));
  fb.append(bd); fin.append(fb);
  const go = h("button", correct ? "big" : "big red", "Continuar"); go.type = "button"; go.id = "check";
  go.onclick = () => (L.hearts <= 0 ? failLevel() : nextEx());
  fin.append(go); go.focus({ preventScroll: true });
  if (correct) setTimeout(() => speak(sentence), 650);
}

function hintFor(str) {
  const p = parse(str), s = p.find(c => c.c === "S"), v = p.find(c => c.c === "V");
  if (s && v) return `Com o sujeito «${s.t}», o verbo fica «${v.t}». Observe a ordem dos blocos: ${p.map(c => c.c).join(" + ")}.`;
  return `Observe a ordem dos blocos: ${p.map(c => c.c).join(" + ")}.`;
}

function finishLevel() {
  const stars = L.wrong === 0 ? 3 : L.wrong <= 2 ? 2 : 1;
  const bonus = 20 + (stars === 3 ? 30 : 0);
  const gained = L.xp + bonus;
  state.xp += gained;
  state.done[L.lv.id] = Math.max(state.done[L.lv.id] || 0, stars);
  state.bestCombo = Math.max(state.bestCombo, L.maxCombo);
  const today = new Date(), td = dayStr(today), yd = dayStr(new Date(today - 864e5));
  if (state.lastDay !== td) { state.streak = state.lastDay === yd ? state.streak + 1 : 1; state.lastDay = td; }
  save();
  const acc = Math.round(L.right / (L.right + L.wrong) * 100);
  const s = $("#lesson");
  s.innerHTML = `<div class="center">
    <img class="tro" src="assets/trofeu.webp" alt="Troféu">
    <h1>${L.lv.boss ? "Champion !" : "Leçon terminée !"}</h1>
    <div class="bigstars">${[1, 2, 3].map(k => `<img src="assets/estrela.webp" alt="" class="${k <= stars ? "" : "off"}" style="animation-delay:${0.3 + k * 0.25}s">`).join("")}</div>
    <p style="margin:0;font-weight:800">${esc(L.lv.name)}${stars === 3 ? " · sem erros, bônus de +30!" : ""}</p>
    <div class="tiles">
      <div class="tile" style="--c:#e3a20b"><small>XP ganho</small><b>${gained}</b></div>
      <div class="tile" style="--c:#58cc02"><small>Precisão</small><b>${acc}%</b></div>
      <div class="tile" style="--c:#ff6b2c"><small>Combo máx.</small><b>${L.maxCombo}</b></div>
    </div>
    <div class="btncol"><button class="big" type="button" id="cont">Continuar</button></div></div>`;
  Audio.explosion(true);
  FX.celebrate(innerWidth / 2, innerHeight * 0.3, { big: true, word: L.lv.boss ? "Champion !" : "Bravo !" });
  setTimeout(() => FX.burst(innerWidth * 0.2, innerHeight * 0.5), 500);
  setTimeout(() => FX.burst(innerWidth * 0.8, innerHeight * 0.5), 800);
  $("#cont").onclick = () => { s.remove(); L = null; renderHome.scroll = true; renderHome(); };
  $("#cont").focus();
}

function failLevel() {
  const s = $("#lesson"), i = L.i;
  s.innerHTML = `<div class="center">
    <img src="assets/mascote_sad.webp" alt="Coco triste" style="width:180px">
    <h1 class="sad">Acabaram as vidas</h1>
    <p style="margin:0;font-weight:700;color:var(--muted)">Releia a dica da unidade e tente de novo. Você precisa terminar esta lição para liberar a próxima.</p>
    <div class="btncol"><button class="big" type="button" id="retry">Tentar de novo</button>
    <button class="big ghost" type="button" id="quit">Voltar à trilha</button></div></div>`;
  $("#retry").onclick = () => { s.remove(); startLevel(i); };
  $("#quit").onclick = () => { s.remove(); L = null; renderHome(); };
}

/* teclado: Enter verifica / continua */
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && L && document.activeElement?.id !== "check") { const c = $("#check"); if (c && !c.disabled) { e.preventDefault(); c.click(); } }
});

/* ---------- início ---------- */
function boot(data) {
  load();
  if (data && data.state) state = { ...state, ...data.state };
  $("#musicBtn").classList.toggle("on", false);
  renderHome();
}
window.claude?.hot?.snapshot?.(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
