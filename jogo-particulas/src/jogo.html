<title>Partícula Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* Layout: uma coluna estilo Duolingo (trilha em zigue-zague) num "quarto de estudo lo-fi à noite";
   os blocos de frase usam as cores da legenda da aula (S/V/O/AUX/ADV). Visual único e escuro por escolha. */
:root {
  color-scheme: dark;
  --bg: #17142b;
  --bg-2: #201c3a;
  --surface: #2a2550;
  --line: #3d3670;
  --fg: #f4f0ff;
  --muted: #aaa2d2;
  --ok: #58cc02;
  --ok-deep: #3f9600;
  --ok-soft: #d7ffb8;
  --bad: #ff5a5f;
  --bad-deep: #c9373c;
  --bad-soft: #ffdfe0;
  --lantern: #ffc24b;
  --lantern-deep: #d18f00;
  --ink: #1d1a33;

  /* cores da legenda da aula (preenchimento / borda / texto) */
  --s-fill: #d6e4f0; --s-edge: #6e9bc8; --s-ink: #1f3b5c;
  --v-fill: #e2efda; --v-edge: #74ad57; --v-ink: #24461a;
  --o-fill: #fff2cc; --o-edge: #d6ad3c; --o-ink: #5a4300;
  --a-fill: #e4d9f0; --a-edge: #9c7bc7; --a-ink: #3e2462;
  --d-fill: #fde9d9; --d-edge: #e0946a; --d-ink: #5e2e12;

  --f-display: "Dela Gothic One", "M PLUS Rounded 1c", system-ui, sans-serif;
  --f-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  --f-pixel: "DotGothic16", ui-monospace, monospace;

  --r: 16px;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(1200px 500px at 80% -10%, #3a2f6e 0%, transparent 60%),
    radial-gradient(800px 400px at -10% 30%, #2b2357 0%, transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: var(--step-0);
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--lantern); outline-offset: 3px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.jp { font-family: var(--f-body); font-weight: 700; }

/* ---------- barra superior ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: var(--step-1); letter-spacing: 0.01em; }
.brand span { font-family: var(--f-display); color: var(--lantern); font-size: var(--step-0); }
.stat {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--f-pixel); font-size: var(--step-1); font-variant-numeric: tabular-nums;
}
.stat svg { width: 22px; height: 22px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px;
  border-radius: 12px; border: 2px solid var(--line); background: var(--bg-2);
}
.icon-btn[aria-pressed="false"] { opacity: .5; }
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- home ---------- */
.wrap { max-width: 620px; margin: 0 auto; padding-inline: 16px; padding-block: 0 80px; }
.hero { position: relative; margin-top: 16px; border-radius: 24px; overflow: hidden;
  background:
    radial-gradient(60px 60px at 82% 22%, #fff6d6 0 40%, #ffe9a8 41%, transparent 70%),
    linear-gradient(180deg, #2e2763 0%, #4a3a86 55%, #7a5aa8 100%);
  border: 2px solid var(--line);
}
.hero::before { /* estrelas */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 8%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 55% 25%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 68% 12%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 90% 40%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 6% 45%, #fff 50%, transparent 51%);
  opacity: .8;
}
.hero canvas, .hero img.fallback { display: block; width: 100%; height: 250px; object-fit: contain; }
.hero-copy { position: absolute; left: 16px; top: 14px; right: 40%; }
.bubble {
  position: relative; display: inline-block; background: #fff; color: var(--ink);
  padding: 8px 12px; border-radius: 14px; font-weight: 700; font-size: var(--step--1);
  box-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.bubble::after { content: ""; position: absolute; bottom: -8px; left: 22px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--step-2); line-height: 1.15; margin-top: 12px; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
.hero-foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px;
  background: linear-gradient(0deg, rgba(23,20,43,.92), transparent); }

.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend .chip { font-size: 0.72rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; border: 2px solid; letter-spacing: .03em; }
.r-S { --fill: var(--s-fill); --edge: var(--s-edge); --ink-c: var(--s-ink); }
.r-V { --fill: var(--v-fill); --edge: var(--v-edge); --ink-c: var(--v-ink); }
.r-O { --fill: var(--o-fill); --edge: var(--o-edge); --ink-c: var(--o-ink); }
.r-A { --fill: var(--a-fill); --edge: var(--a-edge); --ink-c: var(--a-ink); }
.r-D { --fill: var(--d-fill); --edge: var(--d-edge); --ink-c: var(--d-ink); }
.chip { background: var(--fill); border-color: var(--edge); color: var(--ink-c); }

.music-cta {
  display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px 14px;
  border-radius: var(--r); background: var(--bg-2); border: 2px dashed var(--line); font-size: var(--step--1); color: var(--muted);
}
.music-cta button { margin-left: auto; white-space: nowrap; }

.unit { margin-top: 28px; }
.unit-banner {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r);
  color: var(--ink); background: var(--u-bg); box-shadow: 0 5px 0 var(--u-edge);
}
.unit-banner > div { min-width: 0; flex: 1; }
.unit-banner small { display: block; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .72rem; opacity: .75; }
.unit-banner h2 { font-family: var(--f-display); font-weight: 400; font-size: var(--step-1); line-height: 1.2; }
.unit-banner .jp { font-size: var(--step--1); }
.guide-btn { border: 2px solid rgba(0,0,0,.18); background: rgba(255,255,255,.5); border-radius: 12px; padding: 8px 12px; font-weight: 800; color: var(--ink); white-space: nowrap; }

.path { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 30px 0 10px; }
.node-wrap { position: relative; display: flex; flex-direction: column; align-items: center; transform: translateX(var(--dx, 0px)); }
.node {
  width: 84px; height: 84px; border: 0; padding: 0; background: none; border-radius: 50%;
  position: relative; transition: transform .12s ease; filter: drop-shadow(0 6px 0 rgba(0,0,0,.25));
}
.node img { width: 100%; height: 100%; display: block; pointer-events: none; }
.node:active { transform: translateY(4px) scale(.97); }
.node.current { animation: bob 1.6s ease-in-out infinite; }
.node.current::before {
  content: ""; position: absolute; inset: -10px; border-radius: 50%;
  border: 4px solid var(--ok); opacity: .55; animation: pulse 1.6s ease-out infinite;
}
.node-label { margin-top: 6px; text-align: center; line-height: 1.2; }
.node-label .jp { font-size: var(--step-0); display: block; }
.node-label small { color: var(--muted); font-size: .75rem; }
.node-stars { font-size: .9rem; letter-spacing: 2px; color: var(--lantern); min-height: 1em; }
.node-stars .off { color: var(--line); }
.start-tip {
  position: absolute; bottom: calc(100% + 8px); white-space: nowrap; font-weight: 800; font-size: .8rem;
  background: #fff; color: var(--ok-deep); padding: 6px 12px; border-radius: 12px; border: 2px solid var(--line);
  animation: bob 1.6s ease-in-out infinite;
}
.start-tip::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
.node-wrap.locked .node-label { opacity: .55; }
.node-wrap.boss .node { width: 104px; height: 104px; }

.reset-row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 40px; color: var(--muted); font-size: var(--step--1); }
.link-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px; }

@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes pulse { 0% { transform: scale(.9); opacity: .7; } 100% { transform: scale(1.25); opacity: 0; } }

/* ---------- botões estilo Duolingo ---------- */
.btn {
  border: 0; border-radius: 16px; padding: 14px 22px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  background: var(--b, var(--ok)); color: var(--b-ink, #fff); box-shadow: 0 5px 0 var(--b-deep, var(--ok-deep));
  transition: transform .06s, box-shadow .06s, filter .2s;
}
.btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 0 0 var(--b-deep, var(--ok-deep)); }
.btn:disabled { --b: var(--surface); --b-deep: var(--line); --b-ink: var(--muted); cursor: not-allowed; }
.btn.ghost { --b: var(--bg-2); --b-deep: var(--line); --b-ink: var(--fg); }
.btn.lantern { --b: var(--lantern); --b-deep: var(--lantern-deep); --b-ink: var(--ink); }
.btn.bad { --b: var(--bad); --b-deep: var(--bad-deep); }
.btn.small { padding: 9px 14px; font-size: .8rem; border-radius: 12px; box-shadow: 0 4px 0 var(--b-deep, var(--ok-deep)); }

/* ---------- lição ---------- */
.screen { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  background:
    radial-gradient(900px 400px at 50% -20%, #33296b 0%, transparent 70%),
    var(--bg);
}
.lesson-top { display: flex; align-items: center; gap: 12px; padding: 14px 16px; max-width: 760px; width: 100%; margin: 0 auto; }
.close-btn { width: 40px; height: 40px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; }
.close-btn svg { width: 24px; height: 24px; }
.bar { flex: 1; height: 16px; background: var(--surface); border-radius: 999px; overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--ok); border-radius: 999px; transition: width .5s cubic-bezier(.3,1.4,.5,1); }
.bar > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.35); }
.hearts { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-pixel); font-size: var(--step-1); color: var(--bad); }
.hearts svg { width: 26px; height: 26px; }
.hearts.hit { animation: shakeX .4s; }
.lesson-score { font-family: var(--f-pixel); font-size: var(--step-1); color: var(--lantern); min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }

.lesson-body { flex: 1; overflow-y: auto; overflow-x: hidden; }
.lesson-inner { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 24px; display: flex; flex-direction: column; gap: 18px; }
.ex-kind { font-family: var(--f-display); font-weight: 400; font-size: var(--step-2); line-height: 1.2; }
.ex-kind small { display: block; font-family: var(--f-body); font-weight: 700; font-size: var(--step--1); color: var(--muted); letter-spacing: .02em; }
.combo-tag { display: inline-block; margin-left: 8px; font-family: var(--f-pixel); font-size: var(--step-0); color: var(--lantern); vertical-align: middle; }
.prompt-row { display: flex; align-items: flex-end; gap: 10px; }
.mascot-box { flex: 0 0 120px; height: 130px; position: relative; }
.mascot-box canvas, .mascot-box img { width: 120px; height: 130px; display: block; }
.say { position: relative; flex: 1; min-width: 0; margin-bottom: 30px; padding: 12px 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--bg-2); font-size: var(--step-1); font-weight: 700; }
.say::before { content: ""; position: absolute; left: -10px; bottom: 16px; width: 16px; height: 16px; background: var(--bg-2); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.say .hint { display: block; font-size: var(--step--1); color: var(--muted); font-weight: 500; }

.answer {
  min-height: 132px; padding: 8px 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px;
  background-image: linear-gradient(transparent 60px, var(--line) 60px, var(--line) 62px, transparent 62px);
  background-size: 100% 66px;
}
.bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding-top: 6px; }

.chunk {
  position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 52px; min-height: 54px; padding: 14px 14px 8px; border-radius: 14px;
  border: 2px solid var(--edge); border-bottom-width: 5px;
  background: var(--fill); color: var(--ink-c);
  font-weight: 800; font-size: var(--step-1); line-height: 1.1;
  transition: transform .08s;
  animation: pop .22s cubic-bezier(.3,1.6,.5,1);
}
button.chunk:hover { transform: translateY(-2px); }
button.chunk:active { transform: translateY(2px); border-bottom-width: 3px; }
.chunk .tag { position: absolute; top: 3px; left: 7px; font-size: .58rem; font-weight: 800; letter-spacing: .06em; opacity: .75; }
.chunk.ghost { background: var(--surface); border-color: var(--surface); color: transparent; box-shadow: none; animation: none; pointer-events: none; }
.chunk.ghost .tag { opacity: 0; }
.chunk.slot { background: transparent; border-style: dashed; color: var(--edge); min-width: 64px; }
.chunk.slot.filled { background: var(--fill); border-style: solid; color: var(--ink-c); }
.chunk.static { animation: none; }
.sentence { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sentence .chunk { font-size: var(--step-0); min-height: 48px; padding: 13px 11px 6px; }

.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.opt {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 16px;
  border: 2px solid var(--line); border-bottom-width: 5px; background: var(--bg-2); font-size: var(--step-2); font-weight: 800;
}
.opt .k { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); font-size: .75rem; color: var(--muted); font-family: var(--f-pixel); flex: none; }
.opt.sel { border-color: #84d8ff; background: #1f3b5c; }
.opt:active { transform: translateY(3px); border-bottom-width: 2px; }
.opt.verb { font-size: var(--step-1); }

.lesson-foot { border-top: 2px solid var(--line); padding: 16px; }
.lesson-foot .in { max-width: 640px; margin: 0 auto; display: flex; gap: 12px; justify-content: space-between; align-items: center; }
.lesson-foot .btn { min-width: 160px; }
.mini-legend { display: flex; gap: 4px; flex-wrap: wrap; }
.mini-legend .chip { font-size: .62rem; padding: 2px 6px; }

/* folha de feedback */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,1.2,.4,1);
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); color: var(--ink); }
.sheet.show { transform: translateY(0); }
.sheet.ok { background: var(--ok-soft); --b: var(--ok); --b-deep: var(--ok-deep); }
.sheet.bad { background: var(--bad-soft); --b: var(--bad); --b-deep: var(--bad-deep); }
.sheet .in { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.sheet-head .badge { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--b); color: #fff; font-weight: 800; font-size: 1.3rem; flex: none; }
.sheet-head h3 { font-family: var(--f-display); font-weight: 400; font-size: var(--step-2); color: var(--b-deep); flex: 1; }
.sheet-head .pts { font-family: var(--f-pixel); font-size: var(--step-2); color: var(--b-deep); }
.odu { display: grid; gap: 6px; font-size: var(--step--1); }
.odu .row { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: center; }
.odu .lbl { font-weight: 800; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.odu .x { color: var(--bad-deep); font-weight: 800; }
.odu .v { color: var(--ok-deep); font-weight: 800; }
.odu .sentence .chunk { font-size: .95rem; min-height: 40px; padding: 11px 9px 4px; animation: none; border-bottom-width: 3px; }
.odu .sentence .chunk .tag { font-size: .5rem; top: 2px; left: 5px; }
.odu p { margin: 0; }
.sheet .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.listen { background: rgba(0,0,0,.06); border: 2px solid rgba(0,0,0,.12); border-radius: 12px; padding: 8px 12px; font-weight: 800; color: var(--ink); }

/* resultado */
.result-in { max-width: 520px; margin: auto; padding-inline: 16px; padding-block: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.result-in canvas, .result-in img { width: 220px; height: 220px; display: block; }
.result-in h2 { font-family: var(--f-display); font-weight: 400; font-size: var(--step-3); line-height: 1.1; color: var(--lantern); }
.result-in p { margin: 0; color: var(--muted); }
.big-stars { display: flex; gap: 10px; font-size: 3rem; line-height: 1; }
.big-stars span { color: var(--line); transform: scale(.4); opacity: 0; }
.big-stars span.on { color: var(--lantern); text-shadow: 0 4px 0 var(--lantern-deep); }
.big-stars span.in { animation: starIn .5s cubic-bezier(.3,1.8,.5,1) forwards; }
@keyframes starIn { to { transform: scale(1); opacity: 1; } }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.tile { border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
.tile b { display: block; padding: 4px; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--t, var(--lantern)); }
.tile span { display: block; padding: 10px 4px; font-family: var(--f-pixel); font-size: var(--step-2); font-variant-numeric: tabular-nums; }
.result-actions { display: flex; flex-direction: column; gap: 12px; width: 100%; }

/* guia (modal) */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(10, 8, 24, .7); }
.modal-card { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; border-radius: 22px; background: var(--bg-2); border: 2px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-card h3 { font-family: var(--f-display); font-weight: 400; font-size: var(--step-2); }
.modal-card .eyebrow { font-size: .72rem; font-weight: 800; letter-spacing: .1em; color: var(--lantern); text-transform: uppercase; }
.fmm { display: grid; gap: 8px; }
.fmm div { display: grid; grid-template-columns: 84px 1fr; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); }
.fmm b { font-size: .72rem; letter-spacing: .1em; color: var(--muted); padding-top: 3px; }
.fmm span { min-width: 0; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cmp div { padding: 10px 12px; border-radius: 12px; font-weight: 700; }
.cmp .x { background: var(--bad-soft); color: var(--bad-deep); }
.cmp .v { background: var(--ok-soft); color: var(--ok-deep); }
.tip { font-size: var(--step--1); color: var(--muted); margin: 0; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

/* toast + efeitos */
.toast { position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); z-index: 90; transform: translate(-50%, -20px); opacity: 0;
  background: var(--fg); color: var(--ink); font-weight: 800; padding: 10px 16px; border-radius: 14px; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
#fx2d, #fx3d { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 79; opacity: 0; }
.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }

function parse(str) {
  const [jp, pt] = str.split('|');
  const chunks = jp.trim().split(/\s+/).map(tok => {
    const i = tok.lastIndexOf(':');
    let r = tok.slice(i + 1);
    const target = r.endsWith('*');
    if (target) r = r.slice(0, -1);
    return { t: tok.slice(0, i), r, target };
  });
  const verb = chunks[chunks.length - 1].t;
  const base = verb.replace(/ました$/, 'ます');
  return { chunks, pt, verb, base, kind: MOV.includes(base) ? 'mov' : 'acao', past: verb.endsWith('ました') };
}

}

const Sound = {

    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    this.master = ctx.createGain(); this.master.gain.value = 0.9;

  resize() { this.dpr = Math.min(devicePixelRatio || 1, 2); this.cv.width = innerWidth * this.dpr; this.cv.height = innerHeight * this.dpr; this.ctx = this.cv.getContext('2d'); this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); },
  COLORS: ['#d6e4f0', '#e2efda', '#fff2cc', '#e4d9f0', '#fde9d9', '#58cc02', '#ffc24b', '#ff5a5f', '#84d8ff', '#ff8fab'],
  EMOJI: ['✨', '⭐', '🎉', '🌸', '💥', '🔥', '🎊', '💯', '🏮', '🍡'],
  WORDS: ['すごい！', 'せいかい！', 'やった！', 'いいね！', 'かんぺき！', 'さいこう！'],
  burst(x, y, power = 1, word) {
    if (REDUCED) power = Math.min(power, 0.5);
    const P = this.parts;
    for (let i = 0; i < 90 * power; i++) { const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 12 * Math.sqrt(power); P.push({ k: 'conf', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, rot: Math.random() * 6, vr: Math.random() * 0.4 - 0.2, c: pick(this.COLORS), life: 1.6 + Math.random() }); }
    for (let i = 0; i < 40 * power; i++) { const a = Math.random() * Math.PI * 2, s = 8 + Math.random() * 16; P.push({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, c: pick(['#fff', '#ffc24b', '#fff2cc']), life: 0.5 + Math.random() * 0.4 }); }
    for (let i = 0; i < 12 * power; i++) { const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 9; P.push({ k: 'emoji', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 7, e: pick(this.EMOJI), size: 22 + Math.random() * 26, rot: 0, vr: Math.random() * 0.2 - 0.1, life: 1.4 + Math.random() * 0.8 }); }
    for (let i = 0; i < 2 + power; i++) P.push({ k: 'ring', x, y, r: 10, vr: 9 + i * 5, c: pick(this.COLORS), life: 0.6 + i * 0.12, max: 0.6 + i * 0.12 });
    P.push({ k: 'rays', x, y, life: 0.7, max: 0.7, rot: Math.random() });
    P.push({ k: 'word', x: innerWidth / 2, y: Math.max(120, y - 120), t: word || pick(this.WORDS), life: 1.3, max: 1.3, c: pick(['#ffc24b', '#58cc02', '#ff8fab', '#84d8ff']) });
    if (!this.running) { this.running = true; requestAnimationFrame(() => this.loop()); }
  },
  rain(power = 2) { // chuva de confete na conclusão do nível
    for (let i = 0; i < 160 * power; i++) this.parts.push({ k: 'conf', x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight, vx: Math.random() * 2 - 1, vy: 2 + Math.random() * 4, w: 7 + Math.random() * 8, h: 4 + Math.random() * 6, rot: Math.random() * 6, vr: Math.random() * 0.3 - 0.15, c: pick(this.COLORS), life: 4 + Math.random() * 2 });
    if (!this.running) { this.running = true; requestAnimationFrame(() => this.loop()); }
  },
  loop() {
    const c = this.ctx; c.clearRect(0, 0, innerWidth, innerHeight);
    this.parts = this.parts.filter(p => {
      p.life -= 1 / 60;
      if (p.life <= 0) return false;
      if (p.k === 'conf') { p.vy += 0.35; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.scale(1, Math.cos(p.rot * 3)); c.fillStyle = p.c; c.globalAlpha = Math.min(1, p.life); c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore(); }
      else if (p.k === 'spark') { p.x += p.vx; p.y += p.vy; p.vx *= 0.9; p.vy *= 0.9; c.strokeStyle = p.c; c.globalAlpha = Math.min(1, p.life * 2); c.lineWidth = 3; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 2.5, p.y - p.vy * 2.5); c.stroke(); }
      else if (p.k === 'emoji') { p.vy += 0.28; p.x += p.vx; p.y += p.vy; p.rot += p.vr; c.save(); c.globalAlpha = Math.min(1, p.life); c.translate(p.x, p.y); c.rotate(p.rot); c.font = `${p.size}px serif`; c.textAlign = 'center'; c.fillText(p.e, 0, 0); c.restore(); }
      else if (p.k === 'ring') { p.r += p.vr; c.globalAlpha = p.life / p.max; c.strokeStyle = p.c; c.lineWidth = 8 * p.life / p.max; c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.stroke(); }
      else if (p.k === 'rays') { const k = 1 - p.life / p.max; c.save(); c.translate(p.x, p.y); c.rotate(p.rot + k); c.globalAlpha = (1 - k) * 0.5; c.fillStyle = '#fff2cc'; for (let i = 0; i < 14; i++) { c.rotate(Math.PI * 2 / 14); c.beginPath(); c.moveTo(0, 0); c.lineTo(-14, 60 + k * 500); c.lineTo(14, 60 + k * 500); c.fill(); } c.restore(); }
      else if (p.k === 'word') {
        const k = 1 - p.life / p.max, s = k < 0.15 ? k / 0.15 * 1.25 : 1.25 - Math.min(0.25, (k - 0.15));
        c.save(); c.translate(p.x, p.y - k * 40); c.scale(s, s); c.rotate(Math.sin(k * 20) * 0.04);
        c.globalAlpha = k > 0.75 ? (1 - k) / 0.25 : 1; c.font = `400 ${Math.min(72, innerWidth / 7)}px "Dela Gothic One", sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.lineWidth = 10; c.strokeStyle = '#1d1a33'; c.strokeText(p.t, 0, 0); c.fillStyle = p.c; c.fillText(p.t, 0, 0); c.restore();
      }
      c.globalAlpha = 1;
      return p.y < innerHeight + 80 || p.k !== 'conf';
    });
    if (this.parts.length) requestAnimationFrame(() => this.loop()); else { this.running = false; c.clearRect(0, 0, innerWidth, innerHeight); }
  }
};
function flash(color) {

  requestAnimationFrame(() => { f.style.transition = 'opacity .5s'; f.style.opacity = '0'; });
}

}
let toastTimer;

const DX = [0, 46, 72, 46, 0, -46, -72, -46];
function renderHome() {
  $('#statXp').textContent = state.xp;
  $('#statStars').textContent = Object.values(state.done).reduce((a, b) => a + b, 0);
  const box = $('#units'); box.innerHTML = '';
  let idx = 0;
  const currentIdx = LEVELS.findIndex((l, i) => isUnlocked(i) && !state.done[l.id]);
  UNITS.forEach(u => {
    const sec = document.createElement('section'); sec.className = 'unit';
    sec.innerHTML = `<div class="unit-banner" style="--u-bg:${u.bg};--u-edge:${u.edge}"><div><small>${u.eyebrow}</small><h2>${esc(u.title)}</h2><span class="jp">${u.jp}</span></div><button class="guide-btn" data-guide="${u.id}">Guia</button></div><div class="path"></div>`;
    const path = sec.querySelector('.path');
    u.levels.forEach((l, j) => {
      const i = idx++, done = state.done[l.id], unlocked = isUnlocked(i), cur = i === currentIdx;
      const st = done ? 'done' : unlocked ? 'current' : 'locked';
      const icon = done ? ASSETS.no_feito : unlocked ? ASSETS.no_ativo : ASSETS.no_bloqueado;
      const w = document.createElement('div');
      w.className = `node-wrap ${unlocked ? '' : 'locked'} ${l.boss ? 'boss' : ''}`; w.style.setProperty('--dx', DX[j % DX.length] + 'px');
      const stars = done ? '★'.repeat(done) + `<span class="off">${'★'.repeat(3 - done)}</span>` : '';
      w.innerHTML = `${cur ? '<span class="start-tip">COMEÇAR</span>' : ''}<button class="node ${cur ? 'current' : ''}" data-i="${i}" aria-label="Nível ${i + 1}: ${esc(l.name)} (${l.pt}) ${st === 'locked' ? 'bloqueado' : st === 'done' ? 'concluído' : 'disponível'}"><img src="data:image/png;base64,${icon}" alt=""></button><div class="node-label"><span class="jp">${l.name}</span><small>${l.pt}${state.best[l.id] ? ' · ' + state.best[l.id] + ' pts' : ''}</small></div><div class="node-stars">${stars}</div>`;
      path.appendChild(w);
    });
    box.appendChild(sec);
  });
  const cur = box.querySelector('.node.current');
  return cur;
}
$('#units').addEventListener('click', e => {
  Sound.init(); maybeStartMusic();
  const g = e.target.closest('[data-guide]');
  if (g) { openGuide(UNITS.find(u => u.id === g.dataset.guide)); return; }
  const n = e.target.closest('.node'); if (!n) return;
  const i = +n.dataset.i, l = LEVELS[i];
  if (!isUnlocked(i)) { Sound.wrong(); shake(n.parentElement); toast(`Conclua "${LEVELS[i - 1].name}" para desbloquear este nível.`); return; }
  Sound.tap();
  const first = l.unit.levels[0] === l && !state.seen[l.unit.id];
  if (first) openGuide(l.unit, l); else startLevel(l);
});

/* =====================================================================
   LIÇÃO
   ===================================================================== */
let L = null;
const FAKES = { mov: ['を', 'で', 'が'], acao: ['に', 'が', 'で'] };
const WRONG_P = {
  mov: { を: 'を marca o objeto direto de um verbo de ação. Destino de movimento leva に.', で: 'で marca o meio (バスで) ou o lugar onde algo acontece. O ponto de chegada leva に.', が: 'が marca o sujeito. O destino do movimento leva に.', へ: '' },
  acao: { に: 'に marca destino ou horário. O objeto que sofre a ação leva を.', で: 'で marca o meio ou o lugar da ação. O objeto direto leva を.', が: 'が marca o sujeito. O objeto direto sempre leva を (Lição 6: ✗ パンがたべました).' }
};
const FORMA = { mov: 'Lugar に いきます／きます／かえります', acao: 'Objeto を 動詞（verbo de ação）' };

function buildExercises(level) {
  const pool = shuffle(level.pool).map(parse);
  return level.types.map((type, i) => ({ type, s: pool[i % pool.length] }));
}
function startLevel(level) {
  Sound.init(); maybeStartMusic();
  L = { level, queue: buildExercises(level), hearts: 3, score: 0, streak: 0, maxStreak: 0, errors: 0, done: 0, answered: false };
  L.total = L.queue.length;
  $('#lesson').hidden = false; document.body.style.overflow = 'hidden';
  $('#heartsN').textContent = L.hearts; $('#lessonScore').textContent = 0; $('#bar').style.width = '0%';
  next();
}
function next() {
  hideSheet();
  if (!L.queue.length) return finishLevel(true);
  L.cur = L.queue.shift(); L.answered = false; L.choice = null;
  const { type, s } = L.cur;
  const box = $('#exercise');
  const kinds = { montar: ['Monte a frase', 'Toque nos blocos na ordem certa'], particula: ['Complete com a partícula', 'に ou を? Olhe para o verbo no final'], verbo: ['Escolha o verbo', 'Qual verbo combina com a partícula?'] };
  const combo = L.streak >= 2 ? `<span class="combo-tag">COMBO x${L.streak}</span>` : '';
  box.innerHTML = `<h2 class="ex-kind">${kinds[type][0]}${combo}<small>${kinds[type][1]}</small></h2>
    <div class="prompt-row"><div class="mascot-box" id="mascotBox"></div><div class="say">${esc(s.pt)}<span class="hint">${type === 'montar' ? 'Traduza montando os blocos' : 'Tradução da frase'}</span></div></div>
    <div id="area"></div>`;
  if (window.__lessonMascot) $('#mascotBox').appendChild(window.__lessonMascot);
  if (type === 'montar') setupMontar(s); else if (type === 'particula') setupParticula(s); else setupVerbo(s);
  $('#btnCheck').disabled = true; $('#btnCheck').textContent = 'Verificar';
  $('.lesson-body').scrollTop = 0;
}

/* --- tipo 1: montar a frase com blocos (chunking) --- */
function setupMontar(s) {
  const fakes = shuffle(FAKES[s.kind]).slice(0, L.level.distract).map(t => ({ t, r: 'A', fake: true }));
  L.tiles = shuffle([...s.chunks.map(c => ({ ...c })), ...fakes]).map((c, i) => Object.assign(c, { key: i }));
  L.placed = [];
  $('#area').innerHTML = `<div class="answer" id="answer" aria-label="Sua frase"></div><div class="bank" id="bank" aria-label="Blocos disponíveis"></div>`;
  drawMontar();
  $('#area').onclick = e => {
    if (L.answered) return;
    const b = e.target.closest('button.chunk'); if (!b) return;
    const k = +b.dataset.key;
    if (b.dataset.where === 'bank') L.placed.push(k); else L.placed = L.placed.filter(x => x !== k);
    Sound.tap(); drawMontar();
  };
}
function drawMontar() {
  const tileBtn = (c, where) => `<button class="chunk r-${c.r}" data-key="${c.key}" data-where="${where}"><span class="tag">${ROLE_TAG[c.r]}</span>${esc(c.t)}</button>`;
  $('#answer').innerHTML = L.placed.map(k => tileBtn(L.tiles[k], 'answer')).join('');
  $('#bank').innerHTML = L.tiles.map(c => L.placed.includes(c.key) ? `<span class="chunk ghost r-${c.r}"><span class="tag">${ROLE_TAG[c.r]}</span>${esc(c.t)}</span>` : tileBtn(c, 'bank')).join('');
  $('#btnCheck').disabled = L.placed.length === 0;
}
function judgeMontar(s) {
  const ans = L.placed.map(k => L.tiles[k]);
  const fake = ans.find(c => c.fake);
  if (fake) return { ok: false, why: 'particle', p: fake.t, ans };
  if (ans.length !== s.chunks.length) return { ok: false, why: 'missing', ans };
  const core = a => a.filter(c => c.r !== 'D').map(c => c.t).join('|');
  const firstO = ans.findIndex(c => c.r === 'O');
  const okOrder = ans[ans.length - 1].r === 'V' && core(ans) === core(s.chunks) &&
    !ans.some((c, i) => c.r === 'D' && (ans[i + 1] && ans[i + 1].r === 'A')) &&
    !ans.some((c, i) => c.r === 'D' && i > firstO);
  return okOrder ? { ok: true, ans } : { ok: false, why: 'order', ans };
}

/* --- tipo 2: escolher a partícula --- */
function setupParticula(s) {
  const opts = ['に', 'を', 'で', 'が'];
  $('#area').innerHTML = `<div class="sentence" id="sent">${s.chunks.map(c => c.target ? `<span class="chunk static r-A slot" id="slot"><span class="tag">AUX</span>？</span>` : chunkHTML(c)).join('')}</div>
    <div class="options" id="opts">${opts.map((o, i) => `<button class="opt" data-v="${o}"><span class="k">${i + 1}</span><span class="jp">${o}</span></button>`).join('')}</div>`;
  $('#opts').onclick = e => { const b = e.target.closest('.opt'); if (b) choose(b.dataset.v); };
}
/* --- tipo 3: escolher o verbo --- */
function setupVerbo(s) {
  const other = s.kind === 'mov' ? ACAO : MOV;
  const conj = v => s.past ? v.replace(/ます$/, 'ました') : v;
  const opts = shuffle([s.verb, ...shuffle(other).slice(0, 2).map(conj)]);
  $('#area').innerHTML = `<div class="sentence" id="sent">${s.chunks.map(c => c.r === 'V' ? `<span class="chunk static r-V slot" id="slot"><span class="tag">V</span>？</span>` : chunkHTML(c)).join('')}</div>
    <div class="options" id="opts">${opts.map((o, i) => `<button class="opt verb" data-v="${o}"><span class="k">${i + 1}</span><span class="jp">${o}</span></button>`).join('')}</div>`;
  $('#opts').onclick = e => { const b = e.target.closest('.opt'); if (b) choose(b.dataset.v); };
}
function choose(v) {
  if (L.answered) return;
  L.choice = v; Sound.tap();
  document.querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o.dataset.v === v));
  const slot = $('#slot'); slot.classList.add('filled'); slot.innerHTML = `<span class="tag">${L.cur.type === 'verbo' ? 'V' : 'AUX'}</span>${esc(v)}`;
  $('#btnCheck').disabled = false;
}

/* --- verificação e feedback --- */
function check() {
  if (!L || L.answered) return;
  const { type, s } = L.cur;
  let res;
  if (type === 'montar') res = judgeMontar(s);
  else if (type === 'particula') { const want = s.chunks.find(c => c.target).t; res = L.choice === want ? { ok: true } : { ok: false, why: 'particle', p: L.choice }; }
  else { res = L.choice === s.verb ? { ok: true } : { ok: false, why: 'verb', v: L.choice }; }
  L.answered = true;
  if (res.ok) onCorrect(s); else onWrong(s, res);
}
function onCorrect(s) {
  L.streak++; L.maxStreak = Math.max(L.maxStreak, L.streak); L.done++;
  const mult = 1 + Math.min(L.streak - 1, 8) * 0.25;
  const pts = Math.round(100 * mult);
  L.score += pts;
  $('#lessonScore').textContent = L.score;
  $('#bar').style.width = (L.done / L.total * 100) + '%';
  // explosão sonora + "poluição visual"
  const area = $('#area').getBoundingClientRect();
  const x = area.left + area.width / 2, y = area.top + Math.min(area.height, 200) / 2;
  const power = Math.min(1 + (L.streak - 1) * 0.35, 3);
  Sound.explosion(power);
  FX.burst(x, y, power, L.streak >= 3 ? `COMBO x${L.streak}！` : null);
  burst3D(x, y, Math.round(6 + power * 5));
  flash(pick(['#fff2cc', '#e2efda', '#d6e4f0', '#e4d9f0']));
  shake($('#lesson'), power > 1.8);
  if (lessonRig) lessonRig.jump();
  showSheet(true, s, pts, mult);
}
function onWrong(s, res) {
  L.streak = 0; L.errors++; L.hearts--;
  $('#heartsN').textContent = Math.max(0, L.hearts);
  const h = $('#hearts'); h.classList.remove('hit'); void h.offsetWidth; h.classList.add('hit');
  L.queue.push({ type: L.cur.type, s }); // a frase volta no fim da lição
  Sound.wrong(); flash('#ff5a5f');
  const a = $('#area'); a.classList.remove('wrong-shake'); void a.offsetWidth; a.classList.add('wrong-shake');
  if (lessonRig) lessonRig.no();
  showSheet(false, s, 0, 1, res);
}
function explain(s, res) {
  if (res.why === 'particle') return (WRONG_P[s.kind][res.p]) || 'Essa partícula não serve aqui.';
  if (res.why === 'verb') {
    const isMov = MOV.includes(res.v.replace(/ました$/, 'ます'));
    return isMov ? `${res.v} é verbo de movimento: pediria um destino com に. Aqui há um objeto com を, então o verbo é de ação.` : `${res.v} é verbo de ação: pede objeto com を. Aqui há um destino com に, então o verbo é de movimento (いきます・きます・かえります).`;
  }
  if (res.why === 'missing') return 'Faltou bloco. Use todos os blocos da frase (só sobram as partículas que não servem).';
  return 'Ordem SOV: Sujeito は → tempo/meio → complemento + partícula → verbo no final.';
}
function showSheet(ok, s, pts, mult, res) {
  const correct = `<div class="sentence">${s.chunks.map(c => chunkHTML(c)).join('')}</div>`;
  let body;
  if (ok) {
    body = `<div class="odu"><div class="row"><span class="lbl">Frase</span>${correct}</div><div class="row"><span class="lbl">Forma</span><span class="jp">${FORMA[s.kind]}</span></div></div>`;
  } else {
    let mine = '';
    if (res.ans) mine = res.ans.map(c => chunkHTML(c)).join('');
    else mine = s.chunks.map(c => (L.cur.type === 'particula' && c.target) || (L.cur.type === 'verbo' && c.r === 'V') ? chunkHTML({ t: L.choice, r: c.r }) : chunkHTML(c)).join('');
    body = `<div class="odu">
      <div class="row"><span class="lbl x">✗ Errado</span><div class="sentence">${mine}</div></div>
      <div class="row"><span class="lbl v">✓ Correto</span>${correct}</div>
      <p><b>Erro comum:</b> ${esc(explain(s, res))}</p></div>`;
  }
  const title = ok ? pick(['Excelente!', 'Mandou bem!', 'Perfeito!', 'Isso aí!']) : 'Quase lá!';
  $('#sheetIn').innerHTML = `<div class="sheet-head"><span class="badge">${ok ? '✓' : '✗'}</span><h3>${title}</h3>${ok ? `<span class="pts">+${pts}${mult > 1 ? ` <small>x${mult}</small>` : ''}</span>` : ''}</div>
    ${body}
    <div class="actions"><button class="listen" id="btnListen">Ouvir frase</button><button class="btn" id="btnNext">Continuar</button></div>`;
  const sh = $('#sheet'); sh.className = 'sheet ' + (ok ? 'ok' : 'bad');
  requestAnimationFrame(() => sh.classList.add('show'));
  $('#btnListen').onclick = () => speak(sentenceText(s.chunks));
  $('#btnNext').onclick = afterFeedback;
  setTimeout(() => $('#btnNext') && $('#btnNext').focus(), 300);
}
function hideSheet() { $('#sheet').classList.remove('show'); }
function afterFeedback() {
  if (L.hearts <= 0) return finishLevel(false);
  next();
}
$('#btnCheck').onclick = check;
$('#btnQuit').onclick = () => { quitLesson(); };
function quitLesson() { L = null; hideSheet(); $('#lesson').hidden = true; document.body.style.overflow = ''; renderHome(); }

document.addEventListener('keydown', e => {
  if (!$('#modal').hidden && e.key === 'Escape') { $('#modal').hidden = true; return; }
  if (!L || $('#lesson').hidden) return;
  if (e.key === 'Enter') {
    e.preventDefault();
    if (L.answered) afterFeedback(); else if (!$('#btnCheck').disabled) check();
  } else if (/^[1-4]$/.test(e.key) && !L.answered) {
    const o = document.querySelectorAll('.opt')[+e.key - 1]; if (o) choose(o.dataset.v);
  } else if (e.key === 'Escape') quitLesson();
});

/* =====================================================================
   RESULTADO
   ===================================================================== */
function finishLevel(won) {
  hideSheet();
  const lv = L.level;
  $('#lesson').hidden = true; $('#result').hidden = false;
  const box = $('#resultIn');
  if (!won) {
    Sound.sad();
    box.innerHTML = `<div id="resArt"></div><h2>Os corações acabaram</h2><p>Você fez ${L.score} pontos. Revise o guia da unidade e tente de novo: o nível só libera o próximo quando for concluído.</p>
      <div class="result-actions"><button class="btn" id="rRetry">Tentar de novo</button><button class="btn ghost" id="rGuide">Ver guia</button><button class="btn ghost" id="rHome">Voltar à trilha</button></div>`;
    if (window.__lessonMascot) { $('#resArt').appendChild(window.__lessonMascot); window.__lessonMascot.style.width = '160px'; window.__lessonMascot.style.height = '170px'; if (lessonRig) lessonRig.no(); }
    $('#rRetry').onclick = () => { $('#result').hidden = true; resetMascotSize(); startLevel(lv); };
    $('#rGuide').onclick = () => openGuide(lv.unit);
    $('#rHome').onclick = () => { $('#result').hidden = true; resetMascotSize(); document.body.style.overflow = ''; L = null; renderHome(); };
    $('#rRetry').focus();
    return;
  }
  const stars = L.errors === 0 ? 3 : L.errors <= 2 ? 2 : 1;
  const bonus = L.hearts * 50 + (L.errors === 0 ? 300 : 0);
  const total = L.score + bonus;
  const firstClear = !state.done[lv.id];
  state.done[lv.id] = Math.max(state.done[lv.id] || 0, stars);
  state.best[lv.id] = Math.max(state.best[lv.id] || 0, total);
  state.xp += total; save();
  const acc = Math.round(L.total / (L.total + L.errors) * 100);
  const i = LEVELS.indexOf(lv), nextLv = LEVELS[i + 1];
  const unitDone = !nextLv || nextLv.unit !== lv.unit;
  const head = lv.boss ? 'Partículas dominadas!' : unitDone ? 'Unidade concluída!' : 'Nível concluído!';
  const sub = lv.boss ? 'Você completou toda a trilha de に e を. おめでとう！' : nextLv && firstClear ? `Novo nível liberado: ${nextLv.name} (${nextLv.pt}).` : 'Pontuação registrada.';
  box.innerHTML = `<div id="resArt"></div><h2>${head}</h2>
    <div class="big-stars">${[0, 1, 2].map(k => `<span class="${k < stars ? 'on' : ''}">★</span>`).join('')}</div>
    <p>${esc(sub)}</p>
    <div class="tiles">
      <div class="tile" style="--t:var(--lantern)"><b>Pontos</b><span>${total}</span></div>
      <div class="tile" style="--t:var(--ok)"><b>Precisão</b><span>${acc}%</span></div>
      <div class="tile" style="--t:var(--d-edge)"><b>Combo</b><span>x${L.maxStreak}</span></div>
    </div>
    <p>${L.score} de acertos + ${L.hearts * 50} de corações${L.errors === 0 ? ' + 300 de lição perfeita' : ''}</p>
    <div class="result-actions">${nextLv ? '<button class="btn" id="rNext">Próximo nível</button>' : ''}<button class="btn ghost" id="rHome">Voltar à trilha</button></div>`;
  if (window.__trophy) $('#resArt').appendChild(window.__trophy);
  document.querySelectorAll('.big-stars span').forEach((s, k) => setTimeout(() => { s.classList.add('in'); if (k < stars) Sound.tap(); }, 400 + k * 280));
  Sound.fanfare(); FX.rain(lv.boss ? 3 : 1.5);
  setTimeout(() => { const r = $('#resArt').getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height / 2, 2.5, lv.boss ? 'おめでとう！' : 'クリア！'); burst3D(r.left + r.width / 2, r.top + r.height / 2, 24); }, 650);
  const home = () => { $('#result').hidden = true; document.body.style.overflow = ''; L = null; const cur = renderHome(); if (cur) cur.scrollIntoView({ block: 'center', behavior: REDUCED ? 'auto' : 'smooth' }); };
  $('#rHome').onclick = home;
  if (nextLv) $('#rNext').onclick = () => { $('#result').hidden = true; const first = nextLv.unit.levels[0] === nextLv && !state.seen[nextLv.unit.id]; renderHome(); if (first) openGuide(nextLv.unit, nextLv); else startLevel(nextLv); };
  ($('#rNext') || $('#rHome')).focus();
}
function resetMascotSize() { if (window.__lessonMascot) { window.__lessonMascot.style.width = ''; window.__lessonMascot.style.height = ''; } }

/* =====================================================================
   CONTROLES DE SOM + reset
   ===================================================================== */
function syncToggles() {
  $('#btnMusic').setAttribute('aria-pressed', String(state.music));
  $('#btnSfx').setAttribute('aria-pressed', String(state.sfx));
  $('#btnMusicCta').textContent = Sound.playing ? 'Pausar música' : 'Tocar música';
}
function maybeStartMusic() { if (state.music) { Sound.startMusic(); syncToggles(); } }
function toggleMusic(force) {
  Sound.init();
  state.music = typeof force === 'boolean' ? force : !Sound.playing;
  if (state.music) Sound.startMusic(); else Sound.stopMusic();
  save(); syncToggles();
}
$('#btnMusic').onclick = () => toggleMusic();
$('#btnMusicCta').onclick = () => toggleMusic();
$('#btnSfx').onclick = () => { Sound.init(); state.sfx = !state.sfx; save(); syncToggles(); Sound.tap(); };
document.addEventListener('pointerdown', () => { if (!Sound.ctx) { Sound.init(); maybeStartMusic(); } }, { once: true });
function bindReset() {
  $('#btnReset').onclick = () => {
    $('#resetRow').innerHTML = `<span>Apagar estrelas, pontos e níveis liberados?</span><button class="btn small bad" id="rsYes">Apagar</button><button class="btn small ghost" id="rsNo">Cancelar</button>`;
    $('#rsYes').onclick = () => { state.done = {}; state.best = {}; state.xp = 0; state.seen = {}; save(); $('#resetRow').innerHTML = '<button class="link-btn" id="btnReset">Apagar meu progresso</button>'; bindReset(); renderHome(); toast('Progresso apagado.'); };
    $('#rsNo').onclick = () => { $('#resetRow').innerHTML = '<button class="link-btn" id="btnReset">Apagar meu progresso</button>'; bindReset(); };
  };
}
bindReset();

/* =====================================================================
   INÍCIO
   ===================================================================== */
function start(data) {
  load(data);
  FX.resize(); addEventListener('resize', () => FX.resize());
  renderHome(); syncToggles();
  loadModels().then(() => { try { build3D(); } catch (e) { console.warn('3D indisponível', e); useFallbackImages(); } requestAnimationFrame(frame); });
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ state }));
}
if (location.hash === '#debug') window.__pq = { lesson: () => L, LEVELS };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
