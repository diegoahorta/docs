name: Aprenda Python — APK e Debian

# Compila o APK offline a cada alteração em aprenda-python/ e publica uma
# Release quando uma tag "apk-v*" é enviada (ex.: git tag apk-v1.0.0 && git push --tags).
on:
  push:
    paths:
      - 'aprenda-python/**'
      - '.github/workflows/aprenda-python-apk.yml'
    tags:
      - 'apk-v*'
  pull_request:
    paths:
      - 'aprenda-python/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: aprenda-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ferramentas do Android SDK (pacotes do Ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt dalvik-exchange zipalign apksigner android-sdk-platform-23

      - name: Chave de assinatura (opcional, via secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "Sem secret APK_KEYSTORE_BASE64: uma chave temporária será gerada."
          fi

      - name: Compilar APK (baixa o Pyodide, valida o conteúdo e empacota)
        env:
          KEYSTORE_SENHA: ${{ secrets.APK_KEYSTORE_SENHA || 'aprenda-python' }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS || 'aprenda-python' }}
          VERSAO_CODIGO: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/apk-v* ]]; then export VERSAO_NOME="${GITHUB_REF#refs/tags/apk-v}"; fi
          bash tools/build-apk.sh

      - name: Compilar pacote Debian (.deb)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/apk-v* ]]; then export VERSAO_NOME="${GITHUB_REF#refs/tags/apk-v}"; fi
          PULAR_VALIDACAO=1 bash tools/build-deb.sh
          sudo apt-get install -y -qq lintian
          lintian --no-tag-display-limit build/*.deb || true

      - uses: actions/upload-artifact@v4
        with:
          name: AprendaPython-apk
          path: aprenda-python/build/AprendaPython.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AprendaPython-debian
          path: aprenda-python/build/*.deb

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/apk-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aprenda-python/build/AprendaPython.apk
            aprenda-python/build/*.deb
          body: |
            APK do **Aprenda Python** — curso de Python do zero ao avançado, 100% offline.
            - **Android (7.0+):** baixe `AprendaPython.apk` e permita a instalação de fontes desconhecidas.
            - **Debian/Ubuntu:** baixe o `.deb` e rode `sudo apt install ./aprenda-python_*_all.deb`.
