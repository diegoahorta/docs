name: ODU Reader (Android)

on:
  push:
    paths:
      - "odu-reader/**"
      - ".github/workflows/odu-reader-android.yml"
  pull_request:
    paths:
      - "odu-reader/**"
  workflow_dispatch:

concurrency:
  group: odu-reader-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: odu-reader

jobs:
  build:
    name: Build, unit tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew --stacktrace assembleDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Release build (R8, unsigned) and App Bundle
        run: ./gradlew assembleRelease bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: odu-reader/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release outputs (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned
          path: |
            odu-reader/app/build/outputs/apk/release/*.apk
            odu-reader/app/build/outputs/bundle/release/*.aab
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: odu-reader/app/build/reports/tests/

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: odu-reader
          script: ./gradlew connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: odu-reader/app/build/reports/androidTests/
