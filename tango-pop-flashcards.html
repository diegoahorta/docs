<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Tango Pop!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
/* Layout: kawaii study app. One centred 760px column: sticky pastel header, then a single "screen" (home → deck → study mode). Cards are big rounded candy tiles. */
:root{
  --bg:#fff4fa;        /* strawberry milk */
  --card:#ffffff;
  --ink:#4a3553;       /* plum ink */
  --muted:#9a86a6;
  --line:#f3dcea;
  --pink:#ff7eb6; --mint:#5fd3ad; --sky:#6cc2ff; --lemon:#ffd75e; --lav:#b997ff; --peach:#ffa57a;
  --pinkS:#ffe1ef; --mintS:#d9f7ec; --skyS:#dff1ff; --lemonS:#fff3cc; --lavS:#efe6ff; --peachS:#ffe8dc;
  --shadow:0 6px 0 rgba(74,53,83,.10);
  --f-pop:"Mochiy Pop One","M PLUS Rounded 1c",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211a2a;--card:#2e2439;--ink:#fbeefe;--muted:#b9a6c4;--line:#45385a;
  --pinkS:#4a2a3e;--mintS:#1f4339;--skyS:#22394d;--lemonS:#463d22;--lavS:#372c55;--peachS:#4a3128;--shadow:0 6px 0 rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#211a2a;--card:#2e2439;--ink:#fbeefe;--muted:#b9a6c4;--line:#45385a;
  --pinkS:#4a2a3e;--mintS:#1f4339;--skyS:#22394d;--lemonS:#463d22;--lavS:#372c55;--peachS:#4a3128;--shadow:0 6px 0 rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(var(--line) 1.6px,transparent 1.8px);background-size:22px 22px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0}
.logo{font-family:var(--f-pop);font-size:clamp(22px,5vw,30px);line-height:1;margin-right:auto;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.logo .t{color:var(--pink)}.logo .p{color:var(--sky)}.logo .x{color:var(--lemon)}
.logo small{display:block;font-family:var(--f-body);font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.ibtn{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 10px;font-weight:800;box-shadow:var(--shadow)}
.ibtn[aria-pressed="true"]{background:var(--lavS);border-color:var(--lav)}
.screen{display:flex;flex-direction:column;gap:16px;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.97);opacity:0}}
h1,h2{margin:0;font-family:var(--f-pop);font-weight:400;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(26px,6vw,38px)}h2{font-size:22px}
.muted{color:var(--muted)}
.hello{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center;background:var(--card);border-radius:28px;padding:18px 20px;box-shadow:var(--shadow);border:2px solid var(--line)}
.hello img{width:120px;height:120px;object-fit:contain;animation:bounce 2.4s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-6px) rotate(-3deg)}}
.hello .kao{font-weight:800;color:var(--pink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:20px;padding:10px 12px;border:2px solid var(--line);box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font-family:var(--f-pop);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:800;color:var(--muted)}
.decks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.deck{border:0;text-align:left;border-radius:26px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;min-width:0;transition:transform .15s}
.deck:hover{transform:translateY(-3px) rotate(-.5deg)}
.deck .ic{font-size:34px;line-height:1}
.deck .nm{font-family:var(--f-pop);font-size:22px;line-height:1.1}
.deck .sb{font-weight:800;font-size:14px;opacity:.8}
.deck .cnt{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--card)}
.tag.new{color:var(--sky)}.tag.lrn{color:var(--peach)}.tag.due{color:var(--mint)}
.bar{height:10px;background:var(--card);border-radius:999px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ink);opacity:.35;border-radius:999px}
.deck:after{content:"✦";position:absolute;right:14px;top:10px;font-size:22px;opacity:.45}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mode{border:2px solid var(--line);background:var(--card);border-radius:22px;padding:14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0;transition:transform .15s}
.mode:hover{transform:translateY(-3px)}
.mode .e{font-size:28px}.mode b{font-family:var(--f-pop);font-weight:400;font-size:18px}.mode span{font-size:13px;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:18px;padding:10px 18px;font-weight:800;box-shadow:var(--shadow);background:var(--pink);color:#fff;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,53,83,.12)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.mint{background:var(--mint)}.btn.sky{background:var(--sky)}
.back{background:none;border:0;font-weight:800;color:var(--muted);padding:0}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.li .j{font-weight:800;font-size:20px}.li .k{font-size:12px;color:var(--muted)}
.li .s{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}
.seg{display:inline-flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff}

/* Flip card */
.stage{perspective:1400px}
.flip{position:relative;width:100%;aspect-ratio:3/2;max-height:460px;cursor:pointer;border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:32px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;text-align:center;box-shadow:0 10px 0 rgba(74,53,83,.12);border:3px solid var(--line);background:var(--card);overflow:hidden}
.face.b{transform:rotateY(180deg)}
.face .corner{position:absolute;left:16px;top:12px;font-size:12px;font-weight:800;color:var(--muted)}
.face .star{position:absolute;right:12px;top:8px;font-size:24px;background:none;border:0}
.big{font-family:var(--f-body);font-weight:800;font-size:clamp(40px,11vw,76px);line-height:1.1;word-break:keep-all}
.big.s{font-size:clamp(28px,7vw,44px)}
.furi{font-weight:700;color:var(--muted);font-size:clamp(14px,3vw,18px)}
.ptbig{font-family:var(--f-pop);font-size:clamp(24px,6vw,36px);line-height:1.15}
.ex{font-size:15px;font-weight:700;background:var(--lavS);border-radius:16px;padding:8px 12px;max-width:100%}
.ex small{display:block;font-weight:700;color:var(--muted)}
.art{width:min(150px,32vw);height:auto}
.art.em{font-size:clamp(48px,12vw,70px);line-height:1}
.prog{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;background:var(--line)}
.prog .bar i{background:var(--pink);opacity:1}
.kq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kq button{border:0;border-radius:20px;padding:12px;font-weight:800;box-shadow:var(--shadow);color:#fff}
.srs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.srs button{border:0;border-radius:18px;padding:10px 4px;font-weight:800;color:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.srs small{font-weight:700;opacity:.9;font-size:12px}
.qbox{background:var(--card);border-radius:28px;border:3px solid var(--line);padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:14px;font-weight:800;font-size:17px;box-shadow:var(--shadow);text-align:center;min-width:0;word-break:keep-all}
.opt:hover{border-color:var(--pink)}
.opt.ok{background:var(--mintS);border-color:var(--mint)}
.opt.no{background:var(--pinkS);border-color:var(--pink);opacity:.7}
.fb{font-weight:800;min-height:1.5em;text-align:center}
.fb.ok{color:var(--mint)}.fb.no{color:var(--pink)}
.inp{width:100%;border:3px solid var(--line);border-radius:18px;padding:12px 16px;font-size:20px;font-weight:700;background:var(--card)}
.inp:focus{border-color:var(--lav);outline:0}
.match{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{min-height:84px;border:3px solid var(--line);border-radius:20px;background:var(--card);font-weight:800;font-size:17px;padding:8px;box-shadow:var(--shadow);transition:transform .15s,opacity .3s;word-break:keep-all}
.tile.jp{font-size:22px}
.tile.sel{border-color:var(--lav);background:var(--lavS);transform:scale(1.04)}
.tile.bad{border-color:var(--pink);animation:shake .35s}
.tile.gone{opacity:0;transform:scale(.6);pointer-events:none}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--card);border-radius:28px;padding:24px;border:2px solid var(--line);box-shadow:var(--shadow)}
.done img{width:150px;height:150px;object-fit:cover;border-radius:24px;border:3px solid var(--line)}
.kaomoji{font-size:22px;font-weight:800;color:var(--pink)}
form.add{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:var(--card);border:2px dashed var(--line);border-radius:22px;padding:14px}
form.add label{display:flex;flex-direction:column;font-size:12px;font-weight:800;color:var(--muted);gap:2px}
form.add input{border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:16px;background:var(--bg)}
form.add .full{grid-column:1/-1}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);font-weight:800;padding:8px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.keys{font-size:12px;color:var(--muted);font-weight:700;text-align:center}
kbd{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-family:inherit}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .decks,.modes{grid-template-columns:minmax(0,1fr)}
  .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hello{grid-template-columns:minmax(0,1fr) 84px}.hello img{width:84px;height:84px}
  .flip{aspect-ratio:4/5}
  .li{grid-template-columns:minmax(0,1fr) auto}.li .pt{grid-column:1/-1;grid-row:2}
  .srs button{font-size:14px}
  .match{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <button class="logo" id="home" aria-label="Início"><span class="t">Tango</span> <span class="p">Pop</span><span class="x">!</span><small>単語ポップ • japonês N5 • ODU Creative</small></button>
    <span class="pill" title="Dias seguidos estudando">🔥 <span id="streak">0</span></span>
    <button class="ibtn" id="snd" aria-pressed="true" aria-label="Som e voz">🔊</button>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<canvas id="fx"></canvas>

/* ---------------- SRS (Anki-like SM-2) ---------------- */
const MIN=60e3,DAY=864e5,STEPS=[1,10],NEW_PER_DAY=10;
const S=id=>ST.srs[id];
function stateOf(c){const s=S(c.id);if(!s)return"new";return s.q==="rev"?(s.due<=Date.now()?"due":"rev"):"lrn"}
function counts(cards){const now=Date.now();let n=0,l=0,d=0,known=0;for(const c of cards){const s=S(c.id);if(!s)n++;else if(s.q!=="rev"){if(s.due<=now+20*MIN)l++}else{known++;if(s.due<=now)d++}}return {n,l,d,known}}
function fmt(ms){if(ms<60*MIN)return Math.max(1,Math.round(ms/MIN))+" min";if(ms<DAY)return Math.round(ms/36e5)+" h";const d=ms/DAY;return d<30?Math.round(d)+" d":(d/30).toFixed(1)+" mês"}
function schedule(c,btn,dry){
  const now=Date.now();const s={...(S(c.id)||{q:"new",step:0,ease:2.5,ivl:0,reps:0,lapses:0})};
  if(s.q==="new"||s.q==="lrn"||s.q==="relrn"){
    if(btn===0){s.step=0;s.due=now+STEPS[0]*MIN;s.q=s.q==="relrn"?"relrn":"lrn"}
    else if(btn===1){s.due=now+(STEPS[s.step]||STEPS[0])*MIN*1.5;s.q=s.q==="relrn"?"relrn":"lrn"}
    else if(btn===2){if(s.step+1<STEPS.length&&s.q!=="relrn"){s.step++;s.due=now+STEPS[s.step]*MIN;s.q="lrn"}else{s.q="rev";s.ivl=s.q==="relrn"?Math.max(1,s.ivl):Math.max(1,s.ivl||1);s.due=now+s.ivl*DAY}}
    else{s.q="rev";s.ivl=Math.max(4,(s.ivl||0)*1.3);s.due=now+s.ivl*DAY}
  }else{
    if(btn===0){s.lapses++;s.ease=Math.max(1.3,s.ease-.2);s.ivl=Math.max(1,Math.round(s.ivl*.5));s.q="relrn";s.step=0;s.due=now+10*MIN}
    else if(btn===1){s.ease=Math.max(1.3,s.ease-.15);s.ivl=Math.max(s.ivl+1,Math.round(s.ivl*1.2));s.due=now+s.ivl*DAY}
    else if(btn===2){s.ivl=Math.max(s.ivl+1,Math.round(s.ivl*s.ease));s.due=now+s.ivl*DAY}
    else{s.ease+=.15;s.ivl=Math.max(s.ivl+2,Math.round(s.ivl*s.ease*1.3));s.due=now+s.ivl*DAY}
  }
  s.reps++;
  if(dry)return s.due-now;
  if(!S(c.id)){const t=today();ST.newToday[t]=(ST.newToday[t]||0)+1}
  ST.srs[c.id]=s;save();
}
function nextSrsCard(deck){
  const cards=cardsOf(deck),now=Date.now();
  const lrn=cards.filter(c=>S(c.id)&&S(c.id).q!=="rev"&&S(c.id).due<=now).sort((a,b)=>S(a.id).due-S(b.id).due);
  if(lrn.length)return {c:lrn[0]};
  const due=cards.filter(c=>S(c.id)&&S(c.id).q==="rev"&&S(c.id).due<=now);
  if(due.length)return {c:rnd(due)};
  const used=ST.newToday[today()]||0;
  const nw=cards.filter(c=>!S(c.id));
  if(nw.length&&used<NEW_PER_DAY)return {c:nw[0]};
  const soon=cards.filter(c=>S(c.id)&&S(c.id).q!=="rev").sort((a,b)=>S(a.id).due-S(b.id).due)[0];
  if(soon&&S(soon.id).due-now<20*MIN)return {wait:S(soon.id).due-now,c:soon};
  return {done:true,newLeft:nw.length};
}

/* ---------------- Answer checking ---------------- */
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[ōô]/g,"o").replace(/[〜~…?？!！。、,.()（）]/g,"").replace(/\s+/g," ").trim();
const normJ=s=>norm(s).replace(/\s/g,"").replace(/ou/g,"o").replace(/uu/g,"u");
function checkAnswer(c,input,toJp){
  const i=input.trim();if(!i)return false;
  if(toJp){const cands=[c.jp,c.kana,c.ro].map(normJ);return cands.includes(normJ(i))}
  const alts=c.pt.split(/[·\/;,()]/).map(norm).filter(Boolean).concat(norm(c.pt));
  const n=norm(i).replace(/^(a|o|as|os) /,"");
  return alts.some(a=>{const b=a.replace(/^(a|o|as|os) /,"");return b===n||(n.length>=4&&b.startsWith(n))||(b.length>=4&&n.startsWith(b))});
}

    </div>`:`<p class="muted" style="font-weight:800">Este baralho ainda está vazio. Crie seu primeiro cartão aqui embaixo ✿</p>`}
    ${id==="mine"?addForm():""}
    <h2>Cartões</h2>
    <div class="list">${cs.map(c=>{const [l,col]=stLabel[stateOf(c)];return `<div class="li"><div><div class="j">${esc(c.jp)}</div><div class="k">${esc(c.kana)} • ${esc(c.ro)}</div></div>
      <div class="pt" style="font-weight:700">${esc(c.pt)}</div><div class="row" style="gap:6px;justify-content:flex-end"><span class="s" style="background:${col}">${l}</span>
      <button class="ibtn" data-say="${esc(c.kana)}" aria-label="Ouvir">🔊</button><button class="ibtn" data-star="${esc(c.id)}" aria-label="Favoritar">${ST.stars[c.id]?"⭐":"☆"}</button>
      ${c.d==="mine"?`<button class="ibtn" data-del="${esc(c.id)}" aria-label="Apagar">🗑️</button>`:""}</div></div>`}).join("")}</div>
  </section>`;
  $("#bk").onclick=home;
  app.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{ST.dir=b.dataset.dir;save();deckView(id)});
  $("#furi").onclick=()=>{ST.furi=!ST.furi;save();deckView(id)};
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{SFX.pop();ac();({srs:srsMode,cards:cardsMode,learn:learnMode,write:writeMode,match:matchMode,starred:()=>cardsMode(true)})[b.dataset.m]()});
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  app.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{const k=b.dataset.star;ST.stars[k]=!ST.stars[k];save();b.textContent=ST.stars[k]?"⭐":"☆";SFX.pop()});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(b.dataset.sure){ST.mine=ST.mine.filter(c=>c.id!==b.dataset.del);delete ST.srs[b.dataset.del];save();deckView(id)}else{b.dataset.sure=1;b.textContent="Apagar?";}});
  const f=$("#addf");if(f)f.onsubmit=e=>{e.preventDefault();const v=k=>f.elements[k].value.trim();
    if(!v("jp")||!v("pt")){toast("Preencha japonês e português ✿");return}
    ST.mine.push({id:"mine:"+v("jp")+":"+Date.now(),d:"mine",jp:v("jp"),kana:v("kana")||v("jp"),ro:v("ro"),pt:v("pt"),ex:v("ex"),ext:v("ext"),art:{em:v("em")||"🌸"}});save();toast("Cartão criado! (ﾉ◕ヮ◕)ﾉ");deckView(id)};
}
function addForm(){return `<form class="add" id="addf"><b class="full" style="font-family:var(--f-pop);font-weight:400;font-size:18px">＋ Novo cartão</b>
  <label for="f-jp">Japonês<input id="f-jp" name="jp" placeholder="例：本屋"></label><label for="f-kana">Kana<input id="f-kana" name="kana" placeholder="ほんや"></label>
  <label for="f-ro">Romaji<input id="f-ro" name="ro" placeholder="hon'ya"></label><label for="f-pt">Português<input id="f-pt" name="pt" placeholder="livraria"></label>
  <label class="full" for="f-ex">Exemplo (opcional)<input id="f-ex" name="ex" placeholder="駅の 近くに 本屋が あります。"></label>
  <label for="f-ext">Tradução do exemplo<input id="f-ext" name="ext" placeholder="Tem uma livraria perto da estação."></label><label for="f-em">Emoji<input id="f-em" name="em" placeholder="📚" maxlength="4"></label>
  <div class="full"><button class="btn" type="submit">Adicionar cartão ✿</button></div></form>`}

/* card faces */
function front(c){
  if(ST.dir==="pt")return `${artOf(c)}<div class="ptbig">${esc(c.pt)}</div><div class="muted" style="font-weight:700">Como se diz em japonês?</div>`;
  return `<div class="big ${c.jp.length>4?"s":""}">${esc(c.jp)}</div>${ST.furi&&c.kana!==c.jp?`<div class="furi">${esc(c.kana)}</div>`:""}`;
}
function backFace(c){
  return `${artOf(c)}<div class="big s">${esc(c.jp)}</div><div class="furi">${esc(c.kana)} • ${esc(c.ro)}</div><div class="ptbig" style="font-size:clamp(20px,5vw,28px)">${esc(c.pt)}</div>
  ${c.ex?`<div class="ex">${esc(c.ex)}<small>${esc(c.ext)}</small></div>`:""}`;
}
function flipHTML(c,label){
  return `<div class="stage"><button class="flip" id="flip" aria-label="Virar cartão"><div class="face a"><span class="corner">${label}</span>${front(c)}</div><div class="face b"><span class="corner">${label}</span>${backFace(c)}</div></button></div>`;
}
const backBtn=()=>`<button class="back" id="bk">← ${deckMeta(cur.deck).name}</button>`;
function bindFlip(c,onFlip){const f=$("#flip");let first=true;f.onclick=()=>{f.classList.toggle("on");SFX.flip();if(f.classList.contains("on")){say(c.kana);if(first){first=false;onFlip&&onFlip()}}}}
let keyHandler=null;const setKeys=h=>{keyHandler=h};
addEventListener("keydown",e=>{if(e.target.matches("input"))return;if(keyHandler)keyHandler(e)});

/* SRS mode */
function srsMode(){
  setKeys(null);const n=nextSrsCard(cur.deck);
  if(n.done||n.wait)return finish(n.done?(n.newLeft?`Você viu os ${NEW_PER_DAY} cartões novos de hoje. Volte amanhã para mais!`:"Nada para revisar agora. Volte mais tarde!"):`Próximo cartão em ${fmt(n.wait)}. Que tal jogar o Combinar enquanto isso?`,"srs",n.wait);
  const c=n.c,k=counts(cardsOf(cur.deck)),st=stateOf(c);
  const labels=["De novo","Difícil","Bom","Fácil"],cols=["var(--pink)","var(--peach)","var(--mint)","var(--sky)"];
  app.innerHTML=`<section class="screen">${backBtn()}
    <div class="prog"><span class="tag new">${k.n} novos</span><span class="tag lrn">${k.l} aprendendo</span><span class="tag due">${k.d} revisar</span></div>
    ${flipHTML(c,{new:"✿ novo",lrn:"aprendendo",due:"revisão",rev:"revisão"}[st])}
    <div id="ctl"><button class="btn" id="show" style="width:100%">Mostrar resposta</button></div>
    <p class="keys"><kbd>espaço</kbd> virar • <kbd>1</kbd>–<kbd>4</kbd> responder</p></section>`;
  $("#bk").onclick=()=>deckView(cur.deck);
  const reveal=()=>{const f=$("#flip");if(!f.classList.contains("on")){f.classList.add("on");SFX.flip();say(c.kana)}
    $("#ctl").innerHTML=`<div class="srs">${labels.map((l,i)=>`<button data-b="${i}" style="background:${cols[i]}">${l}<small>${fmt(schedule(c,i,true))}</small></button>`).join("")}</div>`;
    $("#ctl").querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>answer(+b.dataset.b))};
  const answer=b=>{schedule(c,b,false);logStudy();if(b>=2){SFX.ok();const r=$("#flip").getBoundingClientRect();sparkle(r.left+r.width/2,r.top+40,b===3?60:30)}else SFX.no();srsMode()};
  $("#show").onclick=reveal;$("#flip").onclick=reveal;
  setKeys(e=>{if(e.key===" "){e.preventDefault();reveal()}else if(/^[1-4]$/.test(e.key)&&$("#ctl [data-b]"))answer(+e.key-1)});
}
function finish(msg,mode,wait){
  setKeys(null);SFX.win();rainFx();
  app.innerHTML=`<section class="screen">${backBtn()}<div class="done"><img src="${IMG.juntos}" alt="Pongo e o Sr. Tromba"><h1>おつかれさま！</h1><div class="kaomoji">${rnd(KAO_OK)}</div>
  <p style="margin:0;font-weight:700">${msg}</p><div class="row" style="justify-content:center">
  ${wait?`<button class="btn" id="again">Revisar mesmo assim</button>`:""}<button class="btn sky" id="m">Jogar Combinar ⚡</button><button class="btn alt" id="dv">Voltar ao baralho</button></div></div></section>`;
  $("#bk").onclick=$("#dv").onclick=()=>deckView(cur.deck);$("#m").onclick=matchMode;
  const a=$("#again");if(a)a.onclick=()=>{const s=S(nextSrsCard(cur.deck).c.id);s.due=Date.now();save();srsMode()};
}
function rainFx(){for(let i=0;i<6;i++)setTimeout(()=>sparkle(Math.random()*innerWidth,innerHeight*.3,25),i*120)}

/* Flashcards (Quizlet) */
function cardsMode(starred){
  let pool=cardsOf(cur.deck);if(starred)pool=pool.filter(c=>ST.stars[c.id]);
  if(!pool.length){toast("Marque cartões com ☆ primeiro");return}
  let q=shuffle(pool),i=0,know=0,learning=[];
  const draw=()=>{
    if(i>=q.length){setKeys(null);SFX.win();rainFx();
      app.innerHTML=`<section class="screen">${backBtn()}<div class="done"><img src="${IMG.feliz}" alt=""><h1>${know}/${q.length} ✿</h1><div class="kaomoji">${know===q.length?rnd(KAO_OK):"がんばって！(ง •̀_•́)ง"}</div>
      <p style="margin:0;font-weight:700">Você já sabe ${know} cartões. ${learning.length?`Ainda aprendendo: ${learning.length}.`:""}</p>
      <div class="row" style="justify-content:center">${learning.length?`<button class="btn" id="rl">Treinar os ${learning.length} que faltam</button>`:""}<button class="btn alt" id="ra">Recomeçar</button></div></div></section>`;
      $("#bk").onclick=()=>deckView(cur.deck);$("#ra").onclick=()=>cardsMode(starred);
      const rl=$("#rl");if(rl)rl.onclick=()=>{q=shuffle(learning);i=0;know=0;learning=[];draw()};return}
    const c=q[i];
    app.innerHTML=`<section class="screen">${backBtn()}
      <div class="prog"><span>${i+1}/${q.length}</span><span class="bar"><i style="width:${i/q.length*100}%"></i></span><span>✓ ${know}</span></div>
      ${flipHTML(c,"toque para virar")}
      <div class="kq"><button id="no" style="background:var(--peach)">😵 Ainda aprendendo</button><button id="yes" style="background:var(--mint)">😊 Já sei!</button></div>
      <div class="row" style="justify-content:center"><button class="ibtn" id="sp">🔊 Ouvir</button><button class="ibtn" id="st">${ST.stars[c.id]?"⭐":"☆"} Favorito</button></div>
      <p class="keys"><kbd>espaço</kbd> virar • <kbd>←</kbd> aprendendo • <kbd>→</kbd> já sei</p></section>`;
    $("#bk").onclick=()=>deckView(cur.deck);bindFlip(c);
    $("#sp").onclick=()=>say(c.kana);$("#st").onclick=()=>{ST.stars[c.id]=!ST.stars[c.id];save();$("#st").textContent=(ST.stars[c.id]?"⭐":"☆")+" Favorito"};
    const go=ok=>{if(ok){know++;SFX.ok();const r=$("#yes").getBoundingClientRect();sparkle(r.left+r.width/2,r.top,25)}else{learning.push(c);SFX.pop()}logStudy();i++;draw()};
    $("#yes").onclick=()=>go(true);$("#no").onclick=()=>go(false);
    setKeys(e=>{if(e.key===" "){e.preventDefault();$("#flip").click()}else if(e.key==="ArrowRight")go(true);else if(e.key==="ArrowLeft")go(false)});
  };draw();
}

/* Learn (multiple choice) */
function learnMode(){
  const pool=cardsOf(cur.deck);if(pool.length<4){toast("Precisa de pelo menos 4 cartões");return}
  let q=shuffle(pool).slice(0,10),i=0,score=0,miss=[];
  const toJp=ST.dir==="pt";
  const draw=()=>{
    if(i>=q.length){setKeys(null);SFX.win();rainFx();
      app.innerHTML=`<section class="screen">${backBtn()}<div class="done"><img src="${score>=q.length*.8?IMG.feliz:IMG.pensativo}" alt=""><h1>${score} / ${q.length}</h1><div class="kaomoji">${score>=q.length*.8?rnd(KAO_OK):rnd(KAO_NO)}</div>
      <div class="row" style="justify-content:center"><button class="btn" id="ag">Mais uma rodada</button><button class="btn alt" id="dv">Voltar</button></div></div></section>`;
      $("#bk").onclick=$("#dv").onclick=()=>deckView(cur.deck);$("#ag").onclick=learnMode;return}
    const c=q[i];const others=shuffle(pool.filter(x=>x!==c&&(toJp?x.jp:x.pt)!==(toJp?c.jp:c.pt))).slice(0,3);
    const opts=shuffle([c,...others]);
    app.innerHTML=`<section class="screen">${backBtn()}
      <div class="prog"><span>${i+1}/${q.length}</span><span class="bar"><i style="width:${i/q.length*100}%"></i></span><span>✓ ${score}</span></div>
      <div class="qbox">${toJp?`${artOf(c)}<div class="ptbig">${esc(c.pt)}</div>`:`<div class="big ${c.jp.length>4?"s":""}">${esc(c.jp)}</div>${ST.furi&&c.kana!==c.jp?`<div class="furi">${esc(c.kana)}</div>`:""}`}</div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(toJp?o.jp:o.pt)}</button>`).join("")}</div>
      <div class="fb" id="fb"></div><p class="keys"><kbd>1</kbd>–<kbd>4</kbd> escolher</p></section>`;
    $("#bk").onclick=()=>deckView(cur.deck);if(!toJp)say(c.kana);
    let locked=false;
    const pick=k=>{if(locked)return;const b=app.querySelector(`[data-k="${k}"]`);const o=opts[k];
      if(o===c){locked=true;b.classList.add("ok");score+=miss.includes(c)?0:1;SFX.ok();if(toJp)say(c.kana);const r=b.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2,30);
        $("#fb").className="fb ok";$("#fb").textContent=rnd(KAO_OK);logStudy();setTimeout(()=>{i++;draw()},900)}
      else{b.classList.add("no");b.disabled=true;SFX.no();if(!miss.includes(c)){miss.push(c);q.push(c)}$("#fb").className="fb no";$("#fb").textContent=`${rnd(KAO_NO)} ${esc(toJp?o.pt:o.jp)} = ${esc(toJp?o.jp:o.pt)}`}};
    app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    setKeys(e=>{if(/^[1-4]$/.test(e.key))pick(+e.key-1)});
  };draw();
}

/* Write */
function writeMode(){
  setKeys(null);const pool=cardsOf(cur.deck);let q=shuffle(pool).slice(0,10),i=0,score=0;const toJp=ST.dir==="pt";
  const draw=()=>{
    if(i>=q.length){SFX.win();rainFx();app.innerHTML=`<section class="screen">${backBtn()}<div class="done"><img src="${IMG.feliz}" alt=""><h1>${score} / ${q.length}</h1><div class="kaomoji">${rnd(score>=q.length*.8?KAO_OK:KAO_NO)}</div>
      <div class="row" style="justify-content:center"><button class="btn" id="ag">De novo</button><button class="btn alt" id="dv">Voltar</button></div></div></section>`;
      $("#bk").onclick=$("#dv").onclick=()=>deckView(cur.deck);$("#ag").onclick=writeMode;return}
    const c=q[i];
    app.innerHTML=`<section class="screen">${backBtn()}
      <div class="prog"><span>${i+1}/${q.length}</span><span class="bar"><i style="width:${i/q.length*100}%"></i></span><span>✓ ${score}</span></div>
      <div class="qbox">${toJp?`${artOf(c)}<div class="ptbig">${esc(c.pt)}</div><div class="muted" style="font-weight:700">Escreva em japonês: kanji, kana ou romaji</div>`:`<div class="big ${c.jp.length>4?"s":""}">${esc(c.jp)}</div>${ST.furi&&c.kana!==c.jp?`<div class="furi">${esc(c.kana)}</div>`:""}<div class="muted" style="font-weight:700">Escreva o significado em português</div>`}</div>
      <form id="wf" class="row" style="flex-wrap:nowrap"><label for="ans" class="muted" style="position:absolute;left:-9999px">Resposta</label><input class="inp" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${toJp?"ex.: ひがし / higashi":"ex.: leste"}"><button class="btn" type="submit">OK</button></form>
      <div class="fb" id="fb"></div><div id="after"></div></section>`;
    $("#bk").onclick=()=>deckView(cur.deck);const inp=$("#ans");inp.focus({preventScroll:true});if(!toJp)say(c.kana);
    let done=false;
    $("#wf").onsubmit=e=>{e.preventDefault();if(done){i++;draw();return}done=true;const ok=checkAnswer(c,inp.value,toJp);logStudy();
      if(ok){score++;SFX.ok();const r=inp.getBoundingClientRect();sparkle(r.left+r.width/2,r.top,30);$("#fb").className="fb ok";$("#fb").textContent=rnd(KAO_OK)}
      else{SFX.no();$("#fb").className="fb no";$("#fb").textContent=rnd(KAO_NO)}
      say(c.kana);
      $("#after").innerHTML=`<div class="qbox" style="padding:14px">${backFace(c)}</div><div class="row" style="justify-content:center;margin-top:10px">${ok?"":`<button class="btn alt" id="ov">Eu acertei (contar como certo)</button>`}<button class="btn" id="nx">Próximo ▶</button></div>`;
      $("#nx").onclick=()=>{i++;draw()};const ov=$("#ov");if(ov)ov.onclick=()=>{score++;i++;draw()};$("#nx").focus({preventScroll:true})};
  };draw();
}

/* Match */
let timerH=0;const stopTimer=()=>{clearInterval(timerH);timerH=0};
function matchMode(){
  setKeys(null);stopTimer();const pool=cardsOf(cur.deck);if(pool.length<3){toast("Precisa de pelo menos 3 cartões");return}
  const pick=shuffle(pool).slice(0,6);let tiles=shuffle(pick.flatMap(c=>[{c,t:c.jp,jp:1},{c,t:c.pt}]));
  let sel=null,left=pick.length,t0=performance.now(),pen=0;
  app.innerHTML=`<section class="screen">${backBtn()}
    <div class="row" style="justify-content:space-between"><h2>⚡ Combinar</h2><span class="pill">⏱️ <span id="tm">0.0</span>s</span></div>
    <p class="muted" style="margin:0;font-weight:700">Toque no japonês e no português que combinam. Erro = +1 segundo.</p>
    <div class="match">${tiles.map((x,k)=>`<button class="tile ${x.jp?"jp":""}" data-k="${k}">${esc(x.t)}</button>`).join("")}</div></section>`;
  $("#bk").onclick=()=>{stopTimer();deckView(cur.deck)};
  timerH=setInterval(()=>{const el=$("#tm");if(!el){stopTimer();return}el.textContent=((performance.now()-t0)/1000+pen).toFixed(1)},100);
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{const x=tiles[+b.dataset.k];
    if(sel===b){b.classList.remove("sel");sel=null;return}
    if(!sel){sel=b;b.classList.add("sel");SFX.pop();if(x.jp)say(x.c.kana);return}
    const y=tiles[+sel.dataset.k];
    if(y.c===x.c&&y.jp!==x.jp){[b,sel].forEach(e=>{e.classList.remove("sel");e.classList.add("gone")});SFX.ok();const r=b.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2,20);sel=null;left--;logStudy();
      if(!left){stopTimer();const tm=(performance.now()-t0)/1000+pen;const best=ST.best[cur.deck];const rec=!best||tm<best;if(rec)ST.best[cur.deck]=tm;save();
        setTimeout(()=>{SFX.win();rainFx();app.innerHTML=`<section class="screen">${backBtn()}<div class="done"><img src="${IMG.juntos}" alt=""><h1>${tm.toFixed(1)} s</h1><div class="kaomoji">${rec?"新記録！ Novo recorde! ✧٩(ˊωˋ*)و✧":rnd(KAO_OK)}</div>
          <p style="margin:0;font-weight:700">Recorde deste baralho: ${ST.best[cur.deck].toFixed(1)} s</p><div class="row" style="justify-content:center"><button class="btn" id="ag">Jogar de novo</button><button class="btn alt" id="dv">Voltar</button></div></div></section>`;
          $("#bk").onclick=$("#dv").onclick=()=>deckView(cur.deck);$("#ag").onclick=matchMode},400)}}
    else{pen+=1;SFX.no();[b,sel].forEach(e=>{e.classList.remove("sel");e.classList.add("bad");setTimeout(()=>e.classList.remove("bad"),400)});sel=null}});
}

/* boot */
$("#home").onclick=()=>{SFX.pop();home()};
const snd=$("#snd");const syncSnd=()=>{snd.textContent=ST.sound?"🔊":"🔇";snd.setAttribute("aria-pressed",ST.sound)};syncSnd();
snd.onclick=()=>{ST.sound=!ST.sound;save();syncSnd();if(ST.sound)SFX.pop();else try{speechSynthesis.cancel()}catch(e){}};
renderStreak();home();
})();
</script>
</html>
