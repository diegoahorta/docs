<title>Pongo no Mundo do Hangul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Jua&family=Monoton&family=Noto+Sans+KR:wght@500;800&display=swap">
<style>
/* Layout: trilha vertical de fases (mapa do "mundo do Hangul") + tela de lição por cima, em coluna única que serve no celular.
   Cores dos blocos (modelo Odu do coreano): azul = consoante inicial, rosa = vogal, amarelo = batchim. */
:root{
  color-scheme: light;
  --ink:#1D2547; --ink-soft:#5B6385; --paper:#FFF8EA; --paper-2:#FFEFD3; --line:#E9D9BC;
  --teal:#0B8290; --teal-deep:#075E69; --neon:#FF4F9A; --sun:#FF7A59; --gold:#F2A900;
  --c-fill:#D9EFFA; --c-edge:#3389C9;   /* consoante inicial */
  --v-fill:#FCE1EB; --v-edge:#D9417B;   /* vogal */
  --t-fill:#FFF0C6; --t-edge:#D99A12;   /* batchim (consoante final) */
  --ok:#1E9E6A; --bad:#D6453D;
  --f-display:'Monoton', 'Jua', system-ui, sans-serif;
  --f-title:'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-han:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; /* letras com desenho padrão, boas para alfabetização */
  --f-ui:'Baloo 2', 'Jua', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--neon);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.45rem 16px;
  background:var(--teal);color:#fff;border-bottom:4px solid var(--teal-deep)}
.brand{display:flex;align-items:baseline;gap:.5rem;margin-right:auto;min-width:0}
.brand .ko{font-family:var(--f-title);font-size:1.3rem}
.brand .pt{font-size:.82rem;opacity:.85;white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:.35rem;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);border-radius:999px;
  padding:.15rem .7rem;font-weight:700;font-size:.85rem;color:#fff}
.tbtn[aria-pressed="true"]{background:#fff;color:var(--teal-deep);border-color:#fff}
.tbtn svg{width:16px;height:16px}
.stars-total{font-weight:800;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:.25rem}

/* mapa */
#map{max-width:760px;margin:0 auto;padding:1rem 16px 4rem}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:1rem;align-items:center;border-radius:20px;padding:1rem 1.2rem;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#2C67D8 0%,#58A9EE 55%,#FFC59A 100%);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.hero::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:var(--sun);right:110px;bottom:-100px}
.hero > *{position:relative;z-index:1}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.8rem,6vw,3rem);margin:0;line-height:1;letter-spacing:.04em;text-wrap:balance;text-shadow:0 3px 0 rgba(29,37,71,.35)}
.hero .kosub{font-family:var(--f-title);font-size:1.4rem;margin:.3rem 0}
.hero p{margin:0;max-width:44ch;font-weight:600;line-height:1.4}
.hero img{width:170px;filter:drop-shadow(0 6px 0 rgba(29,37,71,.35))}
.startrow{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0}
.legend{display:flex;flex-wrap:wrap;gap:.35rem .9rem;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.legend i{width:14px;height:14px;border-radius:4px;border:2px solid}
.legend .c{background:var(--c-fill);border-color:var(--c-edge)} .legend .v{background:var(--v-fill);border-color:var(--v-edge)} .legend .t{background:var(--t-fill);border-color:var(--t-edge)}

.land{margin-top:1.6rem;border-radius:22px;padding:1rem 1rem 1.4rem;border:3px solid var(--ink);background:var(--land-bg);position:relative;overflow:hidden}
.land header{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.land h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:1.6rem}
.land header span{font-weight:800;color:var(--ink-soft)}
.land .eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--land-ink)}
.path{display:flex;flex-direction:column;gap:.9rem;margin-top:.8rem}
.node{--off:0px;align-self:center;transform:translateX(var(--off));display:flex;align-items:center;gap:.7rem}
.nbtn{width:78px;height:78px;border-radius:50%;border:4px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;
  font-family:var(--f-han);font-weight:800;font-size:1.9rem;position:relative;flex:none}
.nbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.node.done .nbtn{background:var(--land-ink);color:#fff}
.node.now .nbtn{background:var(--neon);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 var(--ink),0 0 0 10px rgba(255,79,154,.25)}}
.node.lock .nbtn{background:#EEE7DA;color:#B9AE99;border-color:#B9AE99;box-shadow:0 5px 0 #B9AE99;cursor:not-allowed}
.ninfo{display:flex;flex-direction:column;min-width:0;max-width:200px;width:44vw}
.ninfo b{font-family:var(--f-han);font-size:1rem}
.ninfo small{color:var(--ink-soft);font-weight:700;line-height:1.2}
.nst{color:var(--gold);letter-spacing:.06em;font-size:.95rem}
.nst .off{color:var(--line)}
.pongo-pin{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:#fff}
.pongo-pin img{width:100%;height:100%;object-fit:cover}
.paws{align-self:center;color:var(--land-ink);opacity:.5;font-size:.8rem;letter-spacing:.4em}
.castle{display:flex;flex-direction:column;align-items:center;gap:.4rem;margin-top:1rem;text-align:center}
.castle img{width:110px;filter:drop-shadow(0 4px 0 rgba(29,37,71,.3))}
.castle .hidden{filter:brightness(0) opacity(.35)}

/* lição */
#lesson{position:fixed;inset:0;z-index:20;background:var(--paper);display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lbar{display:flex;align-items:center;gap:.8rem;padding:.7rem 16px;max-width:760px;width:100%;margin:0 auto;box-sizing:border-box}
.xbtn{border:0;background:none;font-size:1.6rem;line-height:1;color:var(--ink-soft);padding:.2rem .4rem}
.prog{flex:1;height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .3s}
.lbody{overflow:auto;padding:.4rem 16px 1.2rem;max-width:760px;width:100%;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:1rem}
.ask{display:flex;align-items:center;gap:.7rem}
.ask img{width:62px;height:62px;border-radius:14px;border:2px solid var(--ink);object-fit:cover;flex:none;background:#fff}
.ask p{margin:0;font-size:1.1rem;font-weight:700;line-height:1.3}
.ask small{display:block;color:var(--ink-soft);font-weight:600;font-size:.85rem}
.big{font-family:var(--f-han);font-weight:800;font-size:clamp(4.5rem,22vw,8rem);line-height:1.05;text-align:center}
.big.word{font-size:clamp(3rem,14vw,5.5rem)}
.center{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.rom{font-weight:800;font-size:1.3rem;color:var(--teal-deep)}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:1rem;box-shadow:0 5px 0 var(--ink)}
.learn .letter{font-family:var(--f-han);font-weight:800;font-size:clamp(6rem,30vw,10rem);line-height:1;text-align:center}
.learn .letter.c{color:var(--c-edge)} .learn .letter.v{color:var(--v-edge)} .learn .letter.t{color:#B07B00}
.learn dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.35rem .8rem;margin:.6rem 0 0}
.learn dt{font-weight:800;color:var(--ink-soft);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;padding-top:.15rem}
.learn dd{margin:0;font-weight:600;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:2px solid var(--ink);background:var(--paper);border-radius:12px;padding:.2rem .7rem;font-family:var(--f-han);font-weight:800;font-size:1.3rem;display:inline-flex;align-items:center;gap:.3rem}
.chip small{font-family:var(--f-ui);font-size:.75rem;color:var(--ink-soft)}
.spk{border:0;background:var(--teal);color:#fff;border-radius:999px;padding:.35rem .9rem;font-weight:800;display:inline-flex;align-items:center;gap:.35rem}
.spk.huge{padding:1rem 1.6rem;font-size:1.2rem}
.spk svg{width:20px;height:20px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.opt{border:3px solid var(--ink);background:#fff;border-radius:16px;padding:.9rem .5rem;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:1.3rem;min-height:64px}
.opt.han{font-family:var(--f-han);font-size:2rem}
.opt.pic{font-size:2.6rem;line-height:1}
.opt.pic small{display:block;font-size:.8rem;font-weight:700;color:var(--ink-soft);margin-top:.25rem}
.opt.sel{border-color:var(--teal);background:#E6F6F4;box-shadow:0 4px 0 var(--teal)}
.opt.good{border-color:var(--ok);background:#E3F7EC;box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:#FDEBE9;box-shadow:0 4px 0 var(--bad)}

/* montador de sílabas */
.builder{display:flex;flex-direction:column;gap:.8rem;align-items:center}
.target{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:center}
.pic{font-size:3.4rem;line-height:1}
.cells{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.cell{width:84px;height:84px;border-radius:16px;border:3px dashed var(--ink-soft);display:grid;place-items:center;font-family:var(--f-han);font-weight:800;font-size:3rem;background:#fff}
.cell.now{border-style:solid;border-color:var(--neon)}
.cell.ok{border-style:solid;border-color:var(--ok);background:#E3F7EC}
.block{display:grid;gap:4px;width:150px;height:150px;padding:6px;border-radius:18px;border:3px solid var(--ink);background:#fff;box-sizing:border-box}
.block.vert{grid-template-areas:"c v" "t t";grid-template-columns:1fr 1fr;grid-template-rows:1.4fr 1fr}
.block.hori{grid-template-areas:"c" "v" "t";grid-template-rows:1fr .8fr .8fr}
.block.mix{grid-template-areas:"c v" "h v" "t t";grid-template-columns:1.2fr 1fr;grid-template-rows:1fr .8fr .8fr}
.slot{border-radius:10px;border:2px dashed;display:grid;place-items:center;font-family:var(--f-han);font-weight:800;font-size:1.9rem;min-width:0;min-height:0;cursor:pointer;background:none}
.slot.c{grid-area:c;border-color:var(--c-edge);color:var(--c-edge);background:color-mix(in srgb,var(--c-fill) 60%,transparent)}
.slot.v{grid-area:v;border-color:var(--v-edge);color:var(--v-edge);background:color-mix(in srgb,var(--v-fill) 60%,transparent)}
.slot.h{grid-area:h;border-color:var(--v-edge);color:var(--v-edge);background:color-mix(in srgb,var(--v-fill) 60%,transparent)}
.slot.t{grid-area:t;border-color:var(--t-edge);color:#A87406;background:color-mix(in srgb,var(--t-fill) 60%,transparent)}
.slot.filled{border-style:solid}
.slot.bad{background:#FDEBE9;border-color:var(--bad)}
.composed{font-family:var(--f-han);font-weight:800;font-size:5rem;line-height:1;min-width:1.2em;text-align:center}
.brow{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;justify-content:center}
.keys{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;max-width:560px}
.key{width:58px;height:58px;border-radius:14px;border:3px solid;font-family:var(--f-han);font-weight:800;font-size:1.7rem;display:grid;place-items:center;background:#fff}
.key.c{background:var(--c-fill);border-color:var(--c-edge);box-shadow:0 4px 0 var(--c-edge)}
.key.v{background:var(--v-fill);border-color:var(--v-edge);box-shadow:0 4px 0 var(--v-edge)}
.key.t{background:var(--t-fill);border-color:var(--t-edge);box-shadow:0 4px 0 var(--t-edge)}
.key:active{transform:translateY(2px)}
.keyhint{font-size:.8rem;color:var(--ink-soft);font-weight:700;text-align:center}

.lfoot{border-top:3px solid var(--line);background:var(--paper)}
.lfoot.ok{background:#E3F7EC;border-color:var(--ok)} .lfoot.bad{background:#FDEBE9;border-color:var(--bad)}
.lfoot > div{max-width:760px;margin:0 auto;padding:.8rem 16px;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.fmsg{flex:1;min-width:200px;font-weight:700;line-height:1.35}
.fmsg b{display:block;font-size:1.15rem}
.lfoot.ok .fmsg b{color:#0E6B45} .lfoot.bad .fmsg b{color:#8E2420}
.fmsg .han{font-family:var(--f-han);font-weight:800}
.btn{border:3px solid var(--ink);border-radius:14px;padding:.6rem 1.4rem;font-weight:800;background:#fff;box-shadow:0 4px 0 var(--ink);font-size:1.05rem}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn.primary{background:var(--neon);color:#fff}
.btn.go{background:var(--teal);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}

/* janelas */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(18,24,52,.62);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);width:min(560px,100%);max-height:100%;overflow:auto;padding:1.2rem;text-align:center;box-sizing:border-box}
.modal img.face{width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid var(--ink)}
.modal h3{font-family:var(--f-title);font-weight:400;font-size:1.8rem;margin:.5rem 0 .2rem}
.modal p{line-height:1.45;font-weight:600;margin:.4rem 0}
.bigstars{font-size:2.4rem;color:var(--gold);letter-spacing:.1em}
.bigstars .off{color:var(--line)}
.modal .actions{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:.8rem}
.chart{background:var(--paper);border:4px solid var(--ink);border-radius:22px;width:min(860px,100%);max-height:100%;overflow:auto;padding:1rem 1.2rem;box-sizing:border-box}
.chart h3{margin:1rem 0 .4rem;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.chart .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:.45rem}
.jbtn{border:2px solid;border-radius:12px;padding:.3rem .2rem;display:flex;flex-direction:column;align-items:center;background:#fff}
.jbtn b{font-family:var(--f-han);font-size:1.8rem}
.jbtn small{font-size:.72rem;font-weight:700;color:var(--ink-soft)}
.jbtn.c{border-color:var(--c-edge);background:var(--c-fill)} .jbtn.v{border-color:var(--v-edge);background:var(--v-fill)} .jbtn.t{border-color:var(--t-edge);background:var(--t-fill)}
.jbtn.lock{opacity:.35}
.closex{float:right;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:.1rem .7rem;font-weight:800}
.note{font-size:.8rem;color:var(--ink-soft);margin:.8rem 0 0}

@media (max-width:560px){
  .brand .pt{display:none}
  .hero{grid-template-columns:minmax(0,1fr) 100px}
  .hero img{width:100px}
  .key{width:52px;height:52px;font-size:1.5rem}
  .block{width:132px;height:132px}
  .composed{font-size:4rem}
  .cell{width:70px;height:70px;font-size:2.4rem}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>

<header class="top">
  <div class="brand"><span class="ko">한글 나라의 퐁고</span><span class="pt">Pongo no Mundo do Hangul · Odu Creative</span></div>
  <span class="stars-total" title="Estrelas conquistadas"><svg viewBox="0 0 24 24" width="18" height="18" fill="#FFD84D" stroke="#1D2547" stroke-width="1.5"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.3L12 17.1l-5.7 3.1 1.2-6.3L2.8 9.5l6.4-.8z"/></svg><span id="starCount">0</span></span>
  <button class="tbtn" id="btnChart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Alfabeto</button>
  <button class="tbtn" id="btnMusic" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span>Música</span></button>
</header>

<main id="map"></main>

<section id="lesson" hidden aria-live="polite">
  <div class="lbar"><button class="xbtn" id="btnQuit" aria-label="Sair da fase">×</button><div class="prog"><i id="progBar" style="width:0%"></i></div></div>
  <div class="lbody" id="lbody"></div>
  <div class="lfoot" id="lfoot"><div><div class="fmsg" id="fmsg"></div><button class="btn primary" id="btnMain">Verificar</button></div></div>
</section>

<div class="overlay" id="modalOv" hidden><div class="modal" id="modal"></div></div>
<div class="overlay" id="chartOv" hidden><div class="chart" id="chart"></div></div>

<script>
"use strict";
const IMG = /*__ASSETS__*/{};
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v; else if (k === 'style') e.setAttribute('style', v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids) if (k != null && k !== false) e.append(k);
  return e;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('pongo-hangul:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pongo-hangul:' + k, JSON.stringify(v)); } catch (e) {} }
};
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const pick = (a, n) => shuffle(a).slice(0, n);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ============================================================
   HANGUL — composição e decomposição de sílabas (Unicode)
   sílaba = 0xAC00 + (inicial × 21 + vogal) × 28 + final
   ============================================================ */
const L = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
const V = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
const T = ['', ...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'.split('')];
const compose = (l, v, t = '') => String.fromCharCode(0xAC00 + (L.indexOf(l) * 21 + V.indexOf(v)) * 28 + T.indexOf(t));
function decompose(s) {
  const c = s.charCodeAt(0) - 0xAC00; if (c < 0 || c > 11171) return null;
  return { l: L[Math.floor(c / 588)], v: V[Math.floor((c % 588) / 28)], t: T[c % 28] };
}
const isSyl = ch => { const c = ch.charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3; };
const VERT = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅣ', HORI = 'ㅗㅛㅜㅠㅡ';
const VSPLIT = { 'ㅘ': ['ㅗ', 'ㅏ'], 'ㅙ': ['ㅗ', 'ㅐ'], 'ㅚ': ['ㅗ', 'ㅣ'], 'ㅝ': ['ㅜ', 'ㅓ'], 'ㅞ': ['ㅜ', 'ㅔ'], 'ㅟ': ['ㅜ', 'ㅣ'], 'ㅢ': ['ㅡ', 'ㅣ'] };

function learnedBefore(id) {
  const c = new Set(), v = new Set();
  for (const s of STAGES.slice(0, id + 1)) { (s.letters || []).forEach(j => (isVowel(j) ? v : c).add(j)); }
  return { c: [...c], v: [...v] };
}
function stageSyllables(s) {
  const out = new Set();
  if (s.rule) for (const c of s.c) for (const v of s.v) out.add(compose(c, v));
  else if (s.bat) for (const w of s.words) for (const ch of w.w) out.add(ch);
  else for (const c of s.c) for (const v of s.v) out.add(compose(c, v));
  return [...out];
}
function makeItems(s) {
  const items = [];
  for (const j of s.letters || []) items.push({ t: 'learn', j });
  for (const b of s.batLearn || []) items.push({ t: 'learnBat', j: b });
  if (s.note && !(s.letters || []).length && !s.bat) items.unshift({ t: 'rule', note: s.note });
  if (s.final) return [s.extra[0], { t: 'word', w: s.words[0] }, s.extra[1], { t: 'word', w: s.words[1], last: true }];
  const syl = stageSyllables(s), sylNew = s.letters && s.letters.length ? syl.filter(x => { const d = decompose(x); return s.letters.includes(d.l) || s.letters.includes(d.v); }) : syl;
  const practice = [];
  if (!s.final) {
    pick(sylNew, 3).forEach(x => practice.push({ t: 'read', s: x }));
    pick(sylNew, 3).forEach(x => practice.push({ t: 'listen', s: x }));
    pick(s.bat ? syl : sylNew, s.build ? 1 : 2).forEach(x => practice.push({ t: 'build', s: x }));
  }
  const words = pick(s.words, s.build ? 5 : 3);
  words.slice(0, s.build ? 5 : 2).forEach(w => practice.push({ t: 'word', w }));
  if (!s.build && s.words.length >= 2) pick(s.words, Math.min(2, s.words.length)).forEach(w => practice.push({ t: 'pick', w }));
  (s.extra || []).forEach(x => practice.push(Object.assign({}, x)));
  const out = items.concat(shuffle(practice));

}
// distratores: sílabas "vizinhas" (trocando uma peça)
function neighborsOf(x, pool) {
  const d = decompose(x), out = new Set();
  for (const y of pool) if (y !== x) { const e = decompose(y); if (e && ((e.l === d.l) + (e.v === d.v) + (e.t === d.t)) >= 2) out.add(y); }
  for (const y of shuffle(pool)) { if (out.size >= 6) break; if (y !== x) out.add(y); }
  return [...out];
}

    sec.append(path);
    if (li === LANDS.length - 1) sec.append(el('div', { class: 'castle' }, el('img', { src: IMG.tromba, class: found ? '' : 'hidden', alt: found ? 'Senhor Tromba encontrado' : 'Senhor Tromba escondido' }),
      el('b', {}, found ? '찾았다! O Tromba está com o Pongo.' : 'O Senhor Tromba está escondido aqui…')));
    M.append(sec);
  });
  M.append(el('p', { class: 'note' }, 'As fases liberam uma a uma. ', el('button', { class: 'closex', style: 'float:none;font-size:.75rem', onclick: () => { G.unlocked = !G.unlocked; store.set('unlockAll', G.unlocked); renderMap(); } }, G.unlocked ? 'Modo professor: ligado' : 'Modo professor: liberar todas')));
  const now = M.querySelector('.node.now'); if (now && cur > 0) setTimeout(() => now.scrollIntoView({ block: 'center', behavior: 'smooth' }), 200);
}
function openChart() {

  C.append(el('button', { class: 'closex', onclick: () => { $('#chartOv').hidden = true; } }, 'Fechar'), el('h2', { style: 'font-family:var(--f-title);font-weight:400;margin:0' }, '한글 · O alfabeto'),
    el('p', { style: 'margin:.2rem 0;color:var(--ink-soft);font-weight:600' }, 'Toque para ouvir. As letras ficam coloridas quando você as aprende no jogo.'));
  sec('Vogais básicas', VOW_BASIC, 'v', sayOf); sec('Vogais compostas', ['ㅐ', 'ㅔ', 'ㅒ', 'ㅖ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅢ'], 'v', sayOf);
  sec('Consoantes', CON_BASIC, 'c', sayOf); sec('Consoantes duplas', ['ㄲ', 'ㄸ', 'ㅃ', 'ㅆ', 'ㅉ'], 'c', sayOf);
  sec('Batchim: os 7 sons finais', ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅇ'], 't', j => compose('ㅇ', 'ㅏ', j));
  $('#chartOv').hidden = false;
}
function setMusic(on) { if (on) Audio.start(); else Audio.stop(); $('#btnMusic').setAttribute('aria-pressed', !!on); }
