<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#4FE3FF" stop-opacity=".55"/><stop offset="1" stop-color="#4FE3FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8EEF8"/><stop offset=".5" stop-color="#9FB0CC"/><stop offset="1" stop-color="#5D6E8E"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset=".55" stop-color="#E0A92E"/><stop offset="1" stop-color="#A8701A"/></linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1FB6D9"/><stop offset="1" stop-color="#155C9C"/></linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#BFF4FF"/><stop offset="1" stop-color="#6FC9E6"/></linearGradient>
  </defs>
  <circle cx="200" cy="220" r="210" fill="url(#glow)"/>
  <!-- cape -->
  <path d="M120 190 Q90 330 70 430 L330 430 Q310 330 280 190 Z" fill="url(#cape)"/>
  <!-- sword -->
  <g transform="rotate(-18 300 250)">
    <rect x="292" y="40" width="22" height="210" rx="6" fill="url(#blade)" stroke="#2A6E8E" stroke-width="3"/>
    <path d="M292 40 L303 12 L314 40 Z" fill="#E9FDFF" stroke="#2A6E8E" stroke-width="3"/>
    <rect x="270" y="248" width="66" height="16" rx="6" fill="url(#gold)" stroke="#7A4E10" stroke-width="3"/>
    <!-- hourglass hilt -->
    <path d="M290 266 L316 266 L306 290 L316 314 L290 314 L300 290 Z" fill="#BFF4FF" stroke="#7A4E10" stroke-width="3"/>
    <path d="M296 306 L310 306 L303 296 Z" fill="#FFD25A"/>
    <circle cx="303" cy="324" r="9" fill="url(#gold)" stroke="#7A4E10" stroke-width="3"/>
  </g>
  <!-- body -->
  <path d="M140 200 Q200 180 260 200 L272 330 Q200 350 128 330 Z" fill="url(#steel)" stroke="#33415E" stroke-width="4"/>
  <circle cx="200" cy="262" r="30" fill="url(#gold)" stroke="#7A4E10" stroke-width="4"/>
  <circle cx="200" cy="262" r="18" fill="#0F1E4A"/>
  <path d="M200 262 L200 248 M200 262 L210 268" stroke="#4FE3FF" stroke-width="4" stroke-linecap="round"/>
  <!-- legs -->
  <rect x="148" y="330" width="40" height="90" rx="12" fill="url(#steel)" stroke="#33415E" stroke-width="4"/>
  <rect x="212" y="330" width="40" height="90" rx="12" fill="url(#steel)" stroke="#33415E" stroke-width="4"/>
  <rect x="140" y="408" width="56" height="24" rx="10" fill="url(#gold)" stroke="#7A4E10" stroke-width="3"/>
  <rect x="204" y="408" width="56" height="24" rx="10" fill="url(#gold)" stroke="#7A4E10" stroke-width="3"/>
  <!-- helmet -->
  <path d="M200 30 Q140 26 132 70" stroke="#1FB6D9" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M138 120 Q138 50 200 46 Q262 50 262 120 L262 170 Q200 196 138 170 Z" fill="url(#steel)" stroke="#33415E" stroke-width="5"/>
  <path d="M154 112 L246 112 L240 138 L160 138 Z" fill="#0F1E4A"/>
  <path d="M164 122 L236 122" stroke="#4FE3FF" stroke-width="6" stroke-linecap="round"/>
  <path d="M200 46 L200 112" stroke="url(#gold)" stroke-width="10"/>
  <circle cx="200" cy="80" r="14" fill="url(#gold)" stroke="#7A4E10" stroke-width="3"/>
  <!-- shield: clock gear -->
  <g transform="translate(118 268)">
    <g fill="url(#gold)" stroke="#7A4E10" stroke-width="3">
      <circle r="70"/>
      <g id="teeth"><rect x="-10" y="-84" width="20" height="20" rx="4"/></g>
      <use href="#teeth" transform="rotate(30)"/><use href="#teeth" transform="rotate(60)"/><use href="#teeth" transform="rotate(90)"/>
      <use href="#teeth" transform="rotate(120)"/><use href="#teeth" transform="rotate(150)"/><use href="#teeth" transform="rotate(180)"/>
      <use href="#teeth" transform="rotate(210)"/><use href="#teeth" transform="rotate(240)"/><use href="#teeth" transform="rotate(270)"/>
      <use href="#teeth" transform="rotate(300)"/><use href="#teeth" transform="rotate(330)"/>
    </g>
    <circle r="52" fill="#0F1E4A" stroke="#4FE3FF" stroke-width="4"/>
    <g stroke="#BFF4FF" stroke-width="4" stroke-linecap="round">
      <path d="M0 -44 L0 -36"/><path d="M44 0 L36 0"/><path d="M0 44 L0 36"/><path d="M-44 0 L-36 0"/>
    </g>
    <path d="M0 0 L0 -32" stroke="#FFD25A" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 0 L24 12" stroke="#4FE3FF" stroke-width="6" stroke-linecap="round"/>
    <circle r="7" fill="#FFD25A"/>
  </g>
</svg>
