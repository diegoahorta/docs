<title>Pongo Katakana World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
/* Layout: tela de console 16 bits — HUD em cima, janela do jogo em pixel art no meio, controles de toque embaixo.
   Visual de plataforma clássico (céu azul, morros com olhos, blocos "?") com tipografia pixel japonesa. */
:root{
  color-scheme: dark;
  --bezel:#1B1D3A; --bezel-2:#2A2D57; --ink:#14162E; --paper:#FFF6DC; --gold:#FFC93C; --red:#E8433E; --green:#3DBE5A; --sky:#6EC6FF; --pink:#FF5FA2;
  --f-pix:'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', monospace;
  --f-arcade:'Press Start 2P', 'DotGothic16', monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bezel);color:var(--paper);font-family:var(--f-pix);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

.hud{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.4rem 16px;background:var(--ink);border-bottom:4px solid #000}
.lvl{font-family:var(--f-arcade);font-size:.62rem;color:var(--gold);line-height:1.6;min-width:0}
.lvl b{display:block;font-family:var(--f-pix);font-size:1.05rem;color:var(--paper);font-weight:400}
.slots{display:flex;gap:.3rem;margin:0 auto}
.slot{width:44px;height:52px;border:3px solid #4B4F8A;background:#0E1024;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.7rem;line-height:1;color:#4B4F8A}
.slot small{font-family:var(--f-arcade);font-size:.45rem;margin-top:3px;color:#8A8FCC}
.slot.got{border-color:var(--gold);background:#3A2A00;color:var(--gold)}
.slot.next{border-color:var(--pink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{border-color:#4B4F8A}}
.stat{font-family:var(--f-arcade);font-size:.62rem;display:flex;gap:.8rem;align-items:center}
.hearts{color:var(--red);font-size:1rem;letter-spacing:.1em}
.hbtn{border:2px solid #4B4F8A;background:#0E1024;padding:.25rem .5rem;font-family:var(--f-arcade);font-size:.55rem}
.hbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

.stage{position:relative;display:grid;place-items:center;min-height:0;background:radial-gradient(circle at 50% 40%,#2A2D57,#14162E)}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid #000;box-shadow:0 0 0 4px var(--bezel-2);background:#6EC6FF;box-sizing:content-box}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--paper);color:var(--ink);border:3px solid #000;box-shadow:4px 4px 0 #000;padding:.35rem .8rem;font-size:1.15rem;max-width:calc(100% - 40px);text-align:center;pointer-events:none}
.toast.bad{background:#FFD9D6}
.toast.good{background:#DFF7C9}

.pad{display:none;justify-content:space-between;align-items:center;padding:.5rem 16px calc(.5rem + env(safe-area-inset-bottom,0px));background:var(--ink);border-top:4px solid #000;gap:1rem}
.pad .dirs,.pad .acts{display:flex;gap:.7rem}
.pbtn{width:74px;height:74px;border-radius:50%;border:4px solid #000;background:#3B3F78;box-shadow:0 5px 0 #000;font-family:var(--f-arcade);font-size:1.1rem;display:grid;place-items:center;touch-action:none}
.pbtn.jump{background:var(--red);width:88px;height:88px}
.pbtn.run{background:var(--gold);color:var(--ink);font-size:.8rem}
.pbtn.on{transform:translateY(4px);box-shadow:0 1px 0 #000}
.keys{font-family:var(--f-arcade);font-size:.5rem;color:#8A8FCC;text-align:center;padding:.4rem;background:var(--ink)}
@media (pointer:coarse), (max-width:820px){ .pad{display:flex} .keys{display:none} }

/* telas (título, mapa, cartões) */
.screen{position:fixed;inset:0;z-index:20;background:rgba(10,11,30,.86);display:grid;place-items:center;padding:16px;overflow:auto}
.panel{background:var(--paper);color:var(--ink);border:4px solid #000;box-shadow:8px 8px 0 #000;width:min(720px,100%);max-height:100%;overflow:auto;padding:1.1rem 1.2rem;box-sizing:border-box}
.panel h1{font-family:var(--f-arcade);font-size:clamp(1.1rem,4.5vw,1.9rem);line-height:1.4;margin:0;color:var(--red);text-shadow:3px 3px 0 #000;-webkit-text-stroke:1px #000;text-wrap:balance}
.panel h2{font-family:var(--f-arcade);font-size:.9rem;line-height:1.6;margin:.2rem 0 .6rem}
.panel p{font-size:1.05rem;line-height:1.5;margin:.4rem 0}
.title{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:1rem;align-items:center;background:linear-gradient(#6EC6FF,#BDE8FF);border:4px solid #000;padding:1rem;margin-bottom:.8rem}
.title img{width:170px;image-rendering:auto}
.title .jp{font-size:1.6rem;margin:.4rem 0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem}
.btn{border:4px solid #000;background:#fff;box-shadow:4px 4px 0 #000;padding:.55rem 1rem;font-family:var(--f-arcade);font-size:.7rem;line-height:1.5;color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.world{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:.6rem;margin-top:.6rem}
.wnode{border:4px solid #000;background:#fff;box-shadow:4px 4px 0 #000;padding:.5rem .3rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;color:var(--ink)}
.wnode b{font-size:1.9rem;line-height:1.1}
.wnode small{font-family:var(--f-arcade);font-size:.45rem;line-height:1.5}
.wnode .st{color:#E0A100;font-size:.9rem;letter-spacing:.1em}
.wnode .st i{color:#D9CFB5;font-style:normal}
.wnode.lock{background:#D9CFB5;opacity:.6;cursor:not-allowed}
.wnode.now{background:#FFE8A3}
.kanatab{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.45rem;margin:.6rem 0}
.kcard{border:4px solid #000;background:#fff;box-shadow:3px 3px 0 #000;display:flex;flex-direction:column;align-items:center;padding:.4rem .2rem;color:var(--ink)}
.kcard b{font-size:clamp(2rem,9vw,3rem);line-height:1.05;font-weight:400}
.kcard span{font-family:var(--f-arcade);font-size:.6rem}
.tips{margin:.4rem 0 0;padding-left:1.1rem;font-size:1rem;line-height:1.45}
.decoys{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;font-size:1rem}
.decoys b{font-weight:400;font-size:1.6rem;border:3px dashed var(--red);padding:0 .35rem;background:#FFE3E0}
.stars{font-size:2rem;color:#E0A100;letter-spacing:.15em}
.stars i{color:#D9CFB5;font-style:normal}
.face{width:120px;height:120px;object-fit:cover;border:4px solid #000;float:right;margin:0 0 .5rem .8rem;background:#fff}
.note{font-size:.85rem;color:#5A5C78}
@media (max-width:560px){ .title{grid-template-columns:minmax(0,1fr) 100px} .title img{width:100px} .slot{width:36px;height:44px;font-size:1.35rem} .face{width:84px;height:84px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important} }
</style>

<div id="app">
  <header class="hud">
    <div class="lvl" id="lvlName">WORLD 1-1<b>ア行</b></div>
    <div class="slots" id="slots" aria-label="Linha do katakana"></div>
    <div class="stat"><span class="hearts" id="hearts" aria-label="Vidas">♥♥♥</span><span id="miss" title="Kana errados">✕0</span></div>
    <button class="hbtn" id="btnMusic" aria-pressed="true">♪ ON</button>
    <button class="hbtn" id="btnMap">MAPA</button>
  </header>
  <section class="stage"><canvas id="cv" width="320" height="208" aria-label="Fase do jogo"></canvas><div class="toast" id="toast" hidden></div></section>
  <div>
    <div class="pad" id="pad">
      <div class="dirs"><button class="pbtn" data-k="left" aria-label="Esquerda">◀</button><button class="pbtn" data-k="right" aria-label="Direita">▶</button></div>
      <div class="acts"><button class="pbtn run" data-k="run" aria-label="Correr">B</button><button class="pbtn jump" data-k="jump" aria-label="Pular">A</button></div>
    </div>
    <div class="keys">← → andar · ESPAÇO / ↑ / Z pular · SHIFT / X correr · P pausa</div>
  </div>
</div>
<div class="screen" id="scr"><div class="panel" id="panel"></div></div>

<script>
"use strict";
const IMG = /*__ASSETS__*/{};
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids) if (k != null && k !== false) e.append(k);
  return e;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('pongo-kata:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pongo-kata:' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ============================================================
   KATAKANA — linhas, romaji, dicas e kana parecidos (os "impostores")
   ============================================================ */
const ROMA = { ア: 'a', イ: 'i', ウ: 'u', エ: 'e', オ: 'o', カ: 'ka', キ: 'ki', ク: 'ku', ケ: 'ke', コ: 'ko', サ: 'sa', シ: 'shi', ス: 'su', セ: 'se', ソ: 'so',
  タ: 'ta', チ: 'chi', ツ: 'tsu', テ: 'te', ト: 'to', ナ: 'na', ニ: 'ni', ヌ: 'nu', ネ: 'ne', ノ: 'no', ハ: 'ha', ヒ: 'hi', フ: 'fu', ヘ: 'he', ホ: 'ho',
  マ: 'ma', ミ: 'mi', ム: 'mu', メ: 'me', モ: 'mo', ヤ: 'ya', ユ: 'yu', ヨ: 'yo', ラ: 'ra', リ: 'ri', ル: 'ru', レ: 're', ロ: 'ro', ワ: 'wa', ヲ: 'wo', ン: 'n',
  ガ: 'ga', ザ: 'za', ダ: 'da', バ: 'ba', パ: 'pa', ボ: 'bo', ポ: 'po' };
const LOOK = { ア: 'マ', イ: 'ト', ウ: 'ワ', エ: 'ユ', オ: 'ホ', カ: 'ヤ', キ: 'モ', ク: 'ワ', ケ: 'ク', コ: 'ユ', サ: 'セ', シ: 'ツ', ス: 'ヌ', セ: 'サ', ソ: 'ン',
  タ: 'ク', チ: 'テ', ツ: 'シ', テ: 'チ', ト: 'イ', ナ: 'メ', ニ: 'ユ', ヌ: 'ス', ネ: 'ホ', ノ: 'ソ', ハ: 'ル', ヒ: 'ト', フ: 'ウ', ヘ: 'ク', ホ: 'オ',
  マ: 'ア', ミ: 'シ', ム: 'ス', メ: 'ナ', モ: 'キ', ヤ: 'カ', ユ: 'コ', ヨ: 'ユ', ラ: 'ヲ', リ: 'ソ', ル: 'レ', レ: 'ル', ロ: 'コ', ワ: 'ウ', ヲ: 'ラ', ン: 'ソ',
  ガ: 'カ', ザ: 'サ', ダ: 'タ', バ: 'ハ', パ: 'バ', ト2: 'イ', ロ2: 'コ', バ2: 'パ' };
const LEVELS = [
  { name: 'ア行', row: ['ア', 'イ', 'ウ', 'エ', 'オ'], theme: 0, tips: ['ア parece uma bandeirinha virada: a.', 'イ são dois tracinhos, como uma pessoa encostada (i).', 'ウ tem um chapéu: u.', 'エ parece um I deitado: e.', 'オ tem um tracinho a mais que o “+”: o.'] },
  { name: 'カ行', row: ['カ', 'キ', 'ク', 'ケ', 'コ'], theme: 0, tips: ['カ é igual ao hiragana か sem o pontinho.', 'キ tem duas linhas atravessadas: ki (chave).', 'ク é como um “7” curvado: ku.', 'コ é um quadrado aberto: ko.'] },
  { name: 'サ行', row: ['サ', 'シ', 'ス', 'セ', 'ソ'], theme: 1, tips: ['シ: os tracinhos estão à ESQUERDA e o traço sobe de baixo para cima.', 'ツ (tsu) é a impostora: tracinhos em cima, traço desce.', 'ソ: um tracinho só, traço desce de cima. ン é a impostora.'] },
  { name: 'タ行', row: ['タ', 'チ', 'ツ', 'テ', 'ト'], theme: 1, tips: ['タ parece ク com um tracinho dentro.', 'ツ: tracinhos em cima, traço desce (não confunda com シ).', 'ト parece uma letra “t” sem a parte de cima: to.'] },
  { name: 'ナ行', row: ['ナ', 'ニ', 'ヌ', 'ネ', 'ノ'], theme: 2, tips: ['ナ é uma cruz torta: na.', 'ニ são dois traços, como o número 2 (ni).', 'ヌ parece ス com um corte: nu.', 'ノ é um traço só, para baixo: no.'] },
  { name: 'ハ行', row: ['ハ', 'ヒ', 'フ', 'ヘ', 'ホ'], theme: 2, tips: ['ハ são duas perninhas abertas, rindo “ha ha”.', 'ヘ é igual ao hiragana へ: he.', 'フ é um gancho: fu.', 'ホ é uma cruz com dois pezinhos: ho.'] },
  { name: 'マ行', row: ['マ', 'ミ', 'ム', 'メ', 'モ'], theme: 3, tips: ['マ parece um ア sem o tracinho de baixo.', 'ミ são três tracinhos inclinados: mi (3 = mi em japonês).', 'メ é um X torto: me.', 'モ parece キ com um gancho: mo.'] },
  { name: 'ヤ行', row: ['ヤ', 'ユ', 'ヨ'], theme: 3, tips: ['A linha ヤ só tem 3 kana: ヤ ユ ヨ.', 'ユ é um U de lado: yu.', 'ヨ parece um E ao contrário: yo.'] },
  { name: 'ラ行', row: ['ラ', 'リ', 'ル', 'レ', 'ロ'], theme: 4, tips: ['リ são dois traços, como o hiragana り.', 'ル tem duas perninhas, a da direita com voltinha. レ é só a perninha com voltinha.', 'ロ é um quadrado fechado: ro.'] },
  { name: 'ワ行', row: ['ワ', 'ヲ', 'ン'], theme: 4, tips: ['ワ parece ウ sem o chapéu: wa.', 'ヲ é usado como partícula (o).', 'ン: o traço sobe de baixo para cima. ソ é a impostora.'] },
  { name: '゛゜', row: ['ガ', 'ザ', 'ダ', 'バ', 'パ'], theme: 5, tips: ['Dakuten (゛, dois risquinhos) deixa o som “sonoro”: カ ka → ガ ga.', 'Handakuten (゜, bolinha) só aparece na linha ハ: ハ ha → パ pa.'] },
  { name: 'トロンバ', row: ['ト', 'ロ', 'ン', 'バ'], theme: 5, final: true, tips: ['Junte os kana para escrever o nome do Senhor Tromba: トロンバ!'] }
];
LEVELS.forEach((L, i) => { L.id = i; L.decoys = L.final ? ['イ', 'コ', 'ソ', 'パ'] : [...new Set(L.row.map(k => LOOK[k]).filter(k => !L.row.includes(k)))].slice(0, 4); });

/* ============================================================
   SOM 8 BITS — trilha original (onda quadrada, triângulo e ruído) e efeitos
   ============================================================ */
const Chip = {
  ctx: null, master: null, music: null, sfx: null, on: true, timer: null, waves: {},
  init() {
    if (this.ctx) { this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = .5; this.master.connect(c.destination);
    this.music = c.createGain(); this.music.gain.value = .55; this.music.connect(this.master);
    this.sfx = c.createGain(); this.sfx.gain.value = .8; this.sfx.connect(this.master);
    for (const duty of [.125, .25, .5]) { // ondas de pulso, como nos consoles
      const n = 32, re = new Float32Array(n), im = new Float32Array(n);
      for (let k = 1; k < n; k++) im[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * duty);
      this.waves[duty] = c.createPeriodicWave(re, im);
    }
    const len = c.sampleRate * .5; this.noise = c.createBuffer(1, len, c.sampleRate); const d = this.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  f: n => 440 * Math.pow(2, (n - 69) / 12),
  note(n, t, d, duty, v, dest, slide) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    if (duty === 'tri') o.type = 'triangle'; else o.setPeriodicWave(this.waves[duty]);
    o.frequency.setValueAtTime(this.f(n), t); if (slide) o.frequency.exponentialRampToValueAtTime(this.f(n + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.setValueAtTime(v, t + d * .75); g.gain.linearRampToValueAtTime(0, t + d);
    o.connect(g); g.connect(dest || this.music); o.start(t); o.stop(t + d + .02);
  },
  hit(t, kind, dest) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = this.noise;
    f.type = kind === 'hat' ? 'highpass' : 'bandpass'; f.frequency.value = kind === 'hat' ? 7000 : 1800;
    const v = kind === 'hat' ? .12 : .35, d = kind === 'hat' ? .04 : .12; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    s.connect(f); f.connect(g); g.connect(dest || this.music); s.start(t); s.stop(t + d + .02);
    if (kind === 'kick') this.note(40, t, .12, 'tri', .6, dest, -18);
  },
  // melodia original em Dó maior, 150 BPM, colcheias (0 = pausa)
  SONG: {
    lead: [72, 76, 79, 76, 81, 79, 76, 72, 74, 77, 81, 77, 79, 77, 74, 71, 72, 76, 79, 84, 83, 81, 79, 76, 77, 76, 74, 72, 74, 0, 67, 0,
      76, 0, 76, 77, 79, 0, 76, 72, 81, 0, 81, 79, 77, 0, 74, 0, 79, 81, 79, 77, 76, 72, 74, 76, 72, 0, 67, 0, 72, 0, 0, 0],
    bass: [48, 55, 50, 57, 48, 55, 53, 55, 48, 55, 53, 60, 55, 59, 48, 48],
    chords: [[60, 64, 67], [62, 65, 69], [60, 64, 67], [65, 69, 72], [60, 64, 67], [65, 69, 72], [67, 71, 74], [60, 64, 67]]
  },
  start() {
    this.init(); if (!this.ctx || this.timer) return;
    this.step = 0; this.next = this.ctx.currentTime + .1; const st = 60 / 150 / 2;
    this.timer = setInterval(() => {
      if (!this.on) return;
      while (this.next < this.ctx.currentTime + .15) { this.play(this.step, this.next, st); this.next += st; this.step++; }
    }, 25);
  },
  play(i, t, st) {
    const S = this.SONG, s = i % 64;
    if (S.lead[s]) this.note(S.lead[s], t, st * .9, .25, .14);
    if (s % 4 === 0) this.note(S.bass[(s / 4) % 16], t, st * 3.6, 'tri', .32);
    const ch = S.chords[Math.floor(s / 8) % 8]; this.note(ch[(i % 3)] + 12, t, st * .45, .125, .045); // arpejo baixinho
    if (s % 4 === 0) this.hit(t, 'kick'); if (s % 8 === 4) this.hit(t, 'snare'); this.hit(t, 'hat');
  },
  setOn(v) { this.on = v; if (this.music && this.ctx) { this.music.gain.setTargetAtTime(v ? .55 : 0, this.ctx.currentTime, .05); if (v) this.next = this.ctx.currentTime + .05; } },
  fx(name) {
    if (!this.ctx) return; const t = this.ctx.currentTime, D = this.sfx;
    const seq = (notes, d, duty, v) => notes.forEach((n, k) => this.note(n, t + k * d, d * .95, duty, v, D));
    switch (name) {
      case 'jump': this.note(62, t, .16, .25, .16, D, 12); break;
      case 'kana': seq([83, 88], .07, .5, .16); break;
      case 'wrong': seq([55, 50], .1, .25, .18); break;
      case 'stomp': this.note(70, t, .1, .5, .18, D, -14); break;
      case 'bump': this.note(43, t, .08, .5, .2, D); break;
      case 'block': seq([72, 79], .05, .25, .14); break;
      case 'hurt': seq([64, 60, 55, 52], .07, .125, .18); break;
      case 'door': seq([60, 64, 67, 72, 76, 79, 84], .06, .25, .14); break;
      case 'clear': seq([67, 72, 76, 79, 84, 0, 79, 84], .1, .25, .15); seq([55, 60, 64, 67, 72, 0, 67, 72], .1, 'tri', .25); break;
      case 'over': seq([67, 66, 65, 64, 60], .16, .5, .14); break;
      case 'tromba': seq([72, 76, 79, 84, 88, 84, 88, 91], .09, .25, .15); break;
    }
  }
};
let jaVoice = null;
function pickVoice() { try { jaVoice = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)) || null; } catch (e) {} }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice; u.rate = .8; speechSynthesis.speak(u); } catch (e) {} }

/* ============================================================
   FASES — gerador de mapa (tiles de 16 px, 13 linhas de altura)
   0 vazio · 1 chão · 2 tijolo · 3 bloco "?" · 4 bloco usado · 5 cano · 6 nuvem (atravessável por baixo) · 9 porta
   ============================================================ */
const TS = 16, ROWS = 13, VW = 320, VH = 208;
const THEMES = [
  { name: 'GRASS', sky: '#6EC6FF', sky2: '#BDE8FF', hill: '#3DBE5A', hill2: '#2A9442', top: '#4CD964', dirt: '#C47A3A', dirt2: '#9A5A26', brick: '#C8602C', enemy: '#8E44AD' },

function drawEnemy(e, x, y, time, th) {
  if (!e.alive) { if (e.squash > 0) { rect(x, y + 10, 14, 4, th.enemy); rect(x + 3, y + 10, 2, 1, '#FFF'); rect(x + 9, y + 10, 2, 1, '#FFF'); } return; }
  const f = Math.floor(time * 6) % 2;
  rect(x + 1, y + 2, 12, 10, th.enemy); rect(x + 2, y + 1, 10, 1, th.enemy); rect(x, y + 4, 14, 6, th.enemy);
  rect(x + 3, y + 4, 3, 3, '#FFF'); rect(x + 8, y + 4, 3, 3, '#FFF'); rect(x + (e.vx < 0 ? 3 : 4), y + 5, 1, 2, '#14162E'); rect(x + (e.vx < 0 ? 8 : 9), y + 5, 1, 2, '#14162E');
  rect(x + 1, y + 12, 4, 2, '#14162E'); rect(x + 9, y + 12, 4, 2, '#14162E'); if (f) { rect(x, y + 12, 4, 2, '#14162E'); rect(x + 10, y + 12, 4, 2, '#14162E'); }
  rect(x + 1, y + 2, 12, 1, 'rgba(255,255,255,.4)');
}
function drawPongo(time) {
  if (P.inv > 0 && Math.floor(time * 20) % 2 && S.mode === 'play') return;
  const running = Math.abs(P.vx) > 20 || !P.onGround, im = running ? SPR.px_pongo_run : SPR.px_pongo_stand;
  if (!im.complete || !im.width) return;
  const bob = running && P.onGround ? (Math.floor(P.anim * 3) % 2) : 0;
  const x = Math.round(P.x + P.w / 2 - S.cam), y = Math.round(P.y + P.h - im.height - bob);
  g.save(); g.translate(x, y); if (P.face < 0) g.scale(-1, 1); g.drawImage(im, -Math.round(im.width / 2), 0); g.restore();
}
function render(time) {
  const M = S.map; if (!M) { drawBG(THEMES[0], time * 20, time); return; }
  const th = M.theme, cam = Math.round(S.cam);
  drawBG(th, cam, time);
  const c0 = Math.floor(cam / TS), c1 = c0 + Math.ceil(VW / TS) + 1;
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) { const t = tileAt(c, r); if (t && t !== 9) drawTile(t, c * TS - cam, r * TS, c, r, th, time); }
  drawDoor(M.door.c * TS - cam, M.door.r * TS);
  g.fillStyle = '#FFF6DC'; g.font = '8px DotGothic16'; g.textAlign = 'left'; g.textBaseline = 'top'; g.fillText(S.lvl.name, M.door.c * TS - cam + 10, M.door.r * TS - 22);
  for (const it of M.items) if (it.alive) { const x = Math.round(it.x - cam); if (x > -20 && x < VW + 20) drawKana(it, x, Math.round(it.y), time); }
  for (const e of M.enemies) { const x = Math.round(e.x - cam); if (x > -20 && x < VW + 20) drawEnemy(e, x, Math.round(e.y), time, th); }
  if (S.tromba) { // o Tromba sai da porta no castelo final
    const im = SPR.px_tromba, k = Math.min(1, S.tromba.t / .8), tx = M.door.c * TS - cam + 22, ty = M.door.r * TS + 32 - im.height - Math.abs(Math.sin(S.tromba.t * 6)) * 6 * k;
    if (im.complete) { g.globalAlpha = k; g.drawImage(im, Math.round(tx), Math.round(ty)); g.globalAlpha = 1; }
    if (S.tromba.t > 1) { g.fillStyle = '#14162E'; g.fillRect(tx - 30, ty - 20, 76, 14); g.fillStyle = '#FFC93C'; g.font = '10px DotGothic16'; g.textAlign = 'center'; g.fillText('ポンゴ！', tx + 8, ty - 13); }
  }
  drawPongo(time);
  for (const p of S.parts) rect(p.x - cam, p.y, 2, 2, p.col);
  if (S.pause) { g.fillStyle = 'rgba(20,22,46,.6)'; g.fillRect(0, 0, VW, VH); g.fillStyle = '#FFF6DC'; g.font = '16px "Press Start 2P"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('PAUSE', VW / 2, VH / 2); }
}

/* ============================================================
   HUD, TELAS E FLUXO
   ============================================================ */
function renderHUD() {
  const L = S.lvl, box = $('#slots'); box.innerHTML = '';
  if (L) L.row.forEach((k, i) => box.append(el('div', { class: 'slot' + (i < S.next ? ' got' : i === S.next ? ' next' : '') }, i < S.next ? k : '?', el('small', {}, ROMA[k]))));
  $('#hearts').textContent = '♥'.repeat(Math.max(0, S.hearts)) + '♡'.repeat(Math.max(0, 3 - S.hearts));
  $('#miss').textContent = '✕' + S.miss;
}
function toast(msg, kind, secs) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (kind ? ' ' + kind : ''); t.hidden = false; S.toastT = secs || 2; }
function showScreen(content) { const p = $('#panel'); p.innerHTML = ''; p.append(content); $('#scr').hidden = false; }
function hideScreen() { $('#scr').hidden = true; }
const isOpen = id => S.unlocked || id === 0 || (S.best[id - 1] || 0) > 0;
function openTitle() {
  S.mode = 'title';
  showScreen(el('div', {},
    el('div', { class: 'title' }, el('div', {}, el('h1', {}, 'PONGO KATAKANA WORLD'), el('div', { class: 'jp' }, 'トロンバを さがせ！'),
      el('p', {}, 'O Senhor Tromba sumiu! Corra, pule e pegue os katakana na ordem de cada linha para abrir as portas e chegar ao castelo.')),
      el('img', { src: IMG.hero_tromba, alt: 'Pongo e o Senhor Tromba' })),
    el('div', { class: 'row' }, el('button', { class: 'btn red', onclick: () => { Chip.init(); Chip.start(); openMap(); } }, '▶ JOGAR'),
      el('button', { class: 'btn', onclick: () => { Chip.init(); Chip.start(); Chip.setOn(false); $('#btnMusic').setAttribute('aria-pressed', 'false'); $('#btnMusic').textContent = '♪ OFF'; openMap(); } }, 'JOGAR SEM SOM')),
    el('p', { class: 'note' }, 'Teclado: ← → andar, ESPAÇO pular, SHIFT correr. No celular, use os botões na parte de baixo.')));
}
function openMap() {
  S.mode = 'map'; S.pause = false;
  const cur = LEVELS.findIndex(L => !(S.best[L.id] > 0));
  const grid = el('div', { class: 'world' });
  for (const L of LEVELS) {
    const st = S.best[L.id] || 0, open = isOpen(L.id);
    grid.append(el('button', { class: 'wnode' + (open ? '' : ' lock') + (L.id === cur ? ' now' : ''), disabled: !open, onclick: () => openIntro(L.id) },
      el('small', {}, 'WORLD ' + (L.id + 1)), el('b', {}, L.final ? '🐘' : L.row[0]), el('small', {}, L.name), el('span', { class: 'st' }, '★'.repeat(st), el('i', {}, '★'.repeat(3 - st)))));
  }
  showScreen(el('div', {}, el('h2', {}, 'MAPA DO MUNDO'), el('p', {}, cur === -1 ? 'Você encontrou o Senhor Tromba! Jogue de novo para conseguir 3 estrelas em tudo.' : 'Cada mundo é uma linha do katakana. O Tromba espera no castelo do último mundo.'), grid,
    el('div', { class: 'row' }, el('button', { class: 'btn', onclick: () => { S.unlocked = !S.unlocked; store.set('unlock', S.unlocked); openMap(); } }, S.unlocked ? 'PROFESSOR: TUDO LIBERADO' : 'MODO PROFESSOR'), el('button', { class: 'btn', onclick: openTitle }, 'TÍTULO'))));
}
function openIntro(id) {
  const L = LEVELS[id];
  const tab = el('div', { class: 'kanatab', style: `grid-template-columns:repeat(${Math.max(3, L.row.length)},minmax(0,1fr))` });
  for (const k of L.row) tab.append(el('button', { class: 'kcard', onclick: () => speak(k) }, el('b', {}, k), el('span', {}, ROMA[k])));
  showScreen(el('div', {}, el('img', { class: 'face', src: L.final ? IMG.surpreso : IMG.feliz, alt: 'Pongo' }), el('h2', {}, `WORLD ${id + 1} · ${L.name}`),
    el('p', {}, L.final ? 'Último castelo! Pegue os kana do nome do Senhor Tromba: ト ロ ン バ.' : `Pegue os kana na ordem: ${L.row.join(' → ')}. Toque em cada um para ouvir.`), tab,
    el('ul', { class: 'tips' }, ...L.tips.map(t => el('li', {}, t))),
    el('p', { class: 'decoys' }, 'Cuidado com os impostores:', ...L.decoys.map(k => el('b', {}, k))),
    el('div', { class: 'row' }, el('button', { class: 'btn red', onclick: () => startLevel(id) }, '▶ COMEÇAR'), el('button', { class: 'btn', onclick: openMap }, 'MAPA'))));
}
function levelClear() {
  const L = S.lvl, lost = 3 - S.hearts, stars = S.miss + lost === 0 ? 3 : S.miss + lost <= 2 ? 2 : 1;
  S.best[L.id] = Math.max(S.best[L.id] || 0, stars); store.set('stars', S.best); S.mode = 'clear';
  const tab = el('div', { class: 'kanatab', style: `grid-template-columns:repeat(${Math.max(3, L.row.length)},minmax(0,1fr))` });
  for (const k of L.row) tab.append(el('button', { class: 'kcard', onclick: () => speak(k) }, el('b', {}, k), el('span', {}, ROMA[k])));
  const next = LEVELS[L.id + 1];
  showScreen(el('div', {}, el('img', { class: 'face', src: L.final ? IMG.t_companhia : IMG.empolgado, alt: 'Pongo comemorando' }),
    el('h1', {}, L.final ? 'トロンバ！' : 'COURSE CLEAR!'),
    el('div', { class: 'stars', 'aria-label': `${stars} de 3 estrelas` }, '★'.repeat(stars), el('i', {}, '★'.repeat(3 - stars))),
    el('p', {}, L.final ? 'O Pongo encontrou o Senhor Tromba no castelo! Você completou todas as linhas do katakana. ずっと いっしょ!' : `Linha ${L.name} completa! Leia em voz alta:`), tab,
    el('p', { class: 'note' }, `Kana errados: ${S.miss} · vidas perdidas: ${lost}`),
    el('div', { class: 'row' }, next ? el('button', { class: 'btn red', onclick: () => openIntro(next.id) }, '▶ PRÓXIMO MUNDO') : null,
      el('button', { class: 'btn', onclick: () => openIntro(L.id) }, 'REPETIR'), el('button', { class: 'btn', onclick: openMap }, 'MAPA'))));
  speak(L.row.join(''));
}

/* ============================================================
   CONTROLES E LAÇO PRINCIPAL
   ============================================================ */
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', ShiftLeft: 'run', ShiftRight: 'run', KeyX: 'run' };
function press(k, on) { if (k === 'jump' && on && !K.jump) P.buffer = .12; K[k] = on; }
addEventListener('keydown', e => {
  if (e.code === 'KeyP' && S.mode === 'play') { S.pause = !S.pause; return; }
  const k = KEYMAP[e.code]; if (!k || !$('#scr').hidden) return; e.preventDefault(); if (!e.repeat) press(k, true);
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) press(k, false); });
for (const b of document.querySelectorAll('.pbtn')) {
  const k = b.dataset.k, on = e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); b.classList.add('on'); press(k, true); }, off = e => { b.classList.remove('on'); press(k, false); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
}
$('#btnMusic').onclick = () => { Chip.init(); Chip.start(); const on = $('#btnMusic').getAttribute('aria-pressed') !== 'true'; Chip.setOn(on); $('#btnMusic').setAttribute('aria-pressed', on); $('#btnMusic').textContent = on ? '♪ ON' : '♪ OFF'; };
$('#btnMap').onclick = () => { if (S.mode === 'play') S.pause = true; openMap(); };
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play') S.pause = true; });

// amplia a janela do jogo para ocupar o espaço disponível (escala inteira quando cabe, para os pixels ficarem nítidos)
function fit() {
  const st = $('.stage'), aw = st.clientWidth - 24, ah = st.clientHeight - 24;
  let k = Math.min(aw / VW, ah / VH); if (k >= 2) k = Math.floor(k); k = Math.max(.5, k);
  cv.style.width = Math.round(VW * k) + 'px'; cv.style.height = Math.round(VH * k) + 'px';
}
addEventListener('resize', fit); setTimeout(fit, 0);
let last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  acc += Math.min(.25, (now - last) / 1000); last = now;
  try {
    while (acc >= 1 / 120) { if (!S.pause && $('#scr').hidden) update(1 / 120); acc -= 1 / 120; }
    render(now / 1000);
  } catch (e) { console.error(e); }
}
renderHUD(); openTitle(); requestAnimationFrame(loop);
</script>
