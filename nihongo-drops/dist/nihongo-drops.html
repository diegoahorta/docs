    <style>
/* ==========================================================
   Nihongo Drops — estilos globais
   Tema noturno com bom contraste (WCAG AA) e kana em fonte grande.
   ========================================================== */

:root {
  --cor-fundo: #0f1630;
  --cor-fundo-2: #18224a;
  --cor-superficie: #1f2b5c;
  --cor-superficie-2: #2a3a78;
  --cor-borda: #3d4c8f;
  --cor-texto: #f4f6ff;
  --cor-texto-suave: #c3cbef;
  --cor-destaque: #ff8fb1;
  --cor-destaque-2: #ffd166;
  --cor-acerto: #5be49b;
  --cor-erro: #ff6b6b;
  --cor-foco: #ffd166;

  /*
   * Caixas do SRS: escala ordinal de um só tom (mais claro = mais dominado),
   * validada contra os fundos escuros (contraste ≥ 3:1, passos visíveis).
   * Nível 0 = ainda não visto (cinza neutro).
   */
  --nivel-0: #5b6380;
  --nivel-1: #3a8f6e;
  --nivel-2: #4aa982;
  --nivel-3: #5dc497;
  --nivel-4: #7ddcb0;
  --nivel-5: #b0f0d0;

  --fonte: 'Noto Sans JP', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --tam-kana-grande: clamp(3rem, 12vw, 5.5rem);
  --tam-kana-medio: clamp(1.6rem, 6vw, 2.2rem);
  --altura-hud: 60px;
  --raio: 14px;
  --sombra: 0 12px 32px rgb(0 0 0 / 0.4);

  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  background: var(--cor-fundo);
  color: var(--cor-texto);
  font-family: var(--fonte);
  font-size: 1rem;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

h1,
h2,
h3 {
  line-height: 1.2;
  margin: 0 0 0.5rem;
}

a {
  color: var(--cor-destaque-2);
}

button {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--cor-foco);
  outline-offset: 3px;
}

[hidden] {
  display: none !important;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.pular-conteudo {
  position: fixed;
  left: 1rem;
  top: -4rem;
  z-index: 100;
  background: var(--cor-destaque-2);
  color: #1a1a1a;
  padding: 0.5rem 1rem;
  border-radius: var(--raio);
}

.pular-conteudo:focus {
  top: 1rem;
}

.texto-suave {
  color: var(--cor-texto-suave);
}

/* ---------- Kana e romaji ---------- */

.kana {
  font-family: var(--fonte);
  font-weight: 700;
  line-height: 1;
}

.kana-grande {
  font-size: var(--tam-kana-grande);
}

.kana-medio {
  font-size: var(--tam-kana-medio);
  font-weight: 700;
}

.romaji {
  color: var(--cor-texto-suave);
  letter-spacing: 0.02em;
}

/* O jogador pode esconder o romaji nas configurações. */
[data-romaji='off'] .romaji {
  display: none;
}

/* ---------- Botões ---------- */

.botao,
.botao-hud,
.botao-icone,
.botao-fala,
.botao-fase {
  cursor: pointer;
  border: 0;
  min-height: 44px;
  touch-action: manipulation;
}

.botao {
  background: var(--cor-destaque);
  color: #1b1030;
  font-weight: 700;
  padding: 0.6rem 1.2rem;
  border-radius: 999px;
}

.botao:hover {
  filter: brightness(1.08);
}

.botao-secundario {
  background: var(--cor-superficie-2);
  color: var(--cor-texto);
}

.botao-perigo {
  background: transparent;
  color: var(--cor-erro);
  border: 2px solid var(--cor-erro);
}

.botao-icone {
  min-width: 44px;
  background: transparent;
  border-radius: 50%;
  font-size: 1.2rem;
}

.botao-icone:hover {
  background: var(--cor-superficie-2);
}

.botao-fala {
  min-width: 44px;
  border-radius: 50%;
  background: var(--cor-superficie-2);
  font-size: 1.15rem;
}

.botao-fala:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ---------- HUD ---------- */

.hud {
  position: fixed;
  inset: 0 0 auto;
  height: var(--altura-hud);
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  background: linear-gradient(rgb(15 22 48 / 0.95), rgb(15 22 48 / 0.7));
  border-bottom: 1px solid rgb(255 255 255 / 0.06);
  backdrop-filter: blur(6px);
}

.hud-esquerda,
.hud-status,
.hud-direita {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.hud-status {
  flex: 1;
  justify-content: center;
  min-width: 0;
}

.hud-marca {
  font-weight: 900;
  font-size: 1.3rem;
}

.hud-marca-texto {
  font-weight: 700;
  color: var(--cor-destaque);
}

.hud-nivel {
  font-weight: 900;
  color: var(--cor-destaque-2);
  white-space: nowrap;
}

.hud-xp {
  position: relative;
  width: min(220px, 28vw);
  height: 12px;
  border-radius: 999px;
  background: var(--cor-superficie);
  overflow: hidden;
}

.hud-xp-preenchimento {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: linear-gradient(90deg, var(--cor-destaque), var(--cor-destaque-2));
  border-radius: inherit;
}

.hud-sequencia {
  white-space: nowrap;
  font-weight: 700;
}

.botao-hud {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0 0.75rem;
  border-radius: 999px;
  background: var(--cor-superficie);
}

.botao-hud:hover {
  background: var(--cor-superficie-2);
}

/* ---------- Área principal ---------- */

.conteudo {
  position: fixed;
  inset: var(--altura-hud) 0 0;
  outline: none;
}

.tela {
  position: relative;
  width: 100%;
  height: 100%;
}

.cortina {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 40%, var(--cor-fundo-2), var(--cor-fundo));
  opacity: 0;
  pointer-events: none;
  font-size: 2rem;
  font-weight: 900;
  color: var(--cor-destaque);
}

.cortina.ativa {
  pointer-events: auto;
}

/* ---------- Menu ---------- */

.tela-menu,
.tela-jogo,
.menu-palco {
  position: absolute;
  inset: 0;
}

.menu-palco {
  background: radial-gradient(circle at 50% 30%, var(--cor-fundo-2), var(--cor-fundo));
}

.menu-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.menu-sobreposicao {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 1rem;
  pointer-events: none;
}

.menu-cabecalho h1 {
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 900;
  text-shadow: 0 4px 18px rgb(0 0 0 / 0.6);
  outline: none;
}

.menu-subtitulo-jp {
  margin: 0;
  font-size: 1.2rem;
  color: var(--cor-destaque);
  font-weight: 700;
}

.menu-subtitulo {
  margin: 0;
  color: var(--cor-texto-suave);
}

.lista-fases {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 0.6rem;
  pointer-events: auto;
}

.botao-fase {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.55rem 0.8rem;
  text-align: left;
  border-radius: var(--raio);
  background: rgb(31 43 92 / 0.88);
  border: 2px solid transparent;
  box-shadow: var(--sombra);
  transition:
    border-color 0.2s,
    transform 0.2s;
}

.botao-fase:hover,
.botao-fase.destacada {
  border-color: var(--cor-fase);
  transform: translateY(-2px);
}

.botao-fase.bloqueada {
  opacity: 0.7;
}

.botao-fase-numero {
  flex: none;
  display: grid;
  place-items: center;
  width: 2.2rem;
  height: 2.2rem;
  border-radius: 50%;
  background: var(--cor-fase);
  color: #141a33;
  font-weight: 900;
}

.botao-fase-textos {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.botao-fase-jp,
.botao-fase-status {
  font-size: 0.85rem;
  color: var(--cor-texto-suave);
}

.sem-3d .menu-sobreposicao {
  justify-content: flex-start;
  gap: 2rem;
}

/* ---------- Modais ---------- */

.modal-fundo {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgb(5 8 20 / 0.7);
}

.modal {
  width: min(560px, 100%);
  max-height: min(88dvh, 900px);
  display: flex;
  flex-direction: column;
  background: var(--cor-fundo-2);
  border: 1px solid var(--cor-borda);
  border-radius: calc(var(--raio) * 1.4);
  box-shadow: var(--sombra);
}

.modal-largo {
  width: min(720px, 100%);
}

.modal-cabecalho {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem 1rem 0.5rem 1.25rem;
}

.modal-cabecalho h2 {
  margin: 0;
  font-size: 1.3rem;
}

.modal-corpo {
  overflow: auto;
  padding: 0 1.25rem 1.25rem;
}

/* ---------- Configurações ---------- */

.campo {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  margin: 0 0 1.1rem;
  padding: 0;
  border: 0;
}

.campo legend,
.campo > strong {
  font-weight: 700;
  margin-bottom: 0.3rem;
}

.campo-interruptor {
  flex-direction: row;
  align-items: flex-start;
  gap: 0.75rem;
  cursor: pointer;
}

.campo-interruptor span {
  display: flex;
  flex-direction: column;
}

.campo-interruptor small {
  color: var(--cor-texto-suave);
}

.campo input[type='checkbox'],
.campo input[type='radio'] {
  width: 1.3rem;
  height: 1.3rem;
  accent-color: var(--cor-destaque);
  flex: none;
  margin-top: 0.15rem;
}

.campo input[type='range'] {
  accent-color: var(--cor-destaque);
  width: 100%;
}

.grupo-opcoes {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.25rem;
}

.opcao {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  cursor: pointer;
  min-height: 44px;
}

.creditos {
  font-size: 0.85rem;
  color: var(--cor-texto-suave);
}

/* ---------- Tabela de kana ---------- */

.abas {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.aba {
  flex: 1;
  min-height: 44px;
  cursor: pointer;
  border: 2px solid var(--cor-borda);
  border-radius: 999px;
  background: transparent;
  font-weight: 700;
}

.aba[aria-selected='true'] {
  background: var(--cor-destaque);
  border-color: var(--cor-destaque);
  color: #1b1030;
}

.tabela-kana {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0.4rem;
  margin-bottom: 1.25rem;
}

.celula-kana {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.2rem;
  min-height: 64px;
  padding: 0.4rem 0;
  border: 2px solid transparent;
  border-radius: var(--raio);
  background: var(--cor-superficie);
  cursor: pointer;
}

.celula-kana .kana {
  font-size: var(--tam-kana-medio);
}

.celula-kana .romaji {
  font-size: 0.8rem;
}

.celula-kana:hover {
  border-color: var(--cor-destaque);
}

/* Bolinha com a caixa do SRS (cinza = não visto; verde mais claro = mais dominado). */
.celula-kana::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--nivel-0);
}

.celula-kana[data-caixa='1']::after {
  background: var(--nivel-1);
}

.celula-kana[data-caixa='2']::after {
  background: var(--nivel-2);
}

.celula-kana[data-caixa='3']::after {
  background: var(--nivel-3);
}

.celula-kana[data-caixa='4']::after {
  background: var(--nivel-4);
}

.celula-kana[data-caixa='5']::after {
  background: var(--nivel-5);
}

/* ---------- Detalhe do kana e ordem dos traços ---------- */

.detalhe-kana {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 1.25rem;
  align-items: start;
}

.detalhe-tracos {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
}

.detalhe-leitura {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.detalhe-romaji {
  font-size: 1.6rem;
  font-weight: 700;
}

.dica {
  background: var(--cor-superficie);
  border-left: 4px solid var(--cor-destaque-2);
  border-radius: 8px;
  padding: 0.6rem 0.8rem;
}

.exemplos ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.exemplos li {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.6rem;
}

.tracos {
  max-width: 100%;
  height: auto;
  background: #fffaf0;
  border-radius: var(--raio);
}

.tracos path {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tracos-grade line {
  stroke: #e3c9c9;
  stroke-width: 0.6;
  stroke-dasharray: 2 2;
}

.tracos-fantasma path {
  stroke: #d8d2e6;
  stroke-width: 4;
}

.tracos-ativos path {
  stroke: #1b1030;
  stroke-width: 4;
}

.tracos-numeros text {
  font-size: 7px;
  font-weight: 700;
  fill: #d64545;
}

@media (max-width: 560px) {
  .detalhe-kana {
    grid-template-columns: 1fr;
    justify-items: center;
  }

  .hud-marca-texto,
  .botao-hud-texto {
    display: none;
  }

  .botao-hud {
    padding: 0;
    width: 44px;
    justify-content: center;
  }

  .hud-xp {
    width: 18vw;
  }

  /* No celular, as fases viram uma faixa horizontal para não cobrir a ilha. */
  .lista-fases {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 0.4rem;
  }

  .lista-fases li {
    flex: 0 0 68%;
    scroll-snap-align: start;
  }
}

/* ---------- Conquistas ---------- */

.lista-conquistas {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.conquista {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0.8rem;
  border-radius: var(--raio);
  background: var(--cor-superficie);
}

.conquista span:nth-child(2) {
  display: flex;
  flex-direction: column;
}

.conquista small {
  color: var(--cor-texto-suave);
}

.conquista-icone {
  font-size: 1.8rem;
  width: 2.5rem;
  text-align: center;
}

.conquista-bloqueada .conquista-icone {
  filter: grayscale(1);
  opacity: 0.45;
}

/* ---------- Feedback (acerto, erro, avisos) ---------- */

.camada-feedback {
  position: fixed;
  inset: 0;
  z-index: 45;
  pointer-events: none;
}

.camada-feedback > * {
  pointer-events: auto;
}

/* Centralizados no ponto pelo GSAP (xPercent/yPercent), não pelo CSS. */
.selo-acerto,
.petala {
  position: absolute;
  pointer-events: none;
}

.selo-acerto {
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--cor-acerto);
  text-shadow: 0 2px 10px rgb(0 0 0 / 0.6);
}

.petala {
  font-size: 1.2rem;
}

/*
 * Elementos animados pelo GSAP são centralizados pelo layout (margin auto),
 * e não com `translate`: o GSAP reescreve o transform ao animar.
 */
.cartao-erro {
  position: absolute;
  left: 0;
  right: 0;
  margin-inline: auto;
  bottom: max(16px, env(safe-area-inset-bottom));
  width: min(420px, calc(100% - 32px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  padding: 1rem 1.25rem;
  text-align: center;
  background: var(--cor-fundo-2);
  border: 2px solid var(--cor-erro);
  border-radius: calc(var(--raio) * 1.4);
  box-shadow: var(--sombra);
}

.cartao-erro p {
  margin: 0;
}

.cartao-erro-titulo {
  color: var(--cor-erro);
  font-weight: 700;
}

.cartao-erro-resposta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.cartao-erro-romaji {
  font-size: 1.8rem;
  font-weight: 700;
}

.cartao-erro-dica {
  color: var(--cor-texto-suave);
}

.pilha-avisos {
  position: absolute;
  top: calc(var(--altura-hud) + 12px);
  left: 50%;
  translate: -50% 0;
  width: max-content;
  max-width: calc(100% - 32px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  pointer-events: none;
}

/* Em telas largas, os avisos vão para o canto e não cobrem a pergunta dos jogos. */
@media (min-width: 760px) {
  .pilha-avisos {
    left: auto;
    right: 16px;
    translate: none;
    align-items: flex-end;
  }
}

.aviso,
.toast-conquista {
  padding: 0.7rem 1.1rem;
  border-radius: var(--raio);
  background: var(--cor-superficie-2);
  box-shadow: var(--sombra);
  font-weight: 700;
}

.toast-conquista {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  border: 2px solid var(--cor-destaque-2);
}

.toast-conquista > span:last-child {
  display: flex;

function criarRoteador(conteiner, cortina) {
  let telaAtual = null;
  let trocando = false;
  const cobrir = () => gsap.to(cortina, { opacity: 1, duration: duracao(0.3) }).then();
  const descobrir = () => gsap.to(cortina, { opacity: 0, duration: duracao(0.45) }).then();
  async function irPara(montarTela, params = {}) {
    if (trocando) {
      return;
    }
    trocando = true;
    cortina.classList.add("ativa");
    try {
      await cobrir();
      telaAtual?.destroy();
      telaAtual = null;
      conteiner.replaceChildren();
      telaAtual = await montarTela(conteiner, params);
    } finally {
      await descobrir();
      cortina.classList.remove("ativa");
      trocando = false;
    }
    conteiner.querySelector('h1, [tabindex="-1"]')?.focus({ preventScroll: true });
  }
  return { irPara };
}

      for (const valor of Object.values(material2)) {
        if (valor?.isTexture) {
          texturas.add(valor);
        }
      }
    }
  });
  geometrias.forEach((geometria) => geometria.dispose());
  materiais.forEach((material2) => material2.dispose());
  texturas.forEach((textura) => textura.dispose());
  raiz.clear();
}

// src/menu3d/Menu3D.js
var COR_DO_CEU = "#0f1630";
var POSICAO_CAMERA = new THREE5.Vector3(0, 8.5, 17);
var ALVO_CAMERA = new THREE5.Vector3(0, 1.2, 0);
var LIMITE_DE_ARRASTE_PX = 6;
var Menu3D = class {
  /**
   * @param {HTMLElement} conteiner elemento que vai receber o canvas
   * @param {object} opcoes { fases, kana, aoEscolher(id), aoDestacar(id|null) }
   */
  constructor(conteiner, { fases, kana, aoEscolher, aoDestacar }) {
    this.conteiner = conteiner;
    this.aoEscolher = aoEscolher;
    this.aoDestacar = aoDestacar;
    this.relogio = new THREE5.Clock();
    this.raycaster = new THREE5.Raycaster();
    this.ponteiro = new THREE5.Vector2();
    this.inicioDoToque = null;
    this.destacado = null;
    this.criarRenderer();
    this.criarCena(fases, kana);
    this.criarControles();
    this.registrarEventos();
    this.redimensionar();
    this.animarEntrada();
    this.renderer.setAnimationLoop(() => this.quadro());
  }
  criarRenderer() {
    this.renderer = new THREE5.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.outputColorSpace = THREE5.SRGBColorSpace;
    this.renderer.domElement.classList.add("menu-canvas");
    this.renderer.domElement.setAttribute("aria-hidden", "true");
    this.conteiner.append(this.renderer.domElement);
  }
  criarCena(fases, kana) {
    this.cena = new THREE5.Scene();
    this.cena.background = new THREE5.Color(COR_DO_CEU);
    this.cena.fog = new THREE5.Fog(COR_DO_CEU, 30, 75);
    this.camera = new THREE5.PerspectiveCamera(45, 1, 0.1, 200);
    this.camera.position.copy(POSICAO_CAMERA);
    this.cena.add(
      new THREE5.HemisphereLight("#bcd4ff", "#3b2a4a", 1.6),
      this.criarLuzDoSol(),
      criarEstrelas()
    );
    const ilha = construirIlha();
    this.agua = ilha.agua;
    this.cena.add(ilha.grupo);
    this.kanaFlutuantes = criarKanaFlutuantes(kana);
    this.cena.add(this.kanaFlutuantes.grupo);
    this.pontos = criarPontosDeFase(fases);
    this.cena.add(this.pontos.grupo);
  }
  criarLuzDoSol() {
    const sol = new THREE5.DirectionalLight("#ffe2c4", 2.2);
    sol.position.set(8, 14, 6);
    return sol;
  }
  criarControles() {
    this.controles = new OrbitControls(this.camera, this.renderer.domElement);
    this.controles.target.copy(ALVO_CAMERA);
    this.controles.enablePan = false;
    this.controles.enableDamping = true;
    this.controles.minDistance = 11;
    this.controles.maxDistance = 30;
    this.controles.minPolarAngle = Math.PI * 0.18;
    this.controles.maxPolarAngle = Math.PI * 0.46;
    this.controles.autoRotateSpeed = 0.5;
    this.controles.update();
  }
  registrarEventos() {
    const canvas = this.renderer.domElement;
    this.ouvintes = [
      [canvas, "pointermove", (evento) => this.aoMoverPonteiro(evento)],
      [canvas, "pointerdown", (evento) => this.aoPressionar(evento)],
      [canvas, "pointerup", (evento) => this.aoSoltar(evento)],
      [canvas, "pointerleave", () => this.definirDestaque(null)]
    ];
    this.ouvintes.forEach(([alvo, tipo, funcao]) => alvo.addEventListener(tipo, funcao));
    this.observador = new ResizeObserver(() => this.redimensionar());
    this.observador.observe(this.conteiner);
  }
  /** Ajusta canvas e câmera ao tamanho do contêiner (retrato usa FOV maior). */
  redimensionar() {
    const largura = this.conteiner.clientWidth || 1;
    const altura = this.conteiner.clientHeight || 1;
    this.renderer.setSize(largura, altura, false);
    this.camera.aspect = largura / altura;
    this.camera.fov = this.camera.aspect < 0.8 ? 68 : 45;
    this.camera.updateProjectionMatrix();
  }
  /** Câmera desce do céu até a ilha (só com animações completas). */
  animarEntrada() {
    if (animacoesReduzidas()) {
      return;
    }
    gsap.from(this.camera.position, {
      x: 0,
      y: 24,
      z: 34,
      duration: 1.8,
      ease: "power3.out",
      onUpdate: () => this.camera.lookAt(this.controles.target)
    });
  }
  /** Descobre qual fase está sob o ponteiro (ou null). */
  faseSobPonteiro(evento) {
    const retangulo = this.renderer.domElement.getBoundingClientRect();
    this.ponteiro.set(
      (evento.clientX - retangulo.left) / retangulo.width * 2 - 1,
      -((evento.clientY - retangulo.top) / retangulo.height) * 2 + 1
    );
    this.raycaster.setFromCamera(this.ponteiro, this.camera);
    const [acerto] = this.raycaster.intersectObjects(this.pontos.alvos, false);
    return acerto?.object.userData.faseId ?? null;
  }
  aoMoverPonteiro(evento) {
    if (evento.pointerType === "mouse") {
      this.definirDestaque(this.faseSobPonteiro(evento));
    }
  }
  aoPressionar(evento) {
    this.inicioDoToque = { x: evento.clientX, y: evento.clientY };
  }
  /** Só conta como clique se o ponteiro quase não se moveu (senão foi rotação). */
  aoSoltar(evento) {
    if (!this.inicioDoToque) {
      return;
    }
    const distancia = Math.hypot(
      evento.clientX - this.inicioDoToque.x,
      evento.clientY - this.inicioDoToque.y
    );
    this.inicioDoToque = null;
    if (distancia > LIMITE_DE_ARRASTE_PX) {
      return;
    }
    const faseId = this.faseSobPonteiro(evento);
    if (faseId) {
      this.aoEscolher?.(faseId);
    }
  }
  /** Destaca uma fase (vindo do mouse no 3D ou do foco nos botões HTML). */
  definirDestaque(faseId, avisar = true) {
    if (faseId === this.destacado) {
      return;
    }
    this.destacado = faseId;
    this.pontos.destacar(faseId);
    this.renderer.domElement.style.cursor = faseId ? "pointer" : "";
    if (avisar) {
      this.aoDestacar?.(faseId);
    }
  }
  /** Atualiza cores e rótulos depois de mudanças de XP ou configuração. */
  atualizarFases(fases) {
    this.pontos.atualizarFases(fases);
  }
  /** Um quadro da animação (chamado ~60 vezes por segundo). */
  quadro() {
    const dt = Math.min(this.relogio.getDelta(), 0.1);
    const tempo = this.relogio.elapsedTime;
    const reduzido = animacoesReduzidas();
    this.controles.autoRotate = !reduzido;
    this.controles.update(dt);
    this.kanaFlutuantes.atualizar(tempo, dt, reduzido);
    this.pontos.atualizar(tempo, reduzido);
    if (!reduzido) {
      this.agua.position.y = -1.6 + Math.sin(tempo * 0.8) * 0.08;
    }
    this.renderer.render(this.cena, this.camera);
  }
  /** Para a animação e libera tudo da memória (CPU e GPU). */
  destroy() {
    this.renderer.setAnimationLoop(null);
    gsap.killTweensOf(this.camera.position);
    this.observador.disconnect();
    this.ouvintes.forEach(([alvo, tipo, funcao]) => alvo.removeEventListener(tipo, funcao));
    this.controles.dispose();
    liberarObjeto(this.cena);
    this.renderer.renderLists.dispose();
    this.renderer.dispose();
    this.renderer.forceContextLoss();
    this.renderer.domElement.remove();
  }
};

function estadoDasFases() {
  return JOGOS.map((jogo) => ({
    ...jogo,
    liberada: jogoLiberado(jogo),
    disponivel: Boolean(jogo.carregar)
  }));
}
function kanaDecorativos() {
  return [...HIRAGANA, ...KATAKANA].filter((item) => !item.dakuten).filter((_, indice) => indice % 3 === 0).map((item) => item.kana);
}
function rotuloDoStatus(fase) {
  if (!fase.liberada) {
    const falta = Math.max(0, fase.xpNecessario - obterResumo().xp);
    return `🔒 faltam ${falta} XP`;
  }
  return fase.disponivel ? "▶ Jogar" : "⏳ Em breve";
}
function criarBotaoFase(fase, indice, { aoClicar, aoFocar }) {
  const botao = criarElemento(
    "button",
    {
      type: "button",
      class: "botao-fase",
      dataset: { fase: fase.id },
      onClick: () => aoClicar(fase.id, botao),
      onFocus: () => aoFocar(fase.id),
      onBlur: () => aoFocar(null),
      onMouseenter: () => aoFocar(fase.id),
      onMouseleave: () => aoFocar(null)
    },
    [
      criarElemento("span", { class: "botao-fase-numero", text: String(indice + 1) }),
      criarElemento("span", { class: "botao-fase-textos" }, [
        criarElemento("strong", { text: fase.nome }),
        criarElemento("span", { class: "botao-fase-jp", lang: "ja", text: fase.nomeJP }),
        criarElemento("span", { class: "botao-fase-status" })
      ])
    ]
  );
  botao.style.setProperty("--cor-fase", fase.cor);
  return botao;
}
function atualizarBotoes(botoes, fases) {
  fases.forEach((fase, indice) => {
    const botao = botoes[indice];
    botao.querySelector(".botao-fase-status").textContent = rotuloDoStatus(fase);
    botao.classList.toggle("bloqueada", !fase.liberada);
    botao.setAttribute(
      "aria-label",
      `Fase ${indice + 1}: ${fase.nome}. ${fase.descricao} ${rotuloDoStatus(fase)}`
    );
  });
}
function mostrarEmBreve(fase) {
  abrirModal({
    titulo: `${fase.nome} — em breve`,
    conteudo: [
      criarElemento("p", { class: "kana-medio", lang: "ja", text: fase.nomeJP }),
      criarElemento("p", { text: fase.descricao }),
      criarElemento("p", {
        class: "texto-suave",
        text: "Este minijogo será adicionado na próxima etapa. Enquanto isso, use 📚 Estudar para conhecer os kana!"
      })
    ]
  });
}
async function montarTelaMenu(conteiner, { aoEscolherJogo }) {
  const palco3d = criarElemento("div", { class: "menu-palco" });
  const listaFases = criarElemento("ol", { class: "lista-fases" });
  const raiz = criarElemento("section", { class: "tela-menu", "aria-labelledby": "titulo-menu" }, [
    palco3d,
    criarElemento("div", { class: "menu-sobreposicao" }, [
      criarElemento("header", { class: "menu-cabecalho" }, [
        criarElemento("h1", { id: "titulo-menu", tabindex: "-1", text: "Nihongo Drops" }),
        criarElemento("p", { lang: "ja", class: "menu-subtitulo-jp", text: "にほんご ドロップス" }),
        criarElemento("p", {
          class: "menu-subtitulo",
          text: "Aprenda hiragana e katakana jogando."
        })
      ]),
      criarElemento("nav", { class: "menu-fases", "aria-label": "Fases" }, listaFases)
    ])
  ]);
  conteiner.append(raiz);
  let menu3d = null;
  let fases = estadoDasFases();
  function escolher(faseId, botao) {
    const fase = fases.find((item) => item.id === faseId);
    if (!fase.liberada) {
      const falta = Math.max(0, fase.xpNecessario - obterResumo().xp);
      mostrarMensagem(`🔒 ${fase.nome}: faltam ${falta} XP. Jogue as outras fases!`);
      tremer(botao ?? listaFases);
    } else if (!fase.disponivel) {
      mostrarEmBreve(fase);
    } else {
      aoEscolherJogo(fase.id);
    }
  }
  function destacarBotao(faseId) {
    botoes.forEach((botao) => botao.classList.toggle("destacada", botao.dataset.fase === faseId));
  }
  const botoes = fases.map(
    (fase, indice) => criarBotaoFase(fase, indice, {
      aoClicar: escolher,
      aoFocar: (faseId) => menu3d?.definirDestaque(faseId, false)
    })
  );
  listaFases.append(...botoes.map((botao) => criarElemento("li", {}, botao)));
  atualizarBotoes(botoes, fases);
  await aguardarFontes();
  try {
    menu3d = new Menu3D(palco3d, {
      fases,
      kana: kanaDecorativos(),
      aoEscolher: (faseId) => escolher(
        faseId,
        botoes.find((b) => b.dataset.fase === faseId)
      ),
      aoDestacar: destacarBotao
    });
  } catch (erro) {
    console.warn("WebGL indisponível; usando apenas o menu em HTML.", erro);
    raiz.classList.add("sem-3d");
  }
  const atualizar = () => {
    fases = estadoDasFases();
    atualizarBotoes(botoes, fases);
    menu3d?.atualizarFases(fases);
  };
  const cancelamentos = [aoMudarConfig(atualizar), aoProgresso("mudou", atualizar)];
  entrar(raiz.querySelectorAll(".menu-cabecalho > *, .botao-fase"), { atraso: 0.2 });
  return {
    destroy() {
      cancelamentos.forEach((cancelar) => cancelar());
      menu3d?.destroy();
      raiz.remove();
    }
  };
}

import * as Phaser7 from "phaser";
var COR_DE_FUNDO = "#0f1630";
function criarJogoPhaser(conteiner, ClasseCena, dados = {}) {
  const jogo = new Phaser7.Game({
    type: Phaser7.AUTO,
    parent: conteiner,
    backgroundColor: COR_DE_FUNDO,
    banner: false,
    // O áudio fica com o core/audio.js (Web Audio próprio), então o Phaser não cria outro contexto.
    audio: { noAudio: true },
    fps: { target: 60 },
    // O teclado é escutado direto na janela (ver games/keyboard.js).
    input: { keyboard: false },
    scale: {
      mode: Phaser7.Scale.RESIZE,
      width: conteiner.clientWidth || 800,
      height: conteiner.clientHeight || 600
    },
    callbacks: {
      // A cena usa a chave definida no próprio construtor; 'principal' é só um apelido.
      postBoot: (instancia) => instancia.scene.add("principal", ClasseCena, true, dados)
    }
  });
  const obterCena = () => jogo.scene?.getScenes(false)[0] ?? null;
  return {
    jogo,
    pausar() {
      const cena = obterCena();
      if (cena?.pausarExterno) {
        cena.pausarExterno();
      } else {
        cena?.scene.pause();
      }
    },
    continuar() {
      const cena = obterCena();
      if (cena?.continuarExterno) {
        cena.continuarExterno();
      } else {
        cena?.scene.resume();
      }
    },
    destroy() {
      jogo.destroy(true);
    }
  };
}

// src/games/gameScreen.js
async function montarTelaJogo(conteiner, { jogoId, aoSair }) {
  const jogo = buscarJogo(jogoId);
  if (!jogo?.carregar) {
    throw new Error(`O jogo "${jogoId}" ainda não está disponível.`);
  }
  const palco = criarElemento("section", {
    class: "tela-jogo",
    "aria-label": `${jogo.nome} — ${jogo.descricao}`
  });
  conteiner.append(palco);
  const modulo = await jogo.carregar();
  const instancia = criarJogoPhaser(palco, modulo.default, {
    jogo,
    conteiner: palco,
    aoSair
  });
  const aoModal = (evento) => evento.detail.aberto ? instancia.pausar() : instancia.continuar();
  document.addEventListener("nd:modal", aoModal);
  return {
    destroy() {
      document.removeEventListener("nd:modal", aoModal);
      instancia.destroy();
      palco.remove();
    }
  };
}

    });

  const cancelamentos = [
    aoProgresso("mudou", atualizar),
    aoProgresso("xp", () => pulsar(barra, 1.06)),
    aoProgresso("nivel", ({ nivel: novoNivel }) => {
      tocarNivel();

    })
  ];
  atualizar();
  return {
    mostrarVoltar(visivel) {
      botaoVoltar.hidden = !visivel;
    },
    destroy() {
      cancelamentos.forEach((cancelar) => cancelar());
      raiz.replaceChildren();
    }
  };
}

var SVG_NS = "http://www.w3.org/2000/svg";
var PAUSA_REDUZIDA = 0.4;
function criarSvg(tag, atributos = {}) {
  const elemento = document.createElementNS(SVG_NS, tag);
  for (const [chave, valor] of Object.entries(atributos)) {
    elemento.setAttribute(chave, String(valor));
  }
  return elemento;
}
function pontoInicial(d) {
  const encontrado = /^M\s*(-?[\d.]+)[\s,]+(-?[\d.]+)/.exec(d);
  return encontrado ? { x: Number(encontrado[1]), y: Number(encontrado[2]) } : { x: 0, y: 0 };
}
function criarGuias() {
  const meio = STROKE_VIEWBOX / 2;
  const grupo = criarSvg("g", { class: "tracos-grade" });
  grupo.append(
    criarSvg("line", { x1: meio, y1: 0, x2: meio, y2: STROKE_VIEWBOX }),
    criarSvg("line", { x1: 0, y1: meio, x2: STROKE_VIEWBOX, y2: meio })
  );
  return grupo;
}
function criarAnimacaoTracos(kana, { tamanho = 220 } = {}) {
  const tracos = STROKES[kana] ?? [];
  const svg = criarSvg("svg", {
    viewBox: `0 0 ${STROKE_VIEWBOX} ${STROKE_VIEWBOX}`,
    width: tamanho,
    height: tamanho,
    class: "tracos",
    role: "img",
    "aria-label": `Ordem dos traços de ${kana}: ${tracos.length} traços`
  });
  svg.append(criarGuias());
  const fantasmas = criarSvg("g", { class: "tracos-fantasma" });
  const ativos = criarSvg("g", { class: "tracos-ativos" });
  const numeros = criarSvg("g", { class: "tracos-numeros" });
  const caminhos = tracos.map((d, indice) => {
    fantasmas.append(criarSvg("path", { d }));
    const caminho = criarSvg("path", { d });
    ativos.append(caminho);
    const { x, y } = pontoInicial(d);
    const numero = criarSvg("text", { x: x - 6, y: y - 3 });
    numero.textContent = String(indice + 1);
    numeros.append(numero);
    return { caminho, numero };
  });
  svg.append(fantasmas, ativos, numeros);
  let linhaDoTempo = null;
  function tocar() {
    linhaDoTempo?.kill();
    const reduzido = animacoesReduzidas();
    linhaDoTempo = gsap.timeline();
    caminhos.forEach(({ caminho, numero }, indice) => {
      const comprimento = caminho.getTotalLength();
      gsap.set(caminho, { strokeDasharray: comprimento, strokeDashoffset: comprimento });
      gsap.set(numero, { opacity: 0 });
      if (reduzido) {
        const momento = indice * PAUSA_REDUZIDA;
        linhaDoTempo.set(caminho, { strokeDashoffset: 0 }, momento);
        linhaDoTempo.set(numero, { opacity: 1 }, momento);
      } else {
        linhaDoTempo.to(numero, { opacity: 1, duration: 0.15 });
        linhaDoTempo.to(
          caminho,
          {
            strokeDashoffset: 0,
            duration: Math.max(0.35, comprimento / 110),
            ease: "power1.inOut"
          },
          "<"
        );
      }
    });
    return linhaDoTempo;
  }
  function destroy() {
    linhaDoTempo?.kill();
    svg.remove();
  }
  return { elemento: svg, tocar, destroy, total: tracos.length };
}

init_utils();

var CAIXA_DOMINADA = 3;
var MAIS_ERRADOS = 5;
var ROTULOS_DOS_NIVEIS = ["Não visto", "Caixa 1", "Caixa 2", "Caixa 3", "Caixa 4", "Caixa 5"];
var NOMES = { hiragana: "Hiragana ひらがな", katakana: "Katakana カタカナ" };
function nivelDoItem(item) {
  return obterRegistro(item.id)?.caixa ?? 0;
}
function resumir(itens) {
  const porNivel = Array(TOTAL_CAIXAS + 1).fill(0);
  let acertos = 0;
  let erros = 0;
  itens.forEach((item) => {
    porNivel[nivelDoItem(item)] += 1;
    const registro = obterRegistro(item.id);
    acertos += registro?.acertos ?? 0;
    erros += registro?.erros ?? 0;
  });
  const vistos = itens.length - porNivel[0];
  const dominados = porNivel.slice(CAIXA_DOMINADA).reduce((soma, valor) => soma + valor, 0);
  return {
    total: itens.length,
    porNivel,
    vistos,
    dominados,
    revisar: vistos - dominados,
    precisao: acertos + erros > 0 ? Math.round(acertos / (acertos + erros) * 100) : null
  };
}
function cartaoDeNumero(rotulo, valor, detalhe) {
  return criarElemento("div", { class: "progresso-numero" }, [
    criarElemento("span", { class: "progresso-numero-valor", text: valor }),
    criarElemento("span", { class: "progresso-numero-rotulo", text: rotulo }),
    detalhe ? criarElemento("span", { class: "texto-suave", text: detalhe }) : null
  ]);
}
function criarResumo(resumo) {
  return criarElemento("div", { class: "progresso-numeros" }, [
    cartaoDeNumero("Dominados", String(resumo.dominados), `de ${resumo.total} (caixa 3+)`),
    cartaoDeNumero("Vistos", String(resumo.vistos), `de ${resumo.total}`),
    cartaoDeNumero("Para revisar", String(resumo.revisar), "caixas 1 e 2"),
    cartaoDeNumero(
      "Precisão",
      resumo.precisao === null ? "—" : `${resumo.precisao}%`,
      "acertos / respostas"
    )
  ]);
}
function criarDistribuicao(resumo) {
  const segmentos = resumo.porNivel.map((quantidade, nivel) => ({ quantidade, nivel })).filter(({ quantidade }) => quantidade > 0).map(({ quantidade, nivel }) => {
    const descricao = `${ROTULOS_DOS_NIVEIS[nivel]}: ${quantidade} kana`;
    const segmento = criarElemento("span", {
      class: "progresso-segmento",
      dataset: { nivel: String(nivel) },
      title: descricao,
      "aria-label": descricao
    });
    segmento.style.flexGrow = String(quantidade);
    return segmento;
  });
  const legenda = criarElemento(
    "ul",
    { class: "progresso-legenda" },
    resumo.porNivel.map(
      (quantidade, nivel) => criarElemento("li", {}, [
        criarElemento("span", {
          class: "progresso-amostra",
          dataset: { nivel: String(nivel) },
          "aria-hidden": "true"
        }),
        `${ROTULOS_DOS_NIVEIS[nivel]}: `,
        criarElemento("strong", { text: String(quantidade) })
      ])
    )
  );
  return criarElemento("section", { class: "progresso-secao" }, [
    criarElemento("h3", { text: "Caixas do SRS" }),
    criarElemento(
      "div",
      { class: "progresso-barra", role: "img", "aria-label": "Distribuição pelas caixas" },
      segmentos
    ),
    legenda
  ]);
}
function criarCelula2(item) {
  const nivel = nivelDoItem(item);
  return criarElemento(
    "button",
    {
      type: "button",
      class: "progresso-kana",
      lang: "ja",
      dataset: { nivel: String(nivel) },
      title: `${item.kana} (${item.romaji}) — ${ROTULOS_DOS_NIVEIS[nivel]}`,
      "aria-label": `${item.kana}, ${item.romaji}, ${ROTULOS_DOS_NIVEIS[nivel]}`,
      onClick: () => abrirDetalheKana(item)
    },
    item.kana
  );
}
function criarGrupos(script) {
  const liberados = new Set(gruposLiberados(gruposDeEstudo(script, true)).map((grupo) => grupo.id));
  const linhas = [...GRUPOS_BASICOS, ...GRUPOS_DAKUTEN].map((grupo) => {
    const itens = listarKana(script, [grupo]);
    const dominados = itens.filter((item) => nivelDoItem(item) >= CAIXA_DOMINADA).length;
    const liberado = liberados.has(grupo);
    return criarElemento("li", { class: `progresso-grupo ${liberado ? "" : "bloqueado"}` }, [
      criarElemento("span", { class: "progresso-grupo-nome" }, [
        criarElemento("strong", { lang: "ja", text: `${itens[0].kana}行` }),
        criarElemento("span", {
          class: "texto-suave",
          text: liberado ? `${dominados}/${itens.length}` : "🔒",
          title: liberado ? "Dominados neste grupo" : "Libera quando você dominar os grupos anteriores"
        })
      ]),
      criarElemento("span", { class: "progresso-grupo-kana" }, itens.map(criarCelula2))
    ]);
  });
  return criarElemento("section", { class: "progresso-secao" }, [
    criarElemento("h3", { text: "Grupos" }),
    criarElemento("ul", { class: "progresso-grupos" }, linhas)
  ]);
}
function criarMaisErrados(itens) {
  const errados = itens.map((item) => ({ item, registro: obterRegistro(item.id) })).filter(({ registro }) => registro?.erros > 0).sort((a, b) => b.registro.erros - a.registro.erros || a.registro.acertos - b.registro.acertos).slice(0, MAIS_ERRADOS);
  const conteudo = errados.length === 0 ? criarElemento("p", {
    class: "texto-suave",
    text: "Nenhum erro ainda. Continue jogando! 🎉"
  }) : criarElemento(
    "ul",
    { class: "progresso-errados" },
    errados.map(
      ({ item, registro }) => criarElemento("li", {}, [
        criarElemento("button", {
          type: "button",
          class: "progresso-errado-kana",
          lang: "ja",
          "aria-label": `Ver ${item.kana}`,
          text: item.kana,
          onClick: () => abrirDetalheKana(item)
        }),
        criarElemento("span", { class: "revisao-romaji", text: item.romaji }),
        criarElemento("span", {
          class: "texto-suave",
          text: `✔ ${registro.acertos} · ✖ ${registro.erros}`
        }),
        criarBotaoFala(item.kana)
      ])
    )
  );
  return criarElemento("section", { class: "progresso-secao" }, [
    criarElemento("h3", { text: "Mais errados" }),
    conteudo
  ]);
}
function criarConteudoDoScript(script) {
  const itens = listarKana(script);
  const resumo = resumir(itens);
  return criarElemento("div", { role: "tabpanel" }, [
    criarResumo(resumo),
    criarDistribuicao(resumo),
    criarGrupos(script),
    criarMaisErrados(itens)
  ]);
}
function abrirPainelProgresso(scriptInicial = "hiragana") {
  const conteiner = criarElemento("div");
  const abas = Object.entries(NOMES).map(
    ([script, nome]) => criarElemento("button", {
      type: "button",
      role: "tab",
      class: "aba",
      dataset: { script },
      text: nome
    })
  );
  const selecionar = (script) => {
    abas.forEach((aba) => aba.setAttribute("aria-selected", String(aba.dataset.script === script)));
    const painel = criarConteudoDoScript(script);
    conteiner.replaceChildren(painel);
    entrar(painel.children, { y: 12, duracao: 0.3, intervalo: 0.05 });
  };
  abas.forEach((aba) => aba.addEventListener("click", () => selecionar(aba.dataset.script)));
  abrirModal({
    titulo: "Seu progresso",
    classe: "modal-largo",
    conteudo: [criarElemento("div", { class: "abas", role: "tablist" }, abas), conteiner]
  });
  selecionar(scriptInicial);
}
