/* ==========================================================
   Nihongo Drops — estilos globais
   Tema noturno com bom contraste (WCAG AA) e hangul em fonte grande.
   ========================================================== */

:root {
  --cor-fundo: #0f1630;
  --cor-fundo-2: #18224a;
  --cor-superficie: #1f2b5c;
  --cor-superficie-2: #2a3a78;
  --cor-borda: #3d4c8f;
  --cor-texto: #f4f6ff;
  --cor-texto-suave: #c3cbef;
  --cor-destaque: #ff8fb1;
  --cor-destaque-2: #ffd166;
  --cor-acerto: #5be49b;
  --cor-erro: #ff6b6b;
  --cor-foco: #ffd166;

  /*
   * Caixas do SRS: escala ordinal de um só tom (mais claro = mais dominado),
   * validada contra os fundos escuros (contraste ≥ 3:1, passos visíveis).
   * Nível 0 = ainda não visto (cinza neutro).
   */
  --nivel-0: #5b6380;
  --nivel-1: #3a8f6e;
  --nivel-2: #4aa982;
  --nivel-3: #5dc497;
  --nivel-4: #7ddcb0;
  --nivel-5: #b0f0d0;

  --fonte: 'Noto Sans KR', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --tam-hangul-grande: clamp(3rem, 12vw, 5.5rem);
  --tam-hangul-medio: clamp(1.6rem, 6vw, 2.2rem);
  --altura-hud: 60px;
  --raio: 14px;
  --sombra: 0 12px 32px rgb(0 0 0 / 0.4);

  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  background: var(--cor-fundo);
  color: var(--cor-texto);
  font-family: var(--fonte);
  font-size: 1rem;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

h1,
h2,
h3 {
  line-height: 1.2;
  margin: 0 0 0.5rem;
}

a {
  color: var(--cor-destaque-2);
}

button {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--cor-foco);
  outline-offset: 3px;
}

[hidden] {
  display: none !important;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.pular-conteudo {
  position: fixed;
  left: 1rem;
  top: -4rem;
  z-index: 100;
  background: var(--cor-destaque-2);
  color: #1a1a1a;
  padding: 0.5rem 1rem;
  border-radius: var(--raio);
}

.pular-conteudo:focus {
  top: 1rem;
}

.texto-suave {
  color: var(--cor-texto-suave);
}

/* ---------- Hangul e romanização ---------- */

.hangul {
  font-family: var(--fonte);
  font-weight: 700;
  line-height: 1;
}

.hangul-grande {
  font-size: var(--tam-hangul-grande);
}

.hangul-medio {
  font-size: var(--tam-hangul-medio);
  font-weight: 700;
}

.romanizacao {
  color: var(--cor-texto-suave);
  letter-spacing: 0.02em;
}

/* O jogador pode esconder o romanizacao nas configurações. */
[data-romanizacao='off'] .romanizacao {
  display: none;
}

/* ---------- Botões ---------- */

.botao,
.botao-hud,
.botao-icone,
.botao-fala,
.botao-fase {
  cursor: pointer;
  border: 0;
  min-height: 44px;
  touch-action: manipulation;
}

.botao {
  background: var(--cor-destaque);
  color: #1b1030;
  font-weight: 700;
  padding: 0.6rem 1.2rem;
  border-radius: 999px;
}

.botao:hover {
  filter: brightness(1.08);
}

.botao-secundario {
  background: var(--cor-superficie-2);
  color: var(--cor-texto);
}

.botao-perigo {
  background: transparent;
  color: var(--cor-erro);
  border: 2px solid var(--cor-erro);
}

.botao-icone {
  min-width: 44px;
  background: transparent;
  border-radius: 50%;
  font-size: 1.2rem;
}

.botao-icone:hover {
  background: var(--cor-superficie-2);
}

.botao-fala {
  min-width: 44px;
  border-radius: 50%;
  background: var(--cor-superficie-2);
  font-size: 1.15rem;
}

.botao-fala:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ---------- HUD ---------- */

.hud {
  position: fixed;
  inset: 0 0 auto;
  height: var(--altura-hud);
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  background: linear-gradient(rgb(15 22 48 / 0.95), rgb(15 22 48 / 0.7));
  border-bottom: 1px solid rgb(255 255 255 / 0.06);
  backdrop-filter: blur(6px);
}

.hud-esquerda,
.hud-status,
.hud-direita {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.hud-status {
  flex: 1;
  justify-content: center;
  min-width: 0;
}

.hud-marca {
  font-weight: 900;
  font-size: 1.3rem;
}

.hud-marca-texto {
  font-weight: 700;
  color: var(--cor-destaque);
}

.hud-nivel {
  font-weight: 900;
  color: var(--cor-destaque-2);
  white-space: nowrap;
}

.hud-xp {
  position: relative;
  width: min(220px, 28vw);
  height: 12px;
  border-radius: 999px;
  background: var(--cor-superficie);
  overflow: hidden;
}

.hud-xp-preenchimento {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: linear-gradient(90deg, var(--cor-destaque), var(--cor-destaque-2));
  border-radius: inherit;
}

.hud-sequencia {
  white-space: nowrap;
  font-weight: 700;
}

.botao-hud {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0 0.75rem;
  border-radius: 999px;
  background: var(--cor-superficie);
}

.botao-hud:hover {
  background: var(--cor-superficie-2);
}

/* ---------- Área principal ---------- */

.conteudo {
  position: fixed;
  inset: var(--altura-hud) 0 0;
  outline: none;
}

.tela {
  position: relative;
  width: 100%;
  height: 100%;
}

.cortina {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 40%, var(--cor-fundo-2), var(--cor-fundo));
  opacity: 0;
  pointer-events: none;
  font-size: 2rem;
  font-weight: 900;
  color: var(--cor-destaque);
}

.cortina.ativa {
  pointer-events: auto;
}

/* ---------- Menu ---------- */

.tela-menu,
.tela-jogo,
.menu-palco {
  position: absolute;
  inset: 0;
}

.menu-palco {
  background: radial-gradient(circle at 50% 30%, var(--cor-fundo-2), var(--cor-fundo));
}

.menu-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.menu-sobreposicao {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 1rem;
  pointer-events: none;
}

.menu-cabecalho h1 {
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 900;
  text-shadow: 0 4px 18px rgb(0 0 0 / 0.6);
  outline: none;
}

.menu-subtitulo-ko {
  margin: 0;
  font-size: 1.2rem;
  color: var(--cor-destaque);
  font-weight: 700;
}

.menu-subtitulo {
  margin: 0;
  color: var(--cor-texto-suave);
}

.lista-fases {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 0.6rem;
  pointer-events: auto;
}

.botao-fase {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.55rem 0.8rem;
  text-align: left;
  border-radius: var(--raio);
  background: rgb(31 43 92 / 0.88);
  border: 2px solid transparent;
  box-shadow: var(--sombra);
  transition:
    border-color 0.2s,
    transform 0.2s;
}

.botao-fase:hover,
.botao-fase.destacada {
  border-color: var(--cor-fase);
  transform: translateY(-2px);
}

.botao-fase.bloqueada {
  opacity: 0.7;
}

.botao-fase-numero {
  flex: none;
  display: grid;
  place-items: center;
  width: 2.2rem;
  height: 2.2rem;
  border-radius: 50%;
  background: var(--cor-fase);
  color: #141a33;
  font-weight: 900;
}

.botao-fase-textos {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.botao-fase-jp,
.botao-fase-status {
  font-size: 0.85rem;
  color: var(--cor-texto-suave);
}

.sem-3d .menu-sobreposicao {
  justify-content: flex-start;
  gap: 2rem;
}

/* ---------- Modais ---------- */

.modal-fundo {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgb(5 8 20 / 0.7);
}

.modal {
  width: min(560px, 100%);
  max-height: min(88dvh, 900px);
  display: flex;
  flex-direction: column;
  background: var(--cor-fundo-2);
  border: 1px solid var(--cor-borda);
  border-radius: calc(var(--raio) * 1.4);
  box-shadow: var(--sombra);
}

.modal-largo {
  width: min(720px, 100%);
}

.modal-cabecalho {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem 1rem 0.5rem 1.25rem;
}

.modal-cabecalho h2 {
  margin: 0;
  font-size: 1.3rem;
}

.modal-corpo {
  overflow: auto;
  padding: 0 1.25rem 1.25rem;
}

/* ---------- Configurações ---------- */

.campo {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  margin: 0 0 1.1rem;
  padding: 0;
  border: 0;
}

.campo legend,
.campo > strong {
  font-weight: 700;
  margin-bottom: 0.3rem;
}

.campo-interruptor {
  flex-direction: row;
  align-items: flex-start;
  gap: 0.75rem;
  cursor: pointer;
}

.campo-interruptor span {
  display: flex;
  flex-direction: column;
}

.campo-interruptor small {
  color: var(--cor-texto-suave);
}

.campo input[type='checkbox'],
.campo input[type='radio'] {
  width: 1.3rem;
  height: 1.3rem;
  accent-color: var(--cor-destaque);
  flex: none;
  margin-top: 0.15rem;
}

.campo input[type='range'] {
  accent-color: var(--cor-destaque);
  width: 100%;
}

.grupo-opcoes {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.25rem;
}

.opcao {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  cursor: pointer;
  min-height: 44px;
}

.creditos {
  font-size: 0.85rem;
  color: var(--cor-texto-suave);
}

/* ---------- Tabela de hangul ---------- */

.abas {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.aba {
  flex: 1;
  min-height: 44px;
  cursor: pointer;
  border: 2px solid var(--cor-borda);
  border-radius: 999px;
  background: transparent;
  font-weight: 700;
}

.aba[aria-selected='true'] {
  background: var(--cor-destaque);
  border-color: var(--cor-destaque);
  color: #1b1030;
}

.tabela-hangul {
  display: grid;
  gap: 0.4rem;
  margin-bottom: 1.25rem;
}

/* Letras: quantas couberem por linha. */
.tabela-jamo {
  grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
}

/* Sílabas: a primeira coluna é a consoante; as outras, as 6 vogais. */
.tabela-silabas {
  grid-template-columns: 2rem repeat(6, minmax(0, 1fr));
}

.tabela-cabecalho {
  display: grid;
  place-items: center;
  font-size: 1.2rem;
  font-weight: 900;
  color: var(--cor-destaque);
}

.celula-hangul {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.2rem;
  min-height: 64px;
  padding: 0.4rem 0;
  border: 2px solid transparent;
  border-radius: var(--raio);
  background: var(--cor-superficie);
  cursor: pointer;
}

.celula-hangul .hangul {
  font-size: var(--tam-hangul-medio);
}

.celula-hangul .romanizacao {
  font-size: 0.8rem;
}

.celula-hangul:hover {
  border-color: var(--cor-destaque);
}

/* Bolinha com a caixa do SRS (cinza = não visto; verde mais claro = mais dominado). */
.celula-hangul::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--nivel-0);
}

.celula-hangul[data-caixa='1']::after {
  background: var(--nivel-1);
}

.celula-hangul[data-caixa='2']::after {
  background: var(--nivel-2);
}

.celula-hangul[data-caixa='3']::after {
  background: var(--nivel-3);
}

.celula-hangul[data-caixa='4']::after {
  background: var(--nivel-4);
}

.celula-hangul[data-caixa='5']::after {
  background: var(--nivel-5);
}

/* ---------- Detalhe do hangul e ordem dos traços ---------- */

.detalhe-hangul {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 1.25rem;
  align-items: start;
}

.detalhe-tracos {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
}

.detalhe-leitura {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.detalhe-romanizacao {
  font-size: 1.6rem;
  font-weight: 700;
}

.dica {
  background: var(--cor-superficie);
  border-left: 4px solid var(--cor-destaque-2);
  border-radius: 8px;
  padding: 0.6rem 0.8rem;
}

.exemplos ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.exemplos li {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.6rem;
}

.tracos {
  max-width: 100%;
  height: auto;
  background: #fffaf0;
  border-radius: var(--raio);
}

.tracos path {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tracos-grade line {
  stroke: #e3c9c9;
  stroke-width: 0.6;
  stroke-dasharray: 2 2;
}

.tracos-fantasma path {
  stroke: #d8d2e6;
  stroke-width: 4;
}

.tracos-ativos path {
  stroke: #1b1030;
  stroke-width: 4;
}

.tracos-numeros text {
  font-size: 7px;
  font-weight: 700;
  fill: #d64545;
}

@media (max-width: 560px) {
  .detalhe-hangul {
    grid-template-columns: 1fr;
    justify-items: center;
  }

  .hud-marca-texto,
  .botao-hud-texto {
    display: none;
  }

  .botao-hud {
    padding: 0;
    width: 44px;
    justify-content: center;
  }

  .hud-xp {
    width: 18vw;
  }

  /* No celular, as fases viram uma faixa horizontal para não cobrir a ilha. */
  .lista-fases {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 0.4rem;
  }

  .lista-fases li {
    flex: 0 0 68%;
    scroll-snap-align: start;
  }
}

/* ---------- Conquistas ---------- */

.lista-conquistas {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.conquista {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0.8rem;
  border-radius: var(--raio);
  background: var(--cor-superficie);
}

.conquista span:nth-child(2) {
  display: flex;
  flex-direction: column;
}

.conquista small {
  color: var(--cor-texto-suave);
}

.conquista-icone {
  font-size: 1.8rem;
  width: 2.5rem;
  text-align: center;
}

.conquista-bloqueada .conquista-icone {
  filter: grayscale(1);
  opacity: 0.45;
}

/* ---------- Feedback (acerto, erro, avisos) ---------- */

.camada-feedback {
  position: fixed;
  inset: 0;
  z-index: 45;
  pointer-events: none;
}

.camada-feedback > * {
  pointer-events: auto;
}

/* Centralizados no ponto pelo GSAP (xPercent/yPercent), não pelo CSS. */
.selo-acerto,
.petala {
  position: absolute;
  pointer-events: none;
}

.selo-acerto {
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--cor-acerto);
  text-shadow: 0 2px 10px rgb(0 0 0 / 0.6);
}

.petala {
  font-size: 1.2rem;
}

/*
 * Elementos animados pelo GSAP são centralizados pelo layout (margin auto),
 * e não com `translate`: o GSAP reescreve o transform ao animar.
 */
.cartao-erro {
  position: absolute;
  left: 0;
  right: 0;
  margin-inline: auto;
  bottom: max(16px, env(safe-area-inset-bottom));
  width: min(420px, calc(100% - 32px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  padding: 1rem 1.25rem;
  text-align: center;
  background: var(--cor-fundo-2);
  border: 2px solid var(--cor-erro);
  border-radius: calc(var(--raio) * 1.4);
  box-shadow: var(--sombra);
}

.cartao-erro p {
  margin: 0;
}

.cartao-erro-titulo {
  color: var(--cor-erro);
  font-weight: 700;
}

.cartao-erro-resposta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.cartao-erro-romanizacao {
  font-size: 1.8rem;
  font-weight: 700;
}

.cartao-erro-dica {
  color: var(--cor-texto-suave);
}

.pilha-avisos {
  position: absolute;
  top: calc(var(--altura-hud) + 12px);
  left: 50%;
  translate: -50% 0;
  width: max-content;
  max-width: calc(100% - 32px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  pointer-events: none;
}

/* Em telas largas, os avisos vão para o canto e não cobrem a pergunta dos jogos. */
@media (min-width: 760px) {
  .pilha-avisos {
    left: auto;
    right: 16px;

      /** Alinha o fim numa das 8 direções e encurta até caber na grade. */
      fimAlinhado(inicio, alvo) {
        let fim = alinharFim(inicio, alvo);
        const dentro = ({ l, c }) => l >= 0 && c >= 0 && l < this.nivelAtual.tamanho && c < this.nivelAtual.tamanho;
        while (!dentro(fim)) {
          fim = { l: fim.l - Math.sign(fim.l - inicio.l), c: fim.c - Math.sign(fim.c - inicio.c) };
        }
        return fim;
      }
      /** Desenha uma "cápsula" sobre as células (linha grossa com pontas redondas). */
      desenharCapsula(grafico, celulas, cor, alfa) {
        const inicio = this.centroDaCelula(celulas[0]);
        const fim = this.centroDaCelula(celulas[celulas.length - 1]);
        const espessura = this.celula * 0.72;
        grafico.lineStyle(espessura, cor, alfa);
        grafico.lineBetween(inicio.x, inicio.y, fim.x, fim.y);
        grafico.fillStyle(cor, alfa);
        grafico.fillCircle(inicio.x, inicio.y, espessura / 2);
        grafico.fillCircle(fim.x, fim.y, espessura / 2);
      }
      desenharDestaques() {
        this.destaques.clear();
        this.marcadas.forEach(
          ({ celulas, cor }) => this.desenharCapsula(this.destaques, celulas, cor, 0.55)
        );
        if (this.celulaComDica) {
          const { x, y } = this.centroDaCelula(this.celulaComDica);
          this.destaques.lineStyle(4, COR_ERRO, 1);
          this.destaques.strokeCircle(x, y, this.celula * 0.45);
        }
      }
      /** Seleção em andamento (arraste ou âncora do teclado). */
      desenharSelecao(cor = COR_SELECAO) {
        this.selecao.clear();
        const inicio = this.arraste?.inicio ?? this.ancora;
        if (!inicio) {
          return;
        }
        const fim = this.arraste?.fim ?? this.fimAlinhado(this.ancora, this.posCursor);
        this.desenharCapsula(this.selecao, celulasEntre(inicio, fim), cor, 0.5);
      }
      desenharCursor() {
        this.cursor.clear();
        if (!this.usandoTeclado || this.estado !== "jogando") {
          return;
        }
        const { x, y } = this.centroDaCelula(this.posCursor);
        this.cursor.lineStyle(4, 16765286, 1);
        this.cursor.strokeRoundedRect(
          x - this.celula / 2,
          y - this.celula / 2,
          this.celula,
          this.celula,
          8
        );
      }
      animarEntrada() {
        if (animacoesReduzidas()) {
          return;
        }
        this.textos.flat().forEach((texto, indice) => {
          texto.setScale(0);
          this.tweens.add({ targets: texto, scale: 1, delay: indice * 6, duration: 200 });
        });
      }
      // ---------- Ponteiro (mouse e toque) ----------
      aoPressionar(ponteiro) {
        if (this.estado !== "jogando") {
          return;
        }
        const celula = this.celulaEm(ponteiro.x, ponteiro.y);
        if (celula) {
          this.usandoTeclado = false;
          this.ancora = null;
          this.arraste = { inicio: celula, fim: celula };
          this.desenharSelecao();
          this.desenharCursor();
        }
      }
      aoMover(ponteiro) {
        if (!this.arraste || !ponteiro.isDown) {
          return;
        }
        const alvo = this.limitarCelula({
          l: Math.floor((ponteiro.y - this.origemY) / this.celula),
          c: Math.floor((ponteiro.x - this.origemX) / this.celula)
        });
        this.arraste.fim = this.fimAlinhado(this.arraste.inicio, alvo);
        this.desenharSelecao();
      }
      aoSoltar() {
        if (!this.arraste) {
          return;
        }
        const { inicio, fim } = this.arraste;
        this.arraste = null;
        this.finalizarSelecao(celulasEntre(inicio, fim));
      }
      // ---------- Teclado ----------
      /** Setas movem o cursor; Enter marca início/fim; Esc cancela ou pausa. */
      aoTeclar(evento) {
        if (evento.target instanceof HTMLElement && evento.target.closest("button, input, a")) {
          return;
        }
        if (evento.key === "Escape") {
          if (this.ancora) {
            this.ancora = null;
            this.desenharSelecao();
          } else {
            this.pausar();
          }
          return;
        }
        if (this.estado !== "jogando") {
          return;
        }
        const movimentos = {
          ArrowLeft: [0, -1],
          ArrowRight: [0, 1],
          ArrowUp: [-1, 0],
          ArrowDown: [1, 0]
        };
        if (evento.key in movimentos) {
          evento.preventDefault();
          const [dl, dc] = movimentos[evento.key];
          this.usandoTeclado = true;
          this.posCursor = this.limitarCelula({ l: this.posCursor.l + dl, c: this.posCursor.c + dc });
          this.desenharCursor();
          this.desenharSelecao();
        } else if (evento.key === "Enter" || evento.key === " ") {
          evento.preventDefault();
          this.usandoTeclado = true;
          this.marcarComTeclado();
        }
      }
      marcarComTeclado() {
        if (!this.ancora) {
          this.ancora = { ...this.posCursor };
          this.desenharSelecao();
          this.desenharCursor();
          return;
        }
        const celulas = celulasEntre(this.ancora, this.fimAlinhado(this.ancora, this.posCursor));
        this.ancora = null;
        this.finalizarSelecao(celulas);
      }
      // ---------- Conferência ----------
      finalizarSelecao(celulas) {
        if (!celulas || celulas.length < 2) {
          this.desenharSelecao();
          return;
        }
        const achada = conferirSelecao(
          this.nivelAtual.grade,
          celulas,
          this.nivelAtual.palavras,
          this.encontradas
        );
        if (achada) {
          this.encontrar(achada.palavra, celulas);
        } else {
          this.errarSelecao(celulas);
        }
      }
      encontrar(palavra, celulas) {
        this.encontradas.add(palavra.id);
        this.marcadas.push({
          celulas,
          cor: CORES_ENCONTRADAS[this.marcadas.length % CORES_ENCONTRADAS.length]
        });
        this.celulaComDica = null;
        this.palavrasTotais += 1;
        if (!this.dicasUsadas.has(palavra.id)) {
          registrarResposta2(palavra.id, true);
        }
        const ganho = pontosDaPalavra(palavra);
        this.pontos += ganho;
        falar(palavra.fala);
        const meio = this.centroDaCelula(celulas[Math.floor(celulas.length / 2)]);
        mostrarAcerto({ texto: `+${ganho}`, ...this.pontoNaTela(meio.x, meio.y) });
        this.lista.marcarEncontrada(palavra);
        this.desenharSelecao();
        this.desenharDestaques();
        this.atualizarPlacar();
        if (this.encontradas.size === this.nivelAtual.palavras.length) {
          this.concluirNivel();
        }
      }
      /** Seleção que não é palavra da lista: mostra como se lê o que foi marcado. */
      errarSelecao(celulas) {
        tocarErro();
        const texto = textoDasCelulas(this.nivelAtual.grade, celulas);
        mostrarDica(this.camada, [
          `${texto} = ${romanizar(texto)} (leitura sílaba por sílaba)`,
          "Essa sequência não é uma das palavras da lista. Confira as pistas!"
        ]);
        this.desenharCapsula(this.selecao, celulas, COR_ERRO, 0.5);
        this.time.delayedCall(450, () => this.desenharSelecao());
      }
      /** Mostra onde começa uma palavra ainda não encontrada (custa pontos). */
      usarDica() {
        if (this.estado !== "jogando") {
          return;
        }
        const faltando = this.nivelAtual.palavras.filter(
          ({ palavra: palavra2 }) => !this.encontradas.has(palavra2.id)
        );
        const escolha = faltando.find(({ palavra: palavra2 }) => !this.dicasUsadas.has(palavra2.id)) ?? faltando[0];
        if (!escolha) {
          return;
        }
        const { palavra, celulas } = escolha;
        if (!this.dicasUsadas.has(palavra.id)) {
          this.dicasUsadas.add(palavra.id);
          this.revisar.set(palavra.id, palavra);
          registrarResposta2(palavra.id, false);
          this.pontos = Math.max(0, this.pontos - CUSTO_DA_DICA);
        }
        this.celulaComDica = celulas[0];
        const primeiro = Array.from(palavra.hangul)[0];
        mostrarDica(this.camada, [
          `${palavra.emoji} ${palavra.pt}: começa com ${primeiro} (${romanizar(primeiro)}) — veja o círculo vermelho.`
        ]);
        falar(palavra.fala);
        this.desenharDestaques();
        this.atualizarPlacar();
      }
      // ---------- Placar ----------
      atualizarPlacar() {
        const total = this.nivelAtual?.palavras.length ?? 0;
        this.placar.setText(
          `Nível ${this.indiceDoNivel + 1}/${NIVEIS2.length}   Palavras ${this.encontradas?.size ?? 0}/${total}   ${this.pontos} pts`
        );
      }
      /** Converte coordenadas do jogo para a tela (para o feedback em HTML). */
      pontoNaTela(x, y) {
        const retangulo = this.game.canvas.getBoundingClientRect();
        return {
          x: retangulo.left + x * retangulo.width / this.scale.width,
          y: retangulo.top + y * retangulo.height / this.scale.height
        };
      }
      // ---------- Limpeza ----------
      /** Remove o que foi criado fora do Phaser (HTML e listeners). */
      limpar() {
        if (this.limpo) {
          return;
        }
        this.limpo = true;
        this.estado = "destruida";
        this.scale.off("resize", this.organizar, this);
        this.input.off("pointerdown", this.aoPressionar, this);
        this.input.off("pointermove", this.aoMover, this);
        this.input.off("pointerup", this.aoSoltar, this);
        this.pararTeclado?.();
        this.lista?.destroy();
        this.camada?.remove();
      }
    };
  }
});

function criarRoteador(conteiner, cortina) {
  let telaAtual = null;
  let trocando = false;
  const cobrir = () => gsap.to(cortina, { opacity: 1, duration: duracao(0.3) }).then();
  const descobrir = () => gsap.to(cortina, { opacity: 0, duration: duracao(0.45) }).then();
  async function irPara(montarTela, params = {}) {
    if (trocando) {
      return;
    }
    trocando = true;
    cortina.classList.add("ativa");
    try {
      await cobrir();
      telaAtual?.destroy();
      telaAtual = null;
      conteiner.replaceChildren();
      telaAtual = await montarTela(conteiner, params);
    } finally {
      await descobrir();
      cortina.classList.remove("ativa");
      trocando = false;
    }
    conteiner.querySelector('h1, [tabindex="-1"]')?.focus({ preventScroll: true });
  }
  return { irPara };
}

var SELETOR_FOCAVEL = 'button:not([disabled]), [href], input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])';
var contador2 = 0;
var abertos = 0;
var pilha = [];
function aoTeclarNoDocumento(evento) {
  if (evento.key === "Escape" && pilha.length > 0) {
    evento.preventDefault();
    evento.stopPropagation();
    pilha[pilha.length - 1]();
  }
}
document.addEventListener("keydown", aoTeclarNoDocumento, true);
function avisarEstado() {
  document.dispatchEvent(new CustomEvent("nd:modal", { detail: { aberto: abertos > 0 } }));
}
function prenderFoco(evento, caixa) {
  const focaveis = [...caixa.querySelectorAll(SELETOR_FOCAVEL)];
  if (focaveis.length === 0) {
    return;
  }
  const primeiro = focaveis[0];
  const ultimo = focaveis[focaveis.length - 1];
  if (evento.shiftKey && document.activeElement === primeiro) {
    evento.preventDefault();
    ultimo.focus();
  } else if (!evento.shiftKey && document.activeElement === ultimo) {
    evento.preventDefault();
    primeiro.focus();
  }
}
function abrirModal({ titulo, conteudo, classe = "", aoFechar } = {}) {
  contador2 += 1;
  const idTitulo = `modal-titulo-${contador2}`;
  const anterior = document.activeElement;
  const camada2 = document.getElementById("modais") ?? document.body;
  const botaoFechar = criarElemento("button", {
    class: "botao-icone",
    type: "button",
    "aria-label": "Fechar",
    text: "✕"
  });
  const corpo = criarElemento("div", { class: "modal-corpo" }, conteudo);
  const caixa = criarElemento(
    "div",
    { class: `modal ${classe}`, role: "dialog", "aria-modal": "true", "aria-labelledby": idTitulo },
    [
      criarElemento("header", { class: "modal-cabecalho" }, [
        criarElemento("h2", { id: idTitulo, text: titulo }),
        botaoFechar
      ]),
      corpo
    ]
  );
  const fundo = criarElemento("div", { class: "modal-fundo" }, caixa);
  let fechado = false;
  async function fechar() {
    if (fechado) {
      return;
    }
    fechado = true;
    pilha.splice(pilha.indexOf(fechar), 1);
    await sair(fundo, { y: 0 });
    fundo.remove();
    abertos -= 1;
    avisarEstado();
    aoFechar?.();
    if (anterior instanceof HTMLElement && document.contains(anterior)) {
      anterior.focus();
    }
  }
  botaoFechar.addEventListener("click", fechar);
  fundo.addEventListener("pointerdown", (evento) => {
    if (evento.target === fundo) {
      fechar();
    }
  });
  fundo.addEventListener("keydown", (evento) => {
    if (evento.key === "Tab") {
      prenderFoco(evento, caixa);
    }
  });
  camada2.append(fundo);
  pilha.push(fechar);
  abertos += 1;
  avisarEstado();
  entrar(caixa, { y: 30 });
  botaoFechar.focus();
  return { corpo, fechar };
}

function criarEstrelas(quantidade = 400) {

    const teta = Math.random() * Math.PI * 2;

    posicoes[i * 3] = raio * Math.sin(fi) * Math.cos(teta);
    posicoes[i * 3 + 1] = raio * Math.cos(fi);
    posicoes[i * 3 + 2] = raio * Math.sin(fi) * Math.sin(teta);

  });

async function montarTelaMenu(conteiner, { aoEscolherJogo }) {

    (fase, indice) => criarBotaoFase(fase, indice, {
      aoClicar: escolher,
      aoFocar: (faseId) => menu3d?.definirDestaque(faseId, false)
    })
  );

  atualizarBotoes(botoes, fases);

    menu3d = new Menu3D(palco3d, {
      fases,
      caracteres: caracteresDecorativos(),
      aoEscolher: (faseId) => escolher(
        faseId,

      ),
      aoDestacar: destacarBotao

  } catch (erro) {
    console.warn("WebGL indisponível; usando apenas o menu em HTML.", erro);
    raiz.classList.add("sem-3d");
  }
  const atualizar = () => {
    fases = estadoDasFases();
    atualizarBotoes(botoes, fases);
    menu3d?.atualizarFases(fases);
  };
  const cancelamentos = [aoMudarConfig(atualizar), aoProgresso("mudou", atualizar)];
  entrar(raiz.querySelectorAll(".menu-cabecalho > *, .botao-fase"), { atraso: 0.2 });
  return {
    destroy() {
      cancelamentos.forEach((cancelar) => cancelar());
      menu3d?.destroy();
      raiz.remove();
    }
  };
}

      width: conteiner.clientWidth || 800,
      height: conteiner.clientHeight || 600
    },
    callbacks: {
      // A cena usa a chave definida no próprio construtor; 'principal' é só um apelido.
      postBoot: (instancia) => instancia.scene.add("principal", ClasseCena, true, dados)
    }
  });
  const obterCena = () => jogo.scene?.getScenes(false)[0] ?? null;
  return {
    jogo,
    pausar() {
      const cena = obterCena();
      if (cena?.pausarExterno) {
        cena.pausarExterno();
      } else {
        cena?.scene.pause();
      }
    },
    continuar() {
      const cena = obterCena();
      if (cena?.continuarExterno) {
        cena.continuarExterno();
      } else {
        cena?.scene.resume();
      }
    },
    destroy() {
      jogo.destroy(true);
    }
  };
}

// src/games/gameScreen.js
async function montarTelaJogo(conteiner, { jogoId, aoSair }) {
  const jogo = buscarJogo(jogoId);
  if (!jogo?.carregar) {
    throw new Error(`O jogo "${jogoId}" ainda não está disponível.`);
  }
  const palco = criarElemento("section", {
    class: "tela-jogo",
    "aria-label": `${jogo.nome} — ${jogo.descricao}`
  });
  conteiner.append(palco);
  const modulo = await jogo.carregar();
  const instancia = criarJogoPhaser(palco, modulo.default, {
    jogo,
    conteiner: palco,
    aoSair
  });
  const aoModal = (evento) => evento.detail.aberto ? instancia.pausar() : instancia.continuar();
  document.addEventListener("nd:modal", aoModal);
  return {
    destroy() {
      document.removeEventListener("nd:modal", aoModal);
      instancia.destroy();
      palco.remove();
    }
  };
}

var VOGAIS_EM_PE = "ㅏㅐㅑㅒㅓㅔㅕㅖㅣ";
var VOGAIS_DEITADAS = "ㅗㅛㅜㅠㅡ";
var formatar = (numero) => String(Math.round(numero * 100) / 100);
function encaixar(caminho, [x0, y0, largura, altura]) {
  const sx = largura / STROKE_VIEWBOX;
  const sy = altura / STROKE_VIEWBOX;
  const px = (valor) => formatar(x0 + valor * sx);
  const py = (valor) => formatar(y0 + valor * sy);
  return caminho.replace(/([MLHVQA])([^MLHVQA]*)/g, (_, comando, resto) => {
    const n = resto.trim().split(/[\s,]+/).filter(Boolean).map(Number);
    if (comando === "H") {
      return `H${px(n[0])}`;
    }
    if (comando === "V") {
      return `V${py(n[0])}`;
    }
    if (comando === "A") {
      const [rx, ry, rotacao, grande, sentido, x, y] = n;
      return `A${formatar(rx * sx)},${formatar(ry * sy)} ${rotacao} ${grande},${sentido} ${px(x)},${py(y)}`;
    }
    const pares = [];
    for (let i = 0; i < n.length; i += 2) {
      pares.push(`${px(n[i])},${py(n[i + 1])}`);
    }
    return `${comando}${pares.join(" ")}`;
  });
}
function tracosDoJamo(jamo) {
  if (BASICOS[jamo]) {
    return BASICOS[jamo];
  }
  if (PARES[jamo]) {
    const [esquerda, direita] = Array.from(PARES[jamo]);
    return [
      ...BASICOS[esquerda].map((d) => encaixar(d, [-6, 8, 66, 94])),
      ...BASICOS[direita].map((d) => encaixar(d, [49, 8, 66, 94]))
    ];
  }
  if (COMPOSTAS[jamo]) {
    const [primeira, caixa1, segunda, caixa2] = COMPOSTAS[jamo];
    return [
      ...tracosDoJamo(primeira).map((d) => encaixar(d, caixa1)),
      ...tracosDoJamo(segunda).map((d) => encaixar(d, caixa2))
    ];
  }
  return [];
}
function caixasDaSilaba(vogal, temFinal) {
  let caixas;
  if (VOGAIS_EM_PE.includes(vogal)) {
    caixas = { inicial: [0, 6, 64, 98], vogal: [42, 0, 67, 109] };
  } else if (VOGAIS_DEITADAS.includes(vogal)) {
    caixas = { inicial: [14, -4, 82, 66], vogal: [0, 36, 109, 74] };
  } else {
    caixas = { inicial: [0, 0, 62, 60], vogal: [0, 0, 109, 109] };
  }
  if (!temFinal) {
    return caixas;
  }
  const encolher = ([x, y, l, a]) => [x, y * 0.62, l, a * 0.62];
  return {
    inicial: encolher(caixas.inicial),
    vogal: encolher(caixas.vogal),
    final: [14, 62, 82, 50]
  };
}
function tracosDe(caractere) {
  const partes = decomporSilaba(caractere);
  if (!partes) {
    return tracosDoJamo(caractere);
  }
  const caixas = caixasDaSilaba(partes.vogal, Boolean(partes.final));
  const tracos = [
    ...tracosDoJamo(partes.inicial).map((d) => encaixar(d, caixas.inicial)),
    ...tracosDoJamo(partes.vogal).map((d) => encaixar(d, caixas.vogal))
  ];
  if (partes.final) {
    tracos.push(...tracosDoJamo(partes.final).map((d) => encaixar(d, caixas.final)));
  }
  return tracos;
}

init_settings();

var SVG_NS = "http://www.w3.org/2000/svg";
var PAUSA_REDUZIDA = 0.4;
function criarSvg(tag, atributos = {}) {
  const elemento = document.createElementNS(SVG_NS, tag);
  for (const [chave, valor] of Object.entries(atributos)) {
    elemento.setAttribute(chave, String(valor));
  }
  return elemento;
}
function pontoInicial(d) {
  const encontrado = /^M\s*(-?[\d.]+)[\s,]+(-?[\d.]+)/.exec(d);
  return encontrado ? { x: Number(encontrado[1]), y: Number(encontrado[2]) } : { x: 0, y: 0 };
}
function criarGuias() {
  const meio = STROKE_VIEWBOX / 2;
  const grupo = criarSvg("g", { class: "tracos-grade" });
  grupo.append(
    criarSvg("line", { x1: meio, y1: 0, x2: meio, y2: STROKE_VIEWBOX }),
    criarSvg("line", { x1: 0, y1: meio, x2: STROKE_VIEWBOX, y2: meio })
  );
  return grupo;
}
function criarAnimacaoTracos(caractere, { tamanho = 220 } = {}) {
  const tracos = tracosDe(caractere);
  const svg = criarSvg("svg", {
    viewBox: `0 0 ${STROKE_VIEWBOX} ${STROKE_VIEWBOX}`,
    width: tamanho,
    height: tamanho,
    class: "tracos",
    role: "img",
    "aria-label": `Ordem dos traços de ${caractere}: ${tracos.length} traços`
  });
  svg.append(criarGuias());
  const fantasmas = criarSvg("g", { class: "tracos-fantasma" });
  const ativos = criarSvg("g", { class: "tracos-ativos" });
  const numeros = criarSvg("g", { class: "tracos-numeros" });
  const caminhos = tracos.map((d, indice) => {
    fantasmas.append(criarSvg("path", { d }));
    const caminho = criarSvg("path", { d });
    ativos.append(caminho);
    const { x, y } = pontoInicial(d);
    const numero = criarSvg("text", { x: x - 6, y: y - 3 });
    numero.textContent = String(indice + 1);
    numeros.append(numero);
    return { caminho, numero };
  });
  svg.append(fantasmas, ativos, numeros);
  let linhaDoTempo = null;
  function tocar() {
    linhaDoTempo?.kill();
    const reduzido = animacoesReduzidas();
    linhaDoTempo = gsap.timeline();
    caminhos.forEach(({ caminho, numero }, indice) => {
      const comprimento = caminho.getTotalLength();
      gsap.set(caminho, { strokeDasharray: comprimento, strokeDashoffset: comprimento });
      gsap.set(numero, { opacity: 0 });
      if (reduzido) {
        const momento = indice * PAUSA_REDUZIDA;
        linhaDoTempo.set(caminho, { strokeDashoffset: 0 }, momento);
        linhaDoTempo.set(numero, { opacity: 1 }, momento);
      } else {
        linhaDoTempo.to(numero, { opacity: 1, duration: 0.15 });
        linhaDoTempo.to(
          caminho,
          {
            strokeDashoffset: 0,
            duration: Math.max(0.35, comprimento / 110),
            ease: "power1.inOut"
          },
          "<"
        );
      }
    });
    return linhaDoTempo;
  }
  function destroy() {
    linhaDoTempo?.kill();
    svg.remove();
  }
  return { elemento: svg, tocar, destroy, total: tracos.length };
}

          criarExemplos(item)
        ])
      ])
    ]
  });
  falar(item.fala);
  tracos.tocar();
}

var OPCOES_MOVIMENTO = [
  { valor: "sistema", rotulo: "Seguir o sistema" },
  { valor: "reduzido", rotulo: "Reduzidas" },
  { valor: "completo", rotulo: "Completas" }

function campoInterruptor(chave, rotulo, descricao) {
  const entrada = criarElemento("input", { type: "checkbox", checked: obterConfig()[chave] });
  entrada.addEventListener("change", () => alterarConfig(chave, entrada.checked));
  return criarElemento("label", { class: "campo campo-interruptor" }, [
    entrada,
    criarElemento("span", {}, [
      criarElemento("strong", { text: rotulo }),
      descricao ? criarElemento("small", { text: descricao }) : null
    ])
  ]);
}
function campoMovimento() {
  const atual = obterConfig().movimento;
  const opcoes = OPCOES_MOVIMENTO.map(({ valor, rotulo }) => {
    const entrada = criarElemento("input", {
      type: "radio",
      name: "movimento",
      value: valor,
      checked: valor === atual
    });
    entrada.addEventListener("change", () => alterarConfig("movimento", valor));
    return criarElemento("label", { class: "opcao" }, [entrada, rotulo]);
  });
  return criarElemento("fieldset", { class: "campo" }, [

}
function campoDeslizante(chave, rotulo, { min, max, passo, aoSoltar }) {

    type: "range",
    min,
    max,
    step: passo,
    value: obterConfig()[chave]
  });
  entrada.addEventListener("input", () => alterarConfig(chave, Number(entrada.value)));
  entrada.addEventListener("change", () => aoSoltar?.());
  return criarElemento("label", { class: "campo" }, [
    criarElemento("strong", { text: rotulo }),
    entrada
  ]);
}
function secaoVoz() {

function secaoPerigo() {

// src/ui/progressPanel.js
init_utils();
init_hangul();
init_srs();
init_speakButton();
init_motion();
var CAIXA_DOMINADA = 3;
var MAIS_ERRADOS = 5;
var ROTULOS_DOS_NIVEIS = ["Não visto", "Caixa 1", "Caixa 2", "Caixa 3", "Caixa 4", "Caixa 5"];
var NOMES = { jamo: "Letras 자모", silabas: "Sílabas 음절" };
function nivelDoItem2(item) {
  return obterRegistro(item.id)?.caixa ?? 0;
}
function resumir(itens) {
  const porNivel = Array(TOTAL_CAIXAS + 1).fill(0);
  let acertos = 0;
  let erros = 0;
  itens.forEach((item) => {
    porNivel[nivelDoItem2(item)] += 1;
    const registro = obterRegistro(item.id);
    acertos += registro?.acertos ?? 0;
    erros += registro?.erros ?? 0;
  });
  const vistos = itens.length - porNivel[0];
  const dominados = porNivel.slice(CAIXA_DOMINADA).reduce((soma, valor) => soma + valor, 0);
  return {
    total: itens.length,
    porNivel,
    vistos,
    dominados,
    revisar: vistos - dominados,
    precisao: acertos + erros > 0 ? Math.round(acertos / (acertos + erros) * 100) : null
  };
}
function cartaoDeNumero(rotulo, valor, detalhe) {
  return criarElemento("div", { class: "progresso-numero" }, [
    criarElemento("span", { class: "progresso-numero-valor", text: valor }),
    criarElemento("span", { class: "progresso-numero-rotulo", text: rotulo }),
    detalhe ? criarElemento("span", { class: "texto-suave", text: detalhe }) : null
  ]);
}
function criarResumo(resumo) {
  return criarElemento("div", { class: "progresso-numeros" }, [
    cartaoDeNumero("Dominados", String(resumo.dominados), `de ${resumo.total} (caixa 3+)`),
    cartaoDeNumero("Vistos", String(resumo.vistos), `de ${resumo.total}`),
    cartaoDeNumero("Para revisar", String(resumo.revisar), "caixas 1 e 2"),
    cartaoDeNumero(
      "Precisão",
      resumo.precisao === null ? "—" : `${resumo.precisao}%`,
      "acertos / respostas"
    )
  ]);
}
function criarDistribuicao(resumo) {
  const segmentos = resumo.porNivel.map((quantidade, nivel) => ({ quantidade, nivel })).filter(({ quantidade }) => quantidade > 0).map(({ quantidade, nivel }) => {
    const descricao = `${ROTULOS_DOS_NIVEIS[nivel]}: ${quantidade} item(ns)`;
    const segmento = criarElemento("span", {
      class: "progresso-segmento",
      dataset: { nivel: String(nivel) },
      title: descricao,
      "aria-label": descricao
    });
    segmento.style.flexGrow = String(quantidade);
    return segmento;
  });
  const legenda = criarElemento(
    "ul",
    { class: "progresso-legenda" },
    resumo.porNivel.map(
      (quantidade, nivel) => criarElemento("li", {}, [
        criarElemento("span", {
          class: "progresso-amostra",
          dataset: { nivel: String(nivel) },
          "aria-hidden": "true"
        }),
        `${ROTULOS_DOS_NIVEIS[nivel]}: `,
        criarElemento("strong", { text: String(quantidade) })
      ])
    )
  );
  return criarElemento("section", { class: "progresso-secao" }, [
    criarElemento("h3", { text: "Caixas do SRS" }),
    criarElemento(
      "div",
      { class: "progresso-barra", role: "img", "aria-label": "Distribuição pelas caixas" },
      segmentos
    ),
    legenda
  ]);
}
function criarCelula2(item) {
  const nivel = nivelDoItem2(item);
  return criarElemento(
    "button",
    {
      type: "button",
      class: "progresso-hangul",
      lang: "ko",
      dataset: { nivel: String(nivel) },
      title: `${item.hangul} (${item.romanizacao}) — ${ROTULOS_DOS_NIVEIS[nivel]}`,
      "aria-label": `${item.hangul}, ${item.romanizacao}, ${ROTULOS_DOS_NIVEIS[nivel]}`,
      onClick: () => abrirDetalhe(item)
    },
    item.hangul
  );
}
function criarGrupos(conjunto) {
  const liberados = new Set(gruposLiberados(gruposDeEstudo(conjunto)).map((grupo) => grupo.id));
  const grupos = conjunto === "silabas" ? GRUPOS_SILABAS : GRUPOS_JAMO;
  const linhas = grupos.map((grupo) => {
    const itens = listarItens(conjunto, [grupo]);
    const dominados = itens.filter((item) => nivelDoItem2(item) >= CAIXA_DOMINADA).length;
    const liberado = liberados.has(grupo);
    return criarElemento("li", { class: `progresso-grupo ${liberado ? "" : "bloqueado"}` }, [
      criarElemento("span", { class: "progresso-grupo-nome" }, [
        criarElemento("strong", {
          lang: "ko",
          text: conjunto === "silabas" ? `${itens[0].partes[0]} +` : NOMES_DOS_GRUPOS[grupo]
        }),
        criarElemento("span", {
          class: "texto-suave",
          text: liberado ? `${dominados}/${itens.length}` : "🔒",
          title: liberado ? "Dominados neste grupo" : "Libera quando você dominar os grupos anteriores"
        })
      ]),
      criarElemento("span", { class: "progresso-grupo-hangul" }, itens.map(criarCelula2))
    ]);
  });
  return criarElemento("section", { class: "progresso-secao" }, [
    criarElemento("h3", { text: "Grupos" }),
    criarElemento("ul", { class: "progresso-grupos" }, linhas)
  ]);
}
function criarMaisErrados(itens) {
  const errados = itens.map((item) => ({ item, registro: obterRegistro(item.id) })).filter(({ registro }) => registro?.erros > 0).sort((a, b) => b.registro.erros - a.registro.erros || a.registro.acertos - b.registro.acertos).slice(0, MAIS_ERRADOS);
  const conteudo = errados.length === 0 ? criarElemento("p", {
    class: "texto-suave",
    text: "Nenhum erro ainda. Continue jogando! 🎉"
  }) : criarElemento(
    "ul",
    { class: "progresso-errados" },
    errados.map(
      ({ item, registro }) => criarElemento("li", {}, [
        criarElemento("button", {
          type: "button",
          class: "progresso-errado-hangul",
          lang: "ko",
          "aria-label": `Ver ${item.hangul}`,
          text: item.hangul,
          onClick: () => abrirDetalhe(item)
        }),
        criarElemento("span", { class: "revisao-romanizacao", text: item.romanizacao }),
        criarElemento("span", {
          class: "texto-suave",
          text: `✔ ${registro.acertos} · ✖ ${registro.erros}`
        }),
        criarBotaoFala(item.fala, { rotulo: item.hangul })
      ])
    )
  );
  return criarElemento("section", { class: "progresso-secao" }, [
    criarElemento("h3", { text: "Mais errados" }),
    conteudo
  ]);
}
function criarConteudoDoConjunto(conjunto) {
  const itens = listarItens(conjunto);
  const resumo = resumir(itens);
  return criarElemento("div", { role: "tabpanel" }, [
    criarResumo(resumo),
    criarDistribuicao(resumo),
    criarGrupos(conjunto),
    criarMaisErrados(itens)
  ]);
}
function abrirPainelProgresso(conjuntoInicial = "jamo") {
  const conteiner = criarElemento("div");
  const abas = Object.entries(NOMES).map(
    ([conjunto, nome]) => criarElemento("button", {
      type: "button",
      role: "tab",
      class: "aba",
      dataset: { conjunto },
      text: nome
    })
  );
  const selecionar = (conjunto) => {
    abas.forEach(
      (aba) => aba.setAttribute("aria-selected", String(aba.dataset.conjunto === conjunto))
    );
    const painel = criarConteudoDoConjunto(conjunto);
    conteiner.replaceChildren(painel);
    entrar(painel.children, { y: 12, duracao: 0.3, intervalo: 0.05 });
  };
  abas.forEach((aba) => aba.addEventListener("click", () => selecionar(aba.dataset.conjunto)));
  abrirModal({
    titulo: "Seu progresso",
    classe: "modal-largo",
    conteudo: [criarElemento("div", { class: "abas", role: "tablist" }, abas), conteiner]
  });
  selecionar(conjuntoInicial);
}

var TEMPO_TOAST_MS = 3500;
function mostrarToast(conquista) {
  const toast = criarElemento("div", { class: "toast-conquista", role: "status" }, [
    criarElemento("span", { class: "toast-icone", "aria-hidden": "true", text: conquista.icone }),

    ])
  ]);
  pilhaDeAvisos().append(toast);
  tocarNivel();
  entrar(toast, { y: -30 });
  setTimeout(async () => {
    await sair(toast);
    toast.remove();
  }, TEMPO_TOAST_MS);
}

}
